<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>計算練習</title>
<style>
:root { --appH: 100dvh; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    text-align: center; color: #222; background: #fff; -webkit-text-size-adjust: 100%;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
}
#app { max-width: 1100px; margin: 0 auto; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }

/* ---- 出題画面（1画面に収める） ---- */
body.quiz { height: var(--appH); overflow: hidden; }
body.quiz #app { height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
body.quiz #qbox { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; }
body.quiz #result { flex: 0 1 auto; max-height: 30vh; overflow-y: auto; margin: 0; font-size: clamp(15px, 4.4vw, 26px); }
#workspace { display: none; }
body.quiz #workspace { display: flex; flex: 1 1 0; min-height: 0; flex-direction: column; gap: 6px; }

#result { white-space: pre-line; margin: 8px 0; font-size: clamp(18px, 5vw, 28px); line-height: 1.45; }
#timer { display: none; font-size: clamp(13px, 3.6vw, 20px); color: #555; }

#answerRow { display: none; flex: 0 0 auto; }
#answer {
    display: block; margin: 2px auto 4px; font-size: 26px; width: min(92%, 340px); height: 46px;
    text-align: center; border: 2px solid #667; border-radius: 8px;
}
#symbols { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
#symbols button {
    min-width: 46px; height: 38px; font-size: 20px; padding: 0 10px; border-radius: 8px;
    border: 1px solid #889; background: #eef1ff; color: #223;
}

#図形 { flex: 0 1 42%; min-height: 0; display: flex; justify-content: center; }
#図形:empty { display: none; }
#図形 svg { height: 100% !important; width: auto !important; max-width: 100%; }

#explain {
    display: none; flex: 1 1 0; min-height: 0; overflow-y: auto; text-align: left; white-space: pre-line;
    background: #f4f7ff; border: 1px solid #b9c6ee; border-radius: 8px; padding: 8px 12px;
    font-size: clamp(14px, 3.8vw, 18px); line-height: 1.65;
}

#explain .eq { font-size: 0.92em; color: #334; background: #fff; border: 1px dashed #b9c6ee; border-radius: 6px; padding: 4px 8px; margin-bottom: 6px; }
#explain .step { background: #fff; border: 1px solid #c9d4f5; border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
#explain .step .badge { display: inline-block; background: #2d6cdf; color: #fff; border-radius: 10px; font-size: 0.78em; padding: 0 8px; margin-right: 6px; }
#explain .step.ans { background: #eaf7ea; border-color: #9fd39f; }
#explain .step.ans .badge { background: #2e7d32; }
#explain .stepbtns { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }
#explain .stepbtns button { font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 1px solid #2d6cdf; background: #fff; color: #2d6cdf; }
#analysis ol.stepsOl { margin: 4px 0 4px 18px; padding: 0; font-size: 14px; }
#memo { display: flex; flex-direction: column; flex: 1 1 0; min-height: 90px; gap: 4px; }
#memo button { font-size: 15px; padding: 4px 10px; margin: 0 2px; border-radius: 6px; }
#memo button.active { font-weight: bold; background: #cde; }
#memoCanvas { flex: 1 1 0; min-height: 0; width: 100%; border: 2px solid #888; border-radius: 6px; background: #fff; touch-action: none; display: block; }
#memoText { display: none; flex: 1 1 0; min-height: 0; width: 100%; resize: none; font-size: 18px; border: 2px solid #888; border-radius: 6px; padding: 6px; }

#buttons { display: flex; gap: 8px; justify-content: center; flex: 0 0 auto; margin-top: 6px; }
#buttons button { flex: 1 1 0; max-width: 240px; min-height: 48px; font-size: clamp(17px, 4.8vw, 24px); border-radius: 10px; border: 1px solid #889; background: #f1f1f5; }
#checkAnswer { flex: 2 1 0 !important; max-width: 380px !important; background: #2d6cdf !important; color: #fff; border-color: #2d6cdf !important; }

@media (min-width: 760px) and (min-aspect-ratio: 5/4) {
    body.quiz #workspace { flex-direction: row; }
    body.quiz #図形 { flex: 1 1 45%; }
    body.quiz #memo, body.quiz #explain { flex: 1 1 55%; }
}

/* ---- 数式メモ ---- */
#notes { display: none; }
body.notes { height: var(--appH); overflow: hidden; }
body.notes #app { height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
body.notes #qbox, body.notes #buttons, body.notes #workspace { display: none; }
body.notes #notes {
    display: grid; flex: 1 1 0; min-height: 0; gap: 6px; text-align: left;
    grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto;
}
#notesMain { grid-row: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
#notesBar { display: flex; gap: 6px; align-items: center; }
#noteSelect { flex: 1 1 auto; min-width: 0; height: 38px; font-size: 16px; }
#notesBar button { height: 38px; font-size: 15px; padding: 0 10px; border-radius: 8px; }
#noteText {
    flex: 1 1 0; min-height: 0; width: 100%; resize: none; font-size: 20px; line-height: 1.5;
    border: 2px solid #667; border-radius: 8px; padding: 8px; font-family: inherit;
}
#palette { grid-row: 2; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
#palTabs { display: flex; gap: 4px; overflow-x: auto; white-space: nowrap; padding-bottom: 2px; }
#palTabs button { flex: 0 0 auto; height: 34px; font-size: 14px; padding: 0 12px; border-radius: 17px; border: 1px solid #889; background: #f1f1f5; }
#palTabs button.active { background: #2d6cdf; color: #fff; border-color: #2d6cdf; }
#palKeys { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-height: 26vh; overflow-y: auto; }
#palKeys button { min-width: 42px; height: 38px; font-size: 20px; padding: 0 8px; border-radius: 8px; border: 1px solid #889; background: #eef1ff; color: #223; }
#palKeys button.tpl { font-size: 15px; background: #fff4e0; }
#palKeys.pad { display: grid; grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr)); max-height: 36vh; }
#palKeys.pad button { min-width: 0; height: 36px; padding: 0; }
#palKeys button.num { background: #fff; font-weight: bold; font-size: 22px; }
#palKeys .hint { font-size: 14px; color: #777; padding: 8px; }
#palCtl { display: flex; gap: 5px; justify-content: center; }
#palCtl button { flex: 1 1 0; max-width: 90px; height: 36px; font-size: 16px; border-radius: 8px; border: 1px solid #889; background: #f1f1f5; }
#notesBottom { grid-row: 3; display: flex; gap: 8px; justify-content: center; align-items: center; }
#notesBottom button { flex: 0 1 140px; min-height: 46px; font-size: 18px; border-radius: 10px; border: 1px solid #889; background: #f1f1f5; }
#noteStatus { flex: 1 1 auto; font-size: 13px; color: #555; text-align: center; min-width: 0; }
@media (min-width: 760px) and (min-aspect-ratio: 5/4) {
    body.notes #notes { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    #notesMain { grid-column: 1; grid-row: 1; }
    #palette { grid-column: 2; grid-row: 1; }
    #palKeys { max-height: none; flex: 1 1 0; min-height: 0; align-content: flex-start; }
    #palKeys.pad { max-height: none; flex: 1 1 0; min-height: 0; grid-auto-rows: minmax(30px, 56px); align-content: start; }
    #palKeys.pad button { height: auto; }
    #notesBottom { grid-column: 1 / 3; grid-row: 2; }
}

/* ---- メニュー・分析画面 ---- */
#menu, #mode1, #mode2, #mode3, #mode4, #mode5, #mode6 { display: none; text-align: center; }
#mode5 h3, #mode6 h3 { margin: 16px 0 2px; font-size: 18px; color: #445; }
#mode5 .note { font-size: 13px; color: #666; margin: 8px auto; max-width: 420px; line-height: 1.6; }
#menu button, #mode1 button, #mode2 button, #mode3 button, #mode4 button, #mode5 button, #mode6 button {
    display: block; margin: 8px auto; width: min(92vw, 380px); font-size: clamp(18px, 5vw, 24px); padding: 12px 16px; border-radius: 10px;
}
#optBox { display: block; margin: 14px auto; font-size: 17px; }

#analysis { display: none; max-width: 640px; margin: 10px auto; text-align: left; font-size: 19px; padding: 0 10px; }
#analysis table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
#analysis td { padding: 4px 6px; border-bottom: 1px solid #ddd; }
#analysis td.n { text-align: right; white-space: nowrap; width: 1%; }
#analysis td.mis { font-size: 16px; color: #a33; padding-left: 24px; }
#analysis .sub { font-size: 14px; color: #666; }
#analysis .advice { background: #fff6dd; padding: 8px 12px; border-radius: 6px; }
#analysis button { font-size: 20px; padding: 6px 16px; }
#analysis details { margin-top: 4px; font-size: 15px; white-space: pre-line; }

/* ---- ルビ（ふりがな）切り替え ---- */
#rubyBtn { position: fixed; top: calc(4px + env(safe-area-inset-top)); right: 6px; z-index: 60; font-size: 13px; padding: 3px 10px;
    border-radius: 14px; border: 1px solid #889; background: #fffbe8; color: #223; opacity: .93; }
#rubyBtn.on { background: #2d6cdf; color: #fff; border-color: #2d6cdf; }
#app { padding-top: 30px; }
body.quiz #app { padding-top: 30px; }
rt { font-size: .5em; font-weight: normal; color: #555; }
button rt { color: inherit; }
body.ruby #result, body.ruby #explain, body.ruby #analysis, body.ruby #menu, body.ruby #mode1, body.ruby #mode2, body.ruby #mode3,
body.ruby #mode4, body.ruby #mode5, body.ruby #mode6, body.ruby #notes { line-height: 2.1; }
body.ruby button, body.ruby label { line-height: 1.9; }
</style>
</head>
<body>
<button id="rubyBtn" type="button" onclick="toggleRuby()" aria-pressed="false">ルビ：OFF</button>
<div id="app">

<div id="qbox">
    <p id="result"></p>
    <div id="timer"></div>
</div>

<div id="analysis"></div>

<div id="answerRow">
    <input id="answer" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="symbols"></div>
</div>

<div id="menu">
    <button onclick="checkstrat_mode1()">基礎計算</button>
    <button onclick="checkstrat_mode2()">図形計算</button>
    <button onclick="checkstrat_mode3()">高次計算</button>
    <button onclick="checkstrat_mode4()">論理的計算</button>
    <button onclick="checkstrat_mode6()">大学数学（微分積分・線形代数・統計）</button>
    <button onclick="checkstrat_mode5()">まとめテスト（計算方式別・学年別）</button>
    <button onclick="openNotes()">数式メモ（記号つきノート）</button>
    <button onclick="checkanalysis()">正解率の表示</button>
    <button onclick="checkreset()">回答分析のリセット</button>
    <label id="optBox"><input type="checkbox" id="optExplain" onchange="setOption()"> 正解のときも解説を表示する</label>
    <label id="optBox2" style="display:block;margin:6px auto;font-size:17px"><input type="checkbox" id="optStepAll" onchange="setOption()"> 解説を最初から全ステップ表示する</label>
</div>

<div id="mode6">
    <h3>微分積分</h3>
    <button onclick="startUnit(34)">極限</button>
    <button onclick="startUnit(35)">微分</button>
    <button onclick="startUnit(36)">偏微分</button>
    <button onclick="startUnit(37)">積分（定積分・置換・部分積分）</button>
    <button onclick="startUnit(38)">級数・テイラー展開</button>
    <button onclick="startUnit(39)">重積分</button>
    <button onclick="startUnit(40)">微分方程式</button>
    <h3>線形代数</h3>
    <button onclick="startUnit(41)">行列の演算</button>
    <button onclick="startUnit(42)">行列式</button>
    <button onclick="startUnit(43)">逆行列・連立1次方程式</button>
    <button onclick="startUnit(44)">固有値・固有ベクトル</button>
    <button onclick="startUnit(45)">内積・外積・ノルム</button>
    <button onclick="startUnit(46)">階数・次元・一次独立</button>
    <h3>統計</h3>
    <button onclick="startUnit(47)">記述統計</button>
    <button onclick="startUnit(48)">確率変数・期待値・分散</button>
    <button onclick="startUnit(49)">二項分布・ポアソン分布</button>
    <button onclick="startUnit(50)">正規分布・標本平均</button>
    <button onclick="startUnit(51)">推定・検定</button>
    <button onclick="startUnit(52)">相関・回帰</button>
    <button onclick="checkback2()">戻る</button>
</div>

<div id="mode5"></div>

<div id="mode1">
    <button onclick="startUnit(30)">二桁の足し引き</button>
    <button onclick="startUnit(31)">九九</button>
    <button onclick="startUnit(32)">二桁のかけ割</button>
    <button onclick="checkstrat_easeC()">数直線</button>
    <button onclick="checkstrat_hrad()">正負の計算</button>
    <button onclick="startTimeAttack()">正負の2桁 タイムアタック（20問）</button>
    <button onclick="startUnit(14)">平方根</button>
    <button onclick="startUnit(15)">一次方程式・文字式</button>
    <button onclick="checkstrat_easeB()">一次関数</button>
    <button onclick="checkback2()">戻る</button>
</div>

<div id="mode2">
    <button onclick="checkstrat_Shape()">簡単な図形</button>
    <button onclick="startUnit(20)">角度</button>
    <button onclick="startUnit(18)">円とおうぎ形</button>
    <button onclick="startUnit(19)">立体の体積・表面積</button>
    <button onclick="startUnit(17)">三平方の定理</button>
    <button onclick="checkstrat_Shape2()">三角比</button>
    <button onclick="startUnit(25)">正弦定理・余弦定理</button>
    <button onclick="checkstrat_Shape3()">ベクトル</button>
    <button onclick="startUnit(27)">図形と方程式</button>
    <button onclick="startUnit(29)">弧度法と三角関数</button>
    <button onclick="checkback2()">戻る</button>
</div>

<div id="mode3">
    <button onclick="checkstrat_easeB2()">二次関数</button>
    <button onclick="startUnit(16)">二次方程式</button>
    <button onclick="checkstrat_Simultaneous()">連立方程式</button>
    <button onclick="checkstrat_easeB3()">因数分解</button>
    <button onclick="checkstrat_easeB4()">展開</button>
    <button onclick="checkstrat_easeB5()">平方完成</button>
    <button onclick="startUnit(28)">不等式</button>
    <button onclick="startUnit(24)">指数・対数</button>
    <button onclick="startUnit(23)">数列</button>
    <button onclick="startUnit(26)">微分・積分</button>
    <button onclick="checkback2()">戻る</button>
</div>

<div id="mode4">
    <button onclick="checkstrat_easeD1()">集合と命題</button>
    <button onclick="startUnit(21)">場合の数と確率</button>
    <button onclick="startUnit(22)">資料の整理とデータ分析</button>
    <button onclick="checkback2()">戻る</button>
</div>


<div id="workspace">
    <div id="図形"></div>
    <div id="explain"></div>
    <div id="memo">
        <div>
            <button id="memoBtnDraw" onclick="memoSwitch('draw')">手書き</button>
            <button id="memoBtnText" onclick="memoSwitch('text')">テキスト</button>
            <span id="memoTools">
                <button id="memoBtnPen" onclick="memoSetTool('pen')">ペン</button>
                <button id="memoBtnEraser" onclick="memoSetTool('eraser')">消しゴム</button>
            </span>
            <button onclick="memoClear()">全部消す</button>
        </div>
        <canvas id="memoCanvas" width="900" height="450"></canvas>
        <textarea id="memoText" placeholder="ここに計算メモを書けます"></textarea>
    </div>
</div>

<div id="notes">
    <div id="notesMain">
        <div id="notesBar">
            <select id="noteSelect" aria-label="メモを選ぶ"></select>
            <button type="button" id="noteNew">新規</button>
            <button type="button" id="noteRename">名前</button>
            <button type="button" id="noteDelete">削除</button>
        </div>
        <textarea id="noteText" placeholder="ここに自由にメモできます。下の記号をタップすると、カーソルの位置に入ります。" spellcheck="false"></textarea>
    </div>
    <div id="palette">
        <div id="palTabs"></div>
        <div id="palKeys"></div>
        <div id="palCtl">
            <button type="button" data-c="left">◀</button>
            <button type="button" data-c="right">▶</button>
            <button type="button" data-c="back">⌫</button>
            <button type="button" data-c="space">空白</button>
            <button type="button" data-c="enter">改行</button>
        </div>
    </div>
    <div id="notesBottom">
        <button type="button" id="noteCopy">コピー</button>
        <span id="noteStatus"></span>
        <button type="button" id="noteBack">戻る</button>
    </div>
</div>

<div id="buttons">
    <button id="checkAnswer" onclick="checkAnswer()">回答</button>
    <button id="checkback" onclick="checkback()">戻る</button>
</div>

</div>

<script>
// questionmode: 1=整数計算 2=正負の計算 3=一次関数 4=簡単な図形 5=連立方程式 6=三角比
//   7=数直線 8=ベクトル 9=二次関数 10=因数分解 11=展開 12=平方完成 13=集合と命題
//   14=平方根 15=一次方程式 16=二次方程式 17=三平方 18=円とおうぎ形 19=立体 20=角度 21=場合の数と確率
//   22=データ分析 23=数列 24=指数・対数 25=正弦・余弦定理 26=微分・積分 27=図形と方程式 28=不等式 29=弧度法と三角関数
let answerX = 0;
let answerY = 0;
let eq = [0, 0, 0, 0, 0, 0];      // 連立方程式の係数 [a,b,c,d,e,f]
let questionnumber = [0, 0, 0, 0];
let questionmode = 1;
let questionCount = 1;
let correctAnswer;
let correctVec = null;       // 複数の数で答える問題の正解（配列）
let correctExpr = null;      // √や分数を含む式で答える問題の正解（文字列）
let exprStrict = false;      // true: 簡単な形（有理化・√の中を最小）で答えないと不正解
let answerlist = new Array(15).fill(0);
let answer_misu = [];
let answerCount = 1;
let sessionId = 0;                 // 「戻る」後に古い処理が動かないようにするための番号
const MODE_COUNT = 52;
let answerstatistics = newStatistics();
let misList = [];                         // 想定される間違いと、その間違え方の説明
let vecNames = [];                        // 複数の数で答える問題の、各値の名前
let sessionMistakes = {};                 // 今回のセット内の間違え方の集計
let mistakeStats = newMistakeStats();     // 単元ごとの間違え方の集計
const TA_COUNT = 20;                      // タイムアタックの問題数
let answerFigure = null;                   // 回答後に表示する解説図を描く関数
let taStart = 0, taTimerId = null, taLog = [], taCorrect = 0, taFlash = "", taBest = null;

function newMistakeStats() {
    return Array.from({ length: MODE_COUNT }, () => ({}));
}

function newStatistics() {
    return Array.from({ length: MODE_COUNT }, () => [0, 0]);
}

// y=ax+b  [y, a, x, b]
const questioneaseB = [
    [13, 4, 4, -3],
    [-9, -6, 6, 27],
    [-10, -4, -4, -26],
    [-23, -3, 4, -11],
    [-33, 7, -3, 12],
    [-16, -1, 18, 2],
    [14, -1, -16, -2],
    [-14, 3, -9, 13],
    [19, 12, 1, 7]
];

// 連立方程式 [a, b, (c), d, e, (f), x, y]
// c と f は x,y から自動計算するので、ここの値は使われない
const questioneaseE = [
    [2, 3, 13, 4, -1, 5, 2, 3],
    [1, 2, 8, 3, -1, 9, 4, 2],
    [3, 2, 16, 1, -2, -1, 4, 2],
    [2, -1, 7, 3, 2, 14, 3, -1],
    [1, 3, 11, 2, -1, 1, 2, 3],

    [3, 1, 10, 2, 3, 13, 2, 4],
    [2, 5, 19, 4, -1, 6, 2, 3],
    [1, -2, -4, 3, 1, 11, 3, 4],
    [4, 1, 13, 2, -3, 1, 2, 5],
    [2, 3, 12, 1, -2, -4, 2, 2],

    [3, -2, 5, 1, 4, 11, 3, 2],
    [1, 4, 14, 2, -1, 1, 2, 3],
    [2, -3, -1, 3, 1, 11, 2, 1],
    [5, 2, 19, 1, -1, 1, 3, 2],
    [1, 2, 1, 4, -1, 13, 3, -1],

    [2, -1, 9, 3, 2, 16, 3, -3],
    [3, 4, 18, 2, -1, 9, 2, 3],
    [1, -3, 7, 2, 1, 8, 5, -2],
    [4, -2, 10, 1, 3, 11, 2, -1],
    [2, 1, 9, 3, -2, 4, 2, 5]
];

// 三角比 [問題文, 回答]
const questioneaseF = [
    ["直角三角形ABCで、∠C=90°、AB=5、BC=3のとき、sin Aを求めよ", "3/5"],
    ["直角三角形ABCで、∠C=90°、AB=5、AC=4のとき、cos Aを求めよ", "4/5"],
    ["直角三角形ABCで、∠C=90°、AC=4、BC=3のとき、tan Aを求めよ", "3/4"],
    ["sin 30°の値を求めよ", "1/2"],
    ["cos 60°の値を求めよ", "1/2"],
    ["tan 45°の値を求めよ", "1"],

function normalizeNumberText(s) {

        .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
        .replace(/[−ー―‐－]/g, "-")
        .replace(/＋/g, "+")
        .replace(/／/g, "/")
        .replace(/．/g, ".")
        .replace(/[，、]/g, ",")

        .trim();
}

// "3/5" や "0.6" を数値に。変換できなければ null
function tryParseNumber(s) {
    s = s.replace(/\s/g, "");
    if (/^[+-]?\d+(\.\d+)?$/.test(s)) return Number(s);
    const m = s.match(/^([+-]?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
    if (m && Number(m[2]) !== 0) return Number(m[1]) / Number(m[2]);
    return null;
}

    const x0 = Math.min(...xs) - 1, x1 = Math.max(...xs) + 1, y0 = Math.min(...ys) - 1, y1 = Math.max(...ys) + 1;
    const unit = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad) / (y1 - y0), 40);
    const left = (W - (x1 - x0) * unit) / 2, top = (H - (y1 - y0) * unit) / 2;
    const px = x => (left + (x - x0) * unit).toFixed(1);
    const py = y => (top + (y1 - y) * unit).toFixed(1);
    const colorList = [];
    arrows.forEach(ar => { if (!colorList.includes(ar.color)) colorList.push(ar.color); });
    let svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" style="max-width:100%;height:auto"><defs>';
    colorList.forEach((c, i) => {
        svg += '<marker id="ah' + figSeq + "_" + i + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + c + '"/></marker>';
    });
    svg += "</defs>";
    for (let x = x0; x <= x1; x++) svg += '<line x1="' + px(x) + '" y1="' + py(y0) + '" x2="' + px(x) + '" y2="' + py(y1) + '" stroke="#ddd" stroke-width="1"/>';
    for (let y = y0; y <= y1; y++) svg += '<line x1="' + px(x0) + '" y1="' + py(y) + '" x2="' + px(x1) + '" y2="' + py(y) + '" stroke="#ddd" stroke-width="1"/>';
    svg += '<line x1="' + px(x0) + '" y1="' + py(0) + '" x2="' + px(x1) + '" y2="' + py(0) + '" stroke="#555" stroke-width="1.5"/>';
    svg += '<line x1="' + px(0) + '" y1="' + py(y0) + '" x2="' + px(0) + '" y2="' + py(y1) + '" stroke="#555" stroke-width="1.5"/>';
    const step = unit >= 16 ? 1 : (unit >= 9 ? 2 : 5);
    for (let x = x0; x <= x1; x++) {
        if (x !== 0 && x % step === 0) svg += '<text x="' + px(x) + '" y="' + (Number(py(0)) + 13) + '" font-size="11" text-anchor="middle" fill="#555">' + x + "</text>";
    }
    for (let y = y0; y <= y1; y++) {
        if (y !== 0 && y % step === 0) svg += '<text x="' + (Number(px(0)) - 5) + '" y="' + (Number(py(y)) + 4) + '" font-size="11" text-anchor="end" fill="#555">' + y + "</text>";
    }
    svg += '<text x="' + (Number(px(0)) - 8) + '" y="' + (Number(py(0)) + 13) + '" font-size="12" text-anchor="end" fill="#555">O</text>';
    legs.forEach(l => {
        svg += '<polyline points="' + px(l.from[0]) + "," + py(l.from[1]) + " " + px(l.to[0]) + "," + py(l.from[1]) + " " + px(l.to[0]) + "," + py(l.to[1]) +
            '" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3"/>';
    });
    arrows.forEach(ar => {
        const idx = colorList.indexOf(ar.color);
        svg += '<line x1="' + px(ar.from[0]) + '" y1="' + py(ar.from[1]) + '" x2="' + px(ar.to[0]) + '" y2="' + py(ar.to[1]) + '" stroke="' + ar.color +
            '" stroke-width="' + (ar.thin ? 1.5 : 2.5) + '"' + (ar.dash ? ' stroke-dasharray="5,4"' : "") + ' marker-end="url(#ah' + figSeq + "_" + idx + ')"/>';
        if (ar.label) {
            const sx = (Number(px(ar.from[0])) + Number(px(ar.to[0]))) / 2, sy = (Number(py(ar.from[1])) + Number(py(ar.to[1]))) / 2;
            const dx = Number(px(ar.to[0])) - Number(px(ar.from[0])), dy = Number(py(ar.to[1])) - Number(py(ar.from[1]));
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            svg += '<text x="' + (sx - dy / len * 12).toFixed(1) + '" y="' + (sy + dx / len * 12 + 4).toFixed(1) + '" font-size="15" font-weight="bold" text-anchor="middle" fill="' + ar.color + '">' + ar.label + "</text>";
        }
    });
    points.forEach(pt => {
        const c = pt.color || "#333";
        svg += '<circle cx="' + px(pt.p[0]) + '" cy="' + py(pt.p[1]) + '" r="4" fill="' + c + '"/>';
        if (pt.label) svg += '<text x="' + (Number(px(pt.p[0])) + 7) + '" y="' + (Number(py(pt.p[1])) - 7) + '" font-size="15" font-weight="bold" fill="' + c + '">' + pt.label + "</text>";
    });
    document.getElementById("図形").innerHTML = svg + "</svg>";
}

// 8: ベクトル
function makeQuestionVector() {
    const kind = randInt(12);
    const rv = (m) => { let v; do { v = [randRange(-m, m), randRange(-m, m)]; } while (v[0] === 0 && v[1] === 0); return v; };
    const fmt = u => "(" + u[0] + ", " + u[1] + ")";
    const add = (u, v) => [u[0] + v[0], u[1] + v[1]];
    const sub = (u, v) => [u[0] - v[0], u[1] - v[1]];
    const mul = (k, u) => [k * u[0], k * u[1]];
    const O = [0, 0], BLUE = "#1565c0", RED = "#c62828", GREEN = "#2e7d32";
    const a = rv(5), b = rv(5);
    const vecQ = (text, ans) => {
        setVecAnswer(ans, "x成分 y成分");
        setResult(qHead() + text + "\n（答えは「x成分 y成分」の順にスペース区切り）");
    };
    const figAB = (u, v) => drawVectorFigure({ arrows: [{ from: O, to: u, label: "a", color: BLUE }, { from: O, to: v, label: "b", color: RED }] });
    const sumFigure = (u, v) => () => drawVectorFigure({ arrows: [
        { from: O, to: u, label: "a", color: BLUE }, { from: O, to: v, label: "b", color: RED },
        { from: u, to: add(u, v), color: RED, dash: true, thin: true }, { from: v, to: add(u, v), color: BLUE, dash: true, thin: true },
        { from: O, to: add(u, v), label: "a+b", color: GREEN }] });

    if (kind === 0) {
        misVec(sub(a, b), "足し算を引き算にしている（a+b を a−b にしている）");
        ex("ベクトルの和は成分ごとに足す: a+b = (a₁+b₁, a₂+b₂)", "(" + pn(a[0]) + " + " + pn(b[0]) + ", " + pn(a[1]) + " + " + pn(b[1]) + ") = " + fmt(add(a, b)));
        vecQ("a=" + fmt(a) + "、b=" + fmt(b) + " のとき、a+b の成分を求めよ", add(a, b));
        figAB(a, b);
        answerFigure = sumFigure(a, b);
    } else if (kind === 1) {
        misVec(sub(b, a), "引く順序が逆（b−a を計算している）"); misVec(add(a, b), "引き算を足し算にしている");
        ex("ベクトルの差は成分ごとに引く: a−b = (a₁−b₁, a₂−b₂)", "(" + pn(a[0]) + " − " + pn(b[0]) + ", " + pn(a[1]) + " − " + pn(b[1]) + ") = " + fmt(sub(a, b)));
        vecQ("a=" + fmt(a) + "、b=" + fmt(b) + " のとき、a-b の成分を求めよ", sub(a, b));
        figAB(a, b);
        answerFigure = () => drawVectorFigure({ arrows: [
            { from: O, to: a, label: "a", color: BLUE }, { from: O, to: b, label: "b", color: RED },
            { from: b, to: a, label: "a−b", color: GREEN },
            { from: O, to: sub(a, b), color: GREEN, dash: true, thin: true }] });
    } else if (kind === 2) {
        const k = randRange(2, 3), a3 = rv(3), b3 = rv(4);
        misVec(add(a3, b3), k + " 倍を掛け忘れている（a+b にしている）"); misVec(mul(k, add(a3, b3)), k + " 倍を b にも掛けている");
        ex("まず " + k + "a を作り（各成分を " + k + " 倍）、b を成分ごとに足す", k + "a = " + fmt(mul(k, a3)), k + "a + b = (" + pn(k * a3[0]) + " + " + pn(b3[0]) + ", " + pn(k * a3[1]) + " + " + pn(b3[1]) + ") = " + fmt(add(mul(k, a3), b3)));
        vecQ("a=" + fmt(a3) + "、b=" + fmt(b3) + " のとき、" + k + "a+b の成分を求めよ", add(mul(k, a3), b3));
        figAB(a3, b3);
        answerFigure = () => drawVectorFigure({ arrows: [
            { from: O, to: a3, label: "a", color: BLUE }, { from: O, to: b3, label: "b", color: RED },
            { from: O, to: mul(k, a3), label: k + "a", color: BLUE, dash: true },
            { from: mul(k, a3), to: add(mul(k, a3), b3), color: RED, dash: true, thin: true },
            { from: O, to: add(mul(k, a3), b3), label: k + "a+b", color: GREEN }] });
    } else if (kind === 3) {
        correctAnswer = a[0] * b[0] + a[1] * b[1];
        mis(a[0] * b[1] + a[1] * b[0], "内積の成分の組み合わせ違い（x×y, y×x にしている）"); mis(a[0] * b[0] - a[1] * b[1], "成分の積の和でなく差にしている"); mis(a[0] + b[0] + a[1] + b[1], "成分を掛けずに足している");
        ex("内積 a・b = a₁b₁ + a₂b₂", pn(a[0]) + "×" + pn(b[0]) + " + " + pn(a[1]) + "×" + pn(b[1]) + " = " + pn(a[0] * b[0]) + " + " + pn(a[1] * b[1]) + " = " + correctAnswer);
        setResult(qHead() + "a=" + fmt(a) + "、b=" + fmt(b) + " のとき、内積 a・b を求めよ");
        figAB(a, b);
    } else if (kind === 4 || kind === 11) {
        const t = pick([[3, 4], [4, 3], [6, 8], [8, 6], [5, 12], [12, 5]]);
        const v = [t[0] * pick([1, -1]), t[1] * pick([1, -1])];
        correctAnswer = Math.sqrt(t[0] * t[0] + t[1] * t[1]);
        mis(t[0] * t[0] + t[1] * t[1], "√を取っていない（成分の2乗の和のまま答えている）"); mis(t[0] + t[1], "成分をそのまま足している（√(x²+y²) を使っていない）");
        ex("大きさ |a| = √(x² + y²)（図のときは座標を読み取る）", "√(" + t[0] + "² + " + t[1] + "²) = √" + (t[0] * t[0] + t[1] * t[1]) + " = " + correctAnswer);
        if (kind === 4) setResult(qHead() + "a=" + fmt(v) + " のとき、大きさ |a| を求めよ");
        else setResult(qHead() + "図のベクトル a の大きさ |a| を求めよ（座標を読み取って計算する）");
        drawVectorFigure({ arrows: [{ from: O, to: v, label: "a", color: BLUE }], legs: [{ from: O, to: v }] });
    } else if (kind === 5) {
        let A, B;
        do { A = [randRange(-5, 5), randRange(-5, 5)]; B = [randRange(-5, 5), randRange(-5, 5)]; } while (A[0] === B[0] && A[1] === B[1]);
        misVec(sub(A, B), "始点−終点にしている（AB=終点B−始点A）");
        ex("ベクトルAB = 終点B の座標 − 始点A の座標", "(" + pn(B[0]) + " − " + pn(A[0]) + ", " + pn(B[1]) + " − " + pn(A[1]) + ") = " + fmt(sub(B, A)));
        vecQ("A" + fmt(A) + "、B" + fmt(B) + " のとき、ベクトルAB の成分を求めよ", sub(B, A));
        const pts = [{ p: A, label: "A", color: BLUE }, { p: B, label: "B", color: RED }];
        drawVectorFigure({ points: pts });
        answerFigure = () => drawVectorFigure({ points: pts, arrows: [{ from: A, to: B, label: "AB", color: GREEN }], legs: [{ from: A, to: B }] });
    } else if (kind === 6) {
        // a=(p,q), b=(k,r) が垂直: p*k + q*r = 0
        const p = randNZ(-3, 3), q = randNZ(-3, 3), m = randRange(1, 3);
        const r = -p * m;
        correctAnswer = q * m;
        mis(-q * m, "符号の間違い（pk+qr=0 を解くときの移項）"); mis(p * m, "成分 p と q を取り違えている");
        ex("垂直 ⇔ 内積 = 0", "a・b = " + pn(p) + "×k + " + pn(q) + "×" + pn(r) + " = 0", pn(p) + "k = " + (-q * r), "k = " + correctAnswer);
        setResult(qHead() + "a=(" + p + ", " + q + ")、b=(k, " + r + ") が垂直のとき、k の値を求めよ");
        answerFigure = () => drawVectorFigure({ arrows: [
            { from: O, to: [p, q], label: "a", color: BLUE }, { from: O, to: [q * m, r], label: "b", color: RED }] });
    } else if (kind === 7) {
        let p, q;
        do { p = randNZ(-3, 3); q = randNZ(-3, 3); } while (Number.isInteger(Math.sqrt(p * p + q * q)));
        setExpr(vStr(vSimplifyRad([1, 1], p * p + q * q)), true);
        ex("大きさ |a| = √(x² + y²)", "√(" + pn(p) + "² + " + pn(q) + "²) = √" + (p * p + q * q) + " = " + correctExpr + "（平方数があればくくり出す）");
        setResult(qHead() + "a=" + fmt([p, q]) + " のとき、大きさ |a| を簡単な形で求めよ" + exprNote);
        drawVectorFigure({ arrows: [{ from: O, to: [p, q], label: "a", color: BLUE }], legs: [{ from: O, to: [p, q] }] });
    } else if (kind === 8) {
        let u, v, n;
        do {
            u = rv(5); v = rv(5);
            n = (u[0] + v[0]) * (u[0] + v[0]) + (u[1] + v[1]) * (u[1] + v[1]);
        } while (n === 0 || Number.isInteger(Math.sqrt(n)));
        setExpr(vStr(vSimplifyRad([1, 1], n)), true);
        ex("まず a+b を成分で求め、その大きさを求める", "a+b = " + fmt(add(u, v)), "|a+b| = √(" + pn(add(u, v)[0]) + "² + " + pn(add(u, v)[1]) + "²) = √" + n + " = " + correctExpr);
        setResult(qHead() + "a=" + fmt(u) + "、b=" + fmt(v) + " のとき、|a+b| を簡単な形で求めよ" + exprNote);
        figAB(u, v);
        answerFigure = sumFigure(u, v);
    } else if (kind === 9) {
        // 図から成分を読み取る（始点が原点でないことが多い）
        let P, Q;
        do {
            P = Math.random() < 0.4 ? [0, 0] : [randRange(-4, 4), randRange(-4, 4)];
            Q = [randRange(-5, 5), randRange(-5, 5)];
        } while (P[0] === Q[0] && P[1] === Q[1]);
        const d = sub(Q, P);
        if (P[0] !== 0 || P[1] !== 0) misVec(Q, "終点の座標をそのまま答えている（始点の座標を引いていない）");
        misVec(sub(P, Q), "向きが逆（始点−終点にしている）");
        ex("ベクトルの成分 = 終点の座標 − 始点の座標（図から座標を読む）", "始点 " + fmt(P) + "、終点 " + fmt(Q), "(" + pn(Q[0]) + " − " + pn(P[0]) + ", " + pn(Q[1]) + " − " + pn(P[1]) + ") = " + fmt(d));
        vecQ("図のベクトル u（緑の矢印）の成分を求めよ（終点の座標−始点の座標）", d);
        const pts = [{ p: P, color: GREEN }, { p: Q, color: GREEN }];
        drawVectorFigure({ arrows: [{ from: P, to: Q, label: "u", color: GREEN }], points: pts });
        answerFigure = () => drawVectorFigure({ points: pts, legs: [{ from: P, to: Q }], arrows: [
            { from: P, to: Q, label: "u", color: GREEN }, { from: O, to: d, label: "u", color: GREEN, dash: true, thin: true }] });
    } else {
        // kind 10: 図のベクトル a, b から a+b を求める
        misVec(sub(a, b), "足し算を引き算にしている（a+b を a−b にしている）");
        ex("図から a, b の成分（原点から先端までの座標）を読み取る", "a = " + fmt(a) + "、b = " + fmt(b), "a+b = (" + pn(a[0]) + " + " + pn(b[0]) + ", " + pn(a[1]) + " + " + pn(b[1]) + ") = " + fmt(add(a, b)));
        vecQ("図のベクトル a（青）、b（赤）について、a+b の成分を求めよ（座標を読み取って計算する）", add(a, b));
        figAB(a, b);
        answerFigure = sumFigure(a, b);
    }
}

// 9: 二次関数
function makeQuestionQuadratic() {
    const kind = randInt(5);
    const aList = [1, 2, 3, -1, -2];
    const vertexForm = (a, p, q) => "y=" + leadCoef(a) + "(x" + constTerm(-p) + ")²" + constTerm(q);

    if (kind === 0) {
        const a = pick(aList), p = randNZ(-5, 5), q = randNZ(-9, 9);
        setVecAnswer([p, q], "p q");
        misVec([-p, q], "頂点のx座標の符号が逆（(x−p)² の p の符号の読み違い）"); misVec([q, p], "x座標とy座標を入れ替えている");
        { const bb = -2 * a * p, cc = a * p * p + q; drawParabola(a, bb, cc); answerFigure = () => drawParabola(a, bb, cc, { points: [{ x: p, y: q, label: "頂点 (" + p + ", " + q + ")", color: FC.red }], segs: [{ x1: p, y1: 0, x2: p, y2: q, dash: "4,3", color: FC.green }] }); }
        ex("y = a(x − p)² + q の頂点は (p, q)", "(x" + constTerm(-p) + ") より p = " + p + "、定数項より q = " + q, "頂点 (" + p + ", " + q + ")");
        setResult(qHead() + vertexForm(a, p, q) + " の頂点の座標 (p, q) を求めよ\n（答えは「p q」の順にスペース区切り）");
    } else if (kind === 1) {
        const a = pick(aList), b = randRange(-4, 4), c = randNZ(-5, 5), k = randNZ(-3, 3);
        correctAnswer = a * k * k + b * k + c;
        mis(a * k + b * k + c, "x² を x にしている（2乗の計算忘れ）"); mis(a * k * k - b * k + c, "x の項の符号ミス（負の数の代入）"); mis((a * k) * (a * k) + b * k + c, "(ax)² と ax² を混同している");
        { drawParabola(a, b, c); answerFigure = () => drawParabola(a, b, c, { points: [{ x: k, y: correctAnswer, label: "(" + k + ", " + correctAnswer + ")", color: FC.red }], segs: [{ x1: k, y1: 0, x2: k, y2: correctAnswer, dash: "4,3", color: FC.green }] }); }
        ex("x = " + k + " を代入する", "y = " + pn(a) + "×" + pn(k) + "² + " + pn(b) + "×" + pn(k) + " + " + pn(c), "= " + (a * k * k) + " + " + pn(b * k) + " + " + pn(c) + " = " + correctAnswer);
        setResult(qHead() + "y=" + polyA(a, b, c) + " において x=" + k + " のときの y の値を求めよ");
    } else if (kind === 2) {
        const a = pick(aList), p = randNZ(-5, 5), q = randNZ(-9, 9);
        correctAnswer = q;
        mis(p, "頂点の x座標を答えている（最小値・最大値は y座標）");
        { const bb = -2 * a * p, cc = a * p * p + q; drawParabola(a, bb, cc); answerFigure = () => drawParabola(a, bb, cc, { points: [{ x: p, y: q, label: (a > 0 ? "最小値 " : "最大値 ") + q, color: FC.red }], segs: [{ x1: -50, y1: q, x2: 50, y2: q, dash: "4,3", color: FC.green }] }); }
        ex("a(x−p)²+q で a>0 なら下に凸 → 頂点で最小、a<0 なら上に凸 → 頂点で最大", "最小値・最大値は頂点の y 座標 q = " + q);
        setResult(qHead() + vertexForm(a, p, q) + " の" + (a > 0 ? "最小値" : "最大値") + "を求めよ");
    } else if (kind === 3) {
        const a = pick([1, 2, 3]), p = randNZ(-4, 4), c = randNZ(-5, 5);
        correctAnswer = p;
        mis(-p, "軸の符号の取り違え（x=−b/2a）"); mis(a * p, "2a ではなく 2 だけで割っている（x=−b/2a の a）");
        { const bb = -2 * a * p; drawParabola(a, bb, c); answerFigure = () => drawParabola(a, bb, c, { segs: [{ x1: p, y1: -500, x2: p, y2: 500, dash: "5,4", color: FC.green }], texts: [{ x: p + 0.2, y: 0.9, t: "軸 x=" + p, color: FC.green, bold: true, anchor: "start" }] }); }
        ex("y = ax²+bx+c の軸は x = −b/(2a)", "a = " + a + "、b = " + (-2 * a * p), "x = −(" + (-2 * a * p) + ")/(2×" + a + ") = " + p);
        setResult(qHead() + "y=" + polyA(a, -2 * a * p, c) + " の軸は x=□ である。□に入る値を求めよ");
    } else {
        const a = pick(aList), b = randNZ(-6, 6), c = randNZ(-5, 5);
        correctAnswer = b * b - 4 * a * c;
        mis(b * b + 4 * a * c, "−4ac の符号ミス（D=b²−4ac）"); mis(b * b - a * c, "4 を掛け忘れている（D=b²−4ac）"); mis(b * b, "−4ac を計算し忘れている");

    s = String(s).replace(/ルート|ろーと|sqrt|root|rt/gi, "√").replace(/（/g, "(").replace(/）/g, ")");
    s = normalizeNumberText(s).replace(/\s/g, "");
    return s.replace(/√\((\d+)\)/g, "√$1").replace(/\((√?\d+)\)/g, "$1").replace(/[×・＊]/g, "*");
}

// 「2√3」「√3/2」「1/√3」のような1項を解析
function parseTermStr(t) {
    const toks = t.match(/\d+(?:\.\d+)?|√|\/|\*/g);
    if (!toks || toks.join("") !== t) return null;
    let coeff = [1, 1], rad = 1, op = "*", prevOp = true, clean = true, i = 0;
    while (i < toks.length) {
        const tk = toks[i];
        if (tk === "/" || tk === "*") {
            if (prevOp) return null;
            op = tk; prevOp = true; i++;
            continue;
        }
        if (tk === "√") {
            const nx = toks[i + 1];
            if (nx === undefined || !/^\d+$/.test(nx) || Number(nx) === 0) return null;
            const val = Number(nx);
            i += 2;
            if (op === "/") { coeff = frMul(coeff, [1, val]); clean = false; }   // 分母に√
            rad *= val;
        } else {
            i++;
            let f;
            if (tk.includes(".")) f = fr(Number(tk.replace(".", "")), Math.pow(10, tk.split(".")[1].length));
            else f = fr(Number(tk), 1);
            if (op === "/") {
                if (f[0] === 0) return null;
                coeff = frMul(coeff, [f[1], f[0]]);
            } else coeff = frMul(coeff, f);
        }
        op = "*"; prevOp = false;
    }
    if (prevOp) return null;
    const w = vSimplifyRad(coeff, rad);
    if (w.s !== rad) clean = false;                                            // √の中に平方数が残っている
    return { c: w.c, s: w.s, clean: clean };
}

function parseExpr(raw) {
    const str = normalizeExprText(raw);
    if (str === "" || /[()]/.test(str)) return null;
    const terms = str.match(/[+-]?[^+-]+/g);
    if (!terms || terms.join("") !== str) return null;
    const map = {};
    let clean = true;
    for (const term of terms) {
        const v = parseTermStr(term.replace(/^[+-]/, ""));
        if (!v) return null;
        if (!v.clean) clean = false;
        const c = term[0] === "-" ? [-v.c[0], v.c[1]] : v.c;
        map[v.s] = map[v.s] ? frAdd(map[v.s], c) : c;
    }
    Object.keys(map).forEach(k => { if (map[k][0] === 0) delete map[k]; });
    return { map: map, clean: clean };
}

function exprEqual(a, b) {
    const ka = Object.keys(a), kb = Object.keys(b);
    return ka.length === kb.length && ka.every(k => b[k] && a[k][0] === b[k][0] && a[k][1] === b[k][1]);
}

function judgeExpr(raw) {
    const u = parseExpr(raw), c = parseExpr(correctExpr);
    if (!u || !c) return false;
    if (exprStrict && !u.clean) return false;
    return exprEqual(u.map, c.map);
}

const memoCanvas = document.getElementById("memoCanvas");

let memoDrawing = false;
let memoToolName = "pen";

function memoSetTool(tool) {
    memoToolName = tool;
    memoCtx.globalCompositeOperation = tool === "eraser" ? "destination-out" : "source-over";
    memoCtx.lineWidth = tool === "eraser" ? 28 : 4;

function memoSwitch(mode) {
    const draw = mode === "draw";
    memoCanvas.style.display = draw ? "inline-block" : "none";
    document.getElementById("memoText").style.display = draw ? "none" : "inline-block";
    document.getElementById("memoTools").style.display = draw ? "inline" : "none";

function memoClear() {
    memoCtx.clearRect(0, 0, memoCanvas.width, memoCanvas.height);
    document.getElementById("memoText").value = "";
}

function memoPos(e) {
    const r = memoCanvas.getBoundingClientRect();
    return {
        x: (e.clientX - r.left) * memoCanvas.width / r.width,
        y: (e.clientY - r.top) * memoCanvas.height / r.height
    };
}

memoCanvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    memoDrawing = true;
    if (memoCanvas.setPointerCapture) memoCanvas.setPointerCapture(e.pointerId);
    const p = memoPos(e);
    memoCtx.beginPath();
    memoCtx.moveTo(p.x, p.y);
    memoCtx.lineTo(p.x + 0.1, p.y + 0.1);
    memoCtx.stroke();
});
memoCanvas.addEventListener("pointermove", e => {
    if (!memoDrawing) return;
    e.preventDefault();
    const p = memoPos(e);
    memoCtx.lineTo(p.x, p.y);
    memoCtx.stroke();
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
    memoCanvas.addEventListener(ev, () => { memoDrawing = false; }));

function fitMemoCanvas() {
    const r = memoCanvas.getBoundingClientRect();
    const w = Math.round(r.width), h = Math.round(r.height);
    if (w < 20 || h < 20) return;
    if (memoCanvas.width === w && memoCanvas.height === h) return;
    const tmp = document.createElement("canvas");
    tmp.width = memoCanvas.width;
    tmp.height = memoCanvas.height;
    tmp.getContext("2d").drawImage(memoCanvas, 0, 0);
    memoCanvas.width = w;
    memoCanvas.height = h;
    memoCtx.drawImage(tmp, 0, 0);
    memoSetTool(memoToolName);
}

function tms(l) {
    let s = "";
    l.forEach(([a, m]) => {
        if (!a) return;
        const ab = Math.abs(a), t = m === "" ? String(ab) : (ab === 1 ? "" : ab) + m;

}

    const A = M.map(r => r.slice()), R = A.length, C = A[0].length;
    let rk = 0;
    for (let c = 0; c < C && rk < R; c++) {
        let p = -1;
        for (let r = rk; r < R; r++) if (Math.abs(A[r][c]) > 1e-9) { p = r; break; }
        if (p < 0) continue;
        [A[rk], A[p]] = [A[p], A[rk]];
        for (let r = rk + 1; r < R; r++) { const f = A[r][c] / A[rk][c]; for (let k = c; k < C; k++) A[r][k] -= f * A[rk][k]; }
        rk++;
    }
    return rk;
}

        mis(A * B - A, "割り算を引き算にしている");
        answerFigure = () => drawDotArray(A, B, (A * B) + " ÷ " + A + " = " + B);
        ex("九九の逆: " + A + " × □ = " + (A * B) + " の □ を探す", A + " × " + B + " = " + (A * B) + " なので " + (A * B) + " ÷ " + A + " = " + B);
        mis(A + B, "割り算を足し算にしている");
        setResult(qHead() + (A * B) + " ÷ " + A + " = ?");
    } else {
        correctAnswer = A * B;
        mis(A * (B + 1), "九九の覚え違い（隣の答えを答えている）");
        mis(A * (B - 1), "九九の覚え違い（隣の答えを答えている）");
        mis((A + 1) * B, "九九の覚え違い（隣の段の答えを答えている）");
        drawDotArray(A, B, A + " × " + B + " = ?");
        ex("九九: " + A + " × " + B + " = " + (A * B), A + " の段を唱えて確認する（" + A + " が " + B + " 個分）");
        mis((A - 1) * B, "九九の覚え違い（隣の段の答えを答えている）");
        mis(A + B, "かけ算を足し算にしている");
        setResult(qHead() + A + " × " + B + " = ?");
    }
}

// 32: 二桁のかけ割
function makeQuestionTwoDigitMulDiv() {
    const r = Math.random();
    if (r < 0.3) {
        const A = randRange(11, 99), B = randRange(2, 9);
        const t = Math.floor(A / 10), o = A % 10;
        correctAnswer = A * B;
        { drawBoxTable([String(t * 10), String(o)], [String(B)], [["?", "?"]], { title: A + " × " + B + "（分けて掛ける）" }); answerFigure = () => drawBoxTable([String(t * 10), String(o)], [String(B)], [[String(t * 10 * B), String(o * B)]], { title: (t * 10 * B) + " + " + (o * B) + " = " + (A * B) }); }
        ex("二桁×一桁: 十の位と一の位に分けて掛ける", A + " = " + (t * 10) + " + " + o, (t * 10) + " × " + B + " = " + (t * 10 * B) + "、" + o + " × " + B + " = " + (o * B), (t * 10 * B) + " + " + (o * B) + " = " + correctAnswer);
        mis(10 * t * B + o, "一の位に掛けていない（十の位だけ掛けている）");
        if (o * B >= 10) mis(10 * t * B + (o * B) % 10, "一の位の掛け算の繰り上がりを足し忘れている");
        mis(A + B, "かけ算を足し算にしている");
        setResult(qHead() + A + " × " + B + " = ?");
    } else if (r < 0.55) {
        const A = randRange(11, 30), B = randRange(11, 30);
        const b1 = Math.floor(B / 10), b0 = B % 10;
        correctAnswer = A * B;
        { drawBoxTable([String(b1 * 10), String(b0)], [String(A)], [["?", "?"]], { title: A + " × " + B + "（かける数を分ける）", cw: 90 }); answerFigure = () => drawBoxTable([String(b1 * 10), String(b0)], [String(A)], [[String(A * b1 * 10), String(A * b0)]], { title: (A * b1 * 10) + " + " + (A * b0) + " = " + (A * B), cw: 90 }); }
        ex("二桁×二桁: 掛ける数を十の位と一の位に分けて、部分積を足す", A + " × " + B + " = " + A + " × " + (b1 * 10) + " + " + A + " × " + b0, (A * b1 * 10) + " + " + (A * b0) + " = " + correctAnswer);
        mis(A * b1 + A * b0, "十の位の部分積を 10 倍していない（位取りのミス）");
        mis(A * b1 * 10, "一の位の部分積を足し忘れている");
        mis(A * b0, "十の位の掛け算を忘れている");
        setResult(qHead() + A + " × " + B + " = ?");
    } else if (r < 0.8) {
        const dv = randRange(2, 9);
        const q = randRange(Math.ceil(10 / dv), Math.floor(99 / dv));
        correctAnswer = q;
        mis(dv, "割る数を答えている");
        mis(q * 10, "桁がずれている（位取りのミス）");
        ex("割り算の答え × 割る数 = 割られる数 で確かめながら探す", (dv * q) + " ÷ " + dv + " = " + q + "（" + dv + " × " + q + " = " + (dv * q) + "）");
        mis(dv * q - dv, "割り算を引き算にしている");
        setResult(qHead() + (dv * q) + " ÷ " + dv + " = ?");
    } else {
        const dv = randRange(11, 25), q = randRange(2, 9);
        correctAnswer = q;
        mis(dv, "割る数を答えている");
        mis(q * 10, "桁がずれている（位取りのミス）");
        ex("割る数の何倍かを考える", dv + " × " + q + " = " + (dv * q) + " なので " + (dv * q) + " ÷ " + dv + " = " + q);
        mis(dv * q - dv, "割り算を引き算にしている");
        setResult(qHead() + (dv * q) + " ÷ " + dv + " = ?");
    }
}

// 33: 正負の2桁（タイムアタック用）
function makeQuestionSignedTwoDigit() {
    const sgn = () => (Math.random() < 0.5 ? 1 : -1);
    const f = n => "(" + n + ")";
    const r = Math.random();
    const A = sgn() * randRange(10, 99);
    if (r < 0.35) {
        const B = sgn() * randRange(10, 99);
        correctAnswer = A + B;
        mis(A - B, "足し算を引き算にしている（−( ) の扱いの取り違え）");
        if (A * B < 0) {
            mis(Math.abs(A) + Math.abs(B), "異符号の足し算で絶対値を足している（大きい方から小さい方を引く）");
            mis(-(Math.abs(A) + Math.abs(B)), "異符号の足し算で絶対値を足している（大きい方から小さい方を引く）");
        } else {
            mis(Math.abs(A + B), "共通の符号を付け忘れている");
        }
        mis(A + B + 10, "繰り上がり・繰り下がりのミス（10 のずれ）");
        mis(A + B - 10, "繰り上がり・繰り下がりのミス（10 のずれ）");
        ex("足し算: 同符号なら絶対値を足して共通の符号、異符号なら絶対値の大きい方から小さい方を引いて大きい方の符号", pn(A) + " + " + pn(B) + " = " + correctAnswer);
        setResult(qHead() + f(A) + " + " + f(B) + " = ?");
    } else if (r < 0.7) {
        const B = sgn() * randRange(10, 99);
        correctAnswer = A - B;
        mis(A + B, "引き算を足し算にしている（−(−B)=+B の処理ミス）");
        mis(B - A, "引く順番が逆（B−A を計算している）");
        mis(A - B + 10, "繰り上がり・繰り下がりのミス（10 のずれ）");
        mis(A - B - 10, "繰り上がり・繰り下がりのミス（10 のずれ）");
        ex("引き算は「符号を変えて足し算」: A − B = A + (−B)", pn(A) + " − " + pn(B) + " = " + pn(A) + " + " + pn(-B) + " = " + correctAnswer);
        setResult(qHead() + f(A) + " - " + f(B) + " = ?");
    } else if (r < 0.85) {
        const B = sgn() * randRange(2, 9);
        correctAnswer = A * B;
        mis(-correctAnswer, "かけ算の符号ミス（同符号→正、異符号→負）");
        mis(A + B, "かけ算を足し算にしている");
        ex("絶対値を掛けて、同符号なら正、異符号なら負", Math.abs(A) + " × " + Math.abs(B) + " = " + Math.abs(correctAnswer) + "、符号は" + (correctAnswer < 0 ? "負" : "正") + " → " + correctAnswer);
        setResult(qHead() + f(A) + " × " + f(B) + " = ?");
    } else {
        const dv = sgn() * randRange(2, 9), absDv = Math.abs(dv);
        const q = sgn() * randRange(Math.ceil(10 / absDv), Math.floor(99 / absDv));
        correctAnswer = q;
        mis(-q, "割り算の符号ミス（同符号→正、異符号→負）");
        mis(Math.abs(dv), "割る数を答えている");
        ex("絶対値を割って、同符号なら正、異符号なら負", Math.abs(dv * q) + " ÷ " + Math.abs(dv) + " = " + Math.abs(q) + "、符号は" + (q < 0 ? "負" : "正") + " → " + q);
        setResult(qHead() + f(dv * q) + " ÷ " + f(dv) + " = ?");
    }
}

// ---------- タイムアタック ----------
function fmtTime(sec) {
    const m = Math.floor(sec / 60);
    const rest = (sec - m * 60).toFixed(1);
    return m + ":" + (Number(rest) < 10 ? "0" : "") + rest;
}

function updateTimer() {
    const sec = (performance.now() - taStart) / 1000;
    if (testState) {
        document.getElementById("timer").textContent = "【" + testState.test.name + "・セット" + SET_LETTERS[testState.set] + "】問題 " +
            (testState.idx + 1) + "/" + testState.items.length + "　経過 " + fmtTime(sec);
        return;
    }
    document.getElementById("timer").textContent =
        "問題 " + questionCount + "/" + TA_COUNT + "　経過 " + fmtTime(sec) + (taFlash ? "　" + taFlash : "");
}
function startTimer() {
    stopTimer();
    taTimerId = setInterval(updateTimer, 100);
    show("timer", "block");
    updateTimer();
}
function stopTimer() {
    if (taTimerId !== null) clearInterval(taTimerId);
    taTimerId = null;
    show("timer", "none");
}

function startTimeAttack() {
    startSession(33, null, "text");
    show("memo", "none");              // タイムアタックはメモなし
    taLog = [];
    taCorrect = 0;
    taFlash = "";
    taStart = performance.now();
    startTimer();
    document.getElementById("answer").focus();
}

function timeAttackAnswer(raw) {
    answerstatistics[32][1] += 1;
    const qText = plainText(document.getElementById("result")).replace(/^問題\d+　　/, "");
    const verdict = judgeAnswer(raw);
    if (verdict.correct) {
        taCorrect += 1;
        answerstatistics[32][0] += 1;
        taFlash = "前の問題: ○";
    } else {
        recordMistake(verdict.label);
        taLog.push({ q: qText, user: raw, correct: correctAnswer, label: verdict.label, ex: explainText });
        taFlash = "前の問題: ×（正解は " + correctAnswer + "）";
    }
    saveData();
    if (questionCount >= TA_COUNT) {
        finishTimeAttack();
        return;
    }
    questionCount++;
    makeQuestion(33);
    updateTimer();
    document.getElementById("answer").focus();
}

function finishTimeAttack() {
    const sec = (performance.now() - taStart) / 1000;
    stopTimer();
    sessionId++;
    analysisdisplay();
    setResult("");
    const perfect = taCorrect === TA_COUNT;
    let newBest = false;
    if (perfect && (taBest === null || sec < taBest)) { taBest = sec; newBest = true; }
    saveData();

    let h = '<button onclick="startTimeAttack()">もう一度挑戦</button> <button onclick="checkback()">戻る</button>';
    h += "<h2>タイムアタック結果</h2><table>";
    h += '<tr><td class="u">タイム</td><td class="n">' + fmtTime(sec) + "</td></tr>";
    h += '<tr><td class="u">正解率</td><td class="n">' + taCorrect + "/" + TA_COUNT + "（" + Math.round(100 * taCorrect / TA_COUNT) + "%）</td></tr>";
    h += '<tr><td class="u">誤答数</td><td class="n">' + (TA_COUNT - taCorrect) + "</td></tr>";
    h += '<tr><td class="u">1問あたり</td><td class="n">' + (sec / TA_COUNT).toFixed(1) + "秒</td></tr>";
    if (taBest !== null) {
        h += '<tr><td class="u">ノーミスのベストタイム</td><td class="n">' + fmtTime(taBest) + (newBest ? "　更新！" : "") + "</td></tr>";
    }
    h += "</table>";
    if (perfect) {
        h += '<p class="advice">ノーミスです。次は同じ正確さのまま、タイムを縮めましょう。</p>';
    } else if (taCorrect / TA_COUNT < 0.9) {
        h += '<p class="advice">まずは正確さを優先しましょう。正解率が 90% を超えてからタイムを縮めるのがおすすめです。</p>';
    } else {
        h += '<p class="advice">あと少しでノーミスです。間違えたところを確認しましょう。</p>';
    }
    if (taLog.length > 0) {
        h += "<h3>間違えた問題</h3><table>";
        taLog.forEach(e => {
            h += '<tr><td class="u">' + esc(e.q) + '<br><span class="sub">あなたの答え: ' + esc(e.user) + "　正解: " + esc(e.correct) +
                "　【" + esc(e.label) + "】</span>" +
                (e.ex ? "<details><summary>解き方を見る</summary>" + explainOlHtml(e.ex, String(e.correct)) + "</details>" : "") + "</td></tr>";
        });
        h += "</table>";
    }
    document.getElementById("analysis").innerHTML = h;
}

let symLetters = false;      // 文字キー（x, y など）の段を表示するか
const LETTER_KEYS = ["x", "y", "z", "a", "b", "c", "n", "k", "t", "e", "π", "(", ")", "^"];
function updateSymbolBar() {
    const input = document.getElementById("answer");
    const textAnswer = questionmode === 6 && !correctExpr;
    input.inputMode = (textAnswer || symLetters) ? "text" : "decimal";
    let keys;
    if (textAnswer) keys = [{ t: "定義できない", v: "定義できない" }, { t: "-", v: "-" }, { t: "/", v: "/" }];
    else if (correctExpr) keys = [{ t: "√", v: "√" }, { t: "/", v: "/" }, { t: "+", v: "+" }, { t: "-", v: "-" }];
    else if (correctVec || questionmode === 5) keys = [{ t: "-", v: "-" }, { t: "空白", v: " " }];
    else keys = [{ t: "-", v: "-" }, { t: ".", v: "." }].concat(questionmode >= 34 ? [{ t: "/", v: "/" }] : []);
    keys.push({ t: "⌫", a: "back" }, { t: "消す", a: "clear" }, { t: symLetters ? "abc ▲" : "abc ▼", a: "letters" });
    const btn = k => '<button type="button" data-v="' + (k.v === undefined ? "" : k.v) + '" data-a="' + (k.a || "") + '"' +
        (k.a === "letters" && symLetters ? ' style="background:#2d6cdf;color:#fff"' : "") + ">" + k.t + "</button>";
    let h = keys.map(btn).join("");
    if (symLetters) h += '<span style="flex-basis:100%;height:0"></span>' + LETTER_KEYS.map(c => btn({ t: c, v: c })).join("");
    document.getElementById("symbols").innerHTML = h;
}

function insertSymbol(sym, action) {
    const el = document.getElementById("answer");
    const len = el.value.length;
    let start = el.selectionStart === null || el.selectionStart === undefined ? len : el.selectionStart;
    let end = el.selectionEnd === null || el.selectionEnd === undefined ? len : el.selectionEnd;
    if (action === "clear") { el.value = ""; start = end = 0; sym = ""; }
    else if (action === "back") {
        if (start === end && start > 0) start -= 1;
        sym = "";
    }
    el.value = el.value.slice(0, start) + sym + el.value.slice(end);
    const pos = start + sym.length;
    if (el.setSelectionRange) el.setSelectionRange(pos, pos);
    el.focus();
}

const symbolBox = document.getElementById("symbols");
symbolBox.addEventListener("mousedown", e => e.preventDefault());       // 入力欄のフォーカスを外さない
symbolBox.addEventListener("click", e => {
    const b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    if (b.getAttribute("data-a") === "letters") { symLetters = !symLetters; updateSymbolBar(); return; }
    insertSymbol(b.getAttribute("data-v") || "", b.getAttribute("data-a") || "");
});

// ---------- ローカル保存 ----------
const STORAGE_KEY = "mathDrill.v1";
let storageOK = true;
const settings = { explainOnCorrect: false, stepAll: false };

function saveData() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            v: 1, stats: answerstatistics, mistakes: mistakeStats, taBest: taBest, settings: settings, tests: testHistory, savedAt: Date.now()
        }));
        storageOK = true;
    } catch (e) { storageOK = false; }
}

function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const d = JSON.parse(raw);
            if (Array.isArray(d.stats)) d.stats.forEach((st, i) => {
                if (i < MODE_COUNT && Array.isArray(st)) answerstatistics[i] = [Number(st[0]) || 0, Number(st[1]) || 0];
            });
            if (Array.isArray(d.mistakes)) d.mistakes.forEach((m, i) => {
                if (i < MODE_COUNT && m && typeof m === "object") mistakeStats[i] = m;
            });
            if (typeof d.taBest === "number") taBest = d.taBest;
            if (d.tests && typeof d.tests === "object") testHistory = d.tests;
            if (d.settings && typeof d.settings === "object") Object.assign(settings, d.settings);
        }
    } catch (e) { storageOK = false; }
    document.getElementById("optExplain").checked = !!settings.explainOnCorrect;
    document.getElementById("optStepAll").checked = !!settings.stepAll;
}

function setOption() {
    settings.explainOnCorrect = document.getElementById("optExplain").checked;
    settings.stepAll = document.getElementById("optStepAll").checked;
    saveData();
}

// ---------- 解説（解き方） ----------
let explainText = "";
let nextResolver = null;
function ex() { explainText = Array.prototype.slice.call(arguments).join("\n"); }
function pn(n) { return n < 0 ? "(" + n + ")" : String(n); }

function waitForNext() {
    return new Promise(resolve => {
        nextResolver = resolve;
        document.getElementById("checkAnswer").textContent = "次の問題へ";
    });
}
let explainSteps = [], explainShown = 1, explainQ = "";
function answerTextNow() {
    if (questionmode === 5) return "X=" + answerX + "、Y=" + answerY;
    return correctVec ? correctVec.join(" ") : String(correctAnswer);
}
function stepsOf(text, ans) {
    const lines = String(text).split("\n").map(l => l.trim()).filter(l => l !== "");
    const steps = lines.map((l, i) => ({ k: i === 0 ? "考え方" : "計算", t: l }));
    if (ans !== undefined && ans !== "") steps.push({ k: "答え", t: ans, ans: true });
    return steps;
}
function explainOlHtml(text, ans) {
    return '<ol class="stepsOl">' + stepsOf(text, ans).map(st => "<li><b>" + st.k + "</b>　" + esc(st.t) + "</li>").join("") + "</ol>";
}
function renderExplain(scrollEnd) {
    const box = document.getElementById("explain");
    let h = explainQ ? '<div class="eq">問題: ' + esc(explainQ) + "</div>" : "";
    explainSteps.forEach((st, i) => {
        if (i < explainShown) h += '<div class="step' + (st.ans ? " ans" : "") + '"><span class="badge">STEP ' + (i + 1) + "</span><b>" + st.k + "</b><div>" + esc(st.t) + "</div></div>";
    });
    if (explainShown < explainSteps.length) {
        h += '<div class="stepbtns"><button type="button" data-s="next">次のステップ ▶ （' + explainShown + "/" + explainSteps.length + '）</button><button type="button" data-s="all">全部表示</button></div>';
    }
    box.innerHTML = h;
    box.style.display = "block";
    box.scrollTop = scrollEnd ? box.scrollHeight : 0;
}
function openExplain(qText) {
    explainQ = qText || "";
    explainSteps = stepsOf(explainText, answerTextNow());
    explainShown = settings.stepAll ? explainSteps.length : 1;
    renderExplain(false);
    show("memo", "none");
}
document.getElementById("explain").addEventListener("click", e => {
    const b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    const act = b.getAttribute("data-s");
    if (act === "next") explainShown = Math.min(explainSteps.length, explainShown + 1);
    else if (act === "all") explainShown = explainSteps.length;
    else return;
    renderExplain(true);
});
function closeExplain() {
    document.getElementById("explain").style.display = "none";
    document.getElementById("checkAnswer").textContent = "回答";
    if (questionmode !== 33 && document.body.classList.contains("quiz")) show("memo", "block");
}

const NOTES_KEY = "mathDrill.notes.v1";
let notesOK = true;
let notesData = { notes: [], current: null, recent: [] };
let palTab = 1;
let noteTimer = null;

function newNote(title) {
    return { id: "n" + Date.now() + Math.random().toString(36).slice(2, 6), title: title, text: "", updated: Date.now() };
}
function currentNote() {
    return notesData.notes.find(n => n.id === notesData.current) || notesData.notes[0];
}

function saveNotes() {
    try {
        localStorage.setItem(NOTES_KEY, JSON.stringify(notesData));
        notesOK = true;
    } catch (e) { notesOK = false; }
    const st = document.getElementById("noteStatus");
    st.textContent = notesOK ? "自動保存" : "保存できない環境です";
}

function loadNotes() {
    try {
        const raw = localStorage.getItem(NOTES_KEY);
        if (raw) {
            const d = JSON.parse(raw);
            if (Array.isArray(d.notes)) {
                notesData.notes = d.notes.filter(n => n && typeof n.text === "string" && typeof n.id === "string")
                    .map(n => ({ id: n.id, title: String(n.title || "メモ"), text: n.text, updated: Number(n.updated) || 0 }));
            }
            if (typeof d.current === "string") notesData.current = d.current;
            if (Array.isArray(d.recent)) notesData.recent = d.recent.filter(k => k && typeof k.v === "string").slice(0, 16);
        }
    } catch (e) { notesOK = false; }
    if (notesData.notes.length === 0) notesData.notes.push(newNote("メモ 1"));
    if (!notesData.notes.some(n => n.id === notesData.current)) notesData.current = notesData.notes[0].id;
}

function renderNoteSelect() {
    const sel = document.getElementById("noteSelect");
    sel.innerHTML = notesData.notes.map(n =>
        '<option value="' + esc(n.id) + '"' + (n.id === notesData.current ? " selected" : "") + ">" + esc(n.title) + "</option>").join("");
    document.getElementById("noteText").value = currentNote().text;
}

function onNoteEdited() {
    const note = currentNote();
    note.text = document.getElementById("noteText").value;
    note.updated = Date.now();
    if (noteTimer !== null) clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { noteTimer = null; saveNotes(); }, 400);
}
function flushNotes() {
    if (noteTimer !== null) { clearTimeout(noteTimer); noteTimer = null; }
    if (document.body.classList.contains("notes")) {
        currentNote().text = document.getElementById("noteText").value;
    }
    saveNotes();
}

function noteInsert(text) {
    const el = document.getElementById("noteText");
    const caret = text.indexOf("\uE000");
    const clean = text.replace("\uE000", "");
    const len = el.value.length;
    const st = el.selectionStart === null || el.selectionStart === undefined ? len : el.selectionStart;
    const en = el.selectionEnd === null || el.selectionEnd === undefined ? st : el.selectionEnd;
    el.value = el.value.slice(0, st) + clean + el.value.slice(en);
    const pos = st + (caret >= 0 ? caret : clean.length);
    if (el.setSelectionRange) el.setSelectionRange(pos, pos);
    el.focus();
    onNoteEdited();
}

function paletteKeys(i) {
    if (i === 0) return notesData.recent.map(k => ({ t: k.t, v: k.v }));
    return PALETTE[i - 1].keys.map(k => typeof k === "string" ? { t: k, v: k } : k);
}

function renderPalette() {
    const names = ["最近"].concat(PALETTE.map(g => g.name));
    document.getElementById("palTabs").innerHTML = names.map((n, i) =>
        '<button type="button" data-t="' + i + '"' + (i === palTab ? ' class="active"' : "") + ">" + n + "</button>").join("");
    const keys = paletteKeys(palTab);
    const box = document.getElementById("palKeys");
    const group = palTab > 0 ? PALETTE[palTab - 1] : null;
    if (group && group.cols) { box.classList.add("pad"); box.style.setProperty("--cols", group.cols); }
    else { box.classList.remove("pad"); box.style.removeProperty("--cols"); }
    box.innerHTML = keys.length === 0
        ? '<div class="hint">使った記号がここに並びます</div>'
        : keys.map((k, i) => {
            const cls = /^[0-9.]$/.test(k.t) ? ' class="num"' : (k.v.indexOf("\uE000") >= 0 || k.t.length > 3 ? ' class="tpl"' : "");
            return '<button type="button" data-k="' + i + '"' + cls + ">" + esc(k.t) + "</button>";
        }).join("");
}

function rememberKey(k) {
    notesData.recent = [{ t: k.t, v: k.v }].concat(notesData.recent.filter(r => r.v !== k.v)).slice(0, 16);
}

function openNotes() {
    ["mode1", "mode2", "mode3", "mode4", "mode5", "mode6", "checkAnswer", "checkback", "answer", "menu", "memo", "analysis"].forEach(x => show(x, "none"));
    stopTimer();
    setQuiz(false);
    document.body.classList.add("notes");
    renderNoteSelect();
    renderPalette();
    document.getElementById("noteStatus").textContent = notesOK ? "自動保存" : "保存できない環境です";
}

function closeNotes() {
    flushNotes();
    goBackToMenu();
}

(function setupNotes() {
    const byId = id => document.getElementById(id);
    byId("noteText").addEventListener("input", onNoteEdited);
    byId("noteSelect").addEventListener("change", () => {
        flushNotes();
        notesData.current = byId("noteSelect").value;
        saveNotes();
        byId("noteText").value = currentNote().text;
    });
    byId("noteNew").addEventListener("click", () => {
        flushNotes();
        const n = newNote("メモ " + (notesData.notes.length + 1));
        notesData.notes.push(n);
        notesData.current = n.id;
        saveNotes();
        renderNoteSelect();
        byId("noteText").focus();
    });
    byId("noteRename").addEventListener("click", () => {
        const note = currentNote();
        const name = typeof prompt === "function" ? prompt("メモの名前", note.title) : null;
        if (name === null || name.trim() === "") return;
        note.title = name.trim().slice(0, 40);
        saveNotes();
        renderNoteSelect();
    });
    byId("noteDelete").addEventListener("click", () => {
        if (typeof confirm === "function" && !confirm("このメモ「" + currentNote().title + "」を削除します。よろしいですか？")) return;
        notesData.notes = notesData.notes.filter(n => n.id !== notesData.current);
        if (notesData.notes.length === 0) notesData.notes.push(newNote("メモ 1"));
        notesData.current = notesData.notes[0].id;
        saveNotes();
        renderNoteSelect();
    });
    byId("noteCopy").addEventListener("click", () => {
        const text = byId("noteText").value;
        const done = () => { byId("noteStatus").textContent = "コピーしました"; };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, () => { byId("noteText").select(); document.execCommand("copy"); done(); });
        } else {
            byId("noteText").select();
            document.execCommand("copy");
            done();
        }
    });
    byId("noteBack").addEventListener("click", closeNotes);

    const palette = byId("palette");
    palette.addEventListener("mousedown", e => e.preventDefault());       // 入力欄のフォーカスを外さない
    palette.addEventListener("click", e => {
        const b = e.target.closest ? e.target.closest("button") : null;
        if (!b) return;
        const el = byId("noteText");
        if (b.hasAttribute("data-t")) { palTab = Number(b.getAttribute("data-t")); renderPalette(); return; }
        if (b.hasAttribute("data-k")) {
            const k = paletteKeys(palTab)[Number(b.getAttribute("data-k"))];
            if (!k) return;
            noteInsert(k.v);
            rememberKey(k);
            if (palTab !== 0) { /* 「最近」タブ以外では並びを動かさない */ }
            saveNotes();
            return;
        }
        const c = b.getAttribute("data-c");
        if (c === "space") noteInsert(" ");
        else if (c === "enter") noteInsert("\n");
        else {
            const len = el.value.length;
            let st = el.selectionStart === null || el.selectionStart === undefined ? len : el.selectionStart;
            let en = el.selectionEnd === null || el.selectionEnd === undefined ? st : el.selectionEnd;
            if (c === "left") { st = en = Math.max(0, st - 1); }
            else if (c === "right") { st = en = Math.min(len, en + 1); }
            else if (c === "back") {
                if (st === en && st > 0) st -= 1;
                el.value = el.value.slice(0, st) + el.value.slice(en);
                en = st;
                onNoteEdited();
            }
            if (el.setSelectionRange) el.setSelectionRange(st, en);
            el.focus();
        }
    });
    if (typeof window !== "undefined" && window.addEventListener) {
        window.addEventListener("pagehide", flushNotes);
        if (typeof document.addEventListener === "function") document.addEventListener("visibilitychange", () => { if (document.hidden) flushNotes(); });
    }
})();

// ---------- まとめテスト（計算方式別・学年別） ----------
const TEST_SETS = 4;                 // 1つのテストに用意する問題セット数
const TEST_LEN = 10;                 // 1セットの問題数
const SET_LETTERS = "ABCDE";
const TESTS = [
    { id: "m_basic", group: "計算方式別", name: "基礎計算まとめテスト", units: [30, 31, 32, 2, 7, 14, 15, 3] },
    { id: "m_geo", group: "計算方式別", name: "図形計算まとめテスト", units: [4, 20, 18, 19, 17, 6, 25, 8, 27, 29] },
    { id: "m_adv", group: "計算方式別", name: "高次計算まとめテスト", units: [9, 16, 5, 10, 11, 12, 28, 24, 23, 26] },

];
let testState = null;
let testHistory = {};

function hashSeed(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
}

// 同じ seed なら毎回まったく同じ問題になるよう、乱数を一時的に差し替える
function withSeed(seed, fn) {
    const orig = Math.random;
    let a = seed >>> 0;
    Math.random = function () {
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    try { fn(); } finally { Math.random = orig; }
}

function buildTestItems(test, setIdx) {
    const items = [];
    for (let i = 0; i < TEST_LEN; i++) {
        items.push({ mode: test.units[(i + setIdx) % test.units.length], seed: hashSeed(test.id + "|" + setIdx + "|" + i) });
    }
    return items;
}

function renderTestMenu() {
    const groups = [];
    TESTS.forEach(t => { if (groups.indexOf(t.group) < 0) groups.push(t.group); });
    let h = '<p class="note">各テストは ' + TEST_LEN + ' 問です。用意された ' + TEST_SETS +
        ' 種類の問題セットから、1セットがランダムに選ばれます（前回と同じセットは避けます）。受け終わるまで正誤は表示されず、最後に結果と解説が出ます。</p>';
    groups.forEach(g => {
        h += "<h3>" + g + "</h3>";
        TESTS.filter(t => t.group === g).forEach(t => { h += '<button onclick="startTest(\'' + t.id + '\')">' + t.name + "</button>"; });
    });
    h += '<p class="note">範囲は学校や教科書によって異なります。単元は目安として割り当てています。</p>';
    h += '<button onclick="checkback2()">戻る</button>';
    document.getElementById("mode5").innerHTML = h;
}

function showTestQuestion() {
    const st = testState;
    const it = st.items[st.idx];
    questionmode = it.mode;
    questionCount = st.idx + 1;
    if (it.mode === 2) questionnumber = [101, -50, 21, -10];
    document.getElementById("図形").innerHTML = "";
    withSeed(it.seed, () => makeQuestion(it.mode));
    answerFigure = null;
    updateTimer();
    document.getElementById("answer").focus();
}

function startTest(id) {
    const test = TESTS.find(t => t.id === id);
    if (!test) return;
    let k = randInt(TEST_SETS);
    const hist = testHistory[id];
    if (hist && typeof hist.lastSet === "number" && TEST_SETS > 1 && k === hist.lastSet) k = (k + 1 + randInt(TEST_SETS - 1)) % TEST_SETS;

    sessionId++;
    nextResolver = null;
    document.getElementById("explain").style.display = "none";
    document.getElementById("checkAnswer").textContent = "回答";
    sessionMistakes = {};
    stopTimer();
    answerlist = new Array(15).fill(0);
    answerCount = 0;
    document.getElementById("図形").innerHTML = "";
    document.getElementById("answer").placeholder = "";
    questiondisplay();

    testState = { test: test, set: k, items: buildTestItems(test, k), idx: 0, correct: 0, log: [] };
    taStart = performance.now();
    startTimer();
    showTestQuestion();
}

function testAnswer(raw) {
    const st = testState;
    const it = st.items[st.idx];
    answerstatistics[it.mode - 1][1] += 1;
    const qText = plainText(document.getElementById("result")).replace(/^問題\d*　　/, "");
    const verdict = judgeAnswer(raw);
    const correctText = it.mode === 5 ? "X=" + answerX + " Y=" + answerY : (correctVec ? correctVec.join(" ") : correctAnswer);
    if (verdict.correct) {
        st.correct += 1;
        answerstatistics[it.mode - 1][0] += 1;
    } else {
        recordMistake(verdict.label);
    }
    st.log.push({ mode: it.mode, q: qText, user: raw, correct: correctText, ok: verdict.correct, label: verdict.label, ex: explainText });
    saveData();
    if (st.idx + 1 >= st.items.length) { finishTest(); return; }
    st.idx += 1;
    showTestQuestion();
}

function finishTest() {
    const sec = (performance.now() - taStart) / 1000;
    stopTimer();
    const st = testState;
    sessionId++;
    analysisdisplay();
    setResult("");
    const total = st.items.length;
    const rate = Math.round(100 * st.correct / total);

    const rec = testHistory[st.test.id] || { attempts: 0, best: null, last: null, lastSet: null };
    const now = { score: st.correct, total: total, set: st.set, time: sec, date: Date.now() };
    rec.attempts += 1;
    rec.last = now;
    rec.lastSet = st.set;
    if (rec.best === null || now.score > rec.best.score || (now.score === rec.best.score && now.time < rec.best.time)) rec.best = now;
    testHistory[st.test.id] = rec;
    saveData();

    let h = '<button onclick="startTest(\'' + st.test.id + '\')">もう一度（別セット）</button> <button onclick="checkback()">戻る</button>';
    h += "<h2>" + esc(st.test.name) + "　結果（セット" + SET_LETTERS[st.set] + "）</h2><table>";
    h += '<tr><td class="u">得点</td><td class="n">' + st.correct + "/" + total + "（" + rate + "%）</td></tr>";
    h += '<tr><td class="u">タイム</td><td class="n">' + fmtTime(sec) + "</td></tr>";
    h += '<tr><td class="u">ベスト</td><td class="n">' + rec.best.score + "/" + rec.best.total + "</td></tr></table>";
    h += '<p class="advice">' + (rate === 100 ? "満点です。すばらしい出来です。" : rate >= 80 ? "よくできました。間違えた問題の解き方を確認しましょう。" :
        rate >= 60 ? "あと一歩です。下の単元別の結果から、間違えた単元を練習し直しましょう。" : "基礎の確認が必要です。間違えた単元を、単元メニューで1つずつ練習しましょう。") + "</p>";

    const byUnit = {};
    st.log.forEach(e => { byUnit[e.mode] = byUnit[e.mode] || [0, 0]; byUnit[e.mode][1] += 1; if (e.ok) byUnit[e.mode][0] += 1; });
    h += "<h3>単元別の結果</h3><table>";
    Object.keys(byUnit).sort((a, b) => Number(a) - Number(b)).forEach(m => {
        const u = byUnit[m];
        h += '<tr><td class="u">' + UNIT_NAMES[m] + '</td><td class="n">' + u[0] + "/" + u[1] + "</td><td class=\"n\">" + (u[0] === u[1] ? "○" : "×") + "</td></tr>";
    });
    h += "</table>";

    const wrong = st.log.filter(e => !e.ok);
    h += "<h3>間違えた問題（" + wrong.length + " 問）</h3>";
    if (wrong.length === 0) h += "<p>ありません。</p>";
    else {
        h += "<table>";
        wrong.forEach(e => {
            h += '<tr><td class="u"><span class="sub">' + UNIT_NAMES[e.mode] + "</span><br>" + esc(e.q) + '<br><span class="sub">あなたの答え: ' + esc(e.user) +
                "　正解: " + esc(e.correct) + "　【" + esc(e.label) + "】</span>" +
                (e.ex ? "<details><summary>解き方を見る</summary>" + explainOlHtml(e.ex, String(e.correct)) + "</details>" : "") + "</td></tr>";
        });
        h += "</table>";
    }
    document.getElementById("analysis").innerHTML = h;
    testState = null;
}

function testHistoryHtml() {
    const rows = TESTS.filter(t => testHistory[t.id] && testHistory[t.id].attempts > 0);
    let h = "<h2>まとめテストの記録</h2>";
    if (rows.length === 0) return h + "<p>まだ受けていません。</p>";
    h += "<table>";
    rows.forEach(t => {
        const r = testHistory[t.id];
        h += '<tr><td class="u">' + esc(t.name) + '<br><span class="sub">' + r.attempts + "回　前回 " + r.last.score + "/" + r.last.total +
            "（セット" + SET_LETTERS[r.last.set] + "）</span></td><td class=\"n\">ベスト " + r.best.score + "/" + r.best.total + "</td></tr>";
    });
    return h + "</table>";
}

function fx(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fText(x, y, t, o) {

        (o.bold ? ' font-weight="bold"' : "") + ">" + fx(t) + "</text>";

function fLine(x1, y1, x2, y2, o) {

// ---- グラフ（関数・直線・円・点・色つき領域） ----
// sp: {xmin,xmax,ymin,ymax,equal, curves:[{f,color,dash,w,label,lx}], circles:[{cx,cy,r,color}], segs:[{x1,y1,x2,y2,color,dash,w}],
//      points:[{x,y,label,color,open}], texts:[{x,y,t,color}], shades:[{f,from,to,color}]}
function drawPlot(sp) {
    const W = 360, H = 290, L = 34, Rr = 12, Tp = 12, Bt = 26, pw = W - L - Rr, ph = H - Tp - Bt;
    let x0 = sp.xmin, x1 = sp.xmax, y0 = sp.ymin, y1 = sp.ymax;
    if (sp.equal) {
        const sc = Math.max((x1 - x0) / pw, (y1 - y0) / ph), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
        x0 = cx - sc * pw / 2; x1 = cx + sc * pw / 2; y0 = cy - sc * ph / 2; y1 = cy + sc * ph / 2;
    }
    const px = x => L + (x - x0) / (x1 - x0) * pw, py = y => Tp + (y1 - y) / (y1 - y0) * ph;
    let g = '<defs><clipPath id="pc"><rect x="' + L + '" y="' + Tp + '" width="' + pw + '" height="' + ph + '"/></clipPath></defs>';
    g += '<rect x="' + L + '" y="' + Tp + '" width="' + pw + '" height="' + ph + '" fill="#fff" stroke="#bbb"/>';
    const sx = niceStep(x1 - x0), sy = niceStep(y1 - y0);
    for (let x = Math.ceil(x0 / sx - 1e-9) * sx; x <= x1 + 1e-9; x += sx) {
        g += fLine(px(x), Tp, px(x), Tp + ph, { color: "#e6e6e6", w: 1 }) + fText(px(x), Tp + ph + 14, +x.toFixed(6), { size: 11, color: "#555" });
    }
    for (let y = Math.ceil(y0 / sy - 1e-9) * sy; y <= y1 + 1e-9; y += sy) {
        g += fLine(L, py(y), L + pw, py(y), { color: "#e6e6e6", w: 1 }) + fText(L - 4, py(y) + 4, +y.toFixed(6), { size: 11, color: "#555", anchor: "end" });
    }
    if (x0 <= 0 && x1 >= 0) g += fLine(px(0), Tp, px(0), Tp + ph, { color: "#555", w: 1.5 });
    if (y0 <= 0 && y1 >= 0) g += fLine(L, py(0), L + pw, py(0), { color: "#555", w: 1.5 });
    g += '<g clip-path="url(#pc)">';
    (sp.shades || []).forEach(sh => {
        const pts = [];
        for (let i = 0; i <= 80; i++) { const x = sh.from + (sh.to - sh.from) * i / 80; pts.push([px(x), py(sh.f(x))]); }
        pts.push([px(sh.to), py(0)], [px(sh.from), py(0)]);
        g += '<polygon points="' + pts.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ") + '" fill="' + (sh.color || "rgba(255,200,0,0.35)") + '" stroke="none"/>';
    });
    (sp.circles || []).forEach(c => {
        g += '<ellipse cx="' + px(c.cx).toFixed(1) + '" cy="' + py(c.cy).toFixed(1) + '" rx="' + (c.r * pw / (x1 - x0)).toFixed(1) + '" ry="' + (c.r * ph / (y1 - y0)).toFixed(1) +
            '" fill="none" stroke="' + (c.color || FC.blue) + '" stroke-width="2.5"/>';
    });
    (sp.curves || []).forEach(c => {
        let d = "", pen = false;
        for (let i = 0; i <= 260; i++) {
            const x = x0 + (x1 - x0) * i / 260, y = c.f(x);
            if (!isFinite(y) || Math.abs(y) > 1e6) { pen = false; continue; }
            d += (pen ? "L" : "M") + px(x).toFixed(1) + "," + py(y).toFixed(1) + " ";
            pen = true;
        }
        g += '<path d="' + d + '" fill="none" stroke="' + (c.color || FC.blue) + '" stroke-width="' + (c.w || 2.5) + '"' + (c.dash ? ' stroke-dasharray="' + c.dash + '"' : "") + "/>";
    });
    (sp.segs || []).forEach(q => { g += fLine(px(q.x1), py(q.y1), px(q.x2), py(q.y2), q); });
    g += "</g>";
    (sp.curves || []).forEach(c => {
        if (c.label) { const lx = c.lx === undefined ? x1 - (x1 - x0) * 0.12 : c.lx; g += fText(Math.min(px(lx), W - 30), Math.max(Tp + 12, Math.min(py(c.f(lx)) - 6, Tp + ph - 4)), c.label, { color: c.color || FC.blue, bold: true, size: 14 }); }
    });
    (sp.points || []).forEach(pt => {
        g += fCircle(px(pt.x), py(pt.y), 4.5, { fill: pt.open ? "#fff" : (pt.color || FC.red), color: pt.color || FC.red });
        if (pt.label) g += fText(px(pt.x) + 8, py(pt.y) - 8, pt.label, { color: pt.color || FC.red, bold: true, anchor: "start", size: 13 });

}

// ---- 点の数直線（データの分布） ----

// ---- 立体 ----
function drawSolid(kind, d) {
