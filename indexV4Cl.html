<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>計算練習</title>
<style>
:root { --appH: 100dvh; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    text-align: center; color: #222; background: #fff; -webkit-text-size-adjust: 100%;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
}
#app { max-width: 1100px; margin: 0 auto; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }

/* ---- 出題画面（1画面に収める） ---- */
body.quiz { height: var(--appH); overflow: hidden; }
body.quiz #app { height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
body.quiz #qbox { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; }
body.quiz #result { flex: 0 1 auto; max-height: 30vh; overflow-y: auto; margin: 0; font-size: clamp(15px, 4.4vw, 26px); }
#workspace { display: none; }
body.quiz #workspace { display: flex; flex: 1 1 0; min-height: 0; flex-direction: column; gap: 6px; }

#result { white-space: pre-line; margin: 8px 0; font-size: clamp(18px, 5vw, 28px); line-height: 1.45; }
#timer { display: none; font-size: clamp(13px, 3.6vw, 20px); color: #555; }

#answerRow { display: none; flex: 0 0 auto; }
#answer {
    display: block; margin: 2px auto 4px; font-size: 26px; width: min(92%, 340px); height: 46px;
    text-align: center; border: 2px solid #667; border-radius: 8px;
}
#symbols { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
#symbols button {
    min-width: 46px; height: 38px; font-size: 20px; padding: 0 10px; border-radius: 8px;
    border: 1px solid #889; background: #eef1ff; color: #223;
}

#図形 { flex: 0 1 42%; min-height: 0; display: flex; justify-content: center; }
#図形:empty { display: none; }
#図形 svg { height: 100% !important; width: auto !important; max-width: 100%; }

#explain {
    display: none; flex: 1 1 0; min-height: 0; overflow-y: auto; text-align: left; white-space: pre-line;
    background: #f4f7ff; border: 1px solid #b9c6ee; border-radius: 8px; padding: 8px 12px;
    font-size: clamp(14px, 3.8vw, 18px); line-height: 1.65;
}

#memo { display: flex; flex-direction: column; flex: 1 1 0; min-height: 90px; gap: 4px; }
#memo button { font-size: 15px; padding: 4px 10px; margin: 0 2px; border-radius: 6px; }
#memo button.active { font-weight: bold; background: #cde; }
#memoCanvas { flex: 1 1 0; min-height: 0; width: 100%; border: 2px solid #888; border-radius: 6px; background: #fff; touch-action: none; display: block; }
#memoText { display: none; flex: 1 1 0; min-height: 0; width: 100%; resize: none; font-size: 18px; border: 2px solid #888; border-radius: 6px; padding: 6px; }

#buttons { display: flex; gap: 8px; justify-content: center; flex: 0 0 auto; margin-top: 6px; }
#buttons button { flex: 1 1 0; max-width: 240px; min-height: 48px; font-size: clamp(17px, 4.8vw, 24px); border-radius: 10px; border: 1px solid #889; background: #f1f1f5; }
#checkAnswer { flex: 2 1 0 !important; max-width: 380px !important; background: #2d6cdf !important; color: #fff; border-color: #2d6cdf !important; }

@media (min-width: 760px) and (min-aspect-ratio: 5/4) {
    body.quiz #workspace { flex-direction: row; }
    body.quiz #図形 { flex: 1 1 45%; }
    body.quiz #memo, body.quiz #explain { flex: 1 1 55%; }
}

/* ---- 数式メモ ---- */
#notes { display: none; }
body.notes { height: var(--appH); overflow: hidden; }
body.notes #app { height: 100%; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
body.notes #qbox, body.notes #buttons, body.notes #workspace { display: none; }
body.notes #notes {
    display: grid; flex: 1 1 0; min-height: 0; gap: 6px; text-align: left;
    grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto;
}
#notesMain { grid-row: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
#notesBar { display: flex; gap: 6px; align-items: center; }
#noteSelect { flex: 1 1 auto; min-width: 0; height: 38px; font-size: 16px; }
#notesBar button { height: 38px; font-size: 15px; padding: 0 10px; border-radius: 8px; }
#noteText {
    flex: 1 1 0; min-height: 0; width: 100%; resize: none; font-size: 20px; line-height: 1.5;
    border: 2px solid #667; border-radius: 8px; padding: 8px; font-family: inherit;
}
#palette { grid-row: 2; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
#palTabs { display: flex; gap: 4px; overflow-x: auto; white-space: nowrap; padding-bottom: 2px; }
#palTabs button { flex: 0 0 auto; height: 34px; font-size: 14px; padding: 0 12px; border-radius: 17px; border: 1px solid #889; background: #f1f1f5; }
#palTabs button.active { background: #2d6cdf; color: #fff; border-color: #2d6cdf; }
#palKeys { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-height: 26vh; overflow-y: auto; }
#palKeys button { min-width: 42px; height: 38px; font-size: 20px; padding: 0 8px; border-radius: 8px; border: 1px solid #889; background: #eef1ff; color: #223; }
#palKeys button.tpl { font-size: 15px; background: #fff4e0; }
#palKeys.pad { display: grid; grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr)); max-height: 34vh; }
#palKeys.pad button { min-width: 0; height: 40px; padding: 0; }
#palKeys button.num { background: #fff; font-weight: bold; font-size: 22px; }
#palKeys .hint { font-size: 14px; color: #777; padding: 8px; }
#palCtl { display: flex; gap: 5px; justify-content: center; }
#palCtl button { flex: 1 1 0; max-width: 90px; height: 36px; font-size: 16px; border-radius: 8px; border: 1px solid #889; background: #f1f1f5; }
#notesBottom { grid-row: 3; display: flex; gap: 8px; justify-content: center; align-items: center; }
#notesBottom button { flex: 0 1 140px; min-height: 46px; font-size: 18px; border-radius: 10px; border: 1px solid #889; background: #f1f1f5; }
#noteStatus { flex: 1 1 auto; font-size: 13px; color: #555; text-align: center; min-width: 0; }
@media (min-width: 760px) and (min-aspect-ratio: 5/4) {
    body.notes #notes { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    #notesMain { grid-column: 1; grid-row: 1; }
    #palette { grid-column: 2; grid-row: 1; }
    #palKeys { max-height: none; flex: 1 1 0; min-height: 0; align-content: flex-start; }
    #palKeys.pad { max-height: none; flex: 1 1 0; min-height: 0; grid-auto-rows: minmax(30px, 56px); align-content: start; }
    #palKeys.pad button { height: auto; }
    #notesBottom { grid-column: 1 / 3; grid-row: 2; }
}

/* ---- メニュー・分析画面 ---- */
#menu, #mode1, #mode2, #mode3, #mode4 { display: none; text-align: center; }
#menu button, #mode1 button, #mode2 button, #mode3 button, #mode4 button {
    display: block; margin: 8px auto; width: min(92vw, 380px); font-size: clamp(18px, 5vw, 24px); padding: 12px 16px; border-radius: 10px;
}
#optBox { display: block; margin: 14px auto; font-size: 17px; }

#analysis { display: none; max-width: 640px; margin: 10px auto; text-align: left; font-size: 19px; padding: 0 10px; }
#analysis table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
#analysis td { padding: 4px 6px; border-bottom: 1px solid #ddd; }
#analysis td.n { text-align: right; white-space: nowrap; width: 1%; }
#analysis td.mis { font-size: 16px; color: #a33; padding-left: 24px; }
#analysis .sub { font-size: 14px; color: #666; }
#analysis .advice { background: #fff6dd; padding: 8px 12px; border-radius: 6px; }
#analysis button { font-size: 20px; padding: 6px 16px; }
#analysis details { margin-top: 4px; font-size: 15px; white-space: pre-line; }
</style>
</head>
<body>

<div id="notes">

</div>

<script>

let answerstatistics = newStatistics();
let misList = [];                         // 想定される間違いと、その間違え方の説明
let vecNames = [];                        // 複数の数で答える問題の、各値の名前
let sessionMistakes = {};                 // 今回のセット内の間違え方の集計
let mistakeStats = newMistakeStats();     // 単元ごとの間違え方の集計
const TA_COUNT = 20;                      // タイムアタックの問題数
let answerFigure = null;                   // 回答後に表示する解説図を描く関数
let taStart = 0, taTimerId = null, taLog = [], taCorrect = 0, taFlash = "", taBest = null;

function newMistakeStats() {

// y=ax+b  [y, a, x, b]
const questioneaseB = [

// ---------- 共通ユーティリティ ----------
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function show(id, display) {
    if (id === "memo" && display === "block") display = "";     // メモ欄は CSS の flex 表示に任せる
    document.getElementById(id).style.display = display;
    if (id === "answer") document.getElementById("answerRow").style.display = display;

function setQuiz(on) {
    document.body.classList.toggle("quiz", on);
    document.body.classList.remove("notes");
    if (on) fitMemoCanvas();
}

function setResult(text) {
    document.getElementById("result").textContent = text;
}

// 全角数字・全角記号を半角に(数値入力用)
function normalizeNumberText(s) {
    return String(s)
        .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
        .replace(/[−ー―‐－]/g, "-")
        .replace(/＋/g, "+")
        .replace(/／/g, "/")
        .replace(/．/g, ".")
        .replace(/[，、]/g, ",")
        .replace(/　/g, " ")
        .trim();
}

// "3/5" や "0.6" を数値に。変換できなければ null
function tryParseNumber(s) {
    s = s.replace(/\s/g, "");
    if (/^[+-]?\d+(\.\d+)?$/.test(s)) return Number(s);
    const m = s.match(/^([+-]?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
    if (m && Number(m[2]) !== 0) return Number(m[1]) / Number(m[2]);
    return null;
}

function nearlyEqual(a, b) {
    return Math.abs(a - b) < 1e-9;
}

function randInt(n) {
    return Math.floor(Math.random() * n);
}

}

function checkstrat_mode1() { openSubmenu("mode1"); }
function checkstrat_mode2() { openSubmenu("mode2"); }

        .forEach(id => show(id, "none"));

}

function questiondisplay() {
    ["mode1", "mode2", "mode3", "mode4", "menu", "analysis"].forEach(id => show(id, "none"));

// ---------- 問題の作成 ----------
function makeQuestionB(randN) {
    const a = questioneaseB[randN][1];
    const x = questioneaseB[randN][2];
    const b = questioneaseB[randN][3];

    correctAnswer = questioneaseB[randN][0];

    mis(a + b + x, "x に傾きを掛けず、すべて足している（y=ax+b の a×x を計算していない）");
    mis(b + x, "傾き a を掛け忘れている");
    mis(a * (b + x), "切片 b にも傾きを掛けている（a(x+b) にしている）");
    mis(a * b, "傾きと切片を掛けている（x を使っていない）");
    mis(a * x - b, "切片 b の符号ミス");
    ex("x の値を式に代入する", "y = " + pn(a) + "×" + pn(x) + " + " + pn(b) + " = " + (a * x) + " + " + pn(b) + " = " + correctAnswer);
    mis(Math.abs(a) * x + b, "傾き a の符号を落としている");
    const sign = b > -1 ? "+" : "";
    setResult("問題　" + questionCount +
        "　　一次関数y=" + a + "x" + sign + b + "において" + "x=" + x + "の時yの値を求めよ");
}

function makeQuestionC(randN) {
    const y = questioneaseB[randN][0];
    const a = questioneaseB[randN][1];
    const b = questioneaseB[randN][3];

    correctAnswer = questioneaseB[randN][2];

    mis((y + b) / a, "切片 b の移項で符号を変えていない（y−b ではなく y+b）");
    mis(y - b, "傾き a で割り忘れている");
    mis(a / (y - b), "割り算の分子と分母を逆にしている");
    ex("y の値を式に入れて、x について解く", pn(y) + " = " + pn(a) + "x + " + pn(b), pn(a) + "x = " + pn(y) + " − " + pn(b) + " = " + (y - b), "x = " + (y - b) + " ÷ " + pn(a) + " = " + correctAnswer);
    mis((y - b) * a, "a で割らずに掛けている");
    const sign = b > -1 ? "+" : "";
    setResult("問題　" + questionCount +
        "　　一次関数y=" + a + "x" + sign + b + "において" + "y=" + y + "の時xの値を求めよ");
}

// 連立方程式
function leadCoef(n) {
    if (n === 1) return "";
    if (n === -1) return "-";
    return String(n);
}
function absCoef(n) {
    return Math.abs(n) === 1 ? "" : String(Math.abs(n));
}

function makeQuestionE(randN) {
    const row = questioneaseE[randN];
    const a = row[0], b = row[1], d = row[3], e = row[4];
    answerX = row[6];
    answerY = row[7];
    // 解から c, f を計算して、必ず式と答えが一致するようにする
    const c = a * answerX + b * answerY;
    const f = d * answerX + e * answerY;
    ex("加減法: どちらかの文字を消す", "①×" + pn(e) + " − ②×" + pn(b) + " で y を消去: " + (a * e - b * d) + "x = " + (c * e - b * f), "x = " + answerX, "x = " + answerX + " を①に代入: " + a + "×" + pn(answerX) + " + " + pn(b) + "y = " + c + " → y = " + answerY, "答え x=" + answerX + "、y=" + answerY);
    eq = [a, b, c, d, e, f];

    setResult("以下の一次連立方程式を解け（答えは「x y」の順にスペース区切り）\n" +
        leadCoef(a) + "x" + (b < 0 ? "-" : "+") + absCoef(b) + "y=" + c + "\n" +
        leadCoef(d) + "x" + (e < 0 ? "-" : "+") + absCoef(e) + "y=" + f);
}

// ---------- 追加分の問題（数直線・ベクトル・二次関数・因数分解・展開・平方完成・集合と命題） ----------
function qHead() { return "問題" + questionCount + "　　"; }
function randRange(min, max) { return min + randInt(max - min + 1); }
function randNZ(min, max) { let n = 0; while (n === 0) n = randRange(min, max); return n; }
function pick(arr) { return arr[randInt(arr.length)]; }
function setPlaceholder(t) { document.getElementById("answer").placeholder = t; }
function setVecAnswer(arr, hint) { correctVec = arr; vecNames = hint.split(" "); setPlaceholder(hint); }

function constTerm(n) { return n === 0 ? "" : (n < 0 ? "-" : "+") + Math.abs(n); }
function linTerm(p) { return "x" + constTerm(p); }                       // x+p
function poly2(p, q) {                                                   // x²+px+q
    return "x²" + (p === 0 ? "" : (p < 0 ? "-" : "+") + absCoef(p) + "x") + constTerm(q);
}
function polyA(a, b, c) {                                                // ax²+bx+c
    return leadCoef(a) + "x²" + (b === 0 ? "" : (b < 0 ? "-" : "+") + absCoef(b) + "x") + constTerm(c);
}

// 数直線の図（-6〜6）
function drawNumberLine(points) {
    const step = 25, x0 = 30, y = 55;
    const px = v => x0 + (v + 6) * step;
    let svg = `<svg width="360" height="110"><line x1="15" y1="${y}" x2="345" y2="${y}" stroke="black" stroke-width="2" />`;
    for (let v = -6; v <= 6; v++) {
        svg += `<line x1="${px(v)}" y1="${y - 6}" x2="${px(v)}" y2="${y + 6}" stroke="black" stroke-width="2" />`;
        if (v % 5 === 0) {
            svg += `<text x="${px(v)}" y="${y + 26}" font-size="14" text-anchor="middle">${v}</text>`;
        }
    }
    points.forEach(pt => {
        svg += `<circle cx="${px(pt.v)}" cy="${y}" r="6" fill="black" />` +
               `<text x="${px(pt.v)}" y="${y - 14}" font-size="18" text-anchor="middle">${pt.name}</text>`;
    });
    document.getElementById("図形").innerHTML = svg + "</svg>";
}

// 7: 数直線
function makeQuestionNumberLine() {
    const kind = randInt(5);
    if (kind === 0) {
        const p = randRange(-6, 6);
        correctAnswer = p;
        drawNumberLine([{ name: "P", v: p }]);
        mis(-p, "符号が逆（0より左側は負の数）");
        ex("数直線の目盛りを、0 から数える", "点P は 0 から " + (p >= 0 ? "右" : "左") + " に " + Math.abs(p) + " 目盛り → P = " + p);
        setResult(qHead() + "数直線上の点Pの座標を答えよ");
    } else if (kind === 1) {
        const a = randRange(-6, 6);
        let b = randRange(-6, 6);
        while (b === a) b = randRange(-6, 6);
        correctAnswer = Math.abs(a - b);
        drawNumberLine([{ name: "A", v: a }, { name: "B", v: b }]);
        mis(a + b, "距離を「差」ではなく「和」にしている");
        ex("2点間の距離 = 大きい座標 − 小さい座標（差の絶対値）", "|" + a + " − " + pn(b) + "| = " + Math.abs(a - b));
        setResult(qHead() + "数直線上の2点A、Bの距離を答えよ");
    } else if (kind === 2) {
        const a = randRange(-10, 10);
        let b = randRange(-10, 10);
        while (b === a) b = randRange(-10, 10);
        correctAnswer = Math.abs(a - b);
        mis(a + b, "距離を「差」ではなく「和」にしている");
        ex("2点間の距離 = 大きい座標 − 小さい座標（差の絶対値）", "|" + a + " − " + pn(b) + "| = " + Math.abs(a - b));
        setResult(qHead() + "数直線上の2点 A(" + a + ")、B(" + b + ") の距離を答えよ");
    } else if (kind === 3) {
        const m = randRange(-8, 8);
        const d = randRange(1, 5);
        const pair = Math.random() < 0.5 ? [m - d, m + d] : [m + d, m - d];
        correctAnswer = m;
        mis(pair[0] + pair[1], "÷2 を忘れている（中点は2点の平均）");
        ex("中点の座標 = 2点の座標の平均", "(" + pn(pair[0]) + " + " + pn(pair[1]) + ") ÷ 2 = " + (pair[0] + pair[1]) + " ÷ 2 = " + m);
        setResult(qHead() + "数直線上の2点 A(" + pair[0] + ")、B(" + pair[1] + ") の中点Mの座標を答えよ");
    } else {
        const a = randRange(-8, 8);
        const n = randRange(1, 9);
        const positive = Math.random() < 0.5;
        correctAnswer = positive ? a + n : a - n;
        mis(positive ? a - n : a + n, "動かす向きが逆（正の向き=右、負の向き=左）"); mis(n, "動かした量だけを答えている（A の座標に足し引きしていない）");
        ex("正の向き = 右（座標が増える）、負の向き = 左（座標が減る）", positive ? a + " + " + n + " = " + (a + n) : a + " − " + n + " = " + (a - n));
        setResult(qHead() + "数直線上の点 A(" + a + ") を" + (positive ? "正" : "負") +
            "の向きに " + n + " だけ動かした点の座標を答えよ");
    }
}

// ---------- ベクトルの図 ----------
// spec: { arrows:[{from,to,label,color,dash,thin}], points:[{p,label,color}], legs:[{from,to}] }
let figSeq = 0;
function drawVectorFigure(spec) {
    figSeq += 1;
    const arrows = spec.arrows || [], points = spec.points || [], legs = spec.legs || [];
    const W = 360, H = 300, pad = 22;
    const xs = [0, -2, 2], ys = [0, -2, 2];
    arrows.forEach(ar => { xs.push(ar.from[0], ar.to[0]); ys.push(ar.from[1], ar.to[1]); });
    points.forEach(pt => { xs.push(pt.p[0]); ys.push(pt.p[1]); });
    const x0 = Math.min(...xs) - 1, x1 = Math.max(...xs) + 1, y0 = Math.min(...ys) - 1, y1 = Math.max(...ys) + 1;
    const unit = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad) / (y1 - y0), 40);
    const left = (W - (x1 - x0) * unit) / 2, top = (H - (y1 - y0) * unit) / 2;
    const px = x => (left + (x - x0) * unit).toFixed(1);
    const py = y => (top + (y1 - y) * unit).toFixed(1);
    const colorList = [];
    arrows.forEach(ar => { if (!colorList.includes(ar.color)) colorList.push(ar.color); });
    let svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" style="max-width:100%;height:auto"><defs>';
    colorList.forEach((c, i) => {
        svg += '<marker id="ah' + figSeq + "_" + i + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + c + '"/></marker>';
    });
    svg += "</defs>";
    for (let x = x0; x <= x1; x++) svg += '<line x1="' + px(x) + '" y1="' + py(y0) + '" x2="' + px(x) + '" y2="' + py(y1) + '" stroke="#ddd" stroke-width="1"/>';
    for (let y = y0; y <= y1; y++) svg += '<line x1="' + px(x0) + '" y1="' + py(y) + '" x2="' + px(x1) + '" y2="' + py(y) + '" stroke="#ddd" stroke-width="1"/>';
    svg += '<line x1="' + px(x0) + '" y1="' + py(0) + '" x2="' + px(x1) + '" y2="' + py(0) + '" stroke="#555" stroke-width="1.5"/>';
    svg += '<line x1="' + px(0) + '" y1="' + py(y0) + '" x2="' + px(0) + '" y2="' + py(y1) + '" stroke="#555" stroke-width="1.5"/>';
    const step = unit >= 16 ? 1 : (unit >= 9 ? 2 : 5);
    for (let x = x0; x <= x1; x++) {
        if (x !== 0 && x % step === 0) svg += '<text x="' + px(x) + '" y="' + (Number(py(0)) + 13) + '" font-size="11" text-anchor="middle" fill="#555">' + x + "</text>";
    }
    for (let y = y0; y <= y1; y++) {
        if (y !== 0 && y % step === 0) svg += '<text x="' + (Number(px(0)) - 5) + '" y="' + (Number(py(y)) + 4) + '" font-size="11" text-anchor="end" fill="#555">' + y + "</text>";
    }
    svg += '<text x="' + (Number(px(0)) - 8) + '" y="' + (Number(py(0)) + 13) + '" font-size="12" text-anchor="end" fill="#555">O</text>';
    legs.forEach(l => {
        svg += '<polyline points="' + px(l.from[0]) + "," + py(l.from[1]) + " " + px(l.to[0]) + "," + py(l.from[1]) + " " + px(l.to[0]) + "," + py(l.to[1]) +
            '" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3"/>';
    });
    arrows.forEach(ar => {
        const idx = colorList.indexOf(ar.color);
        svg += '<line x1="' + px(ar.from[0]) + '" y1="' + py(ar.from[1]) + '" x2="' + px(ar.to[0]) + '" y2="' + py(ar.to[1]) + '" stroke="' + ar.color +
            '" stroke-width="' + (ar.thin ? 1.5 : 2.5) + '"' + (ar.dash ? ' stroke-dasharray="5,4"' : "") + ' marker-end="url(#ah' + figSeq + "_" + idx + ')"/>';
        if (ar.label) {
            const sx = (Number(px(ar.from[0])) + Number(px(ar.to[0]))) / 2, sy = (Number(py(ar.from[1])) + Number(py(ar.to[1]))) / 2;
            const dx = Number(px(ar.to[0])) - Number(px(ar.from[0])), dy = Number(py(ar.to[1])) - Number(py(ar.from[1]));
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            svg += '<text x="' + (sx - dy / len * 12).toFixed(1) + '" y="' + (sy + dx / len * 12 + 4).toFixed(1) + '" font-size="15" font-weight="bold" text-anchor="middle" fill="' + ar.color + '">' + ar.label + "</text>";
        }
    });
    points.forEach(pt => {
        const c = pt.color || "#333";
        svg += '<circle cx="' + px(pt.p[0]) + '" cy="' + py(pt.p[1]) + '" r="4" fill="' + c + '"/>';
        if (pt.label) svg += '<text x="' + (Number(px(pt.p[0])) + 7) + '" y="' + (Number(py(pt.p[1])) - 7) + '" font-size="15" font-weight="bold" fill="' + c + '">' + pt.label + "</text>";
    });
    document.getElementById("図形").innerHTML = svg + "</svg>";
}

        answerFigure = sumFigure(a, b);
    } else if (kind === 1) {
        misVec(sub(b, a), "引く順序が逆（b−a を計算している）"); misVec(add(a, b), "引き算を足し算にしている");
        ex("ベクトルの差は成分ごとに引く: a−b = (a₁−b₁, a₂−b₂)", "(" + pn(a[0]) + " − " + pn(b[0]) + ", " + pn(a[1]) + " − " + pn(b[1]) + ") = " + fmt(sub(a, b)));
        vecQ("a=" + fmt(a) + "、b=" + fmt(b) + " のとき、a-b の成分を求めよ", sub(a, b));

// 13: 集合と命題
function shuffled(arr) {
    const r = arr.slice();
    for (let i = r.length - 1; i > 0; i--) {
        const j = randInt(i + 1);
        [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
}

// ---------- 第3弾の追加分 ----------
const SUP = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "-": "⁻" };
const SUB = { "0": "₀", "1": "₁", "2": "₂", "3": "₃", "4": "₄", "5": "₅", "6": "₆", "7": "₇", "8": "₈", "9": "₉" };
function sup(n) { return String(n).split("").map(c => SUP[c] || c).join(""); }
function sub(n) { return String(n).split("").map(c => SUB[c] || c).join(""); }
function gcd(a, b) { return b === 0 ? Math.abs(a) : gcd(b, a % b); }
function perm(n, r) { let x = 1; for (let i = 0; i < r; i++) x *= (n - i); return x; }
function comb(n, r) { return perm(n, r) / perm(r, r); }
function rtTerm(k, s) { return (k === 1 ? "" : k) + "√" + s; }
function piFrac(n, d) { return (n === 1 ? "" : n) + "π" + (d === 1 ? "" : "/" + d); }
const VEC2 = "\n（答えは「%1 %2」の順にスペース区切り）";
function vecHint(a, b) { return VEC2.replace("%1", a).replace("%2", b); }

// ---------- √・分数を含む答えの採点 ----------
const exprNote = "\n（√は「√」または「ルート」、分数は「/」で入力。例: 2√3、√3/2）";
function setExpr(str, strict) {
    correctAnswer = str;
    correctExpr = str;
    exprStrict = !!strict;
    setPlaceholder("例 2√3, √3/2");
}
function fr(n, d) {
    if (d === undefined) d = 1;
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d) || 1;
    return [n / g, d / g];
}
function frMul(a, b) { return fr(a[0] * b[0], a[1] * b[1]); }
function frAdd(a, b) { return fr(a[0] * b[1] + b[0] * a[1], a[1] * b[1]); }

// (n/d)√s を表す値
function V(n, d, s) { return { c: fr(n, d), s: s }; }
function vSimplifyRad(c, rad) {
    let k = 1;
    for (let i = Math.floor(Math.sqrt(rad)); i >= 1; i--) {
        if (rad % (i * i) === 0) { k = i; break; }
    }
    return { c: frMul(c, [k, 1]), s: rad / (k * k) };
}
function vMul(x, y) { return vSimplifyRad(frMul(x.c, y.c), x.s * y.s); }
function vDiv(x, y) {
    const inv = fr(y.c[1], y.c[0]);
    return vSimplifyRad(frMul(frMul(x.c, inv), [1, y.s]), x.s * y.s);
}
function vStr(v) {
    const n = v.c[0], d = v.c[1];
    if (n === 0) return "0";
    if (v.s === 1) return d === 1 ? String(n) : n + "/" + d;
    const coef = n === 1 ? "" : n === -1 ? "-" : String(n);
    return coef + "√" + v.s + (d === 1 ? "" : "/" + d);
}
function mapToString(map) {
    const keys = Object.keys(map).map(Number).sort((a, b) => a - b);
    let out = "";
    keys.forEach(k => {
        const c = map[k];
        if (c[0] === 0) return;
        let t = vStr({ c: c, s: k });
        if (out !== "" && t[0] !== "-") t = "+" + t;
        out += t;
    });
    return out || "0";
}

// 特別な角の三角比
const T = {
    sin: { 0: V(0, 1, 1), 30: V(1, 2, 1), 45: V(1, 2, 2), 60: V(1, 2, 3), 90: V(1, 1, 1), 120: V(1, 2, 3), 135: V(1, 2, 2), 150: V(1, 2, 1) },
    cos: { 0: V(1, 1, 1), 30: V(1, 2, 3), 45: V(1, 2, 2), 60: V(1, 2, 1), 90: V(0, 1, 1), 120: V(-1, 2, 1), 135: V(-1, 2, 2), 150: V(-1, 2, 3) },

};

function normalizeExprText(s) {
    s = String(s).replace(/ルート|ろーと|sqrt|root|rt/gi, "√").replace(/（/g, "(").replace(/）/g, ")");
    s = normalizeNumberText(s).replace(/\s/g, "");
    return s.replace(/√\((\d+)\)/g, "√$1").replace(/\((√?\d+)\)/g, "$1").replace(/[×・＊]/g, "*");
}

// 「2√3」「√3/2」「1/√3」のような1項を解析
function parseTermStr(t) {
    const toks = t.match(/\d+(?:\.\d+)?|√|\/|\*/g);
    if (!toks || toks.join("") !== t) return null;
    let coeff = [1, 1], rad = 1, op = "*", prevOp = true, clean = true, i = 0;
    while (i < toks.length) {
        const tk = toks[i];
        if (tk === "/" || tk === "*") {
            if (prevOp) return null;
            op = tk; prevOp = true; i++;
            continue;
        }
        if (tk === "√") {
            const nx = toks[i + 1];
            if (nx === undefined || !/^\d+$/.test(nx) || Number(nx) === 0) return null;
            const val = Number(nx);
            i += 2;
            if (op === "/") { coeff = frMul(coeff, [1, val]); clean = false; }   // 分母に√
            rad *= val;
        } else {
            i++;
            let f;
            if (tk.includes(".")) f = fr(Number(tk.replace(".", "")), Math.pow(10, tk.split(".")[1].length));
            else f = fr(Number(tk), 1);
            if (op === "/") {
                if (f[0] === 0) return null;
                coeff = frMul(coeff, [f[1], f[0]]);
            } else coeff = frMul(coeff, f);
        }
        op = "*"; prevOp = false;
    }
    if (prevOp) return null;
    const w = vSimplifyRad(coeff, rad);
    if (w.s !== rad) clean = false;                                            // √の中に平方数が残っている
    return { c: w.c, s: w.s, clean: clean };
}

function parseExpr(raw) {
    const str = normalizeExprText(raw);
    if (str === "" || /[()]/.test(str)) return null;
    const terms = str.match(/[+-]?[^+-]+/g);
    if (!terms || terms.join("") !== str) return null;
    const map = {};
    let clean = true;
    for (const term of terms) {
        const v = parseTermStr(term.replace(/^[+-]/, ""));
        if (!v) return null;
        if (!v.clean) clean = false;
        const c = term[0] === "-" ? [-v.c[0], v.c[1]] : v.c;
        map[v.s] = map[v.s] ? frAdd(map[v.s], c) : c;
    }
    Object.keys(map).forEach(k => { if (map[k][0] === 0) delete map[k]; });
    return { map: map, clean: clean };
}

function exprEqual(a, b) {
    const ka = Object.keys(a), kb = Object.keys(b);
    return ka.length === kb.length && ka.every(k => b[k] && a[k][0] === b[k][0] && a[k][1] === b[k][1]);
}

function judgeExpr(raw) {
    const u = parseExpr(raw), c = parseExpr(correctExpr);
    if (!u || !c) return false;
    if (exprStrict && !u.clean) return false;
    return exprEqual(u.map, c.map);
}

function makeQuestionData() {

}

// 28: 不等式
function makeQuestionIneq() {
    const kind = randInt(6);
    const absX = a => "|x" + constTerm(-a) + "|";
    if (kind === 0 || kind === 1) {
        let a, b, c, op, xs, cnt;
        const strict = Math.random() < 0.5;
        do {
            a = randRange(2, 5); b = randNZ(-6, 6); c = randRange(5, 20);
            xs = [];
            for (let x = -60; x <= 60; x++) {
                const v = a * x + b;
                if (strict ? v < c : v <= c) xs.push(x);
            }
            cnt = xs.filter(x => x >= 1).length;
        } while (kind === 0 && (cnt < 1 || cnt > 8));
        op = strict ? "<" : "≦";
        if (kind === 0) {
            correctAnswer = cnt;
            if (strict) mis(cnt + 1, "< のとき端の値は含まれないのに数えている（等号なし）"); else mis(cnt - 1, "≦ のとき端の値も含まれるのに数えていない（等号あり）");
            ex("移項して x の範囲を求める（等号の有無に注意）", a + "x " + op + " " + (c - b) + " → x " + op + " " + (c - b) + "/" + a, "これを満たす自然数を数える → " + cnt + " 個");
            setResult(qHead() + a + "x" + constTerm(b) + op + c + " を満たす自然数 x は何個あるか");
        } else {
            correctAnswer = Math.max(...xs);
            if (strict) mis(Math.max(...xs) + 1, "< のとき端の値は含まれない（等号なし）");
            ex("移項して x の範囲を求める（等号の有無に注意）", a + "x " + op + " " + (c - b) + " → x " + op + " " + (c - b) + "/" + a, "満たす最大の整数は " + correctAnswer + (strict ? "（等号を含まないので端の値は不可）" : ""));
            setResult(qHead() + a + "x" + constTerm(b) + op + c + " を満たす最大の整数 x を求めよ");
        }
    } else if (kind === 2) {
        const a = randRange(-4, 4), b = randRange(1, 6);
        setVecAnswer([a - b, a + b], "x₁ x₂");
        misVec([-b, b], "|x−a|=b を |x|=b と同じにしている（中心 a を忘れている）"); misVec([a - b, a + b].map(v => -v).sort((p1, p2) => p1 - p2), "a の符号が逆（x−a の a の扱いミス）");
        ex("|x−a| = b ⇔ x−a = ±b", "x = " + a + " ± " + b + " → " + (a - b) + "、" + (a + b));
        setResult(qHead() + absX(a) + "=" + b + " を解け\n（答えは小さい順に「x₁ x₂」とスペース区切り）");
    } else if (kind === 3) {
        const a = randRange(-4, 4), b = randRange(2, 6);
        const strict = Math.random() < 0.5;
        correctAnswer = strict ? 2 * b - 1 : 2 * b + 1;
        mis(strict ? 2 * b + 1 : 2 * b - 1, strict ? "< なのに端の値を含めている" : "≦ なのに端の値を含めていない"); mis(b, "片側だけ数えている（a の左右の両側を数える）");
        ex("|x−a| < b ⇔ a−b < x < a+b（≦ のときは等号を含む）", (a - b) + (strict ? " < x < " : " ≦ x ≦ ") + (a + b), "整数は " + correctAnswer + " 個");
        setResult(qHead() + absX(a) + (strict ? "<" : "≦") + b + " を満たす整数 x は何個あるか");
    } else {
        const r = randRange(-5, 3), s2 = r + randRange(2, 6);
        if (kind === 4) {
            setVecAnswer([r, s2], "α β");
            misVec([-s2, -r], "解の符号が逆（(x−α)(x−β)<0 の α, β）");
            ex("左辺を因数分解する: (x" + constTerm(-r) + ")(x" + constTerm(-s2) + ") < 0", "2つの解の間が解 → " + r + " < x < " + s2);
            setResult(qHead() + poly2(-(r + s2), r * s2) + "<0 の解は α<x<β である。α と β を求めよ\n（答えは「α β」の順にスペース区切り）");
        } else {
            const strict = Math.random() < 0.5;
            correctAnswer = strict ? s2 - r - 1 : s2 - r + 1;
            mis(strict ? s2 - r + 1 : s2 - r - 1, strict ? "< なのに端の値を含めている" : "≦ なのに端の値を含めていない"); mis(s2 - r, "端の値の数え方のミス（差ではなく個数を数える）");
            ex("因数分解: (x" + constTerm(-r) + ")(x" + constTerm(-s2) + ")" + (strict ? " < 0" : " ≦ 0"), strict ? r + " < x < " + s2 : r + " ≦ x ≦ " + s2, "整数は " + correctAnswer + " 個");
            setResult(qHead() + poly2(-(r + s2), r * s2) + (strict ? "<0" : "≦0") + " を満たす整数 x は何個あるか");
        }
    }
}

        let r, n, d;

        while ((r * r * n) % (2 * d) !== 0);
        correctAnswer = r * r * n / (2 * d);
        mis(r * n / d, "面積と弧の長さの公式を取り違えている（S=1/2 r²θ）"); mis(r * r * n / d, "1/2 を忘れている（S=1/2 r²θ）");
        ex("おうぎ形の面積 S = (1/2) r²θ", "(1/2) × " + r + "² × " + piFrac(n, d) + " = " + correctAnswer + "π");
        setResult(qHead() + "半径 " + r + "、中心角 " + piFrac(n, d) + " ラジアンのおうぎ形の面積を求めよ（πの係数を答えよ。S=1/2 r²θ）");
    } else if (kind === 6) {
        const k = randRange(2, 6);
        correctAnswer = k;
        mis(2 * k, "周期を π/k にしている（周期は 2π/k）"); mis(k / 2, "周期の公式で 2 を余計に掛けている");
        ex("y = sin kx の周期は 2π/k", "k = " + k + " なので 2π/" + k);
        setResult(qHead() + "y=sin " + k + "x の周期は 2π/□ である。□ を求めよ");
    } else if (kind === 7) {
        const t = pick([[1, 6], [1, 4], [1, 3], [2, 3], [3, 4], [5, 6]]), fn = pick(["sin", "cos", "tan"]);
        setExpr(vStr(T[fn][180 * t[0] / t[1]]), false);
        ex("ラジアンを度に直す: " + piFrac(t[0], t[1]) + " = " + (180 * t[0] / t[1]) + "°", fn + " " + (180 * t[0] / t[1]) + "° = " + correctExpr, "（鈍角は 180°−θ の三角比で、sin は同じ符号、cos・tan は符号が逆）");
        setResult(qHead() + fn + "(" + piFrac(t[0], t[1]) + ") の値を求めよ" + exprNote);
    } else {
        const t = pick([[30, 1, 6], [45, 1, 4], [60, 1, 3]]), fn = pick(["sin", "cos", "tan"]);
        const v = T[fn][t[0]];
        setExpr(vStr(fn === "cos" ? v : V(-v.c[0], v.c[1], v.s)), false);
        misExpr(vStr(fn === "cos" ? V(-v.c[0], v.c[1], v.s) : v), "sin(−θ)=−sinθ、cos(−θ)=cosθ、tan(−θ)=−tanθ の扱いの取り違え");
        ex("負の角: sin(−θ) = −sinθ、cos(−θ) = cosθ、tan(−θ) = −tanθ", fn + "(−" + piFrac(t[1], t[2]) + ") = " + correctExpr);
        setResult(qHead() + fn + "(-" + piFrac(t[1], t[2]) + ") の値を求めよ" + exprNote);
    }
}

// ---------- メモ機能 ----------
const memoCanvas = document.getElementById("memoCanvas");
const memoCtx = memoCanvas.getContext("2d");
let memoDrawing = false;
let memoToolName = "pen";

function memoSetTool(tool) {
    memoToolName = tool;
    memoCtx.globalCompositeOperation = tool === "eraser" ? "destination-out" : "source-over";
    memoCtx.lineWidth = tool === "eraser" ? 28 : 4;
    memoCtx.lineCap = "round";
    memoCtx.lineJoin = "round";
    memoCtx.strokeStyle = "#000";
    document.getElementById("memoBtnPen").classList.toggle("active", tool === "pen");
    document.getElementById("memoBtnEraser").classList.toggle("active", tool === "eraser");
}

function memoSwitch(mode) {
    const draw = mode === "draw";
    memoCanvas.style.display = draw ? "inline-block" : "none";
    document.getElementById("memoText").style.display = draw ? "none" : "inline-block";
    document.getElementById("memoTools").style.display = draw ? "inline" : "none";
    document.getElementById("memoBtnDraw").classList.toggle("active", draw);
    document.getElementById("memoBtnText").classList.toggle("active", !draw);
}

function memoClear() {
    memoCtx.clearRect(0, 0, memoCanvas.width, memoCanvas.height);
    document.getElementById("memoText").value = "";
}

function memoPos(e) {
    const r = memoCanvas.getBoundingClientRect();
    return {
        x: (e.clientX - r.left) * memoCanvas.width / r.width,
        y: (e.clientY - r.top) * memoCanvas.height / r.height
    };
}

memoCanvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    memoDrawing = true;
    if (memoCanvas.setPointerCapture) memoCanvas.setPointerCapture(e.pointerId);
    const p = memoPos(e);
    memoCtx.beginPath();
    memoCtx.moveTo(p.x, p.y);
    memoCtx.lineTo(p.x + 0.1, p.y + 0.1);
    memoCtx.stroke();
});
memoCanvas.addEventListener("pointermove", e => {
    if (!memoDrawing) return;
    e.preventDefault();
    const p = memoPos(e);
    memoCtx.lineTo(p.x, p.y);
    memoCtx.stroke();
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
    memoCanvas.addEventListener(ev, () => { memoDrawing = false; }));

function fitMemoCanvas() {
    const r = memoCanvas.getBoundingClientRect();
    const w = Math.round(r.width), h = Math.round(r.height);
    if (w < 20 || h < 20) return;
    if (memoCanvas.width === w && memoCanvas.height === h) return;
    const tmp = document.createElement("canvas");
    tmp.width = memoCanvas.width;
    tmp.height = memoCanvas.height;
    tmp.getContext("2d").drawImage(memoCanvas, 0, 0);
    memoCanvas.width = w;
    memoCanvas.height = h;
    memoCtx.drawImage(tmp, 0, 0);
    memoSetTool(memoToolName);
}

memoSetTool("pen");
memoSwitch("draw");

// 30: 二桁の足し引き
function makeQuestionTwoDigitAddSub() {
    const add = Math.random() < 0.5;
    let A = randRange(10, 99), B = randRange(10, 99);
    if (Math.random() < 0.6) {                       // 繰り上がり・繰り下がりのある問題を多めに
        if (add) { while ((A % 10) + (B % 10) < 10) { A = randRange(10, 99); B = randRange(10, 99); } }
        else { while (A <= B || A % 10 >= B % 10) { A = randRange(10, 99); B = randRange(10, 99); } }
    } else if (!add && A < B) { const tmp = A; A = B; B = tmp; }
    const t1 = Math.floor(A / 10), o1 = A % 10, t2 = Math.floor(B / 10), o2 = B % 10;
    if (add) {
        correctAnswer = A + B;
        if (o1 + o2 >= 10) {
            mis(A + B - 10, "繰り上がりを忘れている（一の位が 10 以上のとき十の位に 1 を足す）");
            mis(Number(String(t1 + t2) + String(o1 + o2)), "一の位の和（10以上）をそのまま書いている（繰り上がりの処理ミス）");
        }
        mis(Math.abs(A - B), "足し算を引き算にしている");
        ex("一の位どうし、十の位どうしを順に足す", "一の位: " + o1 + " + " + o2 + " = " + (o1 + o2) + (o1 + o2 >= 10 ? "（10以上 → 十の位に 1 繰り上げる）" : ""), "十の位: " + t1 + " + " + t2 + (o1 + o2 >= 10 ? " + 1" : "") + " = " + (t1 + t2 + (o1 + o2 >= 10 ? 1 : 0)), "答え " + correctAnswer);
        setResult(qHead() + A + " + " + B + " = ?");
    } else {
        correctAnswer = A - B;
        if (o1 < o2) {
            mis(correctAnswer + 10, "繰り下がりで十の位を 1 減らし忘れている");
            mis(10 * (t1 - t2) + (o2 - o1), "一の位で大きい数から小さい数を引いている（繰り下がりが必要）");
            mis(correctAnswer - 10, "繰り下がりで十の位を二重に減らしている");
        }
        mis(A + B, "引き算を足し算にしている");
        ex("一の位どうし、十の位どうしを順に引く", (o1 < o2 ? "一の位: " + o1 + " は " + o2 + " より小さいので、十の位から 1 借りて " + (o1 + 10) + " − " + o2 + " = " + (o1 + 10 - o2) : "一の位: " + o1 + " − " + o2 + " = " + (o1 - o2)), "十の位: " + t1 + (o1 < o2 ? " − 1" : "") + " − " + t2 + " = " + (t1 - (o1 < o2 ? 1 : 0) - t2), "答え " + correctAnswer);
        setResult(qHead() + A + " - " + B + " = ?");
    }
}

// 31: 九九
function makeQuestionTimesTable() {
    const A = randRange(2, 9), B = randRange(2, 9);
    if (Math.random() < 0.25) {
        correctAnswer = B;
        mis(A, "割る数をそのまま答えている");
        mis(A * B - A, "割り算を引き算にしている");
        ex("九九の逆: " + A + " × □ = " + (A * B) + " の □ を探す", A + " × " + B + " = " + (A * B) + " なので " + (A * B) + " ÷ " + A + " = " + B);
        mis(A + B, "割り算を足し算にしている");
        setResult(qHead() + (A * B) + " ÷ " + A + " = ?");
    } else {
        correctAnswer = A * B;
        mis(A * (B + 1), "九九の覚え違い（隣の答えを答えている）");
        mis(A * (B - 1), "九九の覚え違い（隣の答えを答えている）");
        mis((A + 1) * B, "九九の覚え違い（隣の段の答えを答えている）");
        ex("九九: " + A + " × " + B + " = " + (A * B), A + " の段を唱えて確認する（" + A + " が " + B + " 個分）");
        mis((A - 1) * B, "九九の覚え違い（隣の段の答えを答えている）");
        mis(A + B, "かけ算を足し算にしている");
        setResult(qHead() + A + " × " + B + " = ?");
    }
}

// 32: 二桁のかけ割
function makeQuestionTwoDigitMulDiv() {
    const r = Math.random();
    if (r < 0.3) {
        const A = randRange(11, 99), B = randRange(2, 9);
        const t = Math.floor(A / 10), o = A % 10;
        correctAnswer = A * B;
        ex("二桁×一桁: 十の位と一の位に分けて掛ける", A + " = " + (t * 10) + " + " + o, (t * 10) + " × " + B + " = " + (t * 10 * B) + "、" + o + " × " + B + " = " + (o * B), (t * 10 * B) + " + " + (o * B) + " = " + correctAnswer);
        mis(10 * t * B + o, "一の位に掛けていない（十の位だけ掛けている）");
        if (o * B >= 10) mis(10 * t * B + (o * B) % 10, "一の位の掛け算の繰り上がりを足し忘れている");
        mis(A + B, "かけ算を足し算にしている");
        setResult(qHead() + A + " × " + B + " = ?");
    } else if (r < 0.55) {
        const A = randRange(11, 30), B = randRange(11, 30);
        const b1 = Math.floor(B / 10), b0 = B % 10;
        correctAnswer = A * B;
        ex("二桁×二桁: 掛ける数を十の位と一の位に分けて、部分積を足す", A + " × " + B + " = " + A + " × " + (b1 * 10) + " + " + A + " × " + b0, (A * b1 * 10) + " + " + (A * b0) + " = " + correctAnswer);
        mis(A * b1 + A * b0, "十の位の部分積を 10 倍していない（位取りのミス）");
        mis(A * b1 * 10, "一の位の部分積を足し忘れている");
        mis(A * b0, "十の位の掛け算を忘れている");
        setResult(qHead() + A + " × " + B + " = ?");
    } else if (r < 0.8) {
        const dv = randRange(2, 9);
        const q = randRange(Math.ceil(10 / dv), Math.floor(99 / dv));
        correctAnswer = q;
        mis(dv, "割る数を答えている");
        mis(q * 10, "桁がずれている（位取りのミス）");
        ex("割り算の答え × 割る数 = 割られる数 で確かめながら探す", (dv * q) + " ÷ " + dv + " = " + q + "（" + dv + " × " + q + " = " + (dv * q) + "）");
        mis(dv * q - dv, "割り算を引き算にしている");
        setResult(qHead() + (dv * q) + " ÷ " + dv + " = ?");
    } else {
        const dv = randRange(11, 25), q = randRange(2, 9);
        correctAnswer = q;
        mis(dv, "割る数を答えている");
        mis(q * 10, "桁がずれている（位取りのミス）");
        ex("割る数の何倍かを考える", dv + " × " + q + " = " + (dv * q) + " なので " + (dv * q) + " ÷ " + dv + " = " + q);
        mis(dv * q - dv, "割り算を引き算にしている");
        setResult(qHead() + (dv * q) + " ÷ " + dv + " = ?");
    }
}

// 33: 正負の2桁（タイムアタック用）
function makeQuestionSignedTwoDigit() {
    const sgn = () => (Math.random() < 0.5 ? 1 : -1);
    const f = n => "(" + n + ")";
    const r = Math.random();
    const A = sgn() * randRange(10, 99);
    if (r < 0.35) {
        const B = sgn() * randRange(10, 99);
        correctAnswer = A + B;
        mis(A - B, "足し算を引き算にしている（−( ) の扱いの取り違え）");
        if (A * B < 0) {
            mis(Math.abs(A) + Math.abs(B), "異符号の足し算で絶対値を足している（大きい方から小さい方を引く）");
            mis(-(Math.abs(A) + Math.abs(B)), "異符号の足し算で絶対値を足している（大きい方から小さい方を引く）");
        } else {
            mis(Math.abs(A + B), "共通の符号を付け忘れている");
        }
        mis(A + B + 10, "繰り上がり・繰り下がりのミス（10 のずれ）");
        mis(A + B - 10, "繰り上がり・繰り下がりのミス（10 のずれ）");
        ex("足し算: 同符号なら絶対値を足して共通の符号、異符号なら絶対値の大きい方から小さい方を引いて大きい方の符号", pn(A) + " + " + pn(B) + " = " + correctAnswer);
        setResult(qHead() + f(A) + " + " + f(B) + " = ?");
    } else if (r < 0.7) {
        const B = sgn() * randRange(10, 99);
        correctAnswer = A - B;
        mis(A + B, "引き算を足し算にしている（−(−B)=+B の処理ミス）");
        mis(B - A, "引く順番が逆（B−A を計算している）");
        mis(A - B + 10, "繰り上がり・繰り下がりのミス（10 のずれ）");
        mis(A - B - 10, "繰り上がり・繰り下がりのミス（10 のずれ）");
        ex("引き算は「符号を変えて足し算」: A − B = A + (−B)", pn(A) + " − " + pn(B) + " = " + pn(A) + " + " + pn(-B) + " = " + correctAnswer);
        setResult(qHead() + f(A) + " - " + f(B) + " = ?");
    } else if (r < 0.85) {
        const B = sgn() * randRange(2, 9);
        correctAnswer = A * B;
        mis(-correctAnswer, "かけ算の符号ミス（同符号→正、異符号→負）");
        mis(A + B, "かけ算を足し算にしている");
        ex("絶対値を掛けて、同符号なら正、異符号なら負", Math.abs(A) + " × " + Math.abs(B) + " = " + Math.abs(correctAnswer) + "、符号は" + (correctAnswer < 0 ? "負" : "正") + " → " + correctAnswer);
        setResult(qHead() + f(A) + " × " + f(B) + " = ?");
    } else {
        const dv = sgn() * randRange(2, 9), absDv = Math.abs(dv);
        const q = sgn() * randRange(Math.ceil(10 / absDv), Math.floor(99 / absDv));
        correctAnswer = q;
        mis(-q, "割り算の符号ミス（同符号→正、異符号→負）");
        mis(Math.abs(dv), "割る数を答えている");
        ex("絶対値を割って、同符号なら正、異符号なら負", Math.abs(dv * q) + " ÷ " + Math.abs(dv) + " = " + Math.abs(q) + "、符号は" + (q < 0 ? "負" : "正") + " → " + q);
        setResult(qHead() + f(dv * q) + " ÷ " + f(dv) + " = ?");
    }
}

    return m + ":" + (Number(rest) < 10 ? "0" : "") + rest;
}

    taCorrect = 0;
    taFlash = "";
    taStart = performance.now();
    startTimer();
    document.getElementById("answer").focus();
}

function timeAttackAnswer(raw) {
    answerstatistics[32][1] += 1;
    const qText = document.getElementById("result").textContent.replace(/^問題\d+　　/, "");
    const verdict = judgeAnswer(raw);
    if (verdict.correct) {
        taCorrect += 1;
        answerstatistics[32][0] += 1;
        taFlash = "前の問題: ○";
    } else {
        recordMistake(verdict.label);
        taLog.push({ q: qText, user: raw, correct: correctAnswer, label: verdict.label, ex: explainText });
        taFlash = "前の問題: ×（正解は " + correctAnswer + "）";
    }
    saveData();
    if (questionCount >= TA_COUNT) {
        finishTimeAttack();
        return;
    }
    questionCount++;
    makeQuestion(33);
    updateTimer();
    document.getElementById("answer").focus();
}

function finishTimeAttack() {
    const sec = (performance.now() - taStart) / 1000;
    stopTimer();
    sessionId++;
    analysisdisplay();
    setResult("");
    const perfect = taCorrect === TA_COUNT;
    let newBest = false;
    if (perfect && (taBest === null || sec < taBest)) { taBest = sec; newBest = true; }
    saveData();

    let h = '<button onclick="startTimeAttack()">もう一度挑戦</button> <button onclick="checkback()">戻る</button>';
    h += "<h2>タイムアタック結果</h2><table>";
    h += '<tr><td class="u">タイム</td><td class="n">' + fmtTime(sec) + "</td></tr>";
    h += '<tr><td class="u">正解率</td><td class="n">' + taCorrect + "/" + TA_COUNT + "（" + Math.round(100 * taCorrect / TA_COUNT) + "%）</td></tr>";
    h += '<tr><td class="u">誤答数</td><td class="n">' + (TA_COUNT - taCorrect) + "</td></tr>";
    h += '<tr><td class="u">1問あたり</td><td class="n">' + (sec / TA_COUNT).toFixed(1) + "秒</td></tr>";
    if (taBest !== null) {
        h += '<tr><td class="u">ノーミスのベストタイム</td><td class="n">' + fmtTime(taBest) + (newBest ? "　更新！" : "") + "</td></tr>";
    }
    h += "</table>";
    if (perfect) {
        h += '<p class="advice">ノーミスです。次は同じ正確さのまま、タイムを縮めましょう。</p>';
    } else if (taCorrect / TA_COUNT < 0.9) {
        h += '<p class="advice">まずは正確さを優先しましょう。正解率が 90% を超えてからタイムを縮めるのがおすすめです。</p>';
    } else {
        h += '<p class="advice">あと少しでノーミスです。間違えたところを確認しましょう。</p>';
    }
    if (taLog.length > 0) {
        h += "<h3>間違えた問題</h3><table>";
        taLog.forEach(e => {
            h += '<tr><td class="u">' + esc(e.q) + '<br><span class="sub">あなたの答え: ' + esc(e.user) + "　正解: " + esc(e.correct) +
                "　【" + esc(e.label) + "】</span>" +
                (e.ex ? "<details><summary>解き方を見る</summary>" + esc(e.ex) + "</details>" : "") + "</td></tr>";
        });
        h += "</table>";
    }
    document.getElementById("analysis").innerHTML = h;
}

function insertSymbol(sym, action) {
    const el = document.getElementById("answer");
    const len = el.value.length;
    let start = el.selectionStart === null || el.selectionStart === undefined ? len : el.selectionStart;
    let end = el.selectionEnd === null || el.selectionEnd === undefined ? len : el.selectionEnd;
    if (action === "clear") { el.value = ""; start = end = 0; sym = ""; }
    else if (action === "back") {
        if (start === end && start > 0) start -= 1;
        sym = "";
    }
    el.value = el.value.slice(0, start) + sym + el.value.slice(end);
    const pos = start + sym.length;
    if (el.setSelectionRange) el.setSelectionRange(pos, pos);
    el.focus();
}

const NOTES_KEY = "mathDrill.notes.v1";
let notesOK = true;
let notesData = { notes: [], current: null, recent: [] };
let palTab = 1;
let noteTimer = null;

function newNote(title) {
    return { id: "n" + Date.now() + Math.random().toString(36).slice(2, 6), title: title, text: "", updated: Date.now() };
}
function currentNote() {
    return notesData.notes.find(n => n.id === notesData.current) || notesData.notes[0];
}

function saveNotes() {
    try {
        localStorage.setItem(NOTES_KEY, JSON.stringify(notesData));
        notesOK = true;
    } catch (e) { notesOK = false; }
    const st = document.getElementById("noteStatus");
    st.textContent = notesOK ? "自動保存" : "保存できない環境です";
}

function loadNotes() {
    try {
        const raw = localStorage.getItem(NOTES_KEY);
        if (raw) {
            const d = JSON.parse(raw);
            if (Array.isArray(d.notes)) {
                notesData.notes = d.notes.filter(n => n && typeof n.text === "string" && typeof n.id === "string")
                    .map(n => ({ id: n.id, title: String(n.title || "メモ"), text: n.text, updated: Number(n.updated) || 0 }));
            }
            if (typeof d.current === "string") notesData.current = d.current;
            if (Array.isArray(d.recent)) notesData.recent = d.recent.filter(k => k && typeof k.v === "string").slice(0, 16);
        }
    } catch (e) { notesOK = false; }
    if (notesData.notes.length === 0) notesData.notes.push(newNote("メモ 1"));
    if (!notesData.notes.some(n => n.id === notesData.current)) notesData.current = notesData.notes[0].id;
}

function renderNoteSelect() {
    const sel = document.getElementById("noteSelect");
    sel.innerHTML = notesData.notes.map(n =>
        '<option value="' + esc(n.id) + '"' + (n.id === notesData.current ? " selected" : "") + ">" + esc(n.title) + "</option>").join("");
    document.getElementById("noteText").value = currentNote().text;
}

function onNoteEdited() {
    const note = currentNote();
    note.text = document.getElementById("noteText").value;
    note.updated = Date.now();
    if (noteTimer !== null) clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { noteTimer = null; saveNotes(); }, 400);
}
function flushNotes() {
    if (noteTimer !== null) { clearTimeout(noteTimer); noteTimer = null; }
    if (document.body.classList.contains("notes")) {
        currentNote().text = document.getElementById("noteText").value;
    }
    saveNotes();
}

function noteInsert(text) {
    const el = document.getElementById("noteText");
    const caret = text.indexOf("\uE000");
    const clean = text.replace("\uE000", "");
    const len = el.value.length;
    const st = el.selectionStart === null || el.selectionStart === undefined ? len : el.selectionStart;
    const en = el.selectionEnd === null || el.selectionEnd === undefined ? st : el.selectionEnd;
    el.value = el.value.slice(0, st) + clean + el.value.slice(en);
    const pos = st + (caret >= 0 ? caret : clean.length);
    if (el.setSelectionRange) el.setSelectionRange(pos, pos);
    el.focus();
    onNoteEdited();
}

function paletteKeys(i) {
    if (i === 0) return notesData.recent.map(k => ({ t: k.t, v: k.v }));
    return PALETTE[i - 1].keys.map(k => typeof k === "string" ? { t: k, v: k } : k);
}

function renderPalette() {
    const names = ["最近"].concat(PALETTE.map(g => g.name));
    document.getElementById("palTabs").innerHTML = names.map((n, i) =>
        '<button type="button" data-t="' + i + '"' + (i === palTab ? ' class="active"' : "") + ">" + n + "</button>").join("");
    const keys = paletteKeys(palTab);
    const box = document.getElementById("palKeys");
    const group = palTab > 0 ? PALETTE[palTab - 1] : null;
    if (group && group.cols) { box.classList.add("pad"); box.style.setProperty("--cols", group.cols); }
    else { box.classList.remove("pad"); box.style.removeProperty("--cols"); }
    box.innerHTML = keys.length === 0
        ? '<div class="hint">使った記号がここに並びます</div>'
        : keys.map((k, i) => {
            const cls = /^[0-9.]$/.test(k.t) ? ' class="num"' : (k.v.indexOf("\uE000") >= 0 || k.t.length > 3 ? ' class="tpl"' : "");
            return '<button type="button" data-k="' + i + '"' + cls + ">" + esc(k.t) + "</button>";
        }).join("");
}

function rememberKey(k) {
    notesData.recent = [{ t: k.t, v: k.v }].concat(notesData.recent.filter(r => r.v !== k.v)).slice(0, 16);
}

function openNotes() {
    ["mode1", "mode2", "mode3", "mode4", "checkAnswer", "checkback", "answer", "menu", "memo", "analysis"].forEach(x => show(x, "none"));
    stopTimer();
    setQuiz(false);
    document.body.classList.add("notes");
    renderNoteSelect();
    renderPalette();
    document.getElementById("noteStatus").textContent = notesOK ? "自動保存" : "保存できない環境です";
}

function closeNotes() {
    flushNotes();
    goBackToMenu();
}

(function setupNotes() {
    const byId = id => document.getElementById(id);
    byId("noteText").addEventListener("input", onNoteEdited);
    byId("noteSelect").addEventListener("change", () => {
        flushNotes();
        notesData.current = byId("noteSelect").value;
        saveNotes();
        byId("noteText").value = currentNote().text;
    });
    byId("noteNew").addEventListener("click", () => {
        flushNotes();
        const n = newNote("メモ " + (notesData.notes.length + 1));
        notesData.notes.push(n);
        notesData.current = n.id;
        saveNotes();
        renderNoteSelect();
        byId("noteText").focus();
    });
    byId("noteRename").addEventListener("click", () => {
        const note = currentNote();
        const name = typeof prompt === "function" ? prompt("メモの名前", note.title) : null;
        if (name === null || name.trim() === "") return;
        note.title = name.trim().slice(0, 40);
        saveNotes();
        renderNoteSelect();
    });
    byId("noteDelete").addEventListener("click", () => {
        if (typeof confirm === "function" && !confirm("このメモ「" + currentNote().title + "」を削除します。よろしいですか？")) return;
        notesData.notes = notesData.notes.filter(n => n.id !== notesData.current);
        if (notesData.notes.length === 0) notesData.notes.push(newNote("メモ 1"));
        notesData.current = notesData.notes[0].id;
        saveNotes();
        renderNoteSelect();
    });
    byId("noteCopy").addEventListener("click", () => {
        const text = byId("noteText").value;
        const done = () => { byId("noteStatus").textContent = "コピーしました"; };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, () => { byId("noteText").select(); document.execCommand("copy"); done(); });
        } else {
            byId("noteText").select();
            document.execCommand("copy");
            done();
        }
    });
    byId("noteBack").addEventListener("click", closeNotes);

    const palette = byId("palette");
    palette.addEventListener("mousedown", e => e.preventDefault());       // 入力欄のフォーカスを外さない
    palette.addEventListener("click", e => {
        const b = e.target.closest ? e.target.closest("button") : null;
        if (!b) return;
        const el = byId("noteText");
        if (b.hasAttribute("data-t")) { palTab = Number(b.getAttribute("data-t")); renderPalette(); return; }
        if (b.hasAttribute("data-k")) {
            const k = paletteKeys(palTab)[Number(b.getAttribute("data-k"))];
            if (!k) return;
            noteInsert(k.v);
            rememberKey(k);
            if (palTab !== 0) { /* 「最近」タブ以外では並びを動かさない */ }
            saveNotes();
            return;
        }
        const c = b.getAttribute("data-c");
        if (c === "space") noteInsert(" ");
        else if (c === "enter") noteInsert("\n");
        else {
            const len = el.value.length;
            let st = el.selectionStart === null || el.selectionStart === undefined ? len : el.selectionStart;
            let en = el.selectionEnd === null || el.selectionEnd === undefined ? st : el.selectionEnd;
            if (c === "left") { st = en = Math.max(0, st - 1); }
            else if (c === "right") { st = en = Math.min(len, en + 1); }
            else if (c === "back") {
                if (st === en && st > 0) st -= 1;
                el.value = el.value.slice(0, st) + el.value.slice(en);
                en = st;
                onNoteEdited();
            }
            if (el.setSelectionRange) el.setSelectionRange(st, en);
            el.focus();
        }
    });
    if (typeof window !== "undefined" && window.addEventListener) {
        window.addEventListener("pagehide", flushNotes);
        if (typeof document.addEventListener === "function") document.addEventListener("visibilitychange", () => { if (document.hidden) flushNotes(); });
    }
})();

    questiondisplay();
    makeQuestion(mode);
}

// ---------- 間違え方の記録 ----------
function mis(value, label) { misList.push({ t: "n", v: value, label: label }); }
function misVec(arr, label) { misList.push({ t: "v", v: arr, label: label }); }
function misExpr(str, label) { misList.push({ t: "e", v: str, label: label }); }
function frStr(f) { return f[1] === 1 ? String(f[0]) : f[0] + "/" + f[1]; }
function evalMap(map) {
    return Object.keys(map).reduce((sum, k) => sum + map[k][0] / map[k][1] * Math.sqrt(Number(k)), 0);
}

// 問題文の sin/cos/tan と角度を読み取り、別の三角比の値を答えていないか調べる
function trigConfusion(val) {
    const q = document.getElementById("result").textContent;
    let fn = null, deg = null, m;
    if ((m = q.match(/(sin|cos|tan)\s*\(?\s*(-?\d+(?:\.\d+)?)°/))) {
        fn = m[1]; deg = Number(m[2]);
    } else if ((m = q.match(/(sin|cos|tan)\(\s*(-?)(\d*)π(?:\/(\d+))?\s*\)/))) {
        fn = m[1];
        deg = (m[2] ? -1 : 1) * 180 * (m[3] === "" ? 1 : Number(m[3])) / (m[4] ? Number(m[4]) : 1);
    } else if ((m = q.match(/(sin|cos|tan)\s+(\d*)π/))) {
        fn = m[1]; deg = 180 * (m[2] === "" ? 1 : Number(m[2]));
    } else if ((m = q.match(/(sin|cos|tan)\s+0(?!\d)/))) {
        fn = m[1]; deg = 0;
    }
    if (fn === null || Number.isNaN(val)) return null;
    for (const other of ["sin", "cos", "tan"]) {
        if (other === fn) continue;
        const v = Math[other](deg * Math.PI / 180);
        if (Math.abs(v) < 1e6 && Math.abs(v - val) < 1e-9) {
            return other + " の値を答えている（sin・cos・tan の取り違え）";
        }
    }
    return null;
}

// 数値の答えの間違え方
function diagnoseNumber(n) {
    if (Number.isNaN(n)) return "数として読み取れない入力（書き方の誤り）";
    const hit = misList.find(m => m.t === "n" && nearlyEqual(m.v, n));
    if (hit) return hit.label;
    const tc = trigConfusion(n);
    if (tc) return tc;
    const c = correctAnswer;
    if (typeof c === "number" && c !== 0) {
        if (nearlyEqual(n, -c)) return "符号の間違い（正負が逆になっている）";
        if (nearlyEqual(n, 2 * c)) return "2倍にしている（÷2 の忘れなど）";
        if (nearlyEqual(n * 2, c)) return "半分にしている（×2 の忘れなど）";
        if (nearlyEqual(n, 10 * c) || nearlyEqual(n * 10, c)) return "桁を間違えている";
    }
    if (typeof c === "number" && Math.abs(Math.abs(n - c) - 1) < 1e-9) return "±1 のずれ（数え方・端の扱いのミス）";
    return "その他の計算ミス";
}

// 複数の数で答える問題の間違え方
function diagnoseVec(raw) {
    const u = normalizeNumberText(raw).replace(/,/g, " ").split(/\s+/).map(Number);
    const cv = correctVec;
    const hit = misList.find(m => m.t === "v" && m.v.length === u.length && m.v.every((x, i) => nearlyEqual(x, u[i])));
    if (hit) return hit.label;
    if (u.length !== cv.length || u.some(Number.isNaN)) return "入力形式の誤り（個数・書き方を確認）";
    if (u.every((x, i) => nearlyEqual(x, -cv[i]))) return "すべての値の符号が逆になっている";
    if (cv.length === 2 && nearlyEqual(u[0], cv[1]) && nearlyEqual(u[1], cv[0])) {
        return "答える順序（" + (vecNames[0] || "1番目") + "と" + (vecNames[1] || "2番目") + "）を取り違えている";
    }
    const wrong = u.map((x, i) => nearlyEqual(x, cv[i]) ? -1 : i).filter(i => i >= 0);
    if (wrong.length === 1) {
        const i = wrong[0], nm = vecNames[i] || ((i + 1) + "番目の値");
        return nearlyEqual(u[i], -cv[i]) ? nm + "の符号が逆になっている" : nm + "の計算ミス（もう一方は合っている）";
    }
    return "複数の値が違う（解き方・公式の取り違えの可能性）";
}

// √や分数を含む答えの間違え方
function diagnoseExpr(raw) {
    const u = parseExpr(raw);
    if (!u) return "式として読み取れない入力（√ や / の書き方を確認）";
    const c = parseExpr(correctExpr);
    if (exprEqual(u.map, c.map)) {
        return exprStrict ? "値は合っているが、簡単な形（有理化・√の中を最小に）になっていない" : "答えの形が違う";
    }
    const hit = misList.find(m => {
        const pm = parseExpr(String(m.v));
        return pm && exprEqual(pm.map, u.map);
    });
    if (hit) return hit.label;
    const neg = {};
    Object.keys(c.map).forEach(k => { neg[k] = [-c.map[k][0], c.map[k][1]]; });
    if (exprEqual(neg, u.map)) return "符号の間違い（正負が逆になっている）";
    const un = evalMap(u.map), cn = evalMap(c.map);
    const tc = trigConfusion(un);
    if (tc) return tc;
    if (Math.abs(cn) > 1e-9 && Math.abs(un) > 1e-9) {
        if (Math.abs(un * cn - 1) < 1e-9) return "分子と分母を逆にしている（逆数を答えている）";
        if (Math.abs(un / cn - 2) < 1e-9) return "2倍にしている（÷2 の忘れなど）";
        if (Math.abs(un / cn - 0.5) < 1e-9) return "半分にしている（×2 の忘れなど）";
    }
    const uk = Object.keys(u.map), ck = Object.keys(c.map);
    if (uk.length === 1 && ck.length === 1) {
        if (uk[0] === "1" && ck[0] === "1") return "分数・数値の計算ミス";
        if (uk[0] === ck[0]) return "係数の計算ミス（√の中は合っている）";
        if (uk[0] === "1") return "√ を付け忘れている";
        if (ck[0] === "1") return "√ を付けすぎている";
        return "√の中の計算ミス（平方数のくくり出し・掛け算のミスなど）";
    }
    return "その他の計算ミス";
}

function diagnose(raw) {
    if (correctVec) return diagnoseVec(raw);
    if (correctExpr) return diagnoseExpr(raw);
    if (questionmode === 6) return "定義できる値として答えている（tan90° は cos90°=0 が分母になり定義できない）";
    return diagnoseNumber(Number(normalizeNumberText(raw)));
}

function recordMistake(label) {
    sessionMistakes[label] = (sessionMistakes[label] || 0) + 1;
    const ms = mistakeStats[questionmode - 1];
    ms[label] = (ms[label] || 0) + 1;
}

// ---------- 採点 ----------
// 数値回答
function judgeNumber(raw) {
    const n = Number(normalizeNumberText(raw));
    return nearlyEqual(n, correctAnswer);
}

// 三角比(定義できるかどうか等の文字の答え)
function judgeTrig(raw) {
    const user = raw.replace(/／/g, "/").replace(/[\s　]/g, "").replace(/[０-９]/g, c =>
        String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
    const accepted = [correctAnswer].concat(alternativeAnswersF[correctAnswer] || []);
    return accepted.includes(user);
}

// 連立方程式の誤り分類
function judgeSimultaneous(ux, uy) {
    const [a, b, c, d, e, f] = eq;
    const xOk = nearlyEqual(ux, answerX);
    const yOk = nearlyEqual(uy, answerY);
    if (xOk && yOk) return null;

    const xNeg = nearlyEqual(ux, -answerX);
    const yNeg = nearlyEqual(uy, -answerY);

    if (xNeg && yNeg) return [4, "xとyの正負を間違えている可能性があります"];
    if (xNeg && yOk)  return [5, "xの正負を間違えている可能性があります"];
    if (xOk && yNeg)  return [6, "yの正負を間違えている可能性があります"];
    if (yOk)          return [2, "xの計算を間違えている可能性があります"];
    if (xOk)          return [3, "yの計算を間違えている可能性があります"];

    const eq1Ok = nearlyEqual(a * ux + b * uy, c);
    const eq2Ok = nearlyEqual(d * ux + e * uy, f);
    if (!eq1Ok && eq2Ok) return [7, "1つ目の式の計算を間違えている可能性があります"];
    if (eq1Ok && !eq2Ok) return [8, "2つ目の式の計算を間違えている可能性があります"];
    if (!eq1Ok && !eq2Ok) return [9, "計算方法を間違えている可能性があります"];
    return [10, "その他の間違いの可能性があります"];
}

// 複数の数で答える問題（ベクトル・因数分解など）
function judgeVector(raw) {
    const parts = normalizeNumberText(raw).replace(/,/g, " ").split(/\s+/).map(Number);
    return parts.length === correctVec.length && correctVec.every((v, i) => nearlyEqual(parts[i], v));
}

function judgeAnswer(raw) {
    let correct, label = null;
    if (questionmode === 5) {
        const parts = normalizeNumberText(raw).replace(/,/g, " ").split(/\s+/);
        const verdict = judgeSimultaneous(Number(parts[0]), Number(parts[1]));
        correct = verdict === null;
        if (!correct) label = verdict[1];
    } else if (correctVec) correct = judgeVector(raw);
    else if (correctExpr) correct = judgeExpr(raw);
    else if (questionmode === 6) correct = judgeTrig(raw);
    else correct = judgeNumber(raw);

    if (correct) return { correct: true };
    if (label === null) label = diagnose(raw);
    return { correct: false, label: label };
}

function isValidInput(raw) {
    if (raw === "") return false;
    const need = questionmode === 5 ? 2 : (correctVec ? correctVec.length : 0);
    if (need > 0) {
        const parts = normalizeNumberText(raw).replace(/,/g, " ").split(/\s+/);
        if (parts.length !== need || parts.some(p => p === "" || Number.isNaN(Number(p)))) {
            alert(need + "つの数をスペースで区切って入力してください（例: 2 3）");
            return false;
        }
    }
    return true;
}

function showSummary() {
    let t = "終了！\n　正解数_" + answerlist[0] + "\n　不正解数_" + answerlist[1];
    const entries = Object.keys(sessionMistakes).map(k => [k, sessionMistakes[k]]).sort((a, b) => b[1] - a[1]);
    if (entries.length === 0) {
        t += "\n　全問正解！";
    } else {
        t += "\n\n　今回の間違え方";
        entries.forEach(e => { t += "\n　・" + e[0] + " ×" + e[1]; });
    }
    setResult(t);
}

// 回答ボタン（誤答や解説表示のときは「次の問題へ」になる）
async function checkAnswer() {
    if (nextResolver) {
        const r = nextResolver;
        nextResolver = null;
        r();
        return;
    }
    if (answerCount !== 0) return;

    const raw = document.getElementById("answer").value.trim();
    if (!isValidInput(raw)) return;
    if (questionmode === 33) { timeAttackAnswer(raw); return; }

    answerCount = 1;
    const mySession = sessionId;
    answerstatistics[questionmode - 1][1] += 1;
    const qText = document.getElementById("result").textContent.replace(/^問題\d*　　/, "");

    const verdict = judgeAnswer(raw);
    if (verdict.correct) {
        setResult("正解！");
        answerlist[0] += 1;
        answerstatistics[questionmode - 1][0] += 1;
    } else {
        answerlist[1] += 1;
        recordMistake(verdict.label);
        const correctText = questionmode === 5
            ? "X=" + answerX + " Y=" + answerY
            : (correctVec ? correctVec.join(" ") : correctAnswer);
        setResult("不正解　正解は" + correctText + "\n【間違え方】" + verdict.label);
    }
    saveData();
    if (answerFigure) answerFigure();          // 解説図（答えの矢印などを重ねて表示）

    let manual = false;
    if ((!verdict.correct || settings.explainOnCorrect) && explainText) {
        manual = true;
        openExplain(qText);
        await waitForNext();
        closeExplain();
    } else {
        await sleep(verdict.correct ? 1000 : 3500);
    }
    if (mySession !== sessionId) return;

    if (questionCount === 5) {
        document.getElementById("図形").innerHTML = "";
        showSummary();
        return;
    }

    if (!manual) {
        setResult("次の問題まで 2");
        await sleep(1000);
        if (mySession !== sessionId) return;

        setResult("次の問題まで 1");
        await sleep(1000);
        if (mySession !== sessionId) return;
    }

    document.getElementById("図形").innerHTML = "";
    questionCount++;
    makeQuestion(questionmode);
    answerCount = 0;
}

    "手順の抜け（÷2・平方根・掛け忘れなど）": "答えを出す前に、最後の手順（÷2・÷3・平方根を取る・2倍など）をチェックリストにして確認しましょう。",
    "入力形式の誤り": "入力形式（スペース区切り、√ は「ルート」と入力など）を確認しましょう。",

};

function classifyMistake(label) {
    if (/入力|読み取れ/.test(label)) return "入力形式の誤り";
    if (/符号|正負|奇関数|偶関数/.test(label)) return "符号・正負のミス";
    if (/±1|端|等号|数え|個数/.test(label)) return "数え方・端の扱いのミス";
    if (/簡単な形|有理化|約分|形が違う/.test(label)) return "答えの整理不足（簡単な形・約分）";
    if (/取り違え|混同|公式|逆にしている|逆（|順序|向き|逆になっている/.test(label)) return "公式・用語・向きの取り違え";
    if (/忘れ|していない|いない|抜け|掛けて|落として/.test(label)) return "手順の抜け（÷2・平方根・掛け忘れなど）";
    return "その他の計算ミス";
}

function esc(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function pct(c, t) { return t === 0 ? "―" : Math.round(100 * c / t) + "%"; }
function topMistakes(mode, n) {
    const ms = mistakeStats[mode - 1];
    return Object.keys(ms).map(k => [k, ms[k]]).sort((a, b) => b[1] - a[1]).slice(0, n);
}

function tendencyHtml() {
    const cats = {}, all = {};
    let total = 0;
    for (let m = 1; m <= MODE_COUNT; m++) {
        const ms = mistakeStats[m - 1];
        Object.keys(ms).forEach(label => {
            const c = ms[label], cat = classifyMistake(label);
            cats[cat] = (cats[cat] || 0) + c;
            total += c;
            if (!all[label]) all[label] = { count: 0, units: [] };
            all[label].count += c;
            if (!all[label].units.includes(UNIT_NAMES[m])) all[label].units.push(UNIT_NAMES[m]);
        });
    }
    let h = "<h2>間違え方の傾向</h2>";
    if (total === 0) return h + "<p>まだ間違いの記録がありません。</p>";

    const catList = Object.keys(cats).map(k => [k, cats[k]]).sort((a, b) => b[1] - a[1]);
    h += "<h3>種類別（全部で " + total + " 回）</h3><table>";
    catList.forEach(e => {
        h += '<tr><td class="u">' + esc(e[0]) + '</td><td class="n">' + e[1] + "回</td><td class=\"n\">" +
            Math.round(100 * e[1] / total) + "%</td></tr>";
    });
    h += "</table>";
    h += '<p class="advice">いちばん多いのは「' + esc(catList[0][0]) + "」です。" + esc(ADVICE[catList[0][0]]) + "</p>";

    const top = Object.keys(all).map(k => [k, all[k]]).sort((a, b) => b[1].count - a[1].count).slice(0, 5);
    h += "<h3>よくある間違い TOP" + top.length + "</h3><table>";
    top.forEach(e => {
        h += '<tr><td class="u">' + esc(e[0]) + '<br><span class="sub">' + esc(e[1].units.join("、")) +
            '</span></td><td class="n">' + e[1].count + "回</td></tr>";
    });
    h += "</table>";

    const weak = [];
    for (let m = 1; m <= MODE_COUNT; m++) {
        const st = answerstatistics[m - 1];
        if (st[1] >= 3 && st[0] / st[1] < 0.7) weak.push([m, st[0], st[1]]);
    }
    weak.sort((a, b) => a[1] / a[2] - b[1] / b[2]);
    h += "<h3>苦手な単元（3問以上回答・正解率70%未満）</h3>";
    if (weak.length === 0) h += "<p>該当する単元はありません。</p>";
    else {
        h += "<table>";
        weak.forEach(w => {
            h += '<tr><td class="u">' + UNIT_NAMES[w[0]] + '</td><td class="n">' + w[1] + "/" + w[2] +
                '</td><td class="n">' + pct(w[1], w[2]) + "</td></tr>";
        });
        h += "</table>";
    }
    return h;
}

}
