<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>計算練習</title>
<style>
body { text-align: center; }

#answer {
    display: block;
    margin: 20px auto;
    font-size: 30px;
    width: 200px;
    height: 50px;
    box-sizing: border-box;
    margin-top: 200px;
}

#menu, #mode1, #mode2, #mode3, #mode4 { text-align: center; }

#menu button, #mode1 button, #mode2 button, #mode3 button, #mode4 button {
    display: block;
    margin: 10px auto;
    width: 300px;
    font-size: 25px;
    padding: 10px 20px;
}

#buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
}

#buttons button {
    font-size: 30px;
    padding: 10px 25px;
}

#memo { display: none; margin: 20px auto; max-width: 600px; text-align: center; }
#memo button { font-size: 18px; padding: 6px 12px; margin: 2px; }
#memo button.active { font-weight: bold; background: #cde; }
#memoCanvas { width: 100%; max-width: 600px; height: auto; border: 2px solid #888; background: #fff; touch-action: none; }
#memoText { display: none; width: 100%; max-width: 600px; box-sizing: border-box; font-size: 20px; }

#timer { display: none; font-size: 22px; color: #555; margin: 4px 0; }

#analysis { display: none; max-width: 640px; margin: 10px auto; text-align: left; font-size: 20px; padding: 0 10px; }
#analysis table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
#analysis td { padding: 4px 6px; border-bottom: 1px solid #ddd; }
#analysis td.n { text-align: right; white-space: nowrap; width: 1%; }
#analysis td.mis { font-size: 16px; color: #a33; padding-left: 24px; }
#analysis .sub { font-size: 14px; color: #666; }
#analysis .advice { background: #fff6dd; padding: 8px 12px; border-radius: 6px; }
#analysis button { font-size: 20px; padding: 6px 16px; }

#result {
    font-size: 30px;
    white-space: pre-line;
}
</style>
</head>
<body>

<p id="result"></p>
<div id="timer"></div>
<div id="図形"></div>
<div id="analysis"></div>

<input id="answer" type="text" inputmode="decimal" autocomplete="off">

<div id="menu">
    <button onclick="checkstrat_mode1()">基礎計算</button>
    <button onclick="checkstrat_mode2()">図形計算</button>
    <button onclick="checkstrat_mode3()">高次計算</button>
    <button onclick="checkstrat_mode4()">論理的計算</button>
    <button onclick="checkanalysis()">正解率の表示</button>
    <button onclick="checkreset()">回答分析のリセット</button>
</div>

<div id="mode1">
    <button onclick="startUnit(30)">二桁の足し引き</button>
    <button onclick="startUnit(31)">九九</button>
    <button onclick="startUnit(32)">二桁のかけ割</button>
    <button onclick="checkstrat_easeC()">数直線</button>
    <button onclick="checkstrat_hrad()">正負の計算</button>
    <button onclick="startTimeAttack()">正負の2桁 タイムアタック（20問）</button>
    <button onclick="startUnit(14)">平方根</button>
    <button onclick="startUnit(15)">一次方程式・文字式</button>
    <button onclick="checkstrat_easeB()">一次関数</button>
    <button onclick="checkback2()">戻る</button>
</div>

<div id="mode2">
    <button onclick="checkstrat_Shape()">簡単な図形</button>
    <button onclick="startUnit(20)">角度</button>
    <button onclick="startUnit(18)">円とおうぎ形</button>
    <button onclick="startUnit(19)">立体の体積・表面積</button>
    <button onclick="startUnit(17)">三平方の定理</button>
    <button onclick="checkstrat_Shape2()">三角比</button>
    <button onclick="startUnit(25)">正弦定理・余弦定理</button>
    <button onclick="checkstrat_Shape3()">ベクトル</button>
    <button onclick="startUnit(27)">図形と方程式</button>
    <button onclick="startUnit(29)">弧度法と三角関数</button>
    <button onclick="checkback2()">戻る</button>
</div>

<div id="mode3">
    <button onclick="checkstrat_easeB2()">二次関数</button>
    <button onclick="startUnit(16)">二次方程式</button>
    <button onclick="checkstrat_Simultaneous()">連立方程式</button>
    <button onclick="checkstrat_easeB3()">因数分解</button>
    <button onclick="checkstrat_easeB4()">展開</button>
    <button onclick="checkstrat_easeB5()">平方完成</button>
    <button onclick="startUnit(28)">不等式</button>
    <button onclick="startUnit(24)">指数・対数</button>
    <button onclick="startUnit(23)">数列</button>
    <button onclick="startUnit(26)">微分・積分</button>
    <button onclick="checkback2()">戻る</button>
</div>

<div id="mode4">
    <button onclick="checkstrat_easeD1()">集合と命題</button>
    <button onclick="startUnit(21)">場合の数と確率</button>
    <button onclick="startUnit(22)">資料の整理とデータ分析</button>
    <button onclick="checkback2()">戻る</button>
</div>

<div id="buttons">
    <button id="checkAnswer" onclick="checkAnswer()">回答</button>
    <button id="checkback" onclick="checkback()">戻る</button>
</div>

<div id="memo">
    <div>
        <button id="memoBtnDraw" onclick="memoSwitch('draw')">手書き</button>
        <button id="memoBtnText" onclick="memoSwitch('text')">テキスト</button>
        <span id="memoTools">
            <button id="memoBtnPen" onclick="memoSetTool('pen')">ペン</button>
            <button id="memoBtnEraser" onclick="memoSetTool('eraser')">消しゴム</button>
        </span>
        <button onclick="memoClear()">全部消す</button>
    </div>
    <canvas id="memoCanvas" width="900" height="450"></canvas>
    <textarea id="memoText" rows="8" placeholder="ここに計算メモを書けます"></textarea>
</div>

<script>
// questionmode: 1=整数計算 2=正負の計算 3=一次関数 4=簡単な図形 5=連立方程式 6=三角比
//   7=数直線 8=ベクトル 9=二次関数 10=因数分解 11=展開 12=平方完成 13=集合と命題
//   14=平方根 15=一次方程式 16=二次方程式 17=三平方 18=円とおうぎ形 19=立体 20=角度 21=場合の数と確率
//   22=データ分析 23=数列 24=指数・対数 25=正弦・余弦定理 26=微分・積分 27=図形と方程式 28=不等式 29=弧度法と三角関数
let answerX = 0;
let answerY = 0;
let eq = [0, 0, 0, 0, 0, 0];      // 連立方程式の係数 [a,b,c,d,e,f]
let questionnumber = [0, 0, 0, 0];
let questionmode = 1;
let questionCount = 1;
let correctAnswer;
let correctVec = null;       // 複数の数で答える問題の正解（配列）
let correctExpr = null;      // √や分数を含む式で答える問題の正解（文字列）
let exprStrict = false;      // true: 簡単な形（有理化・√の中を最小）で答えないと不正解
let answerlist = new Array(15).fill(0);
let answer_misu = [];
let answerCount = 1;
let sessionId = 0;                 // 「戻る」後に古い処理が動かないようにするための番号
const MODE_COUNT = 33;
let answerstatistics = newStatistics();
let misList = [];                         // 想定される間違いと、その間違え方の説明
let vecNames = [];                        // 複数の数で答える問題の、各値の名前
let sessionMistakes = {};                 // 今回のセット内の間違え方の集計
let mistakeStats = newMistakeStats();     // 単元ごとの間違え方の集計
const TA_COUNT = 20;                      // タイムアタックの問題数
let taStart = 0, taTimerId = null, taLog = [], taCorrect = 0, taFlash = "", taBest = null;

function newMistakeStats() {
    return Array.from({ length: MODE_COUNT }, () => ({}));
}

function newStatistics() {
    return Array.from({ length: MODE_COUNT }, () => [0, 0]);
}

// y=ax+b  [y, a, x, b]
const questioneaseB = [
    [13, 4, 4, -3],
    [-9, -6, 6, 27],
    [-10, -4, -4, -26],
    [-23, -3, 4, -11],
    [-33, 7, -3, 12],
    [-16, -1, 18, 2],
    [14, -1, -16, -2],
    [-14, 3, -9, 13],
    [19, 12, 1, 7]
];

// 連立方程式 [a, b, (c), d, e, (f), x, y]
// c と f は x,y から自動計算するので、ここの値は使われない
const questioneaseE = [
    [2, 3, 13, 4, -1, 5, 2, 3],
    [1, 2, 8, 3, -1, 9, 4, 2],
    [3, 2, 16, 1, -2, -1, 4, 2],
    [2, -1, 7, 3, 2, 14, 3, -1],
    [1, 3, 11, 2, -1, 1, 2, 3],

    [3, 1, 10, 2, 3, 13, 2, 4],
    [2, 5, 19, 4, -1, 6, 2, 3],
    [1, -2, -4, 3, 1, 11, 3, 4],
    [4, 1, 13, 2, -3, 1, 2, 5],
    [2, 3, 12, 1, -2, -4, 2, 2],

    [3, -2, 5, 1, 4, 11, 3, 2],
    [1, 4, 14, 2, -1, 1, 2, 3],
    [2, -3, -1, 3, 1, 11, 2, 1],
    [5, 2, 19, 1, -1, 1, 3, 2],
    [1, 2, 1, 4, -1, 13, 3, -1],

    [2, -1, 9, 3, 2, 16, 3, -3],
    [3, 4, 18, 2, -1, 9, 2, 3],
    [1, -3, 7, 2, 1, 8, 5, -2],
    [4, -2, 10, 1, 3, 11, 2, -1],
    [2, 1, 9, 3, -2, 4, 2, 5]
];

// 三角比 [問題文, 回答]
const questioneaseF = [
    ["直角三角形ABCで、∠C=90°、AB=5、BC=3のとき、sin Aを求めよ", "3/5"],
    ["直角三角形ABCで、∠C=90°、AB=5、AC=4のとき、cos Aを求めよ", "4/5"],
    ["直角三角形ABCで、∠C=90°、AC=4、BC=3のとき、tan Aを求めよ", "3/4"],
    ["sin 30°の値を求めよ", "1/2"],
    ["cos 60°の値を求めよ", "1/2"],
    ["tan 45°の値を求めよ", "1"],
    ["sin 45°の値を求めよ", "√2/2"],
    ["cos 45°の値を求めよ", "√2/2"],
    ["tan 30°の値を求めよ", "1/√3"],
    ["tan 60°の値を求めよ", "√3"],
    ["sin 60°の値を求めよ", "√3/2"],
    ["cos 30°の値を求めよ", "√3/2"],
    ["sin 0°の値を求めよ", "0"],
    ["cos 0°の値を求めよ", "1"],
    ["tan 0°の値を求めよ", "0"],
    ["sin 90°の値を求めよ", "1"],
    ["cos 90°の値を求めよ", "0"],
    ["tan 90°の値は定義できるか答えよ", "定義できない"]
];

// 三角比で「同じ意味」として許す別表記
const alternativeAnswersF = {
    "√2/2": ["1/√2"],
    "1/√3": ["√3/3"],
    "定義できない": ["できない", "定義不可", "定義できません"]
};

// ---------- 共通ユーティリティ ----------
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function show(id, display) {
    document.getElementById(id).style.display = display;
}

function setResult(text) {
    document.getElementById("result").textContent = text;
}

// 全角数字・全角記号を半角に(数値入力用)
function normalizeNumberText(s) {
    return String(s)
        .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
        .replace(/[−ー―‐－]/g, "-")
        .replace(/＋/g, "+")
        .replace(/／/g, "/")
        .replace(/．/g, ".")
        .replace(/[，、]/g, ",")
        .replace(/　/g, " ")
        .trim();
}

// "3/5" や "0.6" を数値に。変換できなければ null
function tryParseNumber(s) {
    s = s.replace(/\s/g, "");
    if (/^[+-]?\d+(\.\d+)?$/.test(s)) return Number(s);
    const m = s.match(/^([+-]?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
    if (m && Number(m[2]) !== 0) return Number(m[1]) / Number(m[2]);
    return null;
}

function nearlyEqual(a, b) {
    return Math.abs(a - b) < 1e-9;
}

function randInt(n) {
    return Math.floor(Math.random() * n);
}

// ---------- 画面の切り替え ----------
function reset(resetmoed) {
    setResult("");
    questionCount = 1;
    if (resetmoed == 1) {
        answerlist = new Array(15).fill(0);
        answerstatistics = newStatistics();
        mistakeStats = newMistakeStats();
    }
}

function stratdisplay() {
    stopTimer();
    ["mode1", "mode2", "mode3", "mode4", "checkAnswer", "checkback", "answer", "memo", "analysis"]
        .forEach(id => show(id, "none"));
    show("menu", "block");
}

function openSubmenu(id) {
    ["mode1", "mode2", "mode3", "mode4", "checkAnswer", "checkback", "answer", "menu", "memo", "analysis"]
        .forEach(x => show(x, "none"));
    show(id, "block");
}

function checkstrat_mode1() { openSubmenu("mode1"); }
function checkstrat_mode2() { openSubmenu("mode2"); }
function checkstrat_mode3() { openSubmenu("mode3"); }
function checkstrat_mode4() { openSubmenu("mode4"); }

function analysisdisplay() {
    ["mode1", "mode2", "mode3", "mode4", "checkAnswer", "answer", "menu", "memo"]
        .forEach(id => show(id, "none"));
    show("checkback", "block");
    show("analysis", "block");
}

function questiondisplay() {
    ["mode1", "mode2", "mode3", "mode4", "menu", "analysis"].forEach(id => show(id, "none"));
    show("answer", "block");
    show("checkAnswer", "block");
    show("checkback", "block");
    show("memo", "block");
}

// ---------- 問題の作成 ----------
function makeQuestionB(randN) {
    const a = questioneaseB[randN][1];
    const x = questioneaseB[randN][2];
    const b = questioneaseB[randN][3];

    correctAnswer = questioneaseB[randN][0];

    mis(a + b + x, "x に傾きを掛けず、すべて足している（y=ax+b の a×x を計算していない）");
    mis(b + x, "傾き a を掛け忘れている");
    mis(a * (b + x), "切片 b にも傾きを掛けている（a(x+b) にしている）");
    mis(a * b, "傾きと切片を掛けている（x を使っていない）");
    mis(a * x - b, "切片 b の符号ミス");
    mis(Math.abs(a) * x + b, "傾き a の符号を落としている");
    const sign = b > -1 ? "+" : "";
    setResult("問題　" + questionCount +
        "　　一次関数y=" + a + "x" + sign + b + "において" + "x=" + x + "の時yの値を求めよ");
}

function makeQuestionC(randN) {
    const y = questioneaseB[randN][0];
    const a = questioneaseB[randN][1];
    const b = questioneaseB[randN][3];

    correctAnswer = questioneaseB[randN][2];

    mis((y + b) / a, "切片 b の移項で符号を変えていない（y−b ではなく y+b）");
    mis(y - b, "傾き a で割り忘れている");
    mis(a / (y - b), "割り算の分子と分母を逆にしている");
    mis((y - b) * a, "a で割らずに掛けている");
    const sign = b > -1 ? "+" : "";
    setResult("問題　" + questionCount +
        "　　一次関数y=" + a + "x" + sign + b + "において" + "y=" + y + "の時xの値を求めよ");
}

function makeQuestionD() {
    const base = randInt(10) + 1;
    const height = randInt(10) + 1;

    correctAnswer = base * height / 2;
    mis(base * height, "÷2 を忘れている（三角形の面積=底辺×高さ÷2）");
    mis(base + height, "底辺と高さを足している（掛け算にする）");

    setResult("底辺 " + base + "cm、高さ " + height + "cm の三角形の面積は？");

    document.getElementById("図形").innerHTML = `
    <svg width="300" height="200">
        <polygon points="50,150 250,150 150,50" fill="none" stroke="black" stroke-width="3" />
        <line x1="150" y1="50" x2="150" y2="150" stroke="black" stroke-width="3" />
        <text x="135" y="175" font-size="18">${base}cm</text>
        <text x="155" y="105" font-size="18">${height}cm</text>
    </svg>`;
}

function makeQuestionD2() {
    const base = randInt(6) + 4;
    const height = randInt(6) + 4;

    correctAnswer = base * height;
    mis((base + height) * 2, "周の長さと面積を混同している");
    mis(base * height / 2, "÷2 をつけている（三角形の公式と混同）");

    const cm = [base * 10, height * 10];

    setResult("底辺 " + base + "cm、高さ " + height + "cm の四角形の面積は？");

    document.getElementById("図形").innerHTML = `
    <svg width="300" height="200">
        <polygon points="50,50 ${50 + cm[0]},50 ${50 + cm[0]},${50 + cm[1]} 50,${50 + cm[1]}"
            fill="none" stroke="black" stroke-width="3" />
        <text x="${30 + cm[0] / 2}" y="${65 + cm[1]}" font-size="18">${base}cm</text>
        <text x="${60 + cm[0]}" y="${50 + cm[1] / 2}" font-size="18">${height}cm</text>
    </svg>`;
}

// 連立方程式
function leadCoef(n) {
    if (n === 1) return "";
    if (n === -1) return "-";
    return String(n);
}
function absCoef(n) {
    return Math.abs(n) === 1 ? "" : String(Math.abs(n));
}

function makeQuestionE(randN) {
    const row = questioneaseE[randN];
    const a = row[0], b = row[1], d = row[3], e = row[4];
    answerX = row[6];
    answerY = row[7];
    // 解から c, f を計算して、必ず式と答えが一致するようにする
    const c = a * answerX + b * answerY;
    const f = d * answerX + e * answerY;
    eq = [a, b, c, d, e, f];

    setResult("以下の一次連立方程式を解け（答えは「x y」の順にスペース区切り）\n" +
        leadCoef(a) + "x" + (b < 0 ? "-" : "+") + absCoef(b) + "y=" + c + "\n" +
        leadCoef(d) + "x" + (e < 0 ? "-" : "+") + absCoef(e) + "y=" + f);
}

// 三角比
function makeQuestionF(randN) {
    correctAnswer = questioneaseF[randN][1];
    if (parseExpr(correctAnswer)) setExpr(correctAnswer, false);
    if (randN === 0) { misExpr("4/5", "cosA と取り違えている（隣辺/斜辺）"); misExpr("3/4", "tanA と取り違えている（対辺/隣辺）"); } if (randN === 1) { misExpr("3/5", "sinA と取り違えている（対辺/斜辺）"); misExpr("3/4", "tanA と取り違えている（対辺/隣辺）"); } if (randN === 2) { misExpr("3/5", "sinA と取り違えている（対辺/斜辺）"); misExpr("4/5", "cosA と取り違えている（隣辺/斜辺）"); }
    setResult("問題　" + questionCount + "　　" + questioneaseF[randN][0] + (correctExpr ? exprNote : ""));
}

// ---------- 追加分の問題（数直線・ベクトル・二次関数・因数分解・展開・平方完成・集合と命題） ----------
function qHead() { return "問題" + questionCount + "　　"; }
function randRange(min, max) { return min + randInt(max - min + 1); }
function randNZ(min, max) { let n = 0; while (n === 0) n = randRange(min, max); return n; }
function pick(arr) { return arr[randInt(arr.length)]; }
function setPlaceholder(t) { document.getElementById("answer").placeholder = t; }
function setVecAnswer(arr, hint) { correctVec = arr; vecNames = hint.split(" "); setPlaceholder(hint); }

function constTerm(n) { return n === 0 ? "" : (n < 0 ? "-" : "+") + Math.abs(n); }
function linTerm(p) { return "x" + constTerm(p); }                       // x+p
function poly2(p, q) {                                                   // x²+px+q
    return "x²" + (p === 0 ? "" : (p < 0 ? "-" : "+") + absCoef(p) + "x") + constTerm(q);
}
function polyA(a, b, c) {                                                // ax²+bx+c
    return leadCoef(a) + "x²" + (b === 0 ? "" : (b < 0 ? "-" : "+") + absCoef(b) + "x") + constTerm(c);
}

// 数直線の図（-6〜6）
function drawNumberLine(points) {
    const step = 25, x0 = 30, y = 55;
    const px = v => x0 + (v + 6) * step;
    let svg = `<svg width="360" height="110"><line x1="15" y1="${y}" x2="345" y2="${y}" stroke="black" stroke-width="2" />`;
    for (let v = -6; v <= 6; v++) {
        svg += `<line x1="${px(v)}" y1="${y - 6}" x2="${px(v)}" y2="${y + 6}" stroke="black" stroke-width="2" />`;
        if (v % 5 === 0) {
            svg += `<text x="${px(v)}" y="${y + 26}" font-size="14" text-anchor="middle">${v}</text>`;
        }
    }
    points.forEach(pt => {
        svg += `<circle cx="${px(pt.v)}" cy="${y}" r="6" fill="black" />` +
               `<text x="${px(pt.v)}" y="${y - 14}" font-size="18" text-anchor="middle">${pt.name}</text>`;
    });
    document.getElementById("図形").innerHTML = svg + "</svg>";
}

// 7: 数直線
function makeQuestionNumberLine() {
    const kind = randInt(5);
    if (kind === 0) {
        const p = randRange(-6, 6);
        correctAnswer = p;
        drawNumberLine([{ name: "P", v: p }]);
        mis(-p, "符号が逆（0より左側は負の数）");
        setResult(qHead() + "数直線上の点Pの座標を答えよ");
    } else if (kind === 1) {
        const a = randRange(-6, 6);
        let b = randRange(-6, 6);
        while (b === a) b = randRange(-6, 6);
        correctAnswer = Math.abs(a - b);
        drawNumberLine([{ name: "A", v: a }, { name: "B", v: b }]);
        mis(a + b, "距離を「差」ではなく「和」にしている");
        setResult(qHead() + "数直線上の2点A、Bの距離を答えよ");
    } else if (kind === 2) {

const SUP = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "-": "⁻" };

function sub(n) { return String(n).split("").map(c => SUB[c] || c).join(""); }
function gcd(a, b) { return b === 0 ? Math.abs(a) : gcd(b, a % b); }
function perm(n, r) { let x = 1; for (let i = 0; i < r; i++) x *= (n - i); return x; }
function comb(n, r) { return perm(n, r) / perm(r, r); }
function rtTerm(k, s) { return (k === 1 ? "" : k) + "√" + s; }
function piFrac(n, d) { return (n === 1 ? "" : n) + "π" + (d === 1 ? "" : "/" + d); }
const VEC2 = "\n（答えは「%1 %2」の順にスペース区切り）";

// ---------- √・分数を含む答えの採点 ----------
const exprNote = "\n（√は「√」または「ルート」、分数は「/」で入力。例: 2√3、√3/2）";
function setExpr(str, strict) {
    correctAnswer = str;

}
function fr(n, d) {
    if (d === undefined) d = 1;
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d) || 1;
    return [n / g, d / g];
}
function frMul(a, b) { return fr(a[0] * b[0], a[1] * b[1]); }
function frAdd(a, b) { return fr(a[0] * b[1] + b[0] * a[1], a[1] * b[1]); }

// (n/d)√s を表す値
function V(n, d, s) { return { c: fr(n, d), s: s }; }
function vSimplifyRad(c, rad) {
    let k = 1;
    for (let i = Math.floor(Math.sqrt(rad)); i >= 1; i--) {
        if (rad % (i * i) === 0) { k = i; break; }
    }
    return { c: frMul(c, [k, 1]), s: rad / (k * k) };
}
function vMul(x, y) { return vSimplifyRad(frMul(x.c, y.c), x.s * y.s); }
function vDiv(x, y) {
    const inv = fr(y.c[1], y.c[0]);
    return vSimplifyRad(frMul(frMul(x.c, inv), [1, y.s]), x.s * y.s);
}
function vStr(v) {
    const n = v.c[0], d = v.c[1];

// 「2√3」「√3/2」「1/√3」のような1項を解析
function parseTermStr(t) {
    const toks = t.match(/\d+(?:\.\d+)?|√|\/|\*/g);
    if (!toks || toks.join("") !== t) return null;
    let coeff = [1, 1], rad = 1, op = "*", prevOp = true, clean = true, i = 0;
    while (i < toks.length) {
        const tk = toks[i];
        if (tk === "/" || tk === "*") {
            if (prevOp) return null;
            op = tk; prevOp = true; i++;
            continue;
        }
        if (tk === "√") {
            const nx = toks[i + 1];
            if (nx === undefined || !/^\d+$/.test(nx) || Number(nx) === 0) return null;
            const val = Number(nx);
            i += 2;
            if (op === "/") { coeff = frMul(coeff, [1, val]); clean = false; }   // 分母に√
            rad *= val;
        } else {
            i++;
            let f;
            if (tk.includes(".")) f = fr(Number(tk.replace(".", "")), Math.pow(10, tk.split(".")[1].length));
            else f = fr(Number(tk), 1);
            if (op === "/") {
                if (f[0] === 0) return null;
                coeff = frMul(coeff, [f[1], f[0]]);
            } else coeff = frMul(coeff, f);
        }
        op = "*"; prevOp = false;
    }
    if (prevOp) return null;
    const w = vSimplifyRad(coeff, rad);
    if (w.s !== rad) clean = false;                                            // √の中に平方数が残っている
    return { c: w.c, s: w.s, clean: clean };
}

function parseExpr(raw) {
    const str = normalizeExprText(raw);
    if (str === "" || /[()]/.test(str)) return null;
    const terms = str.match(/[+-]?[^+-]+/g);
    if (!terms || terms.join("") !== str) return null;
    const map = {};
    let clean = true;
    for (const term of terms) {
        const v = parseTermStr(term.replace(/^[+-]/, ""));
        if (!v) return null;
        if (!v.clean) clean = false;
        const c = term[0] === "-" ? [-v.c[0], v.c[1]] : v.c;
        map[v.s] = map[v.s] ? frAdd(map[v.s], c) : c;
    }
    Object.keys(map).forEach(k => { if (map[k][0] === 0) delete map[k]; });
    return { map: map, clean: clean };
}

function exprEqual(a, b) {
    const ka = Object.keys(a), kb = Object.keys(b);
    return ka.length === kb.length && ka.every(k => b[k] && a[k][0] === b[k][0] && a[k][1] === b[k][1]);
}

function judgeExpr(raw) {
    const u = parseExpr(raw), c = parseExpr(correctExpr);
    if (!u || !c) return false;
    if (exprStrict && !u.clean) return false;
    return exprEqual(u.map, c.map);
}

        setResult(qHead() + "直線 y=" + leadCoef(m) + "x" + constTerm(n) + " に平行で、点 " + pt(x0, y0) + " を通る直線の y 切片を求めよ");
    } else if (kind === 8) {
        let dx, dy;
        do { dx = randRange(1, 4); dy = randRange(1, 4); } while (Number.isInteger(Math.sqrt(dx * dx + dy * dy)));
        const x1 = randRange(-4, 4), y1 = randRange(-4, 4);
        setExpr(vStr(vSimplifyRad([1, 1], dx * dx + dy * dy)), true);
        misExpr(String(dx + dy), "2点間の距離を座標の差の和にしている"); misExpr(String(dx * dx + dy * dy), "√を取っていない（距離² を答えている）");
        setResult(qHead() + "2点 A" + pt(x1, y1) + "、B" + pt(x1 + dx * pick([1, -1]), y1 + dy * pick([1, -1])) +
            " の距離 AB を簡単な形で求めよ" + exprNote);
    } else {
        const ab = pick([[1, 1], [1, 2], [2, 1], [1, 3], [3, 1]]);
        const a = ab[0], b = ab[1] * pick([1, -1]), m = a * a + b * b;
        const t = randRange(1, 4), x0 = randRange(-4, 4), y0 = randRange(-4, 4);
        const c = pick([1, -1]) * t * m - a * x0 - b * y0;
        setExpr(vStr(V(t, 1, m)), true);
        misExpr(String(t * m), "公式の分母 √(a²+b²) で割っていない（分子をそのまま答えている）");
        setResult(qHead() + "点 " + pt(x0, y0) + " と直線 " + leadCoef(a) + "x" + (b < 0 ? "-" : "+") + absCoef(b) + "y" + constTerm(c) +
            "=0 の距離を簡単な形で求めよ（|ax₀+by₀+c|/√(a²+b²)）" + exprNote);
    }
}

// 28: 不等式
function makeQuestionIneq() {
    const kind = randInt(6);
    const absX = a => "|x" + constTerm(-a) + "|";
    if (kind === 0 || kind === 1) {
        let a, b, c, op, xs, cnt;
        const strict = Math.random() < 0.5;
        do {
            a = randRange(2, 5); b = randNZ(-6, 6); c = randRange(5, 20);
            xs = [];
            for (let x = -60; x <= 60; x++) {
                const v = a * x + b;
                if (strict ? v < c : v <= c) xs.push(x);
            }
            cnt = xs.filter(x => x >= 1).length;
        } while (kind === 0 && (cnt < 1 || cnt > 8));
        op = strict ? "<" : "≦";
        if (kind === 0) {
            correctAnswer = cnt;
            if (strict) mis(cnt + 1, "< のとき端の値は含まれないのに数えている（等号なし）"); else mis(cnt - 1, "≦ のとき端の値も含まれるのに数えていない（等号あり）");
            setResult(qHead() + a + "x" + constTerm(b) + op + c + " を満たす自然数 x は何個あるか");
        } else {
            correctAnswer = Math.max(...xs);
            if (strict) mis(Math.max(...xs) + 1, "< のとき端の値は含まれない（等号なし）");
            setResult(qHead() + a + "x" + constTerm(b) + op + c + " を満たす最大の整数 x を求めよ");
        }
    } else if (kind === 2) {
        const a = randRange(-4, 4), b = randRange(1, 6);
        setVecAnswer([a - b, a + b], "x₁ x₂");
        misVec([-b, b], "|x−a|=b を |x|=b と同じにしている（中心 a を忘れている）"); misVec([a - b, a + b].map(v => -v).sort((p1, p2) => p1 - p2), "a の符号が逆（x−a の a の扱いミス）");
        setResult(qHead() + absX(a) + "=" + b + " を解け\n（答えは小さい順に「x₁ x₂」とスペース区切り）");
    } else if (kind === 3) {
        const a = randRange(-4, 4), b = randRange(2, 6);
        const strict = Math.random() < 0.5;
        correctAnswer = strict ? 2 * b - 1 : 2 * b + 1;
        mis(strict ? 2 * b + 1 : 2 * b - 1, strict ? "< なのに端の値を含めている" : "≦ なのに端の値を含めていない"); mis(b, "片側だけ数えている（a の左右の両側を数える）");
        setResult(qHead() + absX(a) + (strict ? "<" : "≦") + b + " を満たす整数 x は何個あるか");
    } else {
        const r = randRange(-5, 3), s2 = r + randRange(2, 6);
        if (kind === 4) {
            setVecAnswer([r, s2], "α β");
            misVec([-s2, -r], "解の符号が逆（(x−α)(x−β)<0 の α, β）");
            setResult(qHead() + poly2(-(r + s2), r * s2) + "<0 の解は α<x<β である。α と β を求めよ\n（答えは「α β」の順にスペース区切り）");
        } else {
            const strict = Math.random() < 0.5;
            correctAnswer = strict ? s2 - r - 1 : s2 - r + 1;
            mis(strict ? s2 - r + 1 : s2 - r - 1, strict ? "< なのに端の値を含めている" : "≦ なのに端の値を含めていない"); mis(s2 - r, "端の値の数え方のミス（差ではなく個数を数える）");
            setResult(qHead() + poly2(-(r + s2), r * s2) + (strict ? "<0" : "≦0") + " を満たす整数 x は何個あるか");
        }
    }
}

// 29: 弧度法と三角関数
function makeQuestionRadian() {
    const kind = randInt(9);
    if (kind === 0) {
        const d = pick([2, 3, 4, 6]);
        correctAnswer = d;
        mis(180 / d, "度の値をそのまま答えている（180° = π）");
        setResult(qHead() + (180 / d) + "° をラジアンで表すと π/□ である。□ を求めよ");
    } else if (kind === 1) {
        const t = pick([[1, 6], [1, 4], [1, 3], [1, 2], [2, 3], [3, 4], [5, 6], [3, 2], [1, 1], [2, 1]]);
        correctAnswer = 180 * t[0] / t[1];
        mis(180 * t[1] / t[0], "分子と分母を逆にしている"); mis(360 * t[0] / t[1], "π=360° と取り違えている（π=180°）");
        setResult(qHead() + piFrac(t[0], t[1]) + " ラジアンは何度か");
    } else if (kind === 2) {
        const t = pick([["sin 180°", 0], ["cos 180°", -1], ["sin 270°", -1], ["cos 270°", 0], ["cos 360°", 1], ["sin 360°", 0],
            ["tan 135°", -1], ["tan 225°", 1], ["sin(-90°)", -1], ["cos(-180°)", -1], ["tan 180°", 0], ["sin 90°", 1]]);
        correctAnswer = t[1];
        setResult(qHead() + t[0] + " の値を求めよ");
    } else if (kind === 3) {
        const t = pick([["sin(π/2)", 1], ["cos π", -1], ["sin π", 0], ["sin(3π/2)", -1], ["cos 2π", 1], ["tan(π/4)", 1],
            ["tan(3π/4)", -1], ["cos(π/2)", 0], ["cos 0", 1], ["tan π", 0]]);
        correctAnswer = t[1];
        setResult(qHead() + t[0] + " の値を求めよ");
    } else if (kind === 4) {
        let r, n, d;
        do { r = randRange(2, 12); const t = pick([[1, 6], [1, 4], [1, 3], [1, 2], [2, 3], [3, 4], [5, 6]]); n = t[0]; d = t[1]; }
        while ((r * n) % d !== 0);
        correctAnswer = r * n / d;
        mis(r * r * n / (2 * d), "弧の長さと面積の公式を取り違えている（弧 l=rθ）");
        setResult(qHead() + "半径 " + r + "、中心角 " + piFrac(n, d) + " ラジアンのおうぎ形の弧の長さを求めよ（πの係数を答えよ）");
    } else if (kind === 5) {
        let r, n, d;
        do { r = randRange(2, 12); const t = pick([[1, 6], [1, 4], [1, 3], [1, 2], [2, 3], [3, 4], [5, 6]]); n = t[0]; d = t[1]; }
        while ((r * r * n) % (2 * d) !== 0);
        correctAnswer = r * r * n / (2 * d);
        mis(r * n / d, "面積と弧の長さの公式を取り違えている（S=1/2 r²θ）"); mis(r * r * n / d, "1/2 を忘れている（S=1/2 r²θ）");
        setResult(qHead() + "半径 " + r + "、中心角 " + piFrac(n, d) + " ラジアンのおうぎ形の面積を求めよ（πの係数を答えよ。S=1/2 r²θ）");
    } else if (kind === 6) {
        const k = randRange(2, 6);
        correctAnswer = k;
        mis(2 * k, "周期を π/k にしている（周期は 2π/k）"); mis(k / 2, "周期の公式で 2 を余計に掛けている");
        setResult(qHead() + "y=sin " + k + "x の周期は 2π/□ である。□ を求めよ");
    } else if (kind === 7) {
        const t = pick([[1, 6], [1, 4], [1, 3], [2, 3], [3, 4], [5, 6]]), fn = pick(["sin", "cos", "tan"]);
        setExpr(vStr(T[fn][180 * t[0] / t[1]]), false);
        setResult(qHead() + fn + "(" + piFrac(t[0], t[1]) + ") の値を求めよ" + exprNote);
    } else {
        const t = pick([[30, 1, 6], [45, 1, 4], [60, 1, 3]]), fn = pick(["sin", "cos", "tan"]);
        const v = T[fn][t[0]];
        setExpr(vStr(fn === "cos" ? v : V(-v.c[0], v.c[1], v.s)), false);
        misExpr(vStr(fn === "cos" ? V(-v.c[0], v.c[1], v.s) : v), "sin(−θ)=−sinθ、cos(−θ)=cosθ、tan(−θ)=−tanθ の扱いの取り違え");
        setResult(qHead() + fn + "(-" + piFrac(t[1], t[2]) + ") の値を求めよ" + exprNote);
    }
}

// ---------- メモ機能 ----------
const memoCanvas = document.getElementById("memoCanvas");
const memoCtx = memoCanvas.getContext("2d");
let memoDrawing = false;

function memoSetTool(tool) {
    memoCtx.globalCompositeOperation = tool === "eraser" ? "destination-out" : "source-over";
    memoCtx.lineWidth = tool === "eraser" ? 28 : 4;
    memoCtx.lineCap = "round";
    memoCtx.lineJoin = "round";
    memoCtx.strokeStyle = "#000";
    document.getElementById("memoBtnPen").classList.toggle("active", tool === "pen");
    document.getElementById("memoBtnEraser").classList.toggle("active", tool === "eraser");
}

function memoSwitch(mode) {
    const draw = mode === "draw";
    memoCanvas.style.display = draw ? "inline-block" : "none";
    document.getElementById("memoText").style.display = draw ? "none" : "inline-block";
    document.getElementById("memoTools").style.display = draw ? "inline" : "none";
    document.getElementById("memoBtnDraw").classList.toggle("active", draw);
    document.getElementById("memoBtnText").classList.toggle("active", !draw);
}

function memoClear() {
    memoCtx.clearRect(0, 0, memoCanvas.width, memoCanvas.height);
    document.getElementById("memoText").value = "";
}

function memoPos(e) {
    const r = memoCanvas.getBoundingClientRect();
    return {
        x: (e.clientX - r.left) * memoCanvas.width / r.width,
        y: (e.clientY - r.top) * memoCanvas.height / r.height
    };
}

memoCanvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    memoDrawing = true;
    if (memoCanvas.setPointerCapture) memoCanvas.setPointerCapture(e.pointerId);
    const p = memoPos(e);
    memoCtx.beginPath();
    memoCtx.moveTo(p.x, p.y);
    memoCtx.lineTo(p.x + 0.1, p.y + 0.1);
    memoCtx.stroke();
});
memoCanvas.addEventListener("pointermove", e => {
    if (!memoDrawing) return;
    e.preventDefault();
    const p = memoPos(e);
    memoCtx.lineTo(p.x, p.y);
    memoCtx.stroke();
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
    memoCanvas.addEventListener(ev, () => { memoDrawing = false; }));

memoSetTool("pen");
memoSwitch("draw");

// ---------- 基礎計算（整数）・タイムアタック ----------
// 30: 二桁の足し引き
function makeQuestionTwoDigitAddSub() {
    const add = Math.random() < 0.5;
    let A = randRange(10, 99), B = randRange(10, 99);
    if (Math.random() < 0.6) {                       // 繰り上がり・繰り下がりのある問題を多めに
        if (add) { while ((A % 10) + (B % 10) < 10) { A = randRange(10, 99); B = randRange(10, 99); } }
        else { while (A <= B || A % 10 >= B % 10) { A = randRange(10, 99); B = randRange(10, 99); } }
    } else if (!add && A < B) { const tmp = A; A = B; B = tmp; }
    const t1 = Math.floor(A / 10), o1 = A % 10, t2 = Math.floor(B / 10), o2 = B % 10;
    if (add) {
        correctAnswer = A + B;
        if (o1 + o2 >= 10) {
            mis(A + B - 10, "繰り上がりを忘れている（一の位が 10 以上のとき十の位に 1 を足す）");
            mis(Number(String(t1 + t2) + String(o1 + o2)), "一の位の和（10以上）をそのまま書いている（繰り上がりの処理ミス）");
        }
        mis(Math.abs(A - B), "足し算を引き算にしている");
        setResult(qHead() + A + " + " + B + " = ?");
    } else {
        correctAnswer = A - B;
        if (o1 < o2) {
            mis(correctAnswer + 10, "繰り下がりで十の位を 1 減らし忘れている");
            mis(10 * (t1 - t2) + (o2 - o1), "一の位で大きい数から小さい数を引いている（繰り下がりが必要）");
            mis(correctAnswer - 10, "繰り下がりで十の位を二重に減らしている");
        }
        mis(A + B, "引き算を足し算にしている");
        setResult(qHead() + A + " - " + B + " = ?");
    }
}

// 31: 九九
function makeQuestionTimesTable() {
    const A = randRange(2, 9), B = randRange(2, 9);
    if (Math.random() < 0.25) {
        correctAnswer = B;
        mis(A, "割る数をそのまま答えている");
        mis(A * B - A, "割り算を引き算にしている");
        mis(A + B, "割り算を足し算にしている");
        setResult(qHead() + (A * B) + " ÷ " + A + " = ?");
    } else {
        correctAnswer = A * B;
        mis(A * (B + 1), "九九の覚え違い（隣の答えを答えている）");
        mis(A * (B - 1), "九九の覚え違い（隣の答えを答えている）");
        mis((A + 1) * B, "九九の覚え違い（隣の段の答えを答えている）");
        mis((A - 1) * B, "九九の覚え違い（隣の段の答えを答えている）");
        mis(A + B, "かけ算を足し算にしている");
        setResult(qHead() + A + " × " + B + " = ?");
    }
}

// 32: 二桁のかけ割
function makeQuestionTwoDigitMulDiv() {
    const r = Math.random();
    if (r < 0.3) {
        const A = randRange(11, 99), B = randRange(2, 9);
        const t = Math.floor(A / 10), o = A % 10;
        correctAnswer = A * B;
        mis(10 * t * B + o, "一の位に掛けていない（十の位だけ掛けている）");
        if (o * B >= 10) mis(10 * t * B + (o * B) % 10, "一の位の掛け算の繰り上がりを足し忘れている");
        mis(A + B, "かけ算を足し算にしている");
        setResult(qHead() + A + " × " + B + " = ?");
    } else if (r < 0.55) {
        const A = randRange(11, 30), B = randRange(11, 30);
        const b1 = Math.floor(B / 10), b0 = B % 10;
        correctAnswer = A * B;
        mis(A * b1 + A * b0, "十の位の部分積を 10 倍していない（位取りのミス）");
        mis(A * b1 * 10, "一の位の部分積を足し忘れている");
        mis(A * b0, "十の位の掛け算を忘れている");
        setResult(qHead() + A + " × " + B + " = ?");
    } else if (r < 0.8) {
        const dv = randRange(2, 9);
        const q = randRange(Math.ceil(10 / dv), Math.floor(99 / dv));
        correctAnswer = q;
        mis(dv, "割る数を答えている");
        mis(q * 10, "桁がずれている（位取りのミス）");
        mis(dv * q - dv, "割り算を引き算にしている");
        setResult(qHead() + (dv * q) + " ÷ " + dv + " = ?");
    } else {
        const dv = randRange(11, 25), q = randRange(2, 9);
        correctAnswer = q;
        mis(dv, "割る数を答えている");
        mis(q * 10, "桁がずれている（位取りのミス）");
        mis(dv * q - dv, "割り算を引き算にしている");
        setResult(qHead() + (dv * q) + " ÷ " + dv + " = ?");
    }
}

// 33: 正負の2桁（タイムアタック用）
function makeQuestionSignedTwoDigit() {
    const sgn = () => (Math.random() < 0.5 ? 1 : -1);
    const f = n => "(" + n + ")";
    const r = Math.random();
    const A = sgn() * randRange(10, 99);
    if (r < 0.35) {
        const B = sgn() * randRange(10, 99);
        correctAnswer = A + B;
        mis(A - B, "足し算を引き算にしている（−( ) の扱いの取り違え）");
        if (A * B < 0) {
            mis(Math.abs(A) + Math.abs(B), "異符号の足し算で絶対値を足している（大きい方から小さい方を引く）");
            mis(-(Math.abs(A) + Math.abs(B)), "異符号の足し算で絶対値を足している（大きい方から小さい方を引く）");
        } else {
            mis(Math.abs(A + B), "共通の符号を付け忘れている");
        }
        mis(A + B + 10, "繰り上がり・繰り下がりのミス（10 のずれ）");
        mis(A + B - 10, "繰り上がり・繰り下がりのミス（10 のずれ）");
        setResult(qHead() + f(A) + " + " + f(B) + " = ?");
    } else if (r < 0.7) {
        const B = sgn() * randRange(10, 99);
        correctAnswer = A - B;
        mis(A + B, "引き算を足し算にしている（−(−B)=+B の処理ミス）");
        mis(B - A, "引く順番が逆（B−A を計算している）");
        mis(A - B + 10, "繰り上がり・繰り下がりのミス（10 のずれ）");
        mis(A - B - 10, "繰り上がり・繰り下がりのミス（10 のずれ）");
        setResult(qHead() + f(A) + " - " + f(B) + " = ?");
    } else if (r < 0.85) {
        const B = sgn() * randRange(2, 9);
        correctAnswer = A * B;
        mis(-correctAnswer, "かけ算の符号ミス（同符号→正、異符号→負）");
        mis(A + B, "かけ算を足し算にしている");
        setResult(qHead() + f(A) + " × " + f(B) + " = ?");
    } else {
        const dv = sgn() * randRange(2, 9), absDv = Math.abs(dv);
        const q = sgn() * randRange(Math.ceil(10 / absDv), Math.floor(99 / absDv));
        correctAnswer = q;
        mis(-q, "割り算の符号ミス（同符号→正、異符号→負）");
        mis(Math.abs(dv), "割る数を答えている");
        setResult(qHead() + f(dv * q) + " ÷ " + f(dv) + " = ?");
    }
}

// ---------- タイムアタック ----------
function fmtTime(sec) {
    const m = Math.floor(sec / 60);
    const rest = (sec - m * 60).toFixed(1);
    return m + ":" + (Number(rest) < 10 ? "0" : "") + rest;
}

function updateTimer() {
    const sec = (performance.now() - taStart) / 1000;
    document.getElementById("timer").textContent =
        "問題 " + questionCount + "/" + TA_COUNT + "　経過 " + fmtTime(sec) + (taFlash ? "　" + taFlash : "");
}
function startTimer() {
    stopTimer();
    taTimerId = setInterval(updateTimer, 100);
    show("timer", "block");
    updateTimer();
}
function stopTimer() {
    if (taTimerId !== null) clearInterval(taTimerId);
    taTimerId = null;
    show("timer", "none");
}

function startTimeAttack() {
    startSession(33, null, "text");
    show("memo", "none");              // タイムアタックはメモなし
    taLog = [];
    taCorrect = 0;
    taFlash = "";
    taStart = performance.now();
    startTimer();
    document.getElementById("answer").focus();
}

function timeAttackAnswer(raw) {
    answerstatistics[32][1] += 1;
    const qText = document.getElementById("result").textContent.replace(/^問題\d+　　/, "");
    const verdict = judgeAnswer(raw);
    if (verdict.correct) {
        taCorrect += 1;
        answerstatistics[32][0] += 1;
        taFlash = "前の問題: ○";
    } else {
        recordMistake(verdict.label);
        taLog.push({ q: qText, user: raw, correct: correctAnswer, label: verdict.label });
        taFlash = "前の問題: ×（正解は " + correctAnswer + "）";
    }
    if (questionCount >= TA_COUNT) {
        finishTimeAttack();
        return;
    }
    questionCount++;
    makeQuestion(33);
    updateTimer();
    document.getElementById("answer").focus();
}

function finishTimeAttack() {
    const sec = (performance.now() - taStart) / 1000;
    stopTimer();
    sessionId++;
    analysisdisplay();
    setResult("");
    const perfect = taCorrect === TA_COUNT;
    let newBest = false;
    if (perfect && (taBest === null || sec < taBest)) { taBest = sec; newBest = true; }

    let h = '<button onclick="startTimeAttack()">もう一度挑戦</button> <button onclick="checkback()">戻る</button>';
    h += "<h2>タイムアタック結果</h2><table>";
    h += '<tr><td class="u">タイム</td><td class="n">' + fmtTime(sec) + "</td></tr>";
    h += '<tr><td class="u">正解率</td><td class="n">' + taCorrect + "/" + TA_COUNT + "（" + Math.round(100 * taCorrect / TA_COUNT) + "%）</td></tr>";
    h += '<tr><td class="u">誤答数</td><td class="n">' + (TA_COUNT - taCorrect) + "</td></tr>";
    h += '<tr><td class="u">1問あたり</td><td class="n">' + (sec / TA_COUNT).toFixed(1) + "秒</td></tr>";
    if (taBest !== null) {
        h += '<tr><td class="u">ノーミスのベストタイム（このページを開いている間）</td><td class="n">' + fmtTime(taBest) + (newBest ? "　更新！" : "") + "</td></tr>";
    }
    h += "</table>";
    if (perfect) {
        h += '<p class="advice">ノーミスです。次は同じ正確さのまま、タイムを縮めましょう。</p>';
    } else if (taCorrect / TA_COUNT < 0.9) {
        h += '<p class="advice">まずは正確さを優先しましょう。正解率が 90% を超えてからタイムを縮めるのがおすすめです。</p>';
    } else {
        h += '<p class="advice">あと少しでノーミスです。間違えたところを確認しましょう。</p>';
    }
    if (taLog.length > 0) {
        h += "<h3>間違えた問題</h3><table>";
        taLog.forEach(e => {
            h += '<tr><td class="u">' + esc(e.q) + '<br><span class="sub">あなたの答え: ' + esc(e.user) + "　正解: " + esc(e.correct) +
                "　【" + esc(e.label) + "】</span></td></tr>";
        });
        h += "</table>";
    }
    document.getElementById("analysis").innerHTML = h;
}

// ---------- 間違え方の記録 ----------
function mis(value, label) { misList.push({ t: "n", v: value, label: label }); }
function misVec(arr, label) { misList.push({ t: "v", v: arr, label: label }); }
function misExpr(str, label) { misList.push({ t: "e", v: str, label: label }); }
function frStr(f) { return f[1] === 1 ? String(f[0]) : f[0] + "/" + f[1]; }
function evalMap(map) {
    return Object.keys(map).reduce((sum, k) => sum + map[k][0] / map[k][1] * Math.sqrt(Number(k)), 0);
}

// 問題文の sin/cos/tan と角度を読み取り、別の三角比の値を答えていないか調べる
function trigConfusion(val) {
    const q = document.getElementById("result").textContent;
    let fn = null, deg = null, m;
    if ((m = q.match(/(sin|cos|tan)\s*\(?\s*(-?\d+(?:\.\d+)?)°/))) {
        fn = m[1]; deg = Number(m[2]);
    } else if ((m = q.match(/(sin|cos|tan)\(\s*(-?)(\d*)π(?:\/(\d+))?\s*\)/))) {
        fn = m[1];
        deg = (m[2] ? -1 : 1) * 180 * (m[3] === "" ? 1 : Number(m[3])) / (m[4] ? Number(m[4]) : 1);
    } else if ((m = q.match(/(sin|cos|tan)\s+(\d*)π/))) {
        fn = m[1]; deg = 180 * (m[2] === "" ? 1 : Number(m[2]));
    } else if ((m = q.match(/(sin|cos|tan)\s+0(?!\d)/))) {
        fn = m[1]; deg = 0;
    }
    if (fn === null || Number.isNaN(val)) return null;
    for (const other of ["sin", "cos", "tan"]) {
        if (other === fn) continue;
        const v = Math[other](deg * Math.PI / 180);
        if (Math.abs(v) < 1e6 && Math.abs(v - val) < 1e-9) {
            return other + " の値を答えている（sin・cos・tan の取り違え）";
        }
    }
    return null;
}

// 数値の答えの間違え方
function diagnoseNumber(n) {
    if (Number.isNaN(n)) return "数として読み取れない入力（書き方の誤り）";
    const hit = misList.find(m => m.t === "n" && nearlyEqual(m.v, n));
    if (hit) return hit.label;
    const tc = trigConfusion(n);
    if (tc) return tc;
    const c = correctAnswer;
    if (typeof c === "number" && c !== 0) {
        if (nearlyEqual(n, -c)) return "符号の間違い（正負が逆になっている）";
        if (nearlyEqual(n, 2 * c)) return "2倍にしている（÷2 の忘れなど）";
        if (nearlyEqual(n * 2, c)) return "半分にしている（×2 の忘れなど）";
        if (nearlyEqual(n, 10 * c) || nearlyEqual(n * 10, c)) return "桁を間違えている";
    }
    if (typeof c === "number" && Math.abs(Math.abs(n - c) - 1) < 1e-9) return "±1 のずれ（数え方・端の扱いのミス）";
    return "その他の計算ミス";
}

// 複数の数で答える問題の間違え方
function diagnoseVec(raw) {
    const u = normalizeNumberText(raw).replace(/,/g, " ").split(/\s+/).map(Number);
    const cv = correctVec;
    const hit = misList.find(m => m.t === "v" && m.v.length === u.length && m.v.every((x, i) => nearlyEqual(x, u[i])));
    if (hit) return hit.label;
    if (u.length !== cv.length || u.some(Number.isNaN)) return "入力形式の誤り（個数・書き方を確認）";
    if (u.every((x, i) => nearlyEqual(x, -cv[i]))) return "すべての値の符号が逆になっている";
    if (cv.length === 2 && nearlyEqual(u[0], cv[1]) && nearlyEqual(u[1], cv[0])) {
        return "答える順序（" + (vecNames[0] || "1番目") + "と" + (vecNames[1] || "2番目") + "）を取り違えている";
    }
    const wrong = u.map((x, i) => nearlyEqual(x, cv[i]) ? -1 : i).filter(i => i >= 0);
    if (wrong.length === 1) {
        const i = wrong[0], nm = vecNames[i] || ((i + 1) + "番目の値");
        return nearlyEqual(u[i], -cv[i]) ? nm + "の符号が逆になっている" : nm + "の計算ミス（もう一方は合っている）";
    }
    return "複数の値が違う（解き方・公式の取り違えの可能性）";
}

// √や分数を含む答えの間違え方
function diagnoseExpr(raw) {
    const u = parseExpr(raw);
    if (!u) return "式として読み取れない入力（√ や / の書き方を確認）";
    const c = parseExpr(correctExpr);
    if (exprEqual(u.map, c.map)) {
        return exprStrict ? "値は合っているが、簡単な形（有理化・√の中を最小に）になっていない" : "答えの形が違う";
    }
    const hit = misList.find(m => {
        const pm = parseExpr(String(m.v));
        return pm && exprEqual(pm.map, u.map);
    });
    if (hit) return hit.label;
    const neg = {};
    Object.keys(c.map).forEach(k => { neg[k] = [-c.map[k][0], c.map[k][1]]; });
    if (exprEqual(neg, u.map)) return "符号の間違い（正負が逆になっている）";
    const un = evalMap(u.map), cn = evalMap(c.map);
    const tc = trigConfusion(un);
    if (tc) return tc;
    if (Math.abs(cn) > 1e-9 && Math.abs(un) > 1e-9) {
        if (Math.abs(un * cn - 1) < 1e-9) return "分子と分母を逆にしている（逆数を答えている）";
        if (Math.abs(un / cn - 2) < 1e-9) return "2倍にしている（÷2 の忘れなど）";
        if (Math.abs(un / cn - 0.5) < 1e-9) return "半分にしている（×2 の忘れなど）";
    }
    const uk = Object.keys(u.map), ck = Object.keys(c.map);
    if (uk.length === 1 && ck.length === 1) {
        if (uk[0] === "1" && ck[0] === "1") return "分数・数値の計算ミス";
        if (uk[0] === ck[0]) return "係数の計算ミス（√の中は合っている）";
        if (uk[0] === "1") return "√ を付け忘れている";
        if (ck[0] === "1") return "√ を付けすぎている";
        return "√の中の計算ミス（平方数のくくり出し・掛け算のミスなど）";
    }
    return "その他の計算ミス";
}

function diagnose(raw) {
    if (correctVec) return diagnoseVec(raw);
    if (correctExpr) return diagnoseExpr(raw);
    if (questionmode === 6) return "定義できる値として答えている（tan90° は cos90°=0 が分母になり定義できない）";
    return diagnoseNumber(Number(normalizeNumberText(raw)));
}

function recordMistake(label) {
    sessionMistakes[label] = (sessionMistakes[label] || 0) + 1;
    const ms = mistakeStats[questionmode - 1];
    ms[label] = (ms[label] || 0) + 1;
}

// ---------- 採点 ----------
// 数値回答
function judgeNumber(raw) {
    const n = Number(normalizeNumberText(raw));
    return nearlyEqual(n, correctAnswer);
}

// 三角比(定義できるかどうか等の文字の答え)
function judgeTrig(raw) {
    const user = raw.replace(/／/g, "/").replace(/[\s　]/g, "").replace(/[０-９]/g, c =>
        String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
    const accepted = [correctAnswer].concat(alternativeAnswersF[correctAnswer] || []);
    return accepted.includes(user);
}

// 連立方程式の誤り分類
function judgeSimultaneous(ux, uy) {
    const [a, b, c, d, e, f] = eq;
    const xOk = nearlyEqual(ux, answerX);
    const yOk = nearlyEqual(uy, answerY);
    if (xOk && yOk) return null;

    const xNeg = nearlyEqual(ux, -answerX);
    const yNeg = nearlyEqual(uy, -answerY);

    if (xNeg && yNeg) return [4, "xとyの正負を間違えている可能性があります"];
    if (xNeg && yOk)  return [5, "xの正負を間違えている可能性があります"];
    if (xOk && yNeg)  return [6, "yの正負を間違えている可能性があります"];
    if (yOk)          return [2, "xの計算を間違えている可能性があります"];
    if (xOk)          return [3, "yの計算を間違えている可能性があります"];

    const eq1Ok = nearlyEqual(a * ux + b * uy, c);
    const eq2Ok = nearlyEqual(d * ux + e * uy, f);
    if (!eq1Ok && eq2Ok) return [7, "1つ目の式の計算を間違えている可能性があります"];
    if (eq1Ok && !eq2Ok) return [8, "2つ目の式の計算を間違えている可能性があります"];
    if (!eq1Ok && !eq2Ok) return [9, "計算方法を間違えている可能性があります"];
    return [10, "その他の間違いの可能性があります"];
}

// 複数の数で答える問題（ベクトル・因数分解など）
function judgeVector(raw) {
    const parts = normalizeNumberText(raw).replace(/,/g, " ").split(/\s+/).map(Number);
    return parts.length === correctVec.length && correctVec.every((v, i) => nearlyEqual(parts[i], v));
}

function judgeAnswer(raw) {
    let correct, label = null;
    if (questionmode === 5) {
        const parts = normalizeNumberText(raw).replace(/,/g, " ").split(/\s+/);
        const verdict = judgeSimultaneous(Number(parts[0]), Number(parts[1]));
        correct = verdict === null;
        if (!correct) label = verdict[1];
    } else if (correctVec) correct = judgeVector(raw);
    else if (correctExpr) correct = judgeExpr(raw);
    else if (questionmode === 6) correct = judgeTrig(raw);
    else correct = judgeNumber(raw);

    if (correct) return { correct: true };
    if (label === null) label = diagnose(raw);
    return { correct: false, label: label };
}

function isValidInput(raw) {
    if (raw === "") return false;
    const need = questionmode === 5 ? 2 : (correctVec ? correctVec.length : 0);
    if (need > 0) {
        const parts = normalizeNumberText(raw).replace(/,/g, " ").split(/\s+/);
        if (parts.length !== need || parts.some(p => p === "" || Number.isNaN(Number(p)))) {
            alert(need + "つの数をスペースで区切って入力してください（例: 2 3）");
            return false;
        }
    }
    return true;
}

function showSummary() {
    let t = "終了！\n　正解数_" + answerlist[0] + "\n　不正解数_" + answerlist[1];
    const entries = Object.keys(sessionMistakes).map(k => [k, sessionMistakes[k]]).sort((a, b) => b[1] - a[1]);
    if (entries.length === 0) {
        t += "\n　全問正解！";
    } else {
        t += "\n\n　今回の間違え方";
        entries.forEach(e => { t += "\n　・" + e[0] + " ×" + e[1]; });
    }
    setResult(t);
}

// 回答ボタン
async function checkAnswer() {
    if (answerCount !== 0) return;

    const raw = document.getElementById("answer").value.trim();
    if (!isValidInput(raw)) return;
    if (questionmode === 33) { timeAttackAnswer(raw); return; }

    answerCount = 1;
    const mySession = sessionId;
    answerstatistics[questionmode - 1][1] += 1;

    const verdict = judgeAnswer(raw);
    let waitTime = 1000;
    if (verdict.correct) {
        setResult("正解！");
        answerlist[0] += 1;
        answerstatistics[questionmode - 1][0] += 1;
    } else {
        answerlist[1] += 1;
        recordMistake(verdict.label);
        const correctText = questionmode === 5
            ? "X=" + answerX + " Y=" + answerY
            : (correctVec ? correctVec.join(" ") : correctAnswer);
        setResult("不正解　正解は" + correctText + "\n【間違え方】" + verdict.label);
        waitTime = 3500;
    }

    await sleep(waitTime);
    if (mySession !== sessionId) return;

    if (questionCount === 5) {
        document.getElementById("図形").innerHTML = "";
        showSummary();
        return;
    }

    setResult("次の問題まで 2");
    await sleep(1000);
    if (mySession !== sessionId) return;

    setResult("次の問題まで 1");
    await sleep(1000);
    if (mySession !== sessionId) return;

    document.getElementById("図形").innerHTML = "";
    questionCount++;
    makeQuestion(questionmode);
    answerCount = 0;
}

function classifyMistake(label) {

    return "その他の計算ミス";
}

function esc(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function pct(c, t) { return t === 0 ? "―" : Math.round(100 * c / t) + "%"; }
function topMistakes(mode, n) {
    const ms = mistakeStats[mode - 1];
    return Object.keys(ms).map(k => [k, ms[k]]).sort((a, b) => b[1] - a[1]).slice(0, n);
}

function tendencyHtml() {
    const cats = {}, all = {};
    let total = 0;
    for (let m = 1; m <= MODE_COUNT; m++) {
        const ms = mistakeStats[m - 1];
        Object.keys(ms).forEach(label => {
            const c = ms[label], cat = classifyMistake(label);
            cats[cat] = (cats[cat] || 0) + c;
            total += c;
            if (!all[label]) all[label] = { count: 0, units: [] };
            all[label].count += c;
            if (!all[label].units.includes(UNIT_NAMES[m])) all[label].units.push(UNIT_NAMES[m]);
        });
    }
    let h = "<h2>間違え方の傾向</h2>";
    if (total === 0) return h + "<p>まだ間違いの記録がありません。</p>";

    const catList = Object.keys(cats).map(k => [k, cats[k]]).sort((a, b) => b[1] - a[1]);
    h += "<h3>種類別（全部で " + total + " 回）</h3><table>";
    catList.forEach(e => {
        h += '<tr><td class="u">' + esc(e[0]) + '</td><td class="n">' + e[1] + "回</td><td class=\"n\">" +
            Math.round(100 * e[1] / total) + "%</td></tr>";
    });
    h += "</table>";
    h += '<p class="advice">いちばん多いのは「' + esc(catList[0][0]) + "」です。" + esc(ADVICE[catList[0][0]]) + "</p>";

    const top = Object.keys(all).map(k => [k, all[k]]).sort((a, b) => b[1].count - a[1].count).slice(0, 5);
    h += "<h3>よくある間違い TOP" + top.length + "</h3><table>";
    top.forEach(e => {
        h += '<tr><td class="u">' + esc(e[0]) + '<br><span class="sub">' + esc(e[1].units.join("、")) +
            '</span></td><td class="n">' + e[1].count + "回</td></tr>";
    });
    h += "</table>";

    const weak = [];
    for (let m = 1; m <= MODE_COUNT; m++) {
        const st = answerstatistics[m - 1];
        if (st[1] >= 3 && st[0] / st[1] < 0.7) weak.push([m, st[0], st[1]]);
    }
    weak.sort((a, b) => a[1] / a[2] - b[1] / b[2]);
    h += "<h3>苦手な単元（3問以上回答・正解率70%未満）</h3>";
    if (weak.length === 0) h += "<p>該当する単元はありません。</p>";
    else {
        h += "<table>";
        weak.forEach(w => {
            h += '<tr><td class="u">' + UNIT_NAMES[w[0]] + '</td><td class="n">' + w[1] + "/" + w[2] +
                '</td><td class="n">' + pct(w[1], w[2]) + "</td></tr>";
        });
        h += "</table>";
    }
    return h;
}

function checkanalysis() {
    analysisdisplay();
    setResult("");
    let totC = 0, totT = 0;
    answerstatistics.forEach(st => { totC += st[0]; totT += st[1]; });

    let h = '<button onclick="checkback()">戻る</button>';
    h += "<h2>全体の正解率　" + totC + "/" + totT + "（" + pct(totC, totT) + "）</h2>";
    h += "<h2>単元別の正解率と間違え方</h2>";
    CATEGORIES.forEach(cat => {
        let cc = 0, ct = 0;
        cat.modes.forEach(m => { cc += answerstatistics[m - 1][0]; ct += answerstatistics[m - 1][1]; });
        h += "<h3>" + cat.name + "　" + cc + "/" + ct + "（" + pct(cc, ct) + "）</h3><table>";
        cat.modes.forEach(m => {
            const c = answerstatistics[m - 1][0], t = answerstatistics[m - 1][1];
            h += '<tr><td class="u">' + UNIT_NAMES[m] + '</td><td class="n">' + c + "/" + t +
                '</td><td class="n">' + pct(c, t) + "</td></tr>";
            topMistakes(m, 3).forEach(e => {
                h += '<tr><td class="mis" colspan="3">└ ' + esc(e[0]) + "　×" + e[1] + "</td></tr>";
            });
        });
        h += "</table>";
    });
    h += tendencyHtml();
    document.getElementById("analysis").innerHTML = h;
}

// ---------- 戻る・リセット ----------
function goBackToMenu() {
    sessionId++;               // 進行中のカウントダウンを無効にする
    reset(0);
    stratdisplay();
    answerCount = 0;
    setResult("");
    document.getElementById("図形").innerHTML = "";
}

function checkback()  { goBackToMenu(); }
function checkback2() { goBackToMenu(); }

function checkreset() {
    reset(1);
    setResult("回答分析をリセットしました");
}

// Enterキーで回答
document.getElementById("answer").addEventListener("keydown", e => {
    if (e.key === "Enter") checkAnswer();
});

// 最初の画面
stratdisplay();
