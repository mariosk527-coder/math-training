<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>総合学習ナビ - 小中高大5教科対応ブラウザ学習システム</title>
<meta name="description" content="小学校から大学・高校まで対応した数学・国語・英語・理科・社会の全199単元を網羅する総合学習プラットフォーム。段階別ステップ学習と単元まとめテストを搭載。">
<meta property="og:title" content="総合学習ナビ - 小中高大5教科対応ブラウザ学習システム">
<meta property="og:description" content="小学校から大学・高校まで対応した数学・国語・英語・理科・社会の全199単元を網羅する総合学習プラットフォーム。段階別ステップ学習と単元まとめテストを搭載。">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
:root {
  --appH: 100dvh;
  --theme-math: #2563eb;
  --theme-jp: #dc2626;
  --theme-en: #0d9488;
  --theme-sci: #16a34a;
  --theme-soc: #d97706;
  --theme-info: #7c3aed;
  --primary: var(--theme-math);
  --bg-page: #ffffff;
  --card-bg: #ffffff;
  --border-color: #f1f5f9;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg-page); color: #0f172a; }
body {
  text-align: center; -webkit-text-size-adjust: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
  user-select: none; min-height: var(--appH);
}

/* 固定トップバー（完全ミニマル） */
#topBar {
  position: fixed; top: 0; left: 0; right: 0; height: calc(44px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top); background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px);
  border-bottom: 1px solid #f1f5f9; z-index: 100;
  display: flex; align-items: center; justify-content: space-between; padding-left: 14px; padding-right: 14px;
}
.headerBtn {
  height: 28px; padding: 0 10px; font-size: 12px; font-weight: 500; border-radius: 5px;
  border: 1px solid #e2e8f0; background: #ffffff; color: #475569; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px; transition: all .1s ease;
}
.headerBtn:active { background: #f8fafc; }
#topBack { background: #ffffff; border-color: #cbd5e1; color: #0f172a; font-weight: 600; display: none; }
#appLogo { font-weight: 700; font-size: 14px; color: #0f172a; display: flex; align-items: center; gap: 6px; cursor: pointer; }
#curSubjectBadge { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 3px; color: #fff; background: var(--primary); }
#rubyBtn.on { background: #0f172a; color: #fff; border-color: #0f172a; }

#app {
  max-width: 860px; margin: 0 auto;
  padding: calc(48px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
}

/* ルビ */
rt { font-size: 0.52em; font-weight: normal; color: #94a3b8; user-select: none; }
button rt { color: inherit; }
body.ruby { line-height: 2.15; }
body.ruby #result, body.ruby #explain, body.ruby #passageBox { line-height: 2.2; }

/* 科目タブ（アンダーライン形式のすっきりナビ） */
#subjectNav {
  display: flex; gap: 2px; margin: 4px 0 10px; overflow-x: auto; padding: 2px 0;
  border-bottom: 1px solid #f1f5f9; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
#subjectNav::-webkit-scrollbar { display: none; }
.subTabBtn {
  flex: 1 0 auto; height: 36px; padding: 0 14px; font-size: 13.5px; font-weight: 500;
  border: none; background: transparent; color: #64748b; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
  border-bottom: 2px solid transparent; transition: all .12s ease;
}
.subTabBtn:hover { color: #0f172a; }
.subTabBtn.active {
  color: #0f172a; font-weight: 700; border-bottom: 2px solid var(--primary); background: transparent !important;
}

/* 学校段階別フィルター（テキストリンク風） */
#schoolControlBar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px;
  margin: 6px 0 12px; padding: 2px 0 8px;
}
.schoolFilterGroup { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
.schoolFilterBtn {
  font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 4px;
  border: none; background: transparent; color: #64748b; cursor: pointer;
  transition: all .1s ease;
}
.schoolFilterBtn:hover { color: #0f172a; background: #f8fafc; }
.schoolFilterBtn.active { color: #0f172a; background: #f1f5f9; font-weight: 700; }
.schoolToggleAllGroup { display: flex; gap: 4px; }
.toggleAllBtn {
  font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 3px;
  border: 1px solid #f1f5f9; background: #ffffff; color: #94a3b8; cursor: pointer;
}
.toggleAllBtn:hover { color: #475569; border-color: #cbd5e1; }

/* ---- 学校別アコーディオン・セクション（区切り線ベースの超シンプルUI） ---- */
.menuPane { display: none; text-align: left; }
.menuPane.active { display: block; }

.schoolAccordion {
  border-bottom: 1px solid #f1f5f9; margin-bottom: 4px;
}
.schoolAccordion.hidden { display: none !important; }

.schoolHeader {
  width: 100%; padding: 10px 4px; background: transparent; border: none;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; text-align: left; transition: opacity .1s ease;
}
.schoolHeader:hover { opacity: 0.75; }

.schoolTitleLeft { display: flex; align-items: center; gap: 8px; }
.schoolTitleText { font-size: 13.5px; font-weight: 600; color: #0f172a; }
.schoolCountBadge {
  font-size: 11px; font-weight: 500; color: #94a3b8;
}

.schoolChevron {
  font-size: 10px; color: #94a3b8; transition: transform .15s ease;
}
.schoolAccordion.open .schoolChevron { transform: rotate(180deg); }

.schoolBody {
  display: none; padding: 6px 0 14px;
}
.schoolAccordion.open .schoolBody { display: block; }

.menuGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px; }
.menuBtn {
  min-height: 36px; padding: 6px 10px; font-size: 13px; font-weight: 500; border-radius: 6px;
  border: 1px solid #f1f5f9; background: #fafafa; color: #334155; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 6px; text-align: left;
  transition: all .1s ease;
}
.menuBtn:hover { background: #f1f5f9; border-color: #e2e8f0; color: #0f172a; }
.menuBtn:active { background: #e2e8f0; }
.menuBtn .btnLabel { display: flex; align-items: center; }
.menuBtn .btnBadge { font-size: 10.5px; font-weight: 400; color: #94a3b8; white-space: nowrap; }

/* 共通ツールバー（フッターリンク風） */
#globalTools {
  margin-top: 24px; padding-top: 12px; border-top: 1px solid #f1f5f9;
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
}
.toolBtn {
  height: 30px; padding: 0 10px; font-size: 12px; font-weight: 500; border-radius: 4px;
  border: 1px solid #f1f5f9; background: #ffffff; color: #64748b; cursor: pointer;
}
.toolBtn:hover { background: #f8fafc; color: #0f172a; border-color: #e2e8f0; }
.toolBtn:active { background: #f1f5f9; }

/* ---- サブメニュー（単元の段階別学習メニュー） ---- */
#unitSubMenu {
  display: none; text-align: left; background: #ffffff; border: 1px solid var(--border-color);
  border-radius: 12px; padding: 16px; margin-bottom: 16px;
}
#subUnitHeader {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
  padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
}
#subUnitTitle { font-size: 17px; font-weight: 700; color: #0f172a; margin: 0; }
#subUnitDesc { font-size: 13px; color: #64748b; line-height: 1.5; margin: 0 0 14px; }

.subStepGrid { display: flex; flex-direction: column; gap: 8px; }
.subStepCard {
  padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color); background: #ffffff;
  cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  transition: all .1s ease;
}
.subStepCard:active { transform: scale(0.99); background: #f8fafc; }
.subStepCard.stepFinal {
  border-color: #cbd5e1; background: #fafafa;
}
.subStepCard .stepLeft { display: flex; align-items: center; gap: 10px; }
.subStepIcon {
  width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff; background: var(--primary); shrink: 0;
}
.subStepCard.stepFinal .subStepIcon { background: #f59e0b; }
.subStepInfo h4 { margin: 0 0 2px; font-size: 14.5px; font-weight: 600; color: #0f172a; }
.subStepInfo p { margin: 0; font-size: 12px; color: #64748b; }
.subStepBadge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: #f1f5f9; color: #475569; white-space: nowrap; }

/* ---- 出題画面（スマホ最適化） ---- */
body.quiz { height: var(--appH); overflow: hidden; }
body.quiz #app {
  height: 100%; display: flex; flex-direction: column; gap: 6px;
  padding: calc(52px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));
}
#quizCard {
  background: #ffffff; border: 1px solid var(--border-color); border-radius: 10px;
  padding: 12px 14px; text-align: left;
  display: flex; flex-direction: column; gap: 6px; flex: 0 1 auto; max-height: 38vh; overflow-y: auto;
}
#quizMetaRow { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: #64748b; }
#result { margin: 0; font-size: clamp(15px, 4.2vw, 20px); line-height: 1.55; color: #0f172a; font-weight: 600; white-space: pre-line; }

/* パッセージ（文章題）ボックス */
#passageBox {
  display: none; background: #ffffff; border: 1px solid var(--border-color); border-radius: 10px;
  padding: 12px 14px; text-align: left; font-size: clamp(14px, 3.8vw, 15.5px); line-height: 1.75;
  max-height: 28vh; overflow-y: auto; white-space: pre-line;
}
#passageHeader { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 13.5px; color: var(--primary); margin-bottom: 6px; }

/* 選択肢ボタン */
#choicesArea { display: none; flex-direction: column; gap: 6px; margin: 4px 0; }
.choiceOptionBtn {
  min-height: 44px; padding: 8px 12px; font-size: 14.5px; font-weight: 600; text-align: left;
  border-radius: 8px; border: 1px solid var(--border-color); background: #ffffff; color: #1e293b;
  cursor: pointer; display: flex; align-items: center; gap: 8px;
}
.choiceOptionBtn:active { background: #f8fafc; border-color: #94a3b8; }
.choiceOptionBtn .optNum {
  display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
  border-radius: 50%; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; shrink: 0;
}

/* ワークスペース */
#workspace { display: none; }
body.quiz #workspace { display: flex; flex: 1 1 0; min-height: 0; flex-direction: column; gap: 6px; }

#explain {
  display: none; flex: 1 1 0; min-height: 0; overflow-y: auto; text-align: left; white-space: pre-line;
  background: #ffffff; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 14px;
  font-size: clamp(13.5px, 3.6vw, 15px); line-height: 1.65;
}
#explain .step { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 10px; margin: 5px 0; }
#explain .step .badge { display: inline-block; background: var(--primary); color: #fff; border-radius: 4px; font-size: 10.5px; font-weight: 700; padding: 1px 6px; margin-right: 6px; }
#explain .step.ans { background: #f0fdf4; border-color: #bbf7d0; }
#explain .step.ans .badge { background: #16a34a; }

/* メモ欄 */
#memoToggleBar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: #64748b; padding: 2px 4px; }
#memoToggleBtn { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border-color); background: #ffffff; color: #475569; cursor: pointer; }
#memoArea { display: flex; flex-direction: column; flex: 1 1 0; min-height: 60px; gap: 4px; }
#memoArea.collapsed { display: flex; flex: 0 0 auto; min-height: 0; gap: 0; }
#memoArea.collapsed #memoCanvas,
#memoArea.collapsed #memoText { display: none !important; }
#memoArea.collapsed #memoBtnDraw,
#memoArea.collapsed #memoBtnText,
#memoArea.collapsed #memoBtnPen,
#memoArea.collapsed #memoBtnEraser,
#memoArea.collapsed #memoTools > button:not(#memoToggleBtn) { display: none; }
#memoTools { display: flex; gap: 4px; align-items: center; }
#memoTools button { font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-color); background: #ffffff; cursor: pointer; }
#memoTools button.active { background: #e0e7ff; border-color: #6366f1; color: #4338ca; }
#memoCanvas { flex: 1 1 0; min-height: 0; width: 100%; border: 1.5px dashed #16a34a; border-radius: 10px; background: #ffffff; touch-action: none; display: block; }
#memoText { display: none; flex: 1 1 0; min-height: 0; width: 100%; resize: none; font-size: 16px; border: 1.5px dashed #16a34a; border-radius: 10px; padding: 8px; font-family: inherit; }

/* 入力欄 */
#answerRow { display: none; flex: 0 0 auto; margin-top: 2px; }
#answer {
  display: block; margin: 2px auto 4px; font-size: 20px; font-weight: 700; width: min(94%, 380px); height: 44px;
  text-align: center; border: 1.5px solid var(--primary); border-radius: 8px; font-family: inherit; outline: none; background: #ffffff;
}

#symbols { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; max-height: 70px; overflow-y: auto; }
#symbols button {
  min-width: 38px; height: 34px; font-size: 15px; font-weight: 600; padding: 0 8px; border-radius: 6px;
  border: 1px solid var(--border-color); background: #ffffff; color: #1e293b; cursor: pointer;
}

/* ヒントボックス */
#hintBox {
  display: none; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px;
  padding: 10px 12px; margin: 6px 0 2px; font-size: 13px; color: #92400e; text-align: left; line-height: 1.6;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}
#hintBox strong { font-weight: 700; color: #b45309; }
.hintHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.hintCloseBtn { background: none; border: none; font-size: 12px; color: #b45309; cursor: pointer; text-decoration: underline; padding: 0; }
.hintInlineBtn {
  font-size: 11.5px; font-weight: 600; color: #b45309; background: #fef3c7; border: 1px solid #fde68a;
  border-radius: 4px; padding: 2px 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px;
}
.hintInlineBtn:hover { background: #fde68a; }

/* 操作ボタン */
#buttons { display: flex; gap: 6px; justify-content: center; flex: 0 0 auto; margin-top: 6px; }
.actionBtn {
  flex: 1 1 0; max-width: 140px; min-height: 42px; font-size: 14px; font-weight: 600;
  border-radius: 8px; border: 1px solid var(--border-color); background: #ffffff; color: #334155; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
}
.actionBtn:active { transform: scale(0.98); }
#btnHint { max-width: 95px; color: #b45309; border-color: #fde68a; background: #fffbeb; }
#btnHint:active { background: #fef3c7; }
#checkAnswer { flex: 2 1 0 !important; max-width: 240px !important; background: var(--primary) !important; color: #ffffff !important; border-color: var(--primary) !important; font-weight: 700; }
#checkback { background: #fafafa; border-color: #e2e8f0; color: #475569; }

/* ランダムテストボタン */
.randomTestBar {
  display: flex; gap: 8px; margin: 4px 0 10px;
}
.randomTestBtn {
  flex: 1; height: 34px; font-size: 12.5px; font-weight: 600; border-radius: 6px;
  border: 1px dashed var(--primary); background: #f8fafc; color: var(--primary);
  display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  transition: all .1s ease;
}
.randomTestBtn:hover { background: #eff6ff; }
.schoolTestLabel { font-size: 12px; font-weight: 700; color: #475569; align-self: center; white-space: nowrap; }
.studySettingsPanel { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; padding: 7px 9px; border: 1px solid #e2e8f0; border-radius: 7px; background: #f8fafc; font-size: 12px; color: #475569; }
.studySettingsPanel select, .studySettingsPanel input { height: 28px; width: 64px; border: 1px solid #cbd5e1; border-radius: 5px; background: #fff; padding: 0 6px; box-sizing: border-box; }
#questionCountHelp { color: #94a3b8; font-size: 11px; }
.mathFormulaAction { margin: 8px 0; }
.mathFormulaPanel { margin: 8px 0 14px; padding: 12px 14px; border: 1px solid #bfdbfe; border-radius: 9px; background: #eff6ff; color: #1e3a8a; line-height: 1.7; }
.mathFormulaPanel h3 { margin: 0 0 6px; font-size: 15px; }
.mathFormulaPanel p { margin: 0; white-space: normal; }

/* 横画面対応 */
@media (min-width: 768px) and (min-aspect-ratio: 5/4) {
  body.quiz #workspace { flex-direction: row; }
  body.quiz #passageBox { flex: 1 1 48%; max-height: none; }
  body.quiz #memoArea, body.quiz #explain { flex: 1 1 52%; }
}

/* ノート画面 */
#notes { display: none; }
body.notes { height: var(--appH); overflow: hidden; }
body.notes #app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: calc(56px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom)); }
body.notes #notes { display: grid; flex: 1 1 0; min-height: 0; gap: 8px; text-align: left; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; }
#noticePanel { margin: 8px 0; padding: 10px 12px; border: 1px solid #fbbf24; border-radius: 8px; background: #fffbeb; color: #78350f; font-size: 12px; line-height: 1.7; text-align: left; }
#noticePanel { display: block; }
#notesMain { grid-row: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
#notesBar { display: flex; gap: 6px; align-items: center; }
#noteSelect { flex: 1 1 auto; height: 40px; font-size: 15px; border-radius: 8px; border: 1px solid var(--border-color); padding: 0 10px; background: #fff; }
#noteText { flex: 1 1 0; min-height: 0; width: 100%; resize: none; font-size: 17px; line-height: 1.5; border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 10px; outline: none; font-family: inherit; }
#palette { grid-row: 2; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
#palTabs { display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; padding-bottom: 2px; }
#palTabs button { flex: 0 0 auto; height: 34px; font-size: 13px; font-weight: 700; padding: 0 12px; border-radius: 17px; border: 1px solid var(--border-color); background: #ffffff; cursor: pointer; }
#palTabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
#palKeys { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; max-height: 24vh; overflow-y: auto; }
#palKeys button { min-width: 40px; height: 38px; font-size: 17px; font-weight: 600; padding: 0 6px; border-radius: 8px; border: 1px solid var(--border-color); background: #ffffff; cursor: pointer; }
#notesBottom { grid-row: 3; display: flex; gap: 8px; justify-content: center; align-items: center; }

/* 成績分析・回答分析ダッシュボード */
#analysis { display: none; max-width: 720px; margin: 6px auto 30px; text-align: left; font-size: 14px; padding: 0 8px; }
.anaHeader { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.anaTitle { font-size: 18px; font-weight: 700; color: #0f172a; margin: 0; }
.anaOverviewGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 16px; }
.anaCard { background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; text-align: center; }
.anaCard .lbl { font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
.anaCard .val { font-size: 20px; font-weight: 800; color: #0f172a; }
.anaCard .sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }

.anaSection { background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.anaSecTitle { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }

.subProgItem { margin-bottom: 10px; }
.subProgMeta { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; color: #334155; margin-bottom: 4px; }
.progTrack { height: 8px; background: #f1f5f9; border-radius: 4px; overflow: hidden; position: relative; }
.progFill { height: 100%; border-radius: 4px; transition: width .3s ease; }

.focusList { display: flex; flex-direction: column; gap: 6px; }
.focusItem { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 6px; background: #fafafa; border: 1px solid #f1f5f9; font-size: 13px; }
.focusItem.bad { background: #fff7ed; border-color: #ffedd5; }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function gcdInt(x, y) { return y === 0 ? Math.abs(x) : gcdInt(y, x % y); }
  function fracStr(n, d) { const g = gcdInt(n, d); n /= g; d /= g; return d === 1 ? String(n) : n + "/" + d; }

  function stripQuestionHeader(t) {
    return String(t).replace(/^第 \d+ 問[^\n]*\n/, "").replace(/^【[^】\n]*】\n/, "");

  function pn(n) { return n < 0 ? "(" + n + ")" : String(n); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function normalizeNumberText(s) {
    return String(s)
      .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[−ー―‐－]/g, "-").replace(/＋/g, "+").replace(/／/g, "/").replace(/．/g, ".")

  }
  function show(id, display) {

  const RUBY_RE = new RegExp(Object.keys(RUBY_DICT).sort((a, b) => b.length - a.length).join("|"), "g");
  let rubyOn = false;

  function applyRuby() {
    const root = document.getElementById("app");
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => (n.data.trim() && n.parentElement && !n.parentElement.closest("svg,textarea,select,option,rt,ruby,script,style,#symbols,#memoCanvas")) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      RUBY_RE.lastIndex = 0;
      if (!RUBY_RE.test(n.data)) return;
      RUBY_RE.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let last = 0, m;
      while ((m = RUBY_RE.exec(n.data))) {
        if (m.index > last) frag.appendChild(document.createTextNode(n.data.slice(last, m.index)));
        const r = document.createElement("ruby");
        r.appendChild(document.createTextNode(m[0]));
        const rt = document.createElement("rt");
        rt.textContent = RUBY_DICT[m[0]];
        r.appendChild(rt);
        frag.appendChild(r);
        last = m.index + m[0].length;
      }
      if (last < n.data.length) frag.appendChild(document.createTextNode(n.data.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
  }

  function removeRuby() {
    const root = document.getElementById("app");
    root.querySelectorAll("ruby").forEach(r => r.replaceWith(document.createTextNode(r.firstChild.textContent)));
  }

  window.toggleRuby = function() {
    rubyOn = !rubyOn;
    document.body.classList.toggle("ruby", rubyOn);
    const b = document.getElementById("rubyBtn");
    b.textContent = "ルビ：" + (rubyOn ? "ON" : "OFF");
    b.classList.toggle("on", rubyOn);
    if (rubyOn) applyRuby(); else removeRuby();
    settings.ruby = rubyOn;
    saveData();
  };

る,差し迫った危機,余計な付け足し",1,"正解は「たがいに理解し合う親密な友情」です。"],["次の意味を表す言葉はどれ？\n「たがいに理解し合う親密な友情」","管鮑の交わり,朝三暮四,臥薪嘗胆,漁夫の利",1,"正解は「管鮑の交わり」です。（たがいに理解し合う親密な友情）"],["「国士無双」の意味として最も適切なものはどれ？","国中に並ぶ者のないすぐれた人物,たがいに理解し合う親密な友情,立身出世のための関門,無用な心配",1,"正解は「国中に並ぶ者のないすぐれた人物」です。"],["次の意味を表す言葉はどれ？\n「国中に並ぶ者のないすぐれた人物」","国士無双,画竜点睛,一敗地にまみれる,水魚の交わり",1,"正解は「国士無双」です。（国中に並ぶ者のないすぐれた人物）"],["「三顧の礼」の意味として最も適切なものはどれ？","目上の人が礼を尽くして人を迎える,無用な心配,同類の中で最もすぐれたもの,少しの違いはあっても大差ない",1,"正解は「目上の人が礼を尽くして人を迎える」です。"],["次の意味を表す言葉はどれ？\n「目上の人が礼を尽くして人を迎える」","三顧の礼,破竹の勢い,烏合の衆,助長",1,"正解は「三顧の礼」です。（目上の人が礼を尽くして人を迎える）"],["「糟糠の妻」の意味として最も適切なものはどれ？","苦労を共にしてきた妻,非常に親密な交際,目先の違いにとらわれ結果が同じと気づかない,たがいに理解し合う親密な友情",1,"正解は「苦労を共にしてきた妻」です。"],["次の意味を表す言葉はどれ？\n「苦労を共にしてきた妻」","糟糠の妻,推敲,五十歩百歩,鶏口牛後",1,"正解は「糟糠の妻」です。（苦労を共にしてきた妻）"],["「轍鮒の急」の意味として最も適切なものはどれ？","差し迫った危機,非常に親密な交際,つじつまが合わないこと,立身出世のための関門",1,"正解は「差し迫った危機」です。"],["次の意味を表す言葉はどれ？\n「差し迫った危機」","轍鮒の急,他山の石,鶏口牛後,杞憂",1,"正解は「轍鮒の急」です。（差し迫った危機）"],["「青天の霹靂」の意味として最も適切なものはどれ？","突然起こる思いがけない出来事,たがいに理解し合う親密な友情,無用な心配,目先の違いにとらわれ結果が同じと気づかない",1,"正解は「突然起こる思いがけない出来事」です。"],["次の意味を表す言葉はどれ？\n「突然起こる思いがけない出来事」","青天の霹靂,刎頸の交わり,五十歩百歩,水魚の交わり",1,"正解は「青天の霹靂」です。（突然起こる思いがけない出来事）"],["「一敗地にまみれる」の意味として最も適切なものはどれ？","徹底的に敗れる,失敗の許されない状況で全力で当たる,突然起こる思いがけない出来事,無用な心配",1,"正解は「徹底的に敗れる」です。"],["次の意味を表す言葉はどれ？\n「徹底的に敗れる」","一敗地にまみれる,刎頸の交わり,狐の威を借る,背水の陣",1,"正解は「一敗地にまみれる」です。（徹底的に敗れる）"]],"jp_kakari_step1":[["係助詞「ぞ」を受けて、文末はどんな形になる？","連体形,終止形,已然形,命令形",1,"正解は「連体形」です。"],["係助詞「なむ」を受けて、文末はどんな形になる？","連体形,終止形,已然形,未然形",1,"正解は「連体形」です。"],["係助詞「や」を受けて、文末はどんな形になる？","連体形,已然形,終止形,連用形",1,"正解は「連体形」です。"],["係助詞「か」を受けて、文末はどんな形になる？","連体形,已然形,終止形,連用形",1,"正解は「連体形」です。"],["係助詞「こそ」を受けて、文末はどんな形になる？","已然形,連体形,終止形,未然形",1,"正解は「已然形」です。"],["結びが已然形になる係助詞はどれ？","こそ,ぞ,なむ,や",1,"正解は「こそ」です。"],["疑問・反語を表す係助詞はどれ？","や・か,ぞ・なむ,こそ・ぞ,は・も",1,"正解は「や・か」です。"],["強意を表す係助詞はどれ？","ぞ・なむ・こそ,や・か,は・も,ば・ど",1,"正解は「ぞ・なむ・こそ」です。"],["「花ぞ咲きける」の結びの語はどれ？","咲きける,花,ぞ,咲き",1,"正解は「咲きける」です。"],["「春こそをかしけれ」の結びの語はどれ？","をかしけれ,春,こそ,をかし",1,"正解は「をかしけれ」です。"]],"jp_kakari_step2":[["「をかしけれ」は何形？","已然形,連体形,終止形,連用形",1,"正解は「已然形」です。"],["「なむ」の意味は？","強意,疑問,反語,打ち消し",1,"正解は「強意」です。"],["「や」「か」の意味は？","疑問・反語,強意,強調,打ち消し",1,"正解は「疑問・反語」です。"],["「こそ」の意味は？","強意,疑問,反語,打ち消し",1,"正解は「強意」です。"],["係助詞が文中にあるとき、文末が普通の終止形でなくなる決まりを何という？","係り結び,倒置法,体言止め,対句法",1,"正解は「係り結び」です。"],["文末が連体形で結ばれる係助詞の組み合わせはどれ？","ぞ・なむ・や・か,こそ・ぞ,こそ・なむ,や・こそ",1,"正解は「ぞ・なむ・や・か」です。"],["係助詞「は」「も」を受ける文末は？","特に決まった形はない,連体形になる,已然形になる,命令形になる",1,"正解は「特に決まった形はない」です。"],["「人ぞ来ける」で、「ぞ」を除いて言い切ると文末は？","人来けり（終止形）,人来ける,人来けれ,人来け",1,"正解は「人来けり（終止形）」です。"],["係り結びの「ぞ」「なむ」「こそ」が文に加える意味は？","強調（強意）,疑問,打ち消し,過去",1,"正解は「強調（強意）」です。"],["係助詞はいくつある？","5つ（ぞ・なむ・や・か・こそ）,3つ,4つ,6つ",1,"正解は「5つ（ぞ・なむ・や・か・こそ）」です。"]],"jp_kakari_step3":[["「月ぞ出でたる」の結びの語はどれ？","出でたる,月,ぞ,出で",1,"正解は「出でたる」です。"],["「これこそ本意なれ」の結びの語はどれ？","なれ,これ,こそ,本意",1,"正解は「なれ」です。"],["「秋の夜ぞ長き」で強調されている語はどれ？","秋の夜,長き,ぞ,夜以外のすべて",1,"正解は「秋の夜」です。"],["「こそ〜已然形」のあとに「、」で文が続くとき、意味は？","逆接（〜けれども）,順接（〜ので）,並列,仮定",1,"正解は「逆接（〜けれども）」です。"],["係り結びは、文末にどんな影響を与える？","文末を連体形・已然形にする,文末を終止形にする,文末を命令形にする,文末を省く",1,"正解は「文末を連体形・已然形にする」です。"],["係り結びの結びの語が省略されることは？","ある（結びの省略）,ない,疑問文のときだけ,必ず省略される",1,"正解は「ある（結びの省略）」です。"],["「いづれか」の「か」の意味は？","疑問,強意,打ち消し,過去",1,"正解は「疑問」です。"],["「誰か知らむ（誰が知ろうか）」の「か」の意味は？","反語,疑問,強意,打ち消し",1,"正解は「反語」です。"],["「人こそあれ」の「あれ」の活用形は？","已然形,連体形,終止形,連用形",1,"正解は「已然形」です。"],["「梅の花なむ咲きたる」の結びの語の活用形は？","連体形,已然形,終止形,連用形",1,"正解は「連体形」です。"]],"jp_kanbun_base_step1":[["漢文で、返り点などのつかない原文のままの文を何という？","白文,訓読文,書き下し文,送り仮名文",1,"正解は「白文」です。"],["漢文を日本語の語順に直し、仮名まじりで書いた文を何という？","書き下し文,白文,訓読文,返り点",1,"正解は「書き下し文」です。"],["レ点の働きはどれ？","下の一字から、すぐ上の一字に返って読む,二字以上離れた上の字へ返る,下の二字を先に読む,上の字を読まない",1,"正解は「下の一字から、すぐ上の一字に返って読む」です。"],["一二点の働きはどれ？","二字以上隔てた上の字に返って読む,すぐ上の一字に返る,読まない字を示す,送り仮名を示す",1,"正解は「二字以上隔てた上の字に返って読む」です。"],["一二点をはさんで、さらに返る場合に使う返り点はどれ？","上下点,レ点,甲乙点,送り仮名",1,"正解は「上下点」です。"],["書き下し文で、助詞・助動詞にあたる字は何で書く？","ひらがな,カタカナ,漢字,ローマ字",1,"正解は「ひらがな」です。"],["訓読で、読まずに文の調子を整える字を何という？","置き字,送り仮名,返り点,助字",1,"正解は「置き字」です。"],["「而」「於」「乎」などは、訓読ではどう扱うことが多い？","読まない（置き字）,必ず読む,返り点を二つ付ける,送り仮名にする",1,"正解は「読まない（置き字）」です。"],["「不」は書き下し文でどう書く？","ず,ない,どう,ぬる",1,"正解は「ず」です。"],["「春眠不覚暁」の書き下し文はどれ？","春眠暁を覚えず,春眠覚えず暁を,暁を覚えず春眠,春眠暁覚えず",1,"正解は「春眠暁を覚えず」です。"]],"jp_kanbun_base_step2":[["「国破山河在」の書き下し文はどれ？","国破れて山河在り,国破山河在り,国を破りて山河在り,破国山河在る",1,"正解は「国破れて山河在り」です。"],["「有朋自遠方来」の書き下し文はどれ？","朋有り遠方より来たる,朋遠方より有り来る,有朋自り遠方来る,朋の遠方有りて来る",1,"正解は「朋有り遠方より来たる」です。"],["七言絶句の句数・字数は？","四句・各句七字,八句・各句七字,四句・各句五字,八句・各句五字",1,"正解は「四句・各句七字」です。"],["五言律詩の句数・字数は？","八句・各句五字,四句・各句五字,八句・各句七字,四句・各句七字",1,"正解は「八句・各句五字」です。"],["漢詩で、句末の音をそろえることを何という？","押韻,対句,平仄,起承",1,"正解は「押韻」です。"],["漢詩の絶句の構成で、第三句にあたるものは？","転句,起句,承句,結句",1,"正解は「転句」です。"],["漢詩の絶句の構成で、第二句にあたるものは？","承句,起句,転句,結句",1,"正解は「承句」です。"],["漢詩の律詩で、第三句と第四句、第五句と第六句に使う技法は？","対句,倒置,体言止め,反復",1,"正解は「対句」です。"],["送り仮名は書き下し文でどう扱う？","原文の読み方に合わせて漢字の後に付ける,漢字の前に付ける,すべてカタカナにする,付けない",1,"正解は「原文の読み方に合わせて漢字の後に付ける」です。"],["一字で二度読む文字を何という？","再読文字,置き字,助字,返り点",1,"正解は「再読文字」です。"]],"jp_kanbun_base_step3":[["再読文字「将」の読みと意味は？","まさに〜んとす（今にも〜しようとする）,いまだ〜ず（まだ〜ない）,すべからく〜べし（〜すべきだ）,なほ〜がごとし（ちょうど〜のようだ）",1,"正解は「まさに〜んとす（今にも〜しようとする）」です。"],["再読文字「当」「応」の読みと意味は？","まさに〜べし（〜するのが当然だ）,いまだ〜ず,まさに〜んとす,すべからく〜べし",1,"正解は「まさに〜べし（〜するのが当然だ）」です。"],["再読文字「須」の読みと意味は？","すべからく〜べし（〜する必要がある）,まさに〜んとす,いまだ〜ず,なほ〜がごとし",1,"正解は「すべからく〜べし（〜する必要がある）」です。"],["再読文字「宜」の読みと意味は？","よろしく〜べし（〜するのがよい）,まさに〜べし,すべからく〜べし,いまだ〜ず",1,"正解は「よろしく〜べし（〜するのがよい）」です。"],["再読文字「猶」「由」の読みと意味は？","なほ〜がごとし（ちょうど〜のようだ）,いまだ〜ず,まさに〜べし,よろしく〜べし",1,"正解は「なほ〜がごとし（ちょうど〜のようだ）」です。"],["再読文字「盍」の読みと意味は？","なんぞ〜ざる（どうして〜しないのか）,いまだ〜ず,まさに〜んとす,すべからく〜べし",1,"正解は「なんぞ〜ざる（どうして〜しないのか）」です。"],["返り点・送り仮名・句読点などをまとめて何という？","訓点,白文,書き下し,置き字",1,"正解は「訓点」です。"],["上下点は、どの返り点の外側で使うか？","一二点,レ点,甲乙点,送り仮名",1,"正解は「一二点」です。"],["甲乙点は、どの返り点のさらに外側で使うか？","上下点,一二点,レ点,送り仮名",1,"正解は「上下点」です。"],["漢文を読むときに、返り点に従って文字を読む順序はどうなる？","上から読み、返り点のある所で下から上へ返る,必ず右から左へ読む,下から上へ全部読む,順序は自由",1,"正解は「上から読み、返り点のある所で下から上へ返る」です。"]],"jp_kanbun_caus_step1":[["使役を表す字として適切なのは？","使・令・教・遣,見・被・所,不・非・未,何・安・豈",1,"正解は「使・令・教・遣」です。"],["受身を表す字として適切なのは？","見・被・為・所,使・令・教,何・安・孰,不・非・無",1,"正解は「見・被・為・所」です。"],["使役の「使」「令」「教」「遣」は何と読む？","しむ（〜させる）,る・らる,ず,べし",1,"正解は「しむ（〜させる）」です。"],["「使A B」の読み方・意味は？","AをしてBせしむ（AにBさせる）,AにBらる,AのBする所となる,AはBせず",1,"正解は「AをしてBせしむ（AにBさせる）」です。"],["「見〜」「被〜」の読みは？","〜る・〜らる（〜される）,〜しむ,〜べし,〜ず",1,"正解は「〜る・〜らる（〜される）」です。"],["「為A所B」の読み方・意味は？","AのBする所と為る（AにBされる）,AをしてBせしむ,AはBべし,AにBず",1,"正解は「AのBする所と為る（AにBされる）」です。"],["「令子路問津焉」の書き下しとして正しいものは？","子路をして津を問はしむ,子路津を令して問ふ,子路令津を問ふ,令子路津焉問ふ",1,"正解は「子路をして津を問はしむ」です。"],["「為人所殺」の書き下しとして正しいものは？","人の殺す所と為る,人為りて殺す所,人を為して殺す,為人殺す所",1,"正解は「人の殺す所と為る」です。"],["「使人往」の書き下しとして正しいものは？","人をして往かしむ,人使ひて往く,人往かしむ使ふ,使ひ人往く",1,"正解は「人をして往かしむ」です。"],["「教人読書」の書き下しとして正しいものは？","人をして書を読ましむ,人教へて書読む,書を教へ人読む,人書を読む教ふ",1,"正解は「人をして書を読ましむ」です。"]],"jp_kanbun_caus_step2":[["「見」で受身を表す文の例として正しいものは？","信而見疑（信にして疑はる）,不見其人,見山高,見者皆笑",1,"正解は「信而見疑（信にして疑はる）」です。"],["受身を表すとき、動作をする側を導く字としてよく使われるのは？","於（乎）,而,之,者",1,"正解は「於（乎）」です。"],["「於」は受身文でどう読むことが多い？","〜に（〜より）,〜ず,〜や,〜べし",1,"正解は「〜に（〜より）」です。"],["「遣人問之」の書き下しとして正しいものは？","人をして之を問はしむ,人遣はして之を問ふ,人之を問ふ遣はす,遣人之問ふ",1,"正解は「人をして之を問はしむ」です。"],["「見殺」の読み方・意味は？","殺さる（殺される）,殺す見る,見て殺す,殺を見る",1,"正解は「殺さる（殺される）」です。"],["「為A所B」で、Bの動作をする人はどれか？","A,B,為,所",1,"正解は「A」です。"],["「使人学」の書き下しは？","人をして学ばしむ,人学ばしむ使ふ,使ひて人学ぶ,人使ひて学ぶ",1,"正解は「人をして学ばしむ」です。"],["「令民従」の書き下しは？","民をして従はしむ,民令して従ふ,民従ひて令す,令民に従ふ",1,"正解は「民をして従はしむ」です。"],["「教子読」の書き下しは？","子をして読ましむ,子教へて読む,子読み教ふ,教へて子読む",1,"正解は「子をして読ましむ」です。"],["「遣使行」の書き下しは？","使ひをして行かしむ,使ひ遣はして行く,使ひ行きて遣はす,遣使行く",1,"正解は「使ひをして行かしむ」です。"]],"jp_kanbun_caus_step3":[["「見笑」の書き下しは？","笑はる,笑ひ見る,見て笑ふ,笑を見る",1,"正解は「笑はる」です。"],["「被殺」の書き下しは？","殺さる,殺を被る,殺して被る,被りて殺す",1,"正解は「殺さる」です。"],["「為人所笑」の書き下しは？","人の笑ふ所と為る,人笑ひて所為る,為人笑ふ所,人為り笑ふ",1,"正解は「人の笑ふ所と為る」です。"],["受身の「被」「見」の読み方は？","る・らる,しむ,べし,ず",1,"正解は「る・らる」です。"],["使役の「しむ」を現代語に訳すと？","〜させる,〜される,〜できる,〜したい",1,"正解は「〜させる」です。"],["受身の「る・らる」を現代語に訳すと？","〜される,〜させる,〜できる,〜したい",1,"正解は「〜される」です。"],["「為A所B」のAが表すのは？","動作をする人,動作を受ける人,場所,時",1,"正解は「動作をする人」です。"],["「使A B」のAが表すのは？","Bの動作をさせられる人,命令する人,動作を受ける物,時間",1,"正解は「Bの動作をさせられる人」です。"],["使役の「しむ」の直前の動詞の活用形は？","未然形,連用形,終止形,連体形",1,"正解は「未然形」です。"],["「見」を受身で読むとき、返り点はどうなる？","下の動詞から返って読む,読まない,上の動詞へ返らない,上から順に読む",1,"正解は「下の動詞から返って読む」です。"]],"jp_kanbun_neg_step1":[["「不」の読み方（意味）は？","〜ず（打ち消し）,〜なかれ（禁止）,〜べし,〜や（疑問）",1,"正解は「〜ず（打ち消し）」です。"],["「非」の読み方（意味）は？","〜あらず（〜ではない）,〜ず,〜なし,〜べし",1,"正解は「〜あらず（〜ではない）」です。"],["「無」「莫」の読み方（意味）は？","〜なし（〜がない）,〜ず,〜なかれ,〜あらず",1,"正解は「〜なし（〜がない）」です。"],["「勿」「毋」の読み方（意味）は？","〜なかれ（禁止）,〜ず,〜なし,〜べし",1,"正解は「〜なかれ（禁止）」です。"],["「不可」の読み方（意味）は？","〜べからず（〜してはならない）,〜あたはず,〜ざるなし,〜ずや",1,"正解は「〜べからず（〜してはならない）」です。"],["「不能」の読み方（意味）は？","〜あたはず（〜できない）,〜べからず,〜なかれ,〜ざるなし",1,"正解は「〜あたはず（〜できない）」です。"],["「未」の読み（再読文字）は？","いまだ〜ず,すでに〜ず,まさに〜ず,なほ〜ず",1,"正解は「いまだ〜ず」です。"],["「無不〜」の意味は？","〜しないものはない（全部〜する）,〜しなければならない,〜しないわけではない,〜してはならない",1,"正解は「〜しないものはない（全部〜する）」です。"],["「不可不〜」の意味は？","〜しなければならない,〜してはならない,〜できない,〜しないものはない",1,"正解は「〜しなければならない」です。"],["「非不〜」の意味は？","〜しないわけではない,〜しなければならない,〜してはならない,〜しないものはない",1,"正解は「〜しないわけではない」です。"]],"jp_kanbun_neg_step2":[["「無不〜」の書き下し形は？","〜ざる無し,〜ざるべからず,〜ざるに非ず,〜ざるなかれ",1,"正解は「〜ざる無し」です。"],["「不可不〜」の書き下し形は？","〜ざるべからず,〜ざる無し,〜ざるに非ず,〜べからず",1,"正解は「〜ざるべからず」です。"],["「非不〜」の書き下し形は？","〜ざるに非ず,〜ざる無し,〜ざるべからず,〜なかれ",1,"正解は「〜ざるに非ず」です。"],["「不必〜」の意味は？","必ずしも〜ない（部分否定）,必ず〜ない（全部否定）,必ず〜する,〜してはならない",1,"正解は「必ずしも〜ない（部分否定）」です。"],["「常不〜」の意味は？","いつも〜ない（全部否定）,いつも〜とは限らない,いつも〜する,〜してはならない",1,"正解は「いつも〜ない（全部否定）」です。"],["二つの否定を重ねて強い肯定を表す表現を何という？","二重否定,部分否定,全部否定,反語",1,"正解は「二重否定」です。"],["「不復〜」の読み方（意味）は？","復た〜ず（二度と〜ない）,必ずしも〜ず,〜しなければならない,〜ざる無し",1,"正解は「復た〜ず（二度と〜ない）」です。"],["「弗」の読み方は？","〜ず,〜なかれ,〜なし,〜あらず",1,"正解は「〜ず」です。"],["「不学」の書き下しは？","学ばず,学ぶ不,不学ぶ,学ばざれ",1,"正解は「学ばず」です。"],["「無学」の書き下しは？","学無し,学ばず,学ぶなかれ,学ばざるなし",1,"正解は「学無し」です。"]],"jp_kanbun_neg_step3":[["「勿言」の書き下しは？","言ふ勿かれ,言はず,言ふべし,言ひて",1,"正解は「言ふ勿かれ」です。"],["「非人」の書き下しは？","人に非ず,人ならず,人なし,人を非す",1,"正解は「人に非ず」です。"],["「不可行」の書き下しは？","行くべからず,行かず,行くなかれ,行くあたはず",1,"正解は「行くべからず」です。"],["「不能行」の書き下しは？","行くことあたはず,行くべからず,行くなかれ,行かず",1,"正解は「行くことあたはず」です。"],["「未学」の書き下しは？","いまだ学ばず,学ばず,学ぶべし,すでに学ぶ",1,"正解は「いまだ学ばず」です。"],["「無不知」の書き下しは？","知らざる無し,知らず,知るべからず,知るなかれ",1,"正解は「知らざる無し」です。"],["「不可不学」の書き下しは？","学ばざるべからず,学ばず,学ぶ無し,学ぶなかれ",1,"正解は「学ばざるべからず」です。"],["「非不能」の書き下しは？","能はざるに非ず,能はず,能ふ無し,能ふなかれ",1,"正解は「能はざるに非ず」です。"],["「不必然」の書き下しは？","必ずしも然らず,必ず然らず,然ら必ず,然らず必ず",1,"正解は「必ずしも然らず」です。"],["「無不知」の意味は？","知らないものはない,知っているものはない,知ってはならない,知らなければならない",1,"正解は「知らないものはない」です。"]],"jp_kanbun_rhet_step1":[["「豈」の反語での読みは？","あに〜んや,いづくんぞ〜や,たれか〜,いか 管,葉緑体,根の先",1,"正解は「道管」です。"]],"sci_phys_energy_step1":[["運動エネルギーを表す式は？","½mv²,mv²,mgh,½kx²",1,"正解は「½mv²」です。"],["重力による位置エネルギーを表す式は？","mgh,½mv²,½kx²,mv",1,"正解は「mgh」です。"],["弾性力による位置エネルギーを表す式は？","½kx²,mgh,½mv²,kx",1,"正解は「½kx²」です。"],["質量2kgの物体が3m/sで動くときの運動エネルギーは？","9J,18J,6J,4.5J",1,"正解は「9J」です。"],["質量4kgの物体が5m/sで動くときの運動エネルギーは？","50J,100J,20J,10J",1,"正解は「50J」です。"],["質量2kgの物体が高さ5mにあるときの位置エネルギーは？（g＝9.8m/s²）","98J,49J,10J,196J",1,"正解は「98J」です。"],["質量1kgの物体が高さ10mにあるときの位置エネルギーは？（g＝9.8m/s²）","98J,9.8J,10J,196J",1,"正解は「98J」です。"],["摩擦や空気抵抗がないとき、力学的エネルギーは？","一定に保たれる,増え続ける,減り続ける,ゼロになる",1,"正解は「一定に保たれる」です。"],["力学的エネルギーとは？","運動エネルギーと位置エネルギーの和,運動エネルギーだけ,位置エネルギーだけ,熱エネルギー",1,"正解は「運動エネルギーと位置エネルギーの和」です。"],["仕事を表す式は？","力×力の向きに動いた距離,力÷距離,力＋距離,力×時間",1,"正解は「力×力の向きに動いた距離」です。"]],"sci_phys_energy_step2":[["5Nの力で物体を力の向きに3m動かしたときの仕事は？","15J,8J,1.7J,2J",1,"正解は「15J」です。"],["仕事率を表す式は？","仕事÷時間,仕事×時間,時間÷仕事,仕事＋時間",1,"正解は「仕事÷時間」です。"],["15Jの仕事を5秒間で行ったときの仕事率は？","3W,75W,10W,20W",1,"正解は「3W」です。"],["仕事の単位は？","J（ジュール）,W,N,kg",1,"正解は「J（ジュール）」です。"],["仕事率の単位は？","W（ワット）,J,N,Pa",1,"正解は「W（ワット）」です。"],["高い所から物体が自由落下するとき、位置エネルギーは？","運動エネルギーに変わる,熱エネルギーだけに変わる,光に変わる,増え続ける",1,"正解は「運動エネルギーに変わる」です。"],["振り子が最下点を通るとき、運動エネルギーは？","最大,最小（0）,位置エネルギーと同じ,変わらず0",1,"正解は「最大」です。"],["振り子が最高点にあるとき、運動エネルギーは？","0（最小）,最大,位置エネルギーと同じ,不定",1,"正解は「0（最小）」です。"],["質量3kgの物体が2m毎秒で動くときの運動エネルギーは？","6J,12J,3J,1.5J",1,"正解は「6J」です。"],["質量5kgの物体が高さ2mにあるときの位置エネルギーは？（g＝9.8m毎秒毎秒）","98J,49J,10J,196J",1,"正解は「98J」です。"]],"sci_phys_energy_step3":[["質量1kgの物体を高さ10mから自由落下させたとき、地面直前の速さは約何m毎秒？（g＝9.8m毎秒毎秒）","約14m毎秒,約10m毎秒,約98m毎秒,約5m毎秒",1,"正解は「約14m毎秒」です。"],["力の向きに対して垂直に物体が移動したとき、その力がした仕事は？","0,最大,力×距離,負の値",1,"正解は「0」です。"],["ばね定数100N毎mのばねを0.2m伸ばしたときの弾性エネルギーは？","2J,20J,4J,10J",1,"正解は「2J」です。"],["100Wの仕事率で10秒間行った仕事は？","1000J,10J,110J,100J",1,"正解は「1000J」です。"],["太陽電池が行うエネルギー変換は？","光エネルギーから電気エネルギー,電気エネルギーから光エネルギー,熱エネルギーから運動エネルギー,化学エネルギーから光エネルギー",1,"正解は「光エネルギーから電気エネルギー」です。"],["エネルギー保存則の内容は？","エネルギーの総量は変わらない,エネルギーは増え続ける,エネルギーは減り続ける,エネルギーは消える",1,"正解は「エネルギーの総量は変わらない」です。"],["力学的エネルギーが保存される条件は？","摩擦や空気抵抗などがないとき,力が加わるとき,静止しているとき,運動しているとき",1,"正解は「摩擦や空気抵抗などがないとき」です。"],["摩擦によって失われた力学的エネルギーは、おもに何になる？","熱エネルギー,光エネルギー,音エネルギーのみ,位置エネルギー",1,"正解は「熱エネルギー」です。"],["水力発電でのエネルギーの変化は？","位置→運動→電気エネルギー,電気→運動→位置エネルギー,熱→電気→運動エネルギー,光→熱→電気エネルギー",1,"正解は「位置→運動→電気エネルギー」です。"],["物体の速さが2倍になると、運動エネルギーは？","4倍になる,2倍になる,変わらない,半分になる",1,"正解は「4倍になる」です。"]],"sci_phys_motion_step1":[["等加速度直線運動で、時刻tの速度を表す式は？","v＝v₀＋at,v＝v₀－at²,v＝at²,v＝v₀t",1,"正解は「v＝v₀＋at」です。"],["等加速度直線運動で、変位xを表す式は？","x＝v₀t＋½at²,x＝v₀t＋at²,x＝½vt²,x＝v₀＋at",1,"正解は「x＝v₀t＋½at²」です。"],["等加速度運動で、時間を含まない関係式は？","v²－v₀²＝2ax,v＝v₀＋at,x＝v₀t,v＝x÷t",1,"正解は「v²－v₀²＝2ax」です。"],["初速度0、加速度2m/s²で5秒間運動したときの速さは？","10m/s,2.5m/s,25m/s,7m/s",1,"正解は「10m/s」です。"],["初速度0、加速度2m/s²で5秒間運動したときの移動距離は？","25m,10m,50m,12.5m",1,"正解は「25m」です。"],["初速度3m/s、加速度2m/s²で4秒後の速さは？","11m/s,5m/s,8m/s,14m/s",1,"正解は「11m/s」です。"],["初速度3m/s、加速度2m/s²で4秒間の移動距離は？","28m,12m,16m,20m",1,"正解は「28m」です。"],["重力加速度の大きさは、およそ？","9.8m/s²,98m/s²,0.98m/s²,1.6m/s²",1,"正解は「9.8m/s²」です。"],["自由落下で、2秒後の速さは？（g＝9.8m/s²）","19.6m/s,9.8m/s,39.2m/s,4.9m/s",1,"正解は「19.6m/s」です。"],["自由落下で、2秒間の落下距離は？（g＝9.8m/s²）","19.6m,9.8m,39.2m,4.9m",1,"正解は「19.6m」です。"]],"sci_phys_motion_step2":[["v-tグラフで、直線の傾きが表すものは？","加速度,変位,速度,時間",1,"正解は「加速度」です。"],["v-tグラフで、グラフと時間軸の間の面積が表すものは？","変位（移動距離）,加速度,速度,力",1,"正解は「変位（移動距離）」です。"],["加速度の単位は？","m/s²,m/s,N,m/s³",1,"正解は「m/s²」です。"],["等速直線運動で、位置xを表す式は？","x＝vt,x＝½vt²,x＝v÷t,x＝at",1,"正解は「x＝vt」です。"],["鉛直に投げ上げた物体が最高点に達したとき、速さは？","0,最大,初速度と同じ,9.8m/s",1,"正解は「0」です。"],["鉛直投げ上げで、上昇中と下降中の加速度の向きは？","ともに下向き,上昇中は上向き,下降中は上向き,加速度は0",1,"正解は「ともに下向き」です。"],["速度の変化量を時間で割ったものは？","加速度,速度,変位,力",1,"正解は「加速度」です。"],["2秒間で速さが4m/sから10m/sに変わった。加速度は？","3m/s²,6m/s²,2m/s²,7m/s²",1,"正解は「3m/s²」です。"],["等速直線運動のv-tグラフの形は？","時間軸に平行な直線,右上がりの直線,右下がりの直線,曲線",1,"正解は「時間軸に平行な直線」です。"],["等加速度直線運動のv-tグラフの形は？","傾きが一定の直線,時間軸に平行な直線,曲線,階段状",1,"正解は「傾きが一定の直線」です。"]],"sci_phys_motion_step3":[["初速度10m毎秒で加速度が−2m毎秒毎秒のとき、3秒後の速さは？","4m毎秒,16m毎秒,6m毎秒,12m毎秒",1,"正解は「4m毎秒」です。"],["初速度0で加速度3m毎秒毎秒のとき、4秒間の移動距離は？","24m,12m,48m,36m",1,"正解は「24m」です。"],["時速72kmは、毎秒何m？","20m,72m,7.2m,36m",1,"正解は「20m」です。"],["時速36kmは、毎秒何m？","10m,36m,3.6m,100m",1,"正解は「10m」です。"],["自由落下で、3秒間の落下距離は？（g＝9.8m毎秒毎秒）","44.1m,29.4m,88.2m,14.7m",1,"正解は「44.1m」です。"],["初速度14.7m毎秒で鉛直に投げ上げた物体が最高点に達するまでの時間は？（g＝9.8m毎秒毎秒）","1.5秒,3秒,0.75秒,2秒",1,"正解は「1.5秒」です。"],["加速度の向きと速度の向きが逆のとき、物体は？","減速する,加速する,等速で進む,止まったまま",1,"正解は「減速する」です。"],["等速円運動では、速さが一定でも加速度があるのはなぜ？","速度の向きが変わり続けるから,速さが変わるから,質量が変わるから,力がはたらかないから",1,"正解は「速度の向きが変わり続けるから」です。"],["慣性とは？","物体が運動状態を保とうとする性質,物体に力がはたらく性質,物体が重い性質,物体が止まる性質",1,"正解は「物体が運動状態を保とうとする性質」です。"],["1秒ごとに速さが2m毎秒ずつ増える運動の加速度は？","2m毎秒毎秒,1m毎秒毎秒,4m毎秒毎秒,0.5m毎秒毎秒",1,"正解は「2m毎秒毎秒」です。"]],"sci_phys_newton_step1":[["運動方程式は？","ma＝F,F＝m÷a,F＝a÷m,a＝mF",1,"正解は「ma＝F」です。"],["質量2kgの物体に3m/s²の加速度を与える力は？","6N,1.5N,5N,0.67N",1,"正解は「6N」です。"],["質量5kgの物体に10Nの力を加えたときの加速度は？","2m/s²,50m/s²,0.5m/s²,15m/s²",1,"正解は「2m/s²」です。"],["質量4kgの物体に20Nの力を加えたときの加速度は？","5m/s²,80m/s²,0.2m/s²,16m/s²",1,"正解は「5m/s²」です。"],["力を加えなければ物体は等速直線運動を続ける。この法則は？","慣性の法則,作用反作用の法則,運動の法則,万有引力の法則",1,"正解は「慣性の法則」です。"],["物体Aが物体Bに力を及ぼすとき、BはAに同じ大きさ逆向きの力を及ぼす。この法則は？","作用反作用の法則,慣性の法則,運動の法則,フックの法則",1,"正解は「作用反作用の法則」です。"],["質量を表す単位は？","kg,N,m,s",1,"正解は「kg」です。"],["力の単位は？","N（ニュートン）,kg,J,W",1,"正解は「N（ニュートン）」です。"],["質量3kgの物体にはたらく重力は？（g＝9.8m/s²）","29.4N,3N,9.8N,0.33N",1,"正解は「29.4N」です。"],["重力を表す式は？","W＝mg,W＝m÷g,W＝g÷m,W＝m＋g",1,"正解は「W＝mg」です。"]],"sci_phys_newton_step2":[["月面での物体の重さは、地球上と比べて？","約1/6,約6倍,ほぼ同じ,ゼロ",1,"正解は「約1/6」です。"],["月面での物体の質量は、地球上と比べて？","変わらない,約1/6,約6倍,ゼロ",1,"正解は「変わらない」です。"],["物体が面から受ける、面に垂直な力は？","垂直抗力,摩擦力,張力,重力",1,"正解は「垂直抗力」です。"],["運動を妨げる向きにはたらく、接触面での力は？","摩擦力,垂直抗力,弾性力,張力",1,"正解は「摩擦力」です。"],["2つの力がつりあうために必要な条件は？","大きさが等しく向きが逆,大きさが等しく向きが同じ,向きだけが逆,一直線上になくてもよい",1,"正解は「大きさが等しく向きが逆」です。"],["ばねの伸びが力に比例する法則は？","フックの法則,慣性の法則,オームの法則,万有引力の法則",1,"正解は「フックの法則」です。"],["同じ力で質量が2倍になると、加速度は？","半分になる,2倍になる,変わらない,4倍になる",1,"正解は「半分になる」です。"],["糸でつるされた物体が糸から受ける力は？","張力,垂直抗力,摩擦力,浮力",1,"正解は「張力」です。"],["質量1kgの物体にはたらく重力は、およそ？","9.8N,1N,98N,0.98N",1,"正解は「9.8N」です。"],["質量50kgの物体にはたらく重力は？（g＝9.8m毎秒毎秒）","490N,50N,5N,4900N",1,"正解は「490N」です。"]],"sci_phys_newton_step3":[["2つの力がつりあっているとき、合力は？","0,最大,2倍,半分",1,"正解は「0」です。"],["最大静止摩擦力と動摩擦力の大きさの関係は？","最大静止摩擦力のほうが大きい,動摩擦力のほうが大きい,等しい,比較できない",1,"正解は「最大静止摩擦力のほうが大きい」です。"],["エレベーターが上向きに加速しているとき、体重計の値は？","増える,減る,変わらない,0になる",1,"正解は「増える」です。"],["なめらかな面で、質量2kgの物体を引いて加速度が2m毎秒毎秒になるときの力は？","4N,1N,8N,2N",1,"正解は「4N」です。"],["なめらかな面で、質量3kgの物体を12Nの力で押したときの加速度は？","4m毎秒毎秒,36m毎秒毎秒,9m毎秒毎秒,0.25m毎秒毎秒",1,"正解は「4m毎秒毎秒」です。"],["運動の第2法則で、加速度は何に比例し、何に反比例する？","力に比例し、質量に反比例する,質量に比例し、力に反比例する,力にも質量にも比例する,力にも質量にも反比例する",1,"正解は「力に比例し、質量に反比例する」です。"],["作用・反作用の2力が、つりあいの2力と異なる点は？","別々の物体にはたらく,同じ物体にはたらく,大きさが異なる,向きが同じ",1,"正解は「別々の物体にはたらく」です。"],["空気中を落下する物体の速さが一定になる速度を何という？","終端速度,初速度,平均速度,相対速度",1,"正解は「終端速度」です。"],["物体が面を押す力と、面が物体を押し返す力の関係は？","作用・反作用の関係,つりあいの関係,慣性の関係,重力の関係",1,"正解は「作用・反作用の関係」です。"],["重力の大きさを表す式は？","mg,m÷g,g÷m,m＋g",1,"正解は「mg」です。"]],"sci_phys_wave_step1":[["波の速さ・振動数・波長の関係式は？","v＝fλ,v＝f÷λ,v＝λ÷f,v＝f＋λ",1,"正解は「v＝fλ」です。"],["周期Tと振動数fの関係は？","T＝1/f,T＝f,T＝f²,T＝f＋1",1,"正解は「T＝1/f」です。"],["振動数2Hzの波の周期は？","0.5秒,2秒,4秒,0.2秒",1,"正解は「0.5秒」です。"],["振動数100Hz、波長3.4mの波の速さは？","340m/s,34m/s,3400m/s,29.4m/s",1,"正解は「340m/s」です。"],["波の山から次の山までの長さを何という？","波長,周期,振動数,振幅",1,"正解は「波長」です。"],["媒質が波の進行方向と平行に振動する波は？","縦波,横波,表面波,電磁波",1,"正解は「縦波」です。"],["媒質が波の進行方向と垂直に振動する波は？","横波,縦波,疎密波,音波",1,"正解は「横波」です。"],["音波は何波？","縦波（疎密波）,横波,電磁波,表面波",1,"正解は「縦波（疎密波）」です。"],["2つの波の山と山が重なって大きくなる現象は？","強め合い,弱め合い,反射,屈折",1,"正解は「強め合い」です。"],["2つの波の山と谷が重なって打ち消し合う現象は？","弱め合い,強め合い,共鳴,反射",1,"正解は「弱め合い」です。"]],"sci_phys_wave_step2":[["入射波と反射波が重なって、進まないように見える波は？","定常波（定在波）,縦波,進行波,うなり",1,"正解は「定常波（定在波）」です。"],["振動数がわずかに異なる2つの音を同時に鳴らすと生じる現象は？","うなり,ドップラー効果,共鳴,反射",1,"正解は「うなり」です。"],["振動数440Hzと444Hzの音で、1秒間のうなりの回数は？","4回,2回,8回,884回",1,"正解は「4回」です。"],["音源が近づくとき、聞こえる音の高さはどうなる？","高くなる,低くなる,変わらない,消える",1,"正解は「高くなる」です。"],["音源が遠ざかるとき、聞こえる音の高さはどうなる？","低くなる,高くなる,変わらない,消える",1,"正解は「低くなる」です。"],["この音の高さが変化して聞こえる現象を何という？","ドップラー効果,うなり,回折,干渉",1,"正解は「ドップラー効果」です。"],["閉管（片側が閉じた管）の基本振動の波長は、管長Lのとき？","4L,2L,L,L÷2",1,"正解は「4L」です。"],["両側が開いた管（開管）の基本振動の波長は、管長Lのとき？","2L,4L,L,L÷2",1,"正解は「2L」です。"],["空気中で音速340m/s、振動数680Hzの音の波長は？","0.5m,2m,0.25m,231200m",1,"正解は「0.5m」です。"],["周期2秒、波長4mの波の速さは？","2m毎秒,8m毎秒,0.5m毎秒,6m毎秒",1,"正解は「2m毎秒」です。"]],"sci_phys_wave_step3":[["振動数5Hz、波長2mの波の速さは？","10m毎秒,2.5m毎秒,7m毎秒,0.4m毎秒",1,"正解は「10m毎秒」です。"],["横波の例は？","水面の波,音波,地震のP波,空気の疎密波",1,"正解は「水面の波」です。"],["縦波の例は？","音波,光,水面の波,電磁波",1,"正解は「音波」です。"],["波の山から次の山までの距離は？","波長,振幅,周期,振動数",1,"正解は「波長」です。"],["波の中心からの山（谷）の高さは？","振幅,波長,周期,波速",1,"正解は「振幅」です。"],["波が障害物の背後に回り込む現象は？","回折,反射,屈折,干渉",1,"正解は「回折」です。"],["固定端で反射した波は、どうなる？","位相が反転する（山が谷になる）,位相はそのまま反射する,反射しない,波長が変わる",1,"正解は「位相が反転する（山が谷になる）」です。"],["共鳴（共振）が起こる条件は？","外から加わる振動数が固有振動数と一致するとき,振幅が一致するとき,波長が一致するとき,周期が2倍のとき",1,"正解は「外から加わる振動数が固有振動数と一致するとき」です。"],["ホイヘンスの原理とは？","波面上の各点が新たな波源となる,波は直進する,波は反射する,波は干渉しない",1,"正解は「波面上の各点が新たな波源となる」です。"],["2つの波が重なり合って強め合う条件は？","同位相で重なる,逆位相で重なる,波長が異なる,振幅が異なる",1,"正解は「同位相で重なる」です。"]],"sci_power_step1":[["電力を求める式は？","電圧×電流,電圧÷電流,電流÷電圧,電圧＋電流",1,"正解は「電圧×電流」です。"],["電力の単位は？","ワット（W）,ジュール（J）,ボルト（V）,アンペア（A）",1,"正解は「ワット（W）」です。"],["100Vで2Aの電流が流れるときの電力は？","200W,50W,102W,20W",1,"正解は「200W」です。"],["100Vで5Aの電流が流れるときの電力は？","500W,20W,105W,50W",1,"正解は「500W」です。"],["6Vで0.5Aの電流が流れるときの電力は？","3W,12W,6.5W,0.083W",1,"正解は「3W」です。"],["電力量を求める式は？","電力×時間,電力÷時間,電力＋時間,電力－時間",1,"正解は「電力×時間」です。"],["電力量の単位として正しいものは？","ワット時（Wh）,ワット（W）,ボルト（V）,オーム（Ω）",1,"正解は「ワット時（Wh）」です。"],["60Wの電球を5時間使ったときの電力量は？","300Wh,12Wh,65Wh,60Wh",1,"正解は「300Wh」です。"],["1000Wを1時間使ったときの電力量は？","1kWh,1W,1000kWh,0.1kWh",1,"正解は「1kWh」です。"],["1kWhは何Wh？","1000Wh,1Wh,10Wh,100Wh",1,"正解は「1000Wh」です。"]],"sci_power_step2":[["1Wの電力で1秒間に消費するエネルギーは？","1J,1Wh,1V,1A",1,"正解は「1J」です。"],["100Wの電熱線に10秒間電流を流したときの発熱量は？","1000J,10J,110J,100J",1,"正解は「1000J」です。"],["200Wの電熱線に30秒間電流を流したときの発熱量は？","6000J,230J,6.7J,170J",1,"正解は「6000J」です。"],["電熱線の発熱量は、電力と時間に対してどうなる？","どちらにも比例する,どちらにも反比例する,電力に反比例,時間に反比例",1,"正解は「どちらにも比例する」です。"],["同じ電熱線で電流を2倍にすると、電力は？","4倍になる,2倍になる,変わらない,半分になる",1,"正解は「4倍になる」です。"],["1kWhをジュールで表すと？","3600000J,3600J,36000J,360J",1,"正解は「3600000J」です。"],["電力が大きいほど、同じ時間に使うエネルギーは？","多い,少ない,同じ,ゼロ",1,"正解は「多い」です。"],["消費電力が800Wの電子レンジを15分（0.25時間）使ったときの電力量 ど多くの人々の和歌を集めた歌集,聖徳太子が中国の進んだ文化や制度を取り入れるために送った使い,中大兄皇子と中臣鎌足を中心に始められた政治改革",1,"正解は「聖徳太子がたてたとされる、世界最古の木造建築群」です。"],["次の説明に当てはまるものはどれ？\n「聖徳太子がたてたとされる、世界最古の木造建築群」","法隆寺,庸,鑑真,遣隋使",1,"正解は「法隆寺」です。（聖徳太子がたてたとされる、世界最古の木造建築群）"],["「大化の改新」について正しい説明はどれ？","中大兄皇子と中臣鎌足を中心に始められた政治改革,地方の特産物を納める税,天皇の命令で編集された歴史書で、奈良時代にできた,推古天皇の摂政となり、天皇中心の国づくりをすすめた",1,"正解は「中大兄皇子と中臣鎌足を中心に始められた政治改革」です。"],["次の説明に当てはまるものはどれ？\n「中大兄皇子と中臣鎌足を中心に始められた政治改革」","大化の改新,行基,東大寺,墾田永年私財法",1,"正解は「大化の改新」です。（中大兄皇子と中臣鎌足を中心に始められた政治改革）"]],"soc_asuka_elem_step2":[["「平城京」について正しい説明はどれ？","710年に奈良につくられた、唐の都にならった都,役人の心得を示したきまり,聖徳太子が中国の進んだ文化や制度を取り入れるために送った使い,新しく開墾した土地を永久に私有地としてよいと認めた法",1,"正解は「710年に奈良につくられた、唐の都にならった都」です。"],["次の説明に当てはまるものはどれ？\n「710年に奈良につくられた、唐の都にならった都」","平城京,鑑真,十七条の憲法,遣唐使",1,"正解は「平城京」です。（710年に奈良につくられた、唐の都にならった都）"],["「聖武天皇」について正しい説明はどれ？","仏教の力で国を治めようとして、大仏づくりを命じた天皇,聖徳太子が隋に送った使者,710年に奈良につくられた、唐の都にならった都,唐から来日し、唐招提寺を開いた僧",1,"正解は「仏教の力で国を治めようとして、大仏づくりを命じた天皇」です。"],["次の説明に当てはまるものはどれ？\n「仏教の力で国を治めようとして、大仏づくりを命じた天皇」","聖武天皇,冠位十二階,平城京,法隆寺",1,"正解は「聖武天皇」です。（仏教の力で国を治めようとして、大仏づくりを命じた天皇）"],["「東大寺」について正しい説明はどれ？","聖武天皇が建てた、大仏のある奈良の寺,民衆に仏教を広め、大仏づくりに協力した僧,唐から来日し、唐招提寺を開いた僧,天皇や貴族、防人など多くの人々の和歌を集めた歌集",1,"正解は「聖武天皇が建てた、大仏のある奈良の寺」です。"],["次の説明に当てはまるものはどれ？\n「聖武天皇が建てた、大仏のある奈良の寺」","東大寺,遣唐使,遣隋使,鑑真",1,"正解は「東大寺」です。（聖武天皇が建てた、大仏のある奈良の寺）"],["「行基」について正しい説明はどれ？","民衆に仏教を広め、大仏づくりに協力した僧,聖徳太子が中国の進んだ文化や制度を取り入れるために送った使い,役人の心得を示したきまり,田の収穫物の一部（稲）を納める税",1,"正解は「民衆に仏教を広め、大仏づくりに協力した僧」です。"],["次の説明に当てはまるものはどれ？\n「民衆に仏教を広め、大仏づくりに協力した僧」","行基,東大寺,平城京,小野妹子",1,"正解は「行基」です。（民衆に仏教を広め、大仏づくりに協力した僧）"],["「鑑真」について正しい説明はどれ？","唐から来日し、唐招提寺を開いた僧,新しく開墾した土地を永久に私有地としてよいと認めた法,日本の神話や歴史をまとめた、現存する日本最古の歴史書,民衆に仏教を広め、大仏づくりに協力した僧",1,"正解は「唐から来日し、唐招提寺を開いた僧」です。"],["次の説明に当てはまるものはどれ？\n「唐から来日し、唐招提寺を開いた僧」","鑑真,庸,聖徳太子,日本書紀",1,"正解は「鑑真」です。（唐から来日し、唐招提寺を開いた僧）"],["「遣唐使」について正しい説明はどれ？","唐の進んだ制度や文化を学ぶために送られた使い,能力や功績に応じて役人を取り立てた制度,民衆に仏教を広め、大仏づくりに協力した僧,唐から来日し、唐招提寺を開いた僧",1,"正解は「唐の進んだ制度や文化を学ぶために送られた使い」です。"],["次の説明に当てはまるものはどれ？\n「唐の進んだ制度や文化を学ぶために送られた使い」","遣唐使,遣隋使,小野妹子,聖武天皇",1,"正解は「遣唐使」です。（唐の進んだ制度や文化を学ぶために送られた使い）"],["「万葉集」について正しい説明はどれ？","天皇や貴族、防人など多くの人々の和歌を集めた歌集,日本の神話や歴史をまとめた、現存する日本最古の歴史書,天皇の命令で編集された歴史書で、奈良時代にできた,能力や功績に応じて役人を取り立てた制度",1,"正解は「天皇や貴族、防人など多くの人々の和歌を集めた歌集」です。"],["次の説明に当てはまるものはどれ？\n「天皇や貴族、防人など多くの人々の和歌を集めた歌集」","万葉集,聖武天皇,大化の改新,冠位十二階",1,"正解は「万葉集」です。（天皇や貴族、防人など多くの人々の和歌を集めた歌集）"]],"soc_asuka_elem_step3":[["「古事記」について正しい説明はどれ？","日本の神話や歴史をまとめた、現存する日本最古の歴史書,710年に奈良につくられた、唐の都にならった都,役人の心得を示したきまり,聖武天皇が建てた、大仏のある奈良の寺",1,"正解は「日本の神話や歴史をまとめた、現存する日本最古の歴史書」です。"],["次の説明に当てはまるものはどれ？\n「日本の神話や歴史をまとめた、現存する日本最古の歴史書」","古事記,行基,調,墾田永年私財法",1,"正解は「古事記」です。（日本の神話や歴史をまとめた、現存する日本最古の歴史書）"],["「日本書紀」について正しい説明はどれ？","天皇の命令で編集された歴史書で、奈良時代にできた,聖徳太子が中国の進んだ文化や制度を取り入れるために送った使い,唐から来日し、唐招提寺を開いた僧,唐の進んだ制度や文化を学ぶために送られた使い",1,"正解は「天皇の命令で編集された歴史書で、奈良時代にできた」です。"],["次の説明に当てはまるものはどれ？\n「天皇の命令で編集された歴史書で、奈良時代にできた」","日本書紀,行基,万葉集,法隆寺",1,"正解は「日本書紀」です。（天皇の命令で編集された歴史書で、奈良時代にできた）"],["「租」について正しい説明はどれ？","田の収穫物の一部（稲）を納める税,聖徳太子がたてたとされる、世界最古の木造建築群,民衆に仏教を広め、大仏づくりに協力した僧,中大兄皇子と中臣鎌足を中心に始められた政治改革",1,"正解は「田の収穫物の一部（稲）を納める税」です。"],["次の説明に当てはまるものはどれ？\n「田の収穫物の一部（稲）を納める税」","租,法隆寺,大化の改新,調",1,"正解は「租」です。（田の収穫物の一部（稲）を納める税）"],["「調」について正しい説明はどれ？","地方の特産物を納める税,労役の代わりに布を納める税,中大兄皇子と中臣鎌足を中心に始められた政治改革,民衆に仏教を広め、大仏づくりに協力した僧",1,"正解は「地方の特産物を納める税」です。"],["次の説明に当てはまるものはどれ？\n「地方の特産物を納める税」","調,遣唐使,聖徳太子,庸",1,"正解は「調」です。（地方の特産物を納める税）"],["「庸」について正しい説明はどれ？","労役の代わりに布を納める税,天皇の命令で編集された歴史書で、奈良時代にできた,推古天皇の摂政となり、天皇中心の国づくりをすすめた,天皇や貴族、防人など多くの人々の和歌を集めた歌集",1,"正解は「労役の代わりに布を納める税」です。"],["次の説明に当てはまるものはどれ？\n「労役の代わりに布を納める税」","庸,平城京,万葉集,遣隋使",1,"正解は「庸」です。（労役の代わりに布を納める税）"],["「墾田永年私財法」について正しい説明はどれ？","新しく開墾した土地を永久に私有地としてよいと認めた法,聖徳太子が中国の進んだ文化や制度を取り入れるために送った使い,中大兄皇子と中臣鎌足を中心に始められた政治改革,天皇の命令で編集された歴史書で、奈良時代にできた",1,"正解は「新しく開墾した土地を永久に私有地としてよいと認めた法」です。"],["次の説明に当てはまるものはどれ？\n「新しく開墾した土地を永久に私有地としてよいと認めた法」","墾田永年私財法,平城京,東大寺,租",1,"正解は「墾田永年私財法」です。（新しく開墾した土地を永久に私有地としてよいと認めた法）"]],"soc_civ_elem_step1":[["「国民主権」について正しい説明はどれ？","国の政治のあり方を最終的に決める力が国民にあること,国会が決めた法律や予算に基づいて政治を行う行政機関,国民が税金を納める義務,すべての人が生まれながらにもつ権利を大切にすること",1,"正解は「国の政治のあり方を最終的に決める力が国民にあること」です。"],["次の説明に当てはまるものはどれ？\n「国の政治のあり方を最終的に決める力が国民にあること」","国民主権,衆議院,選挙権,国事行為",1,"正解は「国民主権」です。（国の政治のあり方を最終的に決める力が国民にあること）"],["「基本的人権の尊重」について正しい説明はどれ？","すべての人が生まれながらにもつ権利を大切にすること,都道府県や市町村など、地域の政治を行う団体,国の政治のあり方を最終的に決める力が国民にあること,1946年11月3日",1,"正解は「すべての人が生まれながらにもつ権利を大切にすること」です。"],["次の説明に当てはまるものはどれ？\n「すべての人が生まれながらにもつ権利を大切にすること」","基本的人権の尊重,参議院,裁判所,選挙権",1,"正解は「基本的人権の尊重」です。（すべての人が生まれながらにもつ権利を大切にすること）"],["「平和主義」について正しい説明はどれ？","戦争を放棄し、戦力をもたないことを定めた考え方（憲法第9条）,すべての人が生まれながらにもつ権利を大切にすること,地方公共団体が定めるきまり,国会議員の中から国会が指名する、内閣の最高責任者",1,"正解は「戦争を放棄し、戦力をもたないことを定めた考え方（憲法第9条）」です。"],["次の説明に当てはまるものはどれ？\n「戦争を放棄し、戦力をもたないことを定めた考え方（憲法第9条）」","平和主義,内閣総理大臣,参議院,納税の義務",1,"正解は「平和主義」です。（戦争を放棄し、戦力をもたないことを定めた考え方（憲法第9条））"],["「日本国憲法の公布」について正しい説明はどれ？","1946年11月3日,満18歳以上の国民がもつ、政治に参加する権利,同じ事件について3回まで裁判を受けられる制度,国の権力を立法・行政・司法に分けて、互いに抑制し合う仕組み",1,"正解は「1946年11月3日」です。"],["次の説明に当てはまるものはどれ？\n「1946年11月3日」","日本国憲法の公布,国事行為,内閣総理大臣,国民主権",1,"正解は「日本国憲法の公布」です。（1946年11月3日）"],["「日本国憲法の施行」について正しい説明はどれ？","1947年5月3日,国会議員の中から国会が指名する、内閣の最高責任者,同じ事件について3回まで裁判を受けられる制度,任期4年で解散がある国会の議院",1,"正解は「1947年5月3日」です。"],["次の説明に当てはまるものはどれ？\n「1947年5月3日」","日本国憲法の施行,裁判所,参議院,天皇",1,"正解は「日本国憲法の施行」です。（1947年5月3日）"],["「天皇」について正しい説明はどれ？","日本国と日本国民統合の象徴,戦争を放棄し、戦力をもたないことを定めた考え方（憲法第9条）,国の政治の中心で、唯一の立法機関,1947年5月3日",1,"正解は「日本国と日本国民統合の象徴」です。"],["次の説明に当てはまるものはどれ？\n「日本国と日本国民統合の象徴」","天皇,選挙権,三権分立,内閣総理大臣",1,"正解は「天皇」です。（日本国と日本国民統合の象徴）"],["「国会」について正しい説明はどれ？","国の政治の中心で、唯一の立法機関,国会議員の中から国会が指名する、内閣の最高責任者,法律に基づいて争いごとを解決する司法機関,戦争を放棄し、戦力をもたないことを定めた考え方（憲法第9条）",1,"正解は「国の政治の中心で、唯一の立法機関」です。"],["次の説明に当てはまるものはどれ？\n「国の政治の中心で、唯一の立法機関」","国会,内閣,日本国憲法の公布,基本的人権の尊重",1,"正解は「国会」です。（国の政治の中心で、唯一の立法機関）"]],"soc_civ_elem_step2":[["「内閣」について正しい説明はどれ？","国会が決めた法律や予算に基づいて政治を行う行政機関,国民が税金を納める義務,都道府県や市町村など、地域の政治を行う団体,国の権力を立法・行政・司法に分けて、互いに抑制し合う仕組み",1,"正解は「国会が決めた法律や予算に基づいて政治を行う行政機関」です。"],["次の説明に当てはまるものはどれ？\n「国会が決めた法律や予算に基づいて政治を行う行政機関」","内閣,日本国憲法の施行,納税の義務,国民の三大義務",1,"正解は「内閣」です。（国会が決めた法律や予算に基づいて政治を行う行政機関）"],["「裁判所」について正しい説明はどれ？","法律に基づいて争いごとを解決する司法機関,国の政治のあり方を最終的に決める力が国民にあること,国会が決めた法律や予算に基づいて政治を行う行政機関,国の政治の中心で、唯一の立法機関",1,"正解は「法律に基づいて争いごとを解決する司法機関」です。"],["次の説明に当てはまるものはどれ？\n「法律に基づいて争いごとを解決する司法機関」","裁判所,基本的人権の尊重,選挙権,日本国憲法の公布",1,"正解は「裁判所」です。（法律に基づいて争いごとを解決する司法機関）"],["「三権分立」について正しい説明はどれ？","国の権力を立法・行政・司法に分けて、互いに抑制し合う仕組み,国民が税金を納める義務,同じ事件について3回まで裁判を受けられる制度,国の政治のあり方を最終的に決める力が国民にあること",1,"正解は「国の権力を立法・行政・司法に分けて、互いに抑制し合う仕組み」です。"],["次の説明に当てはまるものはどれ？\n「国の権力を立法・行政・司法に分けて、互いに抑制し合う仕組み」","三権分立,内閣,国民主権,平和主義",1,"正解は「三権分立」です。（国の権力を立法・行政・司法に分けて、互いに抑制し合う仕組み）"],["「衆議院」について正しい説明はどれ？","任期4年で解散がある国会の議院,子どもに教育を受けさせる義務・勤労の義務・納税の義務,国会議員の中から国会が指名する、内閣の最高責任者,国民が税金を納める義務",1,"正解は「任期4年で解散がある国会の議院」です。"],["次の説明に当てはまるものはどれ？\n「任期4年で解散がある国会の議院」","衆議院,条例,内閣総理大臣,国民の三大義務",1,"正解は「衆議院」です。（任期4年で解散がある国会の議院）"],["「参議院」について正しい説明はどれ？","任期6年で3年ごとに半数が改選される国会の議院,国の政治の中心で、唯一の立法機関,天皇が内閣の助言と承認によって行う行為,国会が決めた法律や予算に基づいて政治を行う行政機関",1,"正解は「任期6年で3年ごとに半数が改選される国会の議院」です。"],["次の説明に当てはまるものはどれ？\n「任期6年で3年ごとに半数が改選される国会の議院」","参議院,裁判所,地方公共団体,平和主義",1,"正解は「参議院」です。（任期6年で3年ごとに半数が改選される国会の議院）"],["「内閣総理大臣」について正しい説明はどれ？","国会議員の中から国会が指名する、内閣の最高責任者,国民が税金を納める義務,法律に基づいて争いごとを解決する司法機関,1947年5月3日",1,"正解は「国会議員の中から国会が指名する、内閣の最高責任者」です。"],["次の説明に当てはまるものはどれ？\n「国会議員の中から国会が指名する、内閣の最高責任者」","内閣総理大臣,内閣,選挙権,三審制",1,"正解は「内閣総理大臣」です。（国会議員の中から国会が指名する、内閣の最高責任者）"],["「三審制」について正しい説明はどれ？","同じ事件について3回まで裁判を受けられる制度,国の政治の中心で、唯一の立法機関,1946年11月3日,国会議員の中から国会が指名する、内閣の最高責任者",1,"正解は「同じ事件について3回まで裁判を受けられる制度」です。"],["次の説明に当てはまるものはどれ？\n「同じ事件について3回まで裁判を受けられる制度」","三審制,国民主権,日本国憲法の公布,基本的人権の尊重",1,"正解は「三審制」です。（同じ事件について3回まで裁判を受けられる制度）"]],"soc_civ_elem_step3":[["「選挙権」について正しい説明はどれ？","満18歳以上の国民がもつ、政治に参加する権利,法律に基づいて争いごとを解決する司法機関,都道府県や市町村など、地域の政治を行う団体,1947年5月3日",1,"正解は「満18歳以上の国民がもつ、政治に参加する権利」です。"],["次の説明に当てはまるものはどれ？\n「満18歳以上の国民がもつ、政治に参加する権利」","選挙権,裁判所,参議院,日本国憲法の施行",1,"正解は「選挙権」です。（満18歳以上の国民がもつ、政治に参加する権利）"],["「納税の義務」について正しい説明はどれ？","国民が税金を納める義務,国の権力を立法・行政・司法に分けて、互いに抑制し合う仕組み,戦争を放棄し、戦力をもたないことを定めた考え方（憲法第9条）,1947年5月3日",1,"正解は「国民が税金を納める義務」です。"],["次の説明に当てはまるものはどれ？\n「国民が税金を納める義務」","納税の義務,日本国憲法の施行,内閣,天皇",1,"正解は「納税の義務」です。（国民が税金を納める義務）"],["「地方公共団体」について正しい説明はどれ？","都道府県や市町村など、地域の政治を行う団体,法律に基づいて争いごとを解決する司法機関,国の政治のあり方を最終的に決める力が国民にあること,子どもに教育を受けさせる義務・勤労の義務・納税の義務",1,"正解は「都道府県や市町村など、地域の政治を行う団体」です。"],["次の説明 の部品を組み立て、関連工場が集まって生産する工業」です。"],["次の説明に当てはまるものはどれ？\n「多くの部品を組み立て、関連工場が集まって生産する工業」","自動車工業,太平洋ベルト,沖合漁業,加工貿易",1,"正解は「自動車工業」です。（多くの部品を組み立て、関連工場が集まって生産する工業）"],["「機械工業」について正しい説明はどれ？","日本の工業生産額の中で最も割合が大きい工業,東京・神奈川にまたがり、印刷業や機械工業がさかん,古くは日本の主要な輸出産業だった、衣類などをつくる工業,多くの部品を組み立て、関連工場が集まって生産する工業",1,"正解は「日本の工業生産額の中で最も割合が大きい工業」です。"],["次の説明に当てはまるものはどれ？\n「日本の工業生産額の中で最も割合が大きい工業」","機械工業,中京工業地帯,海外生産,食料品工業",1,"正解は「機械工業」です。（日本の工業生産額の中で最も割合が大きい工業）"],["「せんい工業」について正しい説明はどれ？","古くは日本の主要な輸出産業だった、衣類などをつくる工業,いけすなどで魚や貝を育てて出荷する漁業,卵からふ化させた稚魚を海に放流して育てる漁業,海岸近くで、日帰りできる範囲で行う漁業",1,"正解は「古くは日本の主要な輸出産業だった、衣類などをつくる工業」です。"],["次の説明に当てはまるものはどれ？\n「古くは日本の主要な輸出産業だった、衣類などをつくる工業」","せんい工業,栽培漁業,養殖業,遠洋漁業",1,"正解は「せんい工業」です。（古くは日本の主要な輸出産業だった、衣類などをつくる工業）"],["「食料品工業」について正しい説明はどれ？","農産物や水産物を加工する工業,原料を輸入し、製品にして輸出する貿易,関東から九州北部まで工業地帯・地域が帯状に連なる地域,いけすなどで魚や貝を育てて出荷する漁業",1,"正解は「農産物や水産物を加工する工業」です。"],["次の説明に当てはまるものはどれ？\n「農産物や水産物を加工する工業」","食料品工業,銚子港,海外生産,遠洋漁業",1,"正解は「食料品工業」です。（農産物や水産物を加工する工業）"],["「海外生産」について正しい説明はどれ？","人件費などを抑えるため、外国に工場をつくって生産すること,多くの部品を組み立て、関連工場が集まって生産する工業,日本の工業生産額の中で最も割合が大きい工業,愛知県を中心とし、自動車工業がさかんな日本最大の工業地帯",1,"正解は「人件費などを抑えるため、外国に工場をつくって生産すること」です。"],["次の説明に当てはまるものはどれ？\n「人件費などを抑えるため、外国に工場をつくって生産すること」","海外生産,太平洋ベルト,北九州工業地帯（地域）,中京工業地帯",1,"正解は「海外生産」です。（人件費などを抑えるため、外国に工場をつくって生産すること）"]],"soc_jp_climate_step1":[["「日本海側の気候」について正しい説明はどれ？","冬に北西の季節風の影響で雪が多い,地震などによって海底が動いて起こる大きな波,山地に囲まれ、一年を通じて降水量が少ない,山を越えた風が高温で乾燥し、気温が上がる現象",1,"正解は「冬に北西の季節風の影響で雪が多い」です。"],["次の説明に当てはまるものはどれ？\n「冬に北西の季節風の影響で雪が多い」","日本海側の気候,ハザードマップ,フェーン現象,南西諸島の気候",1,"正解は「日本海側の気候」です。（冬に北西の季節風の影響で雪が多い）"],["「太平洋側の気候」について正しい説明はどれ？","夏に南東の季節風の影響で雨が多い,温帯に属する,1995年に起こった大きな地震災害,南東から吹く",1,"正解は「夏に南東の季節風の影響で雨が多い」です。"],["次の説明に当てはまるものはどれ？\n「夏に南東の季節風の影響で雨が多い」","太平洋側の気候,日本の気候の大部分,フェーン現象,台風",1,"正解は「太平洋側の気候」です。（夏に南東の季節風の影響で雨が多い）"],["「内陸性の気候（中央高地）」について正しい説明はどれ？","一年を通じて降水量が少なく、昼夜の気温差が大きい,夏に南東の季節風の影響で雨が多い,2011年に起こり、津波による大きな被害が出た災害,温帯に属する",1,"正解は「一年を通じて降水量が少なく、昼夜の気温差が大きい」です。"],["次の説明に当てはまるものはどれ？\n「一年を通じて降水量が少なく、昼夜の気温差が大きい」","内陸性の気候（中央高地）,フェーン現象,阪神・淡路大震災,津波",1,"正解は「内陸性の気候（中央高地）」です。（一年を通じて降水量が少なく、昼夜の気温差が大きい）"],["「瀬戸内の気候」について正しい説明はどれ？","山地に囲まれ、一年を通じて降水量が少ない,日本の南で発生し、夏から秋に接近する熱帯低気圧,温帯に属する,夏に南東の季節風の影響で雨が多い",1,"正解は「山地に囲まれ、一年を通じて降水量が少ない」です。"],["次の説明に当てはまるものはどれ？\n「山地に囲まれ、一年を通じて降水量が少ない」","瀬戸内の気候,太平洋側の気候,阪神・淡路大震災,ハザードマップ",1,"正解は「瀬戸内の気候」です。（山地に囲まれ、一年を通じて降水量が少ない）"],["「南西諸島の気候」について正しい説明はどれ？","一年を通じて温暖で雨が多い（亜熱帯）,北西から吹く,東北地方の太平洋側に夏に吹く冷たい北東風,一年を通じて降水量が少なく、昼夜の気温差が大きい",1,"正解は「一年を通じて温暖で雨が多い（亜熱帯）」です。"],["次の説明に当てはまるものはどれ？\n「一年を通じて温暖で雨が多い（亜熱帯）」","南西諸島の気候,火山の恩恵,季節風（モンスーン）,ハザードマップ",1,"正解は「南西諸島の気候」です。（一年を通じて温暖で雨が多い（亜熱帯））"],["「北海道の気候」について正しい説明はどれ？","冷帯（亜寒帯）で、冬の寒さがきびしく梅雨がない,6月から7月にかけて雨が降り続く時期,地震などによって海底が動いて起こる大きな波,南東から吹く",1,"正解は「冷帯（亜寒帯）で、冬の寒さがきびしく梅雨がない」です。"],["次の説明に当てはまるものはどれ？\n「冷帯（亜寒帯）で、冬の寒さがきびしく梅雨がない」","北海道の気候,日本海側の気候,津波,東日本大震災",1,"正解は「北海道の気候」です。（冷帯（亜寒帯）で、冬の寒さがきびしく梅雨がない）"],["「季節風（モンスーン）」について正しい説明はどれ？","季節によって吹く向きが変わる風,日本の南で発生し、夏から秋に接近する熱帯低気圧,北西から吹く,温泉や地熱発電、美しい景観など",1,"正解は「季節によって吹く向きが変わる風」です。"],["次の説明に当てはまるものはどれ？\n「季節によって吹く向きが変わる風」","季節風（モンスーン）,夏の季節風,阪神・淡路大震災,活火山",1,"正解は「季節風（モンスーン）」です。（季節によって吹く向きが変わる風）"]],"soc_jp_climate_step2":[["「梅雨」について正しい説明はどれ？","6月から7月にかけて雨が降り続く時期,温泉や地熱発電、美しい景観など,東北地方の太平洋側に夏に吹く冷たい北東風,温帯に属する",1,"正解は「6月から7月にかけて雨が降り続く時期」です。"],["次の説明に当てはまるものはどれ？\n「6月から7月にかけて雨が降り続く時期」","梅雨,ハザードマップ,活火山,阪神・淡路大震災",1,"正解は「梅雨」です。（6月から7月にかけて雨が降り続く時期）"],["「台風」について正しい説明はどれ？","日本の南で発生し、夏から秋に接近する熱帯低気圧,温帯に属する,2011年に起こり、津波による大きな被害が出た災害,1995年に起こった大きな地震災害",1,"正解は「日本の南で発生し、夏から秋に接近する熱帯低気圧」です。"],["次の説明に当てはまるものはどれ？\n「日本の南で発生し、夏から秋に接近する熱帯低気圧」","台風,津波,やませ,梅雨",1,"正解は「台風」です。（日本の南で発生し、夏から秋に接近する熱帯低気圧）"],["「冬の季節風」について正しい説明はどれ？","北西から吹く,冷帯（亜寒帯）で、冬の寒さがきびしく梅雨がない,自然災害の被害を予測し、避難場所などを示した地図,一年を通じて降水量が少なく、昼夜の気温差が大きい",1,"正解は「北西から吹く」です。"],["次の説明に当てはまるものはどれ？\n「北西から吹く」","冬の季節風,台風,火山の恩恵,ハザードマップ",1,"正解は「冬の季節風」です。（北西から吹く）"],["「夏の季節風」について正しい説明はどれ？","南東から吹く,温泉や地熱発電、美しい景観など,1995年に起こった大きな地震災害,おおむね過去1万年以内に噴火した火山",1,"正解は「南東から吹く」です。"],["次の説明に当てはまるものはどれ？\n「南東から吹く」","夏の季節風,日本の気候の大部分,南西諸島の気候,太平洋側の気候",1,"正解は「夏の季節風」です。（南東から吹く）"],["「ハザードマップ」について正しい説明はどれ？","自然災害の被害を予測し、避難場所などを示した地図,1995年に起こった大きな地震災害,季節によって吹く向きが変わる風,一年を通じて降水量が少なく、昼夜の気温差が大きい",1,"正解は「自然災害の被害を予測し、避難場所などを示した地図」です。"],["次の説明に当てはまるものはどれ？\n「自然災害の被害を予測し、避難場所などを示した地図」","ハザードマップ,太平洋側の気候,梅雨,北海道の気候",1,"正解は「ハザードマップ」です。（自然災害の被害を予測し、避難場所などを示した地図）"],["「活火山」について正しい説明はどれ？","おおむね過去1万年以内に噴火した火山,1995年に起こった大きな地震災害,山地に囲まれ、一年を通じて降水量が少ない,季節によって吹く向きが変わる風",1,"正解は「おおむね過去1万年以内に噴火した火山」です。"],["次の説明に当てはまるものはどれ？\n「おおむね過去1万年以内に噴火した火山」","活火山,冬の季節風,太平洋側の気候,瀬戸内の気候",1,"正解は「活火山」です。（おおむね過去1万年以内に噴火した火山）"],["「阪神・淡路大震災」について正しい説明はどれ？","1995年に起こった大きな地震災害,冬に北西の季節風の影響で雪が多い,北西から吹く,おおむね過去1万年以内に噴火した火山",1,"正解は「1995年に起こった大きな地震災害」です。"],["次の説明に当てはまるものはどれ？\n「1995年に起こった大きな地震災害」","阪神・淡路大震災,火山の恩恵,やませ,フェーン現象",1,"正解は「阪神・淡路大震災」です。（1995年に起こった大きな地震災害）"]],"soc_jp_climate_step3":[["「東日本大震災」について正しい説明はどれ？","2011年に起こり、津波による大きな被害が出た災害,一年を通じて温暖で雨が多い（亜熱帯）,季節によって吹く向きが変わる風,夏に南東の季節風の影響で雨が多い",1,"正解は「2011年に起こり、津波による大きな被害が出た災害」です。"],["次の説明に当てはまるものはどれ？\n「2011年に起こり、津波による大きな被害が出た災害」","東日本大震災,太平洋側の気候,台風,冬の季節風",1,"正解は「東日本大震災」です。（2011年に起こり、津波による大きな被害が出た災害）"],["「津波」について正しい説明はどれ？","地震などによって海底が動いて起こる大きな波,北西から吹く,夏に南東の季節風の影響で雨が多い,冬に北西の季節風の影響で雪が多い",1,"正解は「地震などによって海底が動いて起こる大きな波」です。"],["次の説明に当てはまるものはどれ？\n「地震などによって海底が動いて起こる大きな波」","津波,やませ,冬の季節風,北海道の気候",1,"正解は「津波」です。（地震などによって海底が動いて起こる大きな波）"],["「火山の恩恵」について正しい説明はどれ？","温泉や地熱発電、美しい景観など,自然災害の被害を予測し、避難場所などを示した地図,山を越えた風が高温で乾燥し、気温が上がる現象,地震などによって海底が動いて起こる大きな波",1,"正解は「温泉や地熱発電、美しい景観など」です。"],["次の説明に当てはまるものはどれ？\n「温泉や地熱発電、美しい景観など」","火山の恩恵,日本海側の気候,やませ,東日本大震災",1,"正解は「火山の恩恵」です。（温泉や地熱発電、美しい景観など）"],["「日本の気候の大部分」について正しい説明はどれ？","温帯に属する,一年を通じて降水量が少なく、昼夜の気温差が大きい,1995年に起こった大きな地震災害,地震などによって海底が動いて起こる大きな波",1,"正解は「温帯に属する」です。"],["次の説明に当てはまるものはどれ？\n「温帯に属する」","日本の気候の大部分,南西諸島の気候,フェーン現象,やませ",1,"正解は「日本の気候の大部分」です。（温帯に属する）"],["「フェーン現象」について正しい説明はどれ？","山を越えた風が高温で乾燥し、気温が上がる現象,日本の南で発生し、夏から秋に接近する熱帯低気圧,一年を通じて降水量が少なく、昼夜の気温差が大きい,一年を通じて温暖で雨が多い（亜熱帯）",1,"正解は「山を越えた風が高温で乾燥し、気温が上がる現象」です。"],["次の説明に当てはまるものはどれ？\n「山を越えた風が高温で乾燥し、気温が上がる現象」","フェーン現象,冬の季節風,季節風（モンスーン）,内陸性の気候（中央高地）",1,"正解は「フェーン現象」です。（山を越えた風が高温で乾燥し、気温が上がる現象）"],["「やませ」について正しい説明はどれ？","東北地方の太平洋側に夏に吹く冷たい北東風,温泉や地熱発電、美しい景観など,日本の南で発生し、夏から秋に接近する熱帯低気圧,山を越えた風が高温で乾燥し、気温が上がる現象",1,"正解は「東北地方の太平洋側に夏に吹く冷たい北東風」です。"],["次の説明に当てはまるものはどれ？\n「東北地方の太平洋側に夏に吹く冷たい北東風」","やませ,ハザードマップ,南西諸島の気候,夏の季節風",1,"正解は「やませ」です。（東北地方の太平洋側に夏に吹く冷たい北東風）"]],"soc_jp_region_step1":[["「北海道地方」について正しい説明はどれ？","酪農や稲作・水産業がさかんで、広い農地をもつ,米づくりやりんごなどの果樹栽培がさかん,東京湾沿いに広がる工業地帯,高原の涼しい気候を生かして出荷時期をおくらせる栽培方法",1,"正解は「酪農や稲作・水産業がさかんで、広い農地をもつ」です。"],["次の説明に当てはまるものはどれ？\n「酪農や稲作・水産業がさかんで、広い農地をもつ」","北海道地方,促成栽培,関東地方,琉球王国",1,"正解は「北海道地方」です。（酪農や稲作・水産業がさかんで、広い農地をもつ）"],["「東北地方」について正しい説明はどれ？","米づくりやりんごなどの果樹栽培がさかん,鹿児島県にある、縄文杉で有名な世界自然遺産,瀬戸内工業地域があり、本州四国連絡橋でつながっている,ビニールハウスなどで野菜の出荷時期を早める栽培方法",1,"正解は「米づくりやりんごなどの果樹栽培がさかん」です。"],["次の説明に当てはまるものはどれ？\n「米づくりやりんごなどの果樹栽培がさかん」","東北地方,近畿地方,九州地方,北九州工業地帯",1,"正解は「東北地方」です。（米づくりやりんごなどの果樹栽培がさかん）"],["「関東地方」について正しい説明はどれ？","人口が集中し、東京を中心に商業・工業が発達している,瀬戸内工業地域があり、本州四国連絡橋でつながっている,酪農や稲作・水産業がさかんで、広い農地をもつ,沖縄県にあった王国で、独自の文化を育んだ",1,"正解は「人口が集中し、東京を中心に商業・工業が発達している」です。"],["次の説明に当てはまるものはどれ？\n「人口が集中し、東京を中心に商業・工業が発達している」","関東地方,屋久島,阿蘇山,近畿地方",1,"正解は「関東地方」です。（人口が集中し、東京を中心に商業・工業が発達している）"],["「中部地方」について正しい説明はどれ？","東海・中央高地・北陸に分けられ、中京工業地帯がある,かつて鉄鋼業が中心だった福岡県の工業地帯,沖縄県にあった王国で、独自の文化を育んだ,ビニールハウスなどで野菜の出荷時期を早める栽培方法",1,"正解は「東海・中央高地・北陸に分けられ、中京工業地帯がある」です。"],["次の説明に当てはまるものはどれ？\n「東海・中央高地・北陸に分けられ、中京工業地帯がある」","中部地方,関東地方,琉球王国,高原野菜",1,"正解は「中部地方」です。（東海・中央高地・北陸に分けられ、中京工業地帯がある）"],["「近畿地方」について正しい説明はどれ？","古い歴史をもつ京都・奈良があり、阪神工業地帯がある,本州と四国・九州の間にあり、多くの島がある内海,米づくりやりんごなどの果樹栽培がさかん,青森県と秋田県にまたがる世界自然遺産",1,"正解は「古い歴史をもつ京都・奈良があり、阪神工業地帯がある」です。"],["次の説明に当てはまるものはどれ？\n「古い歴史をもつ京都・奈良があり、阪神工業地帯がある」","近畿地方,瀬戸内海,知床,屋久島",1,"正解は「近畿地方」です。（古い歴史をもつ京都・奈良があり、阪神工業地帯がある）"],["「中国・四国地方」について正しい説明はどれ？","瀬戸内工業地域があり、本州四国連絡橋でつながっている,本州と四国・九州の間にあり、多くの島がある内海,ビニールハウスなどで野菜の出荷時期を早める栽培方法,人口が集中し、東京を中心に商業・工業が発達している",1,"正解は「瀬戸内工業地域があり、本州四国連絡橋でつながっている」です。"],["次の説明に当てはまるものはどれ？\n「瀬戸内工業地域があり、本州四国連絡橋でつながっている」","中国・四国地方,北九州工業地帯,琉球王国,促成栽培",1,"正解は「中国・四国地方」です。（瀬戸内工業地域があり、本州四国連絡橋でつながっている）"],["「九州地方」について正しい説明はどれ？","畜産がさかんで、阿蘇山などの火山が多い,日本最大の平野で、人口が多く都市が発達している,熊本県にある、大きなカルデラをもつ火山,沖縄県にあった王国で、独自の文化を育んだ",1,"正解は「畜産がさかんで、阿蘇山などの火山が多い」です。"],["次の説明に当てはまるものはどれ？\n「畜産がさかんで、阿蘇山などの火山が多い」","九州地方,抑制栽培 文化",1,"正解は「鎌倉幕府を倒して建武の新政を行った天皇」です。"],["次の説明に当てはまるものはどれ？\n「鎌倉幕府を倒して建武の新政を行った天皇」","後醍醐天皇,土一揆,守護大名,銀閣",1,"正解は「後醍醐天皇」です。（鎌倉幕府を倒して建武の新政を行った天皇）"],["「南北朝時代」について正しい説明はどれ？","京都と吉野に二つの朝廷が並び立った時代,観阿弥・世阿弥が大成した芸能,足利義政が京都の東山に建てた建物,商工業者の同業組合",1,"正解は「京都と吉野に二つの朝廷が並び立った時代」です。"],["次の説明に当てはまるものはどれ？\n「京都と吉野に二つの朝廷が並び立った時代」","南北朝時代,管領,琉球王国,守護大名",1,"正解は「南北朝時代」です。（京都と吉野に二つの朝廷が並び立った時代）"]],"soc_parl_sys_step1":[["「議院内閣制」について正しい説明はどれ？","内閣が国会の信任にもとづいて成立し、国会に対して責任を負う仕組み,政権を担当する政党,得票に応じて政党に議席を配分する制度,参議院が否決しても衆議院が出席議員の3分の2以上で可決すれば成立",1,"正解は「内閣が国会の信任にもとづいて成立し、国会に対して責任を負う仕組み」です。"],["次の説明に当てはまるものはどれ？\n「内閣が国会の信任にもとづいて成立し、国会に対して責任を負う仕組み」","議院内閣制,衆議院解散後の総選挙,小選挙区制,大統領制",1,"正解は「議院内閣制」です。（内閣が国会の信任にもとづいて成立し、国会に対して責任を負う仕組み）"],["「大統領制」について正しい説明はどれ？","大統領を国民が直接（または間接に）選び、議会と分立する仕組み,予算の議決・条約の承認・内閣総理大臣の指名で認められる,政権を担当していない政党,内閣が国会の信任にもとづいて成立し、国会に対して責任を負う仕組み",1,"正解は「大統領を国民が直接（または間接に）選び、議会と分立する仕組み」です。"],["次の説明に当てはまるものはどれ？\n「大統領を国民が直接（または間接に）選び、議会と分立する仕組み」","大統領制,参議院,比例代表制,国務大臣",1,"正解は「大統領制」です。（大統領を国民が直接（または間接に）選び、議会と分立する仕組み）"],["「内閣不信任の決議」について正しい説明はどれ？","可決されると、内閣は10日以内に衆議院解散か総辞職を選ぶ,政権を担当していない政党,小選挙区比例代表並立制,政権を担当する政党",1,"正解は「可決されると、内閣は10日以内に衆議院解散か総辞職を選ぶ」です。"],["次の説明に当てはまるものはどれ？\n「可決されると、内閣は10日以内に衆議院解散か総辞職を選ぶ」","内閣不信任の決議,内閣総理大臣の指名,野党,内閣総理大臣",1,"正解は「内閣不信任の決議」です。（可決されると、内閣は10日以内に衆議院解散か総辞職を選ぶ）"],["「内閣総理大臣の指名」について正しい説明はどれ？","国会議員の中から国会が行う,1つの選挙区から1名が当選する選挙制度,予算の議決・条約の承認・内閣総理大臣の指名で認められる,大統領を国民が直接（または間接に）選び、議会と分立する仕組み",1,"正解は「国会議員の中から国会が行う」です。"],["次の説明に当てはまるものはどれ？\n「国会議員の中から国会が行う」","内閣総理大臣の指名,大統領制,議院内閣制,衆議院の優越",1,"正解は「内閣総理大臣の指名」です。（国会議員の中から国会が行う）"],["「国務大臣」について正しい説明はどれ？","その過半数は国会議員でなければならない,政権を担当していない政党,毎年1回、1月中に召集され会期は150日,解散がなく、任期は6年（3年ごとに半数改選）",1,"正解は「その過半数は国会議員でなければならない」です。"],["次の説明に当てはまるものはどれ？\n「その過半数は国会議員でなければならない」","国務大臣,党首討論,衆議院議員の任期,衆議院の優越",1,"正解は「国務大臣」です。（その過半数は国会議員でなければならない）"],["「内閣総理大臣」について正しい説明はどれ？","国務大臣を任命・罷免する権限をもつ,大統領を国民が直接（または間接に）選び、議会と分立する仕組み,得票に応じて政党に議席を配分する制度,1つの選挙区から1名が当選する選挙制度",1,"正解は「国務大臣を任命・罷免する権限をもつ」です。"],["次の説明に当てはまるものはどれ？\n「国務大臣を任命・罷免する権限をもつ」","内閣総理大臣,比例代表制,国務大臣,常会（通常国会）",1,"正解は「内閣総理大臣」です。（国務大臣を任命・罷免する権限をもつ）"],["「衆議院の優越」について正しい説明はどれ？","予算の議決・条約の承認・内閣総理大臣の指名で認められる,政権を担当していない政党,小選挙区比例代表並立制,内閣が国会の信任にもとづいて成立し、国会に対して責任を負う仕組み",1,"正解は「予算の議決・条約の承認・内閣総理大臣の指名で認められる」です。"],["次の説明に当てはまるものはどれ？\n「予算の議決・条約の承認・内閣総理大臣の指名で認められる」","衆議院の優越,参議院,臨時会（臨時国会）,衆議院解散後の総選挙",1,"正解は「衆議院の優越」です。（予算の議決・条約の承認・内閣総理大臣の指名で認められる）"]],"soc_parl_sys_step2":[["「法律案の再可決」について正しい説明はどれ？","参議院が否決しても衆議院が出席議員の3分の2以上で可決すれば成立,4年（解散あり）,大統領を国民が直接（または間接に）選び、議会と分立する仕組み,内閣が国会の信任にもとづいて成立し、国会に対して責任を負う仕組み",1,"正解は「参議院が否決しても衆議院が出席議員の3分の2以上で可決すれば成立」です。"],["次の説明に当てはまるものはどれ？\n「参議院が否決しても衆議院が出席議員の3分の2以上で可決すれば成立」","法律案の再可決,野党,与党,内閣不信任の決議",1,"正解は「法律案の再可決」です。（参議院が否決しても衆議院が出席議員の3分の2以上で可決すれば成立）"],["「常会（通常国会）」について正しい説明はどれ？","毎年1回、1月中に召集され会期は150日,解散がなく、任期は6年（3年ごとに半数改選）,得票に応じて政党に議席を配分する制度,その過半数は国会議員でなければならない",1,"正解は「毎年1回、1月中に召集され会期は150日」です。"],["次の説明に当てはまるものはどれ？\n「毎年1回、1月中に召集され会期は150日」","常会（通常国会）,参議院,大統領制,比例代表制",1,"正解は「常会（通常国会）」です。（毎年1回、1月中に召集され会期は150日）"],["「臨時会（臨時国会）」について正しい説明はどれ？","内閣が必要と認めたとき召集される,解散がなく、任期は6年（3年ごとに半数改選）,参議院が否決しても衆議院が出席議員の3分の2以上で可決すれば成立,国会議員の中から国会が行う",1,"正解は「内閣が必要と認めたとき召集される」です。"],["次の説明に当てはまるものはどれ？\n「内閣が必要と認めたとき召集される」","臨時会（臨時国会）,法律案の再可決,比例代表制,衆議院解散後の総選挙",1,"正解は「臨時会（臨時国会）」です。（内閣が必要と認めたとき召集される）"],["「特別会（特別国会）」について正しい説明はどれ？","衆議院の解散総選挙後30日以内に召集される,国務大臣を任命・罷免する権限をもつ,参議院が否決しても衆議院が出席議員の3分の2以上で可決すれば成立,その過半数は国会議員でなければならない",1,"正解は「衆議院の解散総選挙後30日以内に召集される」です。"],["次の説明に当てはまるものはどれ？\n「衆議院の解散総選挙後30日以内に召集される」","特別会（特別国会）,法律案の再可決,衆議院の優越,大統領制",1,"正解は「特別会（特別国会）」です。（衆議院の解散総選挙後30日以内に召集される）"],["「衆議院解散後の総選挙」について正しい説明はどれ？","解散の日から40日以内に行う,衆議院の解散総選挙後30日以内に召集される,国務大臣を任命・罷免する権限をもつ,参議院が否決しても衆議院が出席議員の3分の2以上で可決すれば成立",1,"正解は「解散の日から40日以内に行う」です。"],["次の説明に当てはまるものはどれ？\n「解散の日から40日以内に行う」","衆議院解散後の総選挙,党首討論,小選挙区制,参議院",1,"正解は「衆議院解散後の総選挙」です。（解散の日から40日以内に行う）"],["「参議院」について正しい説明はどれ？","解散がなく、任期は6年（3年ごとに半数改選）,1つの選挙区から1名が当選する選挙制度,得票に応じて政党に議席を配分する制度,政権を担当する政党",1,"正解は「解散がなく、任期は6年（3年ごとに半数改選）」です。"],["次の説明に当てはまるものはどれ？\n「解散がなく、任期は6年（3年ごとに半数改選）」","参議院,衆議院議員の任期,党首討論,比例代表制",1,"正解は「参議院」です。（解散がなく、任期は6年（3年ごとに半数改選））"],["「衆議院議員の任期」について正しい説明はどれ？","4年（解散あり）,内閣が必要と認めたとき召集される,国会議員の中から国会が行う,国務大臣を任命・罷免する権限をもつ",1,"正解は「4年（解散あり）」です。"],["次の説明に当てはまるものはどれ？\n「4年（解散あり）」","衆議院議員の任期,与党,特別会（特別国会）,臨時会（臨時国会）",1,"正解は「衆議院議員の任期」です。（4年（解散あり））"]],"soc_parl_sys_step3":[["「小選挙区制」について正しい説明はどれ？","1つの選挙区から1名が当選する選挙制度,4年（解散あり）,国会議員の中から国会が行う,内閣が国会の信任にもとづいて成立し、国会に対して責任を負う仕組み",1,"正解は「1つの選挙区から1名が当選する選挙制度」です。"],["次の説明に当てはまるものはどれ？\n「1つの選挙区から1名が当選する選挙制度」","小選挙区制,衆議院解散後の総選挙,与党,法律案の再可決",1,"正解は「小選挙区制」です。（1つの選挙区から1名が当選する選挙制度）"],["「比例代表制」について正しい説明はどれ？","得票に応じて政党に議席を配分する制度,解散の日から40日以内に行う,参議院が否決しても衆議院が出席議員の3分の2以上で可決すれば成立,大統領を国民が直接（または間接に）選び、議会と分立する仕組み",1,"正解は「得票に応じて政党に議席を配分する制度」です。"],["次の説明に当てはまるものはどれ？\n「得票に応じて政党に議席を配分する制度」","比例代表制,衆議院の選挙制度,特別会（特別国会）,衆議院解散後の総選挙",1,"正解は「比例代表制」です。（得票に応じて政党に議席を配分する制度）"],["「衆議院の選挙制度」について正しい説明はどれ？","小選挙区比例代表並立制,政権を担当していない政党,毎年1回、1月中に召集され会期は150日,予算の議決・条約の承認・内閣総理大臣の指名で認められる",1,"正解は「小選挙区比例代表並立制」です。"],["次の説明に当てはまるものはどれ？\n「小選挙区比例代表並立制」","衆議院の選挙制度,衆議院解散後の総選挙,特別会（特別国会）,党首討論",1,"正解は「衆議院の選挙制度」です。（小選挙区比例代表並立制）"],["「党首討論」について正しい説明はどれ？","国会で与野党の党首が政策を論じる場,大統領を国民が直接（または間接に）選び、議会と分立する仕組み,予算の議決・条約の承認・内閣総理大臣の指名で認められる,政権を担当する政党",1,"正解は「国会で与野党の党首が政策を論じる場」です。"],["次の説明に当てはまるものはどれ？\n「国会で与野党の党首が政策を論じる場」","党首討論,与党,衆議院の選挙制度,小選挙区制",1,"正解は「党首討論」です。（国会で与野党の党首が政策を論じる場）"],["「与党」について正しい説明はどれ？","政権を担当する政党,参議院が否決しても衆議院が出席議員の3分の2以上で可決すれば成立,解散がなく、任期は6年（3年ごとに半数改選）,衆議院の解散総選挙後30日以内に召集される",1,"正解は「政権を担当する政党」です。"],["次の説明に当てはまるものはどれ？\n「政権を担当する政党」","与党,野党,法律案の再可決,大統領制",1,"正解は「与党」です。（政権を担当する政党）"],["「野党」について正しい説明はどれ？","政権を担当していない政党,小選挙区比例代表並立制,予算の議決・条約の承認・内閣総理大臣の指名で認められる,1つの選挙区から1名が当選する選挙制度",1,"正解は「政権を担当していない政党」です。"],["次の説明に当てはまるものはどれ？\n「政権を担当していない政党」","野党,小選挙区制,内閣総理大臣の指名,衆議院の優越",1,"正解は「野党」です。（政権を担当していない政党）"]],"soc_postwar_step1":[["「GHQ（連合国軍総司令部）」について正しい説明はどれ？","日本占領の最高機関で、最高司令官はマッカーサー,自由民主党と日本社会党による政治体制,高度経済成長期に、水俣病などが社会問題になった,1964年に開かれ、東海道新幹線も開通した",1,"正解は「日本占領の最高機関で、最高司令官はマッカーサー」です。"],["次の説明に当てはまるものはどれ？\n「日本占領の最高機関で、最高司令官はマッカーサー」","GHQ（連合国軍総司令部）,朝鮮戦争,財閥解体,日米安全保障条約",1,"正解は「GHQ（連合国軍総司令部）」です。（日本占領の最高機関で、最高司令官はマッカーサー）"],["「農地改革」について正しい説明はどれ？","地主の土地を安く買い上げて小作人に売り渡した改革,1965年に結ばれ、韓国との国交が正常化   // 「学習範囲」と「確認観点」を問う固有問題を2問ずつ作成する。
  // 問題文は重複チェックの対象にし、既存問題と同じ場合は追加しない。
  (function enrichKnowledgePools() {
    const nonMathUnits = UNIT_CATALOG.filter(unit => unit.subj !== "math");
    const clean = value => String(value || "")
      .replace(/,/g, "・")
      .replace(/\s+/g, " ")
      .trim();
    const addUnique = (pool, item) => {
      if (!pool.some(existing => existing[0] === item[0])) pool.push(item);
    };

    nonMathUnits.forEach((unit, index) => {
      const key = unit.steps.step1.key;
      const correct = clean(unit.desc);
      if (!key || !correct) return;

      const peers = nonMathUnits
        .filter(other => other.subj === unit.subj && other.id !== unit.id)
        .map(other => clean(other.desc))
        .filter(desc => desc && desc !== correct);
      const distractors = [];
      for (let offset = 0; offset < peers.length && distractors.length < 3; offset++) {
        const candidate = peers[(index + offset) % peers.length];
        if (!distractors.includes(candidate)) distractors.push(candidate);
      }
      while (distractors.length < 3) distractors.push("この単元とは直接関係しない内容");
      const options = [correct, ...distractors].join(",");
      const explanation = `「${unit.name}」では、${correct}を確認します。`;
      const step1Key = `${key}_step1`;
      const step2Key = `${key}_step2`;
      if (!Array.isArray(KNOWLEDGE_TUPLES[step1Key])) KNOWLEDGE_TUPLES[step1Key] = [];
      if (!Array.isArray(KNOWLEDGE_TUPLES[step2Key])) KNOWLEDGE_TUPLES[step2Key] = [];

      addUnique(KNOWLEDGE_TUPLES[step1Key], [
        `「${unit.name}」で主に学ぶ内容として最も適切なものは？`, options, 1, explanation
      ]);
      addUnique(KNOWLEDGE_TUPLES[step2Key], [
        `「${unit.name}」を学ぶときに確認する中心事項は？`, options, 1, explanation
      ]);
    });
  })();

  function buildMemoryQuestions(raw) {
    const pairs = raw.split('|').map(v => v.trim().split(/\s+/)).filter(v => v.length >= 2);
    return pairs.map((p, i) => {
      const distractors = [pairs[(i + 1) % pairs.length][1], pairs[(i + 2) % pairs.length][1], pairs[(i + 3) % pairs.length][1]];
      return [`「${p[0]}」の意味・答えとして正しいものは？`, [p[1], ...distractors].join(','), 1, `「${p[0]}」は「${p[1]}」です。`];
    });
  }

      for (let i = 1; i <= 3; i++) KNOWLEDGE_TUPLES[`${partKey}_step${i}`] = chunk.slice((i - 1) * size, i * size);
      const partName = chunks.length === 1 ? name : `${name}（${chunkIndex + 1}/${chunks.length}）`;
      addUnit(chunks.length === 1 ? id : `${id}_p${chunkIndex + 1}`, subj, group, partName, badge, desc, partKey);
      UNIT_CATALOG[UNIT_CATALOG.length - 1].memoryIntensive = true;
    });
  }

  function buildMainMenus() {
    const categories = {
      math: { elem: "mathGrid_elem", junior: "mathGrid_junior", high: "mathGrid_high", uni: "mathGrid_uni" },
      japanese: { elem: "jpGrid_elem", junior: "jpGrid_junior", high: "jpGrid_high" },
      english: { elem: "enGrid_elem", junior: "enGrid_junior", high: "enGrid_high" },
      science: { elem: "sciGrid_elem", junior: "sciGrid_junior", high: "sciGrid_high" },
      social: { elem: "socGrid_elem", junior: "socGrid_junior", high: "socGrid_high" },
      information: { junior: "informationGrid_junior", high: "informationGrid_high" }
    };

    UNIT_CATALOG.forEach(u => {
      const targetMap = categories[u.subj];
      if (!targetMap) return;
      const gridId = targetMap[u.group];
      if (!gridId) return;
      const grid = document.getElementById(gridId);
      if (!grid) return;

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "menuBtn";
      btn.onclick = () => window.openUnitSubMenu(u.id);
      btn.innerHTML = `
        <span class="btnLabel">${esc(u.name)}</span>
        <span class="btnBadge">${esc(u.badge)}</span>
      `;
      grid.appendChild(btn);
    });

    updateSchoolCounts();
  }

    document.getElementById("subUnitDesc").textContent = unit.desc;

    const termAction = document.getElementById("termGuideAction");

    const formulaButton = document.getElementById("mathFormulaButton");
    const termButton = document.getElementById("termGuideButton");

    const steps = unit.steps;
    const stepKeys = unit.subj === "information"
      ? ['official', 'learn', 'master', 'random']
      : ['official', 'learn', 'master', 'random', 'test'];

    listEl.innerHTML = stepKeys.map((k, idx) => {
      const st = steps[k];
      if (!st) return "";
      const isFinal = (k === 'test');
      const isRandom = (k === 'random');
      const iconText = isFinal ? "🏆" : (isRandom ? "🎲" : (idx + 1));

      const stepPool = KNOWLEDGE_TUPLES[`${targetKey}_${k}`] || KNOWLEDGE_TUPLES[targetKey];
      const allUnitQuestions = ['step1', 'step2', 'step3'].flatMap(sk => KNOWLEDGE_TUPLES[`${targetKey}_${sk}`] || []);
      const poolCount = allUnitQuestions.length
        ? Math.min(50, new Set(allUnitQuestions.map(item => item[0])).size)
        : ((stepPool && Array.isArray(stepPool)) ? stepPool.length : 32);
      let badgeText = isFinal ? `実力判定(${targetKey === "jp_kanji" || targetKey === "soc_pref" ? "240問" : "96問"})` : (isRandom ? "ランダム(全問)" : `${settings.questionCount}問出題（問題文${poolCount}問）`);

          badgeText = isFinal ? "実力判定(九九総合)" : (isRandom ? "ランダム" : "九九・虫食い・筆算");

  window.startSubjectRandomTest = function(subjKey) {
    const targetSubj = subjKey || currentSubject;
    const units = UNIT_CATALOG.filter(u => u.subj === targetSubj);
    if (!units || units.length === 0) return;

    // シャッフルして10問分のテストキューを生成
    const shuffledUnits = shuffleArray(units);
    const selected = shuffledUnits.slice(0, Math.min(10, shuffledUnits.length));
    // 足りない場合は重複を許容して10問にする
    while (selected.length < 10 && units.length > 0) {
      selected.push(pick(units));
    }

    randomTestQueue = selected.map(u => {
      const stepKeys = ['step1', 'step2', 'step3'];
      return { unit: u, stepKey: pick(stepKeys) };
    });

    isRandomTestMode = true;
    randomTestTotal = randomTestQueue.length;
    randomTestScore = 0;
    questionCount = 1;
    answerCount = 0;
    sessionId++;
    sessionUsedQuestions.clear();

    document.querySelectorAll(".menuPane").forEach(p => p.classList.remove("active"));

  // --- 特定ステップの出題開始 ---
  window.startUnitStep = function(unitId, stepKey) {
    const unit = UNIT_CATALOG.find(u => u.id === unitId);
    if (!unit) return;
    const step = unit.steps[stepKey];
    if (!step) return;

    currentUnit = unit;
    const dataStepKey = stepKey === "official" || stepKey === "learn" ? "step1" : (stepKey === "master" ? "step3" : stepKey);
    const memoryPoolSize = stepKey === "test" || stepKey === "random"
      ? (KNOWLEDGE_TUPLES[`${step.key}_step1`] || []).length + (KNOWLEDGE_TUPLES[`${step.key}_step2`] || []).length + (KNOWLEDGE_TUPLES[`${step.key}_step3`] || []).length
      : (KNOWLEDGE_TUPLES[`${step.key}_${dataStepKey}`] || KNOWLEDGE_TUPLES[step.key] || []).length;
    const availableUniqueQuestions = new Set(
      ['step1', 'step2', 'step3']
        .flatMap(k => KNOWLEDGE_TUPLES[`${step.key}_${k}`] || [])
        .map(item => item[0])
    ).size;
    const requestedQuizCount = Math.min(20, Math.max(5, Number(settings.questionCount) || 15));
    // 固定問題は、実在する重複なしの問題数を超えて水増ししない。
    // 問題プールがない数学などは、生成問題側で5〜20問を確保する。
    currentQuizLimit = availableUniqueQuestions > 0
      ? Math.min(requestedQuizCount, availableUniqueQuestions)
      : requestedQuizCount;
    currentStep = stepKey;
    isRandomTestMode = false;
    randomTestQueue = [];
    sessionId++;
    questionCount = 1;
    answerCount = 0;
    sessionUsedQuestions.clear();

    document.getElementById("unitSubMenu").style.display = "none";
    show("quizCard", "flex");
    show("workspace", "flex");
    show("buttons", "flex");
    setQuiz(true);

    if (step.key && step.key.startsWith("jp_pass_")) {
      window.startPassageQuestion(step.key);
      return;
    }
    if (step.key && step.key.startsWith("en_pass_")) {
      window.startPassageQuestion(step.key);
      return;
    }

    isPassageMode = false;
    document.getElementById("passageBox").style.display = "none";
    makeStepQuestion();
  };

  function makeStepQuestion() {
    document.getElementById("answer").value = "";
    window.memoClear();
    hideHintBox();
    usedHintInCurrentQuestion = false;

    let unit = currentUnit;
    let stepKey = currentStep;

    if (isRandomTestMode && randomTestQueue.length > 0) {
      const curItem = randomTestQueue[questionCount - 1] || randomTestQueue[0];
      unit = curItem.unit;
      stepKey = curItem.stepKey;
      currentUnit = unit;
    } else if (currentStep === 'random' && unit) {
      // 単元内ランダム特訓：ステップ1〜3からランダム選定
      stepKey = pick(['step1', 'step2', 'step3']);
    }

    const step = unit.steps[stepKey] || unit.steps.step1;
    const isTest = (currentStep === 'test');

    document.getElementById("quizUnitName").textContent = unit.name;
    if (isRandomTestMode) {
      document.getElementById("quizStepBadge").textContent = `ランダム総合 (${questionCount}/${randomTestTotal})`;
    } else if (currentStep === 'random') {
      document.getElementById("quizStepBadge").textContent = `ランダム特訓 (${questionCount}/${currentQuizLimit})`;
    } else {
      const limitLabel = currentQuizLimit;
      document.getElementById("quizStepBadge").textContent = isTest ? `まとめテスト (${questionCount}/${limitLabel})` : `${step.name} (${questionCount}/${limitLabel})`;
    }

    if (unit.subj === 'math') {
      runMathEngine(step.key, step.level);
      document.getElementById("choicesArea").style.display = "none";
      show("answerRow", "block");
      updateSymbols(true);
      return;
    }

    // 他教科：ステップ別（各32問）タプル辞書から出題（重複完全防止・未出題優先選定＋選択肢ランダムシャッフル）
    let pool = null;
    if (isTest) {
      // 単元まとめテスト：step1, step2, step3 全問（各32問計96問）から総合出題
      const p1 = KNOWLEDGE_TUPLES[`${step.key}_step1`] || [];
      const p2 = KNOWLEDGE_TUPLES[`${step.key}_step2`] || [];
      const p3 = KNOWLEDGE_TUPLES[`${step.key}_step3`] || [];
      const combined = [...p1, ...p2, ...p3];
      pool = (combined.length > 0) ? combined : (KNOWLEDGE_TUPLES[step.key] || []);
    } else {
      // 通常ステップ：step1(基礎確認), step2(標準演習), step3(発展応用) の各32問専用プールから出題
      const stepKeyName = (currentStep === 'random') ? stepKey : (currentStep === 'official' || currentStep === 'learn' ? 'step1' : (currentStep === 'master' ? 'step3' : (currentStep || 'step1')));
      const stepSpecificKey = `${step.key}_${stepKeyName}`;
      const primaryPool = KNOWLEDGE_TUPLES[stepSpecificKey] || KNOWLEDGE_TUPLES[step.key] || [];
      const otherPools = ['step1', 'step2', 'step3']
        .filter(k => k !== stepKeyName)
        .flatMap(k => KNOWLEDGE_TUPLES[`${step.key}_${k}`] || []);
      const merged = [...primaryPool, ...otherPools];
      const seenPoolQuestions = new Set();
      pool = merged.filter(item => {
        const key = item[0];
        if (seenPoolQuestions.has(key)) return false;
        seenPoolQuestions.add(key);
        return true;
      }).slice(0, 50);
    }
    if (!pool || pool.length === 0) {
      if (unit.subj === 'science') pool = FALLBACK_SCIENCE;
      else if (unit.subj === 'social') pool = FALLBACK_SOCIAL;
      else if (unit.subj === 'information') pool = FALLBACK_INFORMATION;
      else if (unit.subj === 'english') pool = FALLBACK_ENGLISH;
      else pool = FALLBACK_JAPANESE;
    }

    // 1. 同一セッション内でまだ出題されていない問題のみを抽出（重複完全防止）
    let available = pool.filter(item => !sessionUsedQuestions.has(item[0]));
    if (available.length === 0) {
      // セッション内でプール全問が出尽くした場合はリセット
      available = pool;
    }

    // 2. 過去の直近履歴とも照合し、できる限り未出題の新しい問題を最優先で選択
    const deckKey = isTest ? `${step.key}_test` : `${step.key}_${stepKey}`;
    if (!unitQuestionDeckHistory[deckKey]) unitQuestionDeckHistory[deckKey] = [];
    const historyList = unitQuestionDeckHistory[deckKey];
    let unseenCandidates = available.filter(item => !historyList.includes(item[0]));
    if (unseenCandidates.length === 0) {
      unseenCandidates = available;
    }

    const item = pick(unseenCandidates);
    sessionUsedQuestions.add(item[0]);
    historyList.push(item[0]);
    if (historyList.length >= pool.length) {
      historyList.shift();
    }

    document.getElementById("result").textContent = item[0];
    explainText = item[3];

    // より親切で実用的な学習ヒントの生成
    const baseExp = item[3] || "";
    if (unit.subj === 'japanese') {
      hintText = `【国語の着眼点】前後の文脈や言葉の働き・品詞を意識しましょう。(${baseExp.slice(0, 30)}...)`;
    } else if (unit.subj === 'english') {
      hintText = `【英語の着眼点】主語と動詞の関係、時制や語順のルールを確認しましょう。(${baseExp.slice(0, 30)}...)`;
    } else if (unit.subj === 'science') {
      hintText = `【理科の着眼点】実験条件の変化や科学的な法則・原理を思い出してください。(${baseExp.slice(0, 30)}...)`;
    } else if (unit.subj === 'social') {
      hintText = `【社会の着眼点】時代の背景や目的・人物の関わりに注目してみましょう。(${baseExp.slice(0, 30)}...)`;
    } else {
      hintText = `【ヒント】${baseExp.slice(0, 40)}...`;
    }

    const rawOpts = item[1].split(",");
    const origAnsIdx = Number(item[2]) - 1;
    const indexedOpts = rawOpts.map((opt, i) => ({ opt, isCorrect: (i === origAnsIdx) }));
    const shuffled = shuffleArray(indexedOpts);
    const newCorrectIdx = shuffled.findIndex(s => s.isCorrect) + 1;
    correctAnswer = String(newCorrectIdx);

    renderChoiceButtons(shuffled.map(s => s.opt));
    show("answerRow", "none");
  }

    rEl.textContent = stripQuestionHeader(rEl.textContent);
