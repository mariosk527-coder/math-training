    document.getElementById("analysis").innerHTML = h;
  };

  // --- 最近の学習履歴ビュー ＆ フィルター・検索 ---
  window.openRecentHistory = function() {
    ["quizCard", "passageBox", "workspace", "answerRow", "buttons", "notes", "unitSubMenu", "analysis"].forEach(id => show(id, "none"));
    document.querySelectorAll(".menuPane").forEach(p => p.classList.remove("active"));
    document.getElementById("subjectNav").style.display = "none";
    const randBar = document.getElementById("randomTestBar");
    if (randBar) randBar.style.display = "none";
    document.getElementById("globalTools").style.display = "none";
    show("historyView", "block");
    updateTopBack();
    renderRecentHistoryUI(true);
  };

  window.setHistFilterResult = function(val) {
    histFilterResult = val;
    renderRecentHistoryUI(false);
  };

  window.setHistFilterSubj = function(val) {
    histFilterSubj = val;
    renderRecentHistoryUI(false);
  };

  window.onHistSearchChange = function(val) {
    histSearchKeyword = (val || "").trim().toLowerCase();
    renderRecentHistoryUI(false);
  };

  window.toggleHistExplain = function(id) {
    const el = document.getElementById("histExp_" + id);
    const btn = document.getElementById("histExpBtn_" + id);
    if (!el) return;
    const isOpen = el.classList.contains("open");
    if (isOpen) {
      el.classList.remove("open");
      if (btn) btn.textContent = "📖 解説を見る";
    } else {
      el.classList.add("open");
      if (btn) btn.textContent = "✕ 解説を閉じる";
    }
  };

  window.clearRecentHistory = function() {
    if (confirm("最近の学習履歴のみを消去しますか？\n（教科ごとの総合スコアや苦手分析データは保持されます）")) {
      recentHistory = [];
      saveData();
      renderRecentHistoryUI(true);
    }
  };

  function renderRecentHistoryUI(resetSearch = true) {
    const container = document.getElementById("historyView");
    if (!container) return;

    const totalCount = recentHistory.length;
    const correctCount = recentHistory.filter(h => h.isCorrect).length;
    const wrongCount = totalCount - correctCount;
    const correctRate = totalCount > 0 ? Math.round(100 * correctCount / totalCount) : 0;
    const hintCount = recentHistory.filter(h => h.usedHint).length;

    // フィルタリング処理
    let list = recentHistory.slice();
    if (histFilterResult === 'correct') {
      list = list.filter(h => h.isCorrect);
    } else if (histFilterResult === 'wrong') {
      list = list.filter(h => !h.isCorrect);
    } else if (histFilterResult === 'hint') {
      list = list.filter(h => h.usedHint);
    }

    if (histFilterSubj !== 'all') {
      list = list.filter(h => h.subject === histFilterSubj);
    }

    if (histSearchKeyword) {
      list = list.filter(h => {
        const text = `${h.subjectName} ${h.unitName} ${h.question} ${h.userAns} ${h.correctAns} ${h.mistakeLabel || ''} ${h.mistakeDetail || ''}`.toLowerCase();
        return text.includes(histSearchKeyword);
      });
    }

    let h = `
      <div class="histHeader">
        <div>
          <h2 class="histTitle"><span>📋</span> 最近の学習履歴</h2>
          <div style="font-size: 12px; color: #64748b; margin-top: 2px;">
            直近 ${totalCount} 問の回答履歴と診断・復習ステータス
          </div>
        </div>
        <div style="display: flex; gap: 6px;">
          <button class="toolBtn" type="button" onclick="window.checkanalysis()" style="font-size: 12px; padding: 4px 10px;">📊 分析レポート</button>
          <button class="headerBtn" type="button" onclick="window.goHome()">← メインメニュー</button>
        </div>
      </div>

      <!-- 履歴サマリー統計 -->
      <div class="histOverviewGrid">
        <div class="histStatCard">
          <div class="lbl">記録された問題数</div>
          <div class="val">${totalCount}<span style="font-size: 12px; font-weight: normal; color: #64748b;"> 問</span></div>
        </div>
        <div class="histStatCard">
          <div class="lbl">正答率</div>
          <div class="val" style="color: ${correctRate >= 70 ? '#16a34a' : (correctRate >= 50 ? '#2563eb' : '#dc2626')};">
            ${correctRate}<span style="font-size: 12px; font-weight: normal;"> %</span>
          </div>
        </div>
        <div class="histStatCard">
          <div class="lbl">正解 / 不正解</div>
          <div class="val" style="font-size: 15px; margin-top: 3px;">
            <span style="color: #16a34a;">${correctCount}</span> / <span style="color: #dc2626;">${wrongCount}</span>
          </div>
        </div>
        <div class="histStatCard">
          <div class="lbl">ヒント活用</div>
          <div class="val" style="color: #d97706;">${hintCount}<span style="font-size: 12px; font-weight: normal; color: #64748b;"> 回</span></div>
        </div>
      </div>

      <!-- 絞り込み ＆ 検索バー -->
      <div class="histFilterBar">
        <div class="histFilterRow">
          <span class="histFilterLabel">結果別:</span>
          <button class="histFilterBtn ${histFilterResult === 'all' ? 'active' : ''}" type="button" onclick="window.setHistFilterResult('all')">すべて (${totalCount})</button>
          <button class="histFilterBtn ${histFilterResult === 'correct' ? 'active' : ''}" type="button" onclick="window.setHistFilterResult('correct')">✓ 正解 (${correctCount})</button>
          <button class="histFilterBtn ${histFilterResult === 'wrong' ? 'active' : ''}" type="button" onclick="window.setHistFilterResult('wrong')">❌ 不正解 (${wrongCount})</button>
          <button class="histFilterBtn ${histFilterResult === 'hint' ? 'active' : ''}" type="button" onclick="window.setHistFilterResult('hint')">💡 ヒント使用 (${hintCount})</button>
        </div>
        <div class="histFilterRow">
          <span class="histFilterLabel">教科別:</span>
          <button class="histFilterBtn ${histFilterSubj === 'all' ? 'active' : ''}" type="button" onclick="window.setHistFilterSubj('all')">全教科</button>
          <button class="histFilterBtn ${histFilterSubj === 'math' ? 'active' : ''}" type="button" onclick="window.setHistFilterSubj('math')">📐 算数・数学</button>
          <button class="histFilterBtn ${histFilterSubj === 'japanese' ? 'active' : ''}" type="button" onclick="window.setHistFilterSubj('japanese')">📖 国語</button>
          <button class="histFilterBtn ${histFilterSubj === 'english' ? 'active' : ''}" type="button" onclick="window.setHistFilterSubj('english')">🔤 英語</button>
          <button class="histFilterBtn ${histFilterSubj === 'science' ? 'active' : ''}" type="button" onclick="window.setHistFilterSubj('science')">🔬 理科</button>
          <button class="histFilterBtn ${histFilterSubj === 'social' ? 'active' : ''}" type="button" onclick="window.setHistFilterSubj('social')">🌍 社会</button>
        </div>
        <div style="margin-top: 4px;">
          <input type="search" id="histSearchInput" class="histSearchInput" placeholder="🔍 単元名・設問・間違え方・キーワードで履歴を絞り込み..." value="${esc(histSearchKeyword)}" oninput="window.onHistSearchChange(this.value)">
        </div>
      </div>
    `;

    // 履歴リスト
    if (totalCount === 0) {
      h += `
        <div style="background: #ffffff; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 30px 20px; text-align: center; color: #64748b;">
          <div style="font-size: 28px; margin-bottom: 8px;">📋</div>
          <div style="font-weight: 700; color: #1e293b; font-size: 15px; margin-bottom: 4px;">学習履歴がまだありません</div>
          <p style="font-size: 12.5px; line-height: 1.6; margin-bottom: 14px;">単元の学習ステップや「🎲 ランダムテスト」を解くと、ここに最新100問の回答記録・診断結果が自動保存されます。</p>
          <button class="actionBtn" type="button" style="display: inline-block; padding: 8px 16px; font-size: 13px;" onclick="window.goHome()">さっそく問題を解く</button>
        </div>
      `;
    } else if (list.length === 0) {
      h += `
        <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 24px; text-align: center; color: #64748b;">
          <div style="font-size: 22px; margin-bottom: 6px;">🔍</div>
          <div style="font-weight: 600; color: #334155;">条件に合致する履歴が見つかりませんでした</div>
          <p style="font-size: 12px; margin-top: 4px;">フィルターを「すべて」に戻すか、検索キーワードを変更してください。</p>
          <button class="toolBtn" type="button" style="margin-top: 8px; font-size: 12px;" onclick="window.setHistFilterResult('all'); window.setHistFilterSubj('all'); window.onHistSearchChange('');">条件をリセット</button>
        </div>
      `;
    } else {
      h += `<div class="histCardList">`;
      list.forEach((item) => {
        const themeColor = SUBJ_INFO[item.subject] ? SUBJ_INFO[item.subject].theme : "#3b82f6";
        h += `
          <div class="histCard ${item.isCorrect ? 'isCorrect' : 'isWrong'}">
            <div class="histCardHeader">
              <div class="histCardMetaLeft">
                <span class="histSubjPill" style="background: ${themeColor};">${esc(item.subjectName)}</span>
                <span class="histUnitPill">${esc(item.unitName)}</span>
                <span class="histTimeText">${esc(item.date || '')} ${esc(item.time || '')}</span>
              </div>
              <div>
                ${item.isCorrect
                  ? `<span class="histBadge histBadgeCorrect">✓ 正解</span>`
                  : `<span class="histBadge histBadgeWrong">❌ 不正解</span>`
                }
                ${item.usedHint ? `<span class="histBadge histBadgeHint">💡 ヒント使用</span>` : ''}
              </div>
            </div>

            <div class="histQText">${esc(item.question)}</div>

            <div class="histAnsRow">
              <div class="histAnsItem">
                <span style="color: #64748b; font-size: 12px;">あなたの回答:</span>
                <strong style="color: ${item.isCorrect ? '#16a34a' : '#dc2626'};">${esc(item.userAns)}</strong>
              </div>
              <div class="histAnsItem">
                <span style="color: #64748b; font-size: 12px;">正解:</span>
                <strong style="color: #16a34a;">${esc(item.correctAns)}</strong>
              </div>
            </div>

            ${!item.isCorrect && item.mistakeLabel ? `
              <div class="histDiagBox">
                <strong>⚠️ 【間違え方の診断】:</strong> ${esc(item.mistakeLabel)}<br>
                <span style="font-size: 11.5px; color: #450a0a;">${esc(item.mistakeDetail || '')}</span>
                ${item.mistakeAdvice ? `<div style="margin-top: 3px; font-size: 11.5px; color: #78350f;">💡 <strong>対策:</strong> ${esc(item.mistakeAdvice)}</div>` : ''}
              </div>
            ` : ''}

            <div class="histActionsRow">
              <div>
                ${item.explain ? `
                  <button type="button" class="histExpToggleBtn" id="histExpBtn_${item.id}" onclick="window.toggleHistExplain('${item.id}')">📖 解説を見る</button>
                ` : ''}
              </div>
              <div>
                <button type="button" class="histJumpBtn" onclick="window.jumpToReviewUnit('${esc(item.unitName)}')">🎯 この単元を復習</button>
              </div>
            </div>

            ${item.explain ? `
              <div id="histExp_${item.id}" class="histExpContent">
                <strong>【解説】:</strong><br>
                ${esc(item.explain)}
              </div>
            ` : ''}
          </div>
        `;
      });
      h += `</div>`;
    }

    if (totalCount > 0) {
      h += `
        <div style="display: flex; justify-content: center; gap: 8px; margin-top: 20px;">
          <button class="toolBtn" style="color: #ef4444; border-color: #fca5a5; font-size: 12px;" onclick="window.clearRecentHistory()">🗑️ 履歴のみ消去</button>
          <button class="toolBtn" onclick="window.goHome()">← メインメニューへ</button>
        </div>
      `;
    }

    container.innerHTML = h;

    // フォーカス維持
    if (!resetSearch) {
      const inputEl = document.getElementById("histSearchInput");
      if (inputEl) {
        inputEl.focus();
        inputEl.selectionStart = inputEl.selectionEnd = inputEl.value.length;
      }
    }
  }

  window.checkreset = function() {
    if (confirm("すべての学習記録をリセットしますか？")) {
      subjectStats = {
        math: { total: 0, correct: 0, usedHint: 0, byUnit: {}, wrongHistory: [], mistakePatterns: {} },
        japanese: { total: 0, correct: 0, usedHint: 0, byUnit: {}, wrongHistory: [], mistakePatterns: {} },
        english: { total: 0, correct: 0, usedHint: 0, byUnit: {}, wrongHistory: [], mistakePatterns: {} },
        science: { total: 0, correct: 0, usedHint: 0, byUnit: {}, wrongHistory: [], mistakePatterns: {} },
        social: { total: 0, correct: 0, usedHint: 0, byUnit: {}, wrongHistory: [], mistakePatterns: {} }
      };
      recentHistory = [];
      streak = 0;
      maxStreak = 0;
      saveData();
      alert("記録をリセットしました。");
      window.goHome();
    }
  };

  function saveData() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ settings, subjectStats, streak, maxStreak, recentHistory }));
    } catch(e) {}
  }
  function loadData() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d.settings) Object.assign(settings, d.settings);
        if (d.subjectStats) {
          Object.assign(subjectStats, d.subjectStats);
          Object.keys(subjectStats).forEach(k => {
            if (!subjectStats[k].mistakePatterns) subjectStats[k].mistakePatterns = {};
            if (!subjectStats[k].wrongHistory) subjectStats[k].wrongHistory = [];
          });
        }
        if (Array.isArray(d.recentHistory)) {
          recentHistory = d.recentHistory;
        }
        if (typeof d.streak === 'number') streak = d.streak;
        if (typeof d.maxStreak === 'number') maxStreak = d.maxStreak;
      }
    } catch(e) {}
    document.getElementById("optExplain").checked = !!settings.explainOnCorrect;
  }
  window.setOption = function() {
    settings.explainOnCorrect = document.getElementById("optExplain").checked;
    saveData();
  };

  // --- 初期化 ---
  function init() {
    buildMainMenus();
    loadData();
    window.goHome();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  window.addEventListener("resize", () => {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty("--appH", h + "px");
    fitMemoCanvas();
  });

})();
</script>
</body>
</html>
