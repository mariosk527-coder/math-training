<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>総合学習ナビ - 小中高大5教科対応ブラウザ学習システム</title>
<meta name="description" content="小学校から大学・高校まで対応した数学・国語・英語・理科・社会の全180単元を網羅する総合学習プラットフォーム。段階別ステップ学習と単元まとめテストを搭載。">
<meta property="og:title" content="総合学習ナビ - 小中高大5教科対応ブラウザ学習システム">
<meta property="og:description" content="小学校から大学・高校まで対応した数学・国語・英語・理科・社会の全180単元を網羅する総合学習プラットフォーム。段階別ステップ学習と単元まとめテストを搭載。">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
:root {
  --appH: 100dvh;
  --theme-math: #2563eb;
  --theme-jp: #dc2626;
  --theme-en: #0d9488;
  --theme-sci: #16a34a;
  --theme-soc: #d97706;
  --primary: var(--theme-math);
  --bg-page: #ffffff;
  --card-bg: #ffffff;
  --border-color: #f1f5f9;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg-page); color: #0f172a; }
body {
  text-align: center; -webkit-text-size-adjust: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
  user-select: none; min-height: var(--appH);
}

/* 固定トップバー（完全ミニマル） */
#topBar {
  position: fixed; top: 0; left: 0; right: 0; height: calc(44px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top); background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px);
  border-bottom: 1px solid #f1f5f9; z-index: 100;
  display: flex; align-items: center; justify-content: space-between; padding-left: 14px; padding-right: 14px;
}
.headerBtn {
  height: 28px; padding: 0 10px; font-size: 12px; font-weight: 500; border-radius: 5px;
  border: 1px solid #e2e8f0; background: #ffffff; color: #475569; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px; transition: all .1s ease;
}
.headerBtn:active { background: #f8fafc; }
#topBack { background: #ffffff; border-color: #cbd5e1; color: #0f172a; font-weight: 600; display: none; }
#appLogo { font-weight: 700; font-size: 14px; color: #0f172a; display: flex; align-items: center; gap: 6px; cursor: pointer; }
#curSubjectBadge { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 3px; color: #fff; background: var(--primary); }
#rubyBtn.on { background: #0f172a; color: #fff; border-color: #0f172a; }

#app {
  max-width: 860px; margin: 0 auto;
  padding: calc(48px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
}

/* ルビ */
rt { font-size: 0.52em; font-weight: normal; color: #94a3b8; user-select: none; }
button rt { color: inherit; }
body.ruby { line-height: 2.15; }
body.ruby #result, body.ruby #explain, body.ruby #passageBox { line-height: 2.2; }

/* 科目タブ（アンダーライン形式のすっきりナビ） */
#subjectNav {
  display: flex; gap: 2px; margin: 4px 0 10px; overflow-x: auto; padding: 2px 0;
  border-bottom: 1px solid #f1f5f9; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
#subjectNav::-webkit-scrollbar { display: none; }
.subTabBtn {
  flex: 1 0 auto; height: 36px; padding: 0 14px; font-size: 13.5px; font-weight: 500;
  border: none; background: transparent; color: #64748b; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
  border-bottom: 2px solid transparent; transition: all .12s ease;
}
.subTabBtn:hover { color: #0f172a; }
.subTabBtn.active {
  color: #0f172a; font-weight: 700; border-bottom: 2px solid var(--primary); background: transparent !important;
}

/* 学校段階別フィルター（テキストリンク風） */
#schoolControlBar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px;
  margin: 6px 0 12px; padding: 2px 0 8px;
}
.schoolFilterGroup { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
.schoolFilterBtn {
  font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 4px;
  border: none; background: transparent; color: #64748b; cursor: pointer;
  transition: all .1s ease;
}
.schoolFilterBtn:hover { color: #0f172a; background: #f8fafc; }
.schoolFilterBtn.active { color: #0f172a; background: #f1f5f9; font-weight: 700; }
.schoolToggleAllGroup { display: flex; gap: 4px; }
.toggleAllBtn {
  font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 3px;
  border: 1px solid #f1f5f9; background: #ffffff; color: #94a3b8; cursor: pointer;
}
.toggleAllBtn:hover { color: #475569; border-color: #cbd5e1; }

/* ---- 学校別アコーディオン・セクション（区切り線ベースの超シンプルUI） ---- */
.menuPane { display: none; text-align: left; }
.menuPane.active { display: block; }

.schoolAccordion {
  border-bottom: 1px solid #f1f5f9; margin-bottom: 4px;
}
.schoolAccordion.hidden { display: none !important; }

.schoolHeader {
  width: 100%; padding: 10px 4px; background: transparent; border: none;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; text-align: left; transition: opacity .1s ease;
}
.schoolHeader:hover { opacity: 0.75; }

.schoolTitleLeft { display: flex; align-items: center; gap: 8px; }
.schoolTitleText { font-size: 13.5px; font-weight: 600; color: #0f172a; }
.schoolCountBadge {
  font-size: 11px; font-weight: 500; color: #94a3b8;
}

.schoolChevron {
  font-size: 10px; color: #94a3b8; transition: transform .15s ease;
}
.schoolAccordion.open .schoolChevron { transform: rotate(180deg); }

.schoolBody {
  display: none; padding: 6px 0 14px;
}
.schoolAccordion.open .schoolBody { display: block; }

.menuGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px; }
.menuBtn {
  min-height: 36px; padding: 6px 10px; font-size: 13px; font-weight: 500; border-radius: 6px;
  border: 1px solid #f1f5f9; background: #fafafa; color: #334155; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 6px; text-align: left;
  transition: all .1s ease;
}
.menuBtn:hover { background: #f1f5f9; border-color: #e2e8f0; color: #0f172a; }
.menuBtn:active { background: #e2e8f0; }
.menuBtn .btnLabel { display: flex; align-items: center; }
.menuBtn .btnBadge { font-size: 10.5px; font-weight: 400; color: #94a3b8; white-space: nowrap; }

/* 共通ツールバー（フッターリンク風） */
#globalTools {
  margin-top: 24px; padding-top: 12px; border-top: 1px solid #f1f5f9;
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
}
.toolBtn {
  height: 30px; padding: 0 10px; font-size: 12px; font-weight: 500; border-radius: 4px;
  border: 1px solid #f1f5f9; background: #ffffff; color: #64748b; cursor: pointer;
}
.toolBtn:hover { background: #f8fafc; color: #0f172a; border-color: #e2e8f0; }
.toolBtn:active { background: #f1f5f9; }

/* ---- サブメニュー（単元の段階別学習メニュー） ---- */
#unitSubMenu {
  display: none; text-align: left; background: #ffffff; border: 1px solid var(--border-color);
  border-radius: 12px; padding: 16px; margin-bottom: 16px;
}
#subUnitHeader {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
  padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
}
#subUnitTitle { font-size: 17px; font-weight: 700; color: #0f172a; margin: 0; }
#subUnitDesc { font-size: 13px; color: #64748b; line-height: 1.5; margin: 0 0 14px; }

.subStepGrid { display: flex; flex-direction: column; gap: 8px; }
.subStepCard {
  padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color); background: #ffffff;
  cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  transition: all .1s ease;
}
.subStepCard:active { transform: scale(0.99); background: #f8fafc; }
.subStepCard.stepFinal {
  border-color: #cbd5e1; background: #fafafa;
}
.subStepCard .stepLeft { display: flex; align-items: center; gap: 10px; }
.subStepIcon {
  width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff; background: var(--primary); shrink: 0;
}
.subStepCard.stepFinal .subStepIcon { background: #f59e0b; }
.subStepInfo h4 { margin: 0 0 2px; font-size: 14.5px; font-weight: 600; color: #0f172a; }
.subStepInfo p { margin: 0; font-size: 12px; color: #64748b; }
.subStepBadge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: #f1f5f9; color: #475569; white-space: nowrap; }

/* ---- 出題画面（スマホ最適化） ---- */
body.quiz { height: var(--appH); overflow: hidden; }
body.quiz #app {
  height: 100%; display: flex; flex-direction: column; gap: 6px;
  padding: calc(52px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));
}
#quizCard {
  background: #ffffff; border: 1px solid var(--border-color); border-radius: 10px;
  padding: 12px 14px; text-align: left;
  display: flex; flex-direction: column; gap: 6px; flex: 0 1 auto; max-height: 38vh; overflow-y: auto;
}
#quizMetaRow { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: #64748b; }
#result { margin: 0; font-size: clamp(15px, 4.2vw, 20px); line-height: 1.55; color: #0f172a; font-weight: 600; white-space: pre-line; }

/* パッセージ（文章題）ボックス */
#passageBox {
  display: none; background: #ffffff; border: 1px solid var(--border-color); border-radius: 10px;
  padding: 12px 14px; text-align: left; font-size: clamp(14px, 3.8vw, 15.5px); line-height: 1.75;
  max-height: 28vh; overflow-y: auto; white-space: pre-line;
}
#passageHeader { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 13.5px; color: var(--primary); margin-bottom: 6px; }

/* 選択肢ボタン */
#choicesArea { display: none; flex-direction: column; gap: 6px; margin: 4px 0; }
.choiceOptionBtn {
  min-height: 44px; padding: 8px 12px; font-size: 14.5px; font-weight: 600; text-align: left;
  border-radius: 8px; border: 1px solid var(--border-color); background: #ffffff; color: #1e293b;
  cursor: pointer; display: flex; align-items: center; gap: 8px;
}
.choiceOptionBtn:active { background: #f8fafc; border-color: #94a3b8; }
.choiceOptionBtn .optNum {
  display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
  border-radius: 50%; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; shrink: 0;
}

/* ワークスペース */
#workspace { display: none; }
body.quiz #workspace { display: flex; flex: 1 1 0; min-height: 0; flex-direction: column; gap: 6px; }

#explain {
  display: none; flex: 1 1 0; min-height: 0; overflow-y: auto; text-align: left; white-space: pre-line;
  background: #ffffff; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 14px;
  font-size: clamp(13.5px, 3.6vw, 15px); line-height: 1.65;
}
#explain .step { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 10px; margin: 5px 0; }
#explain .step .badge { display: inline-block; background: var(--primary); color: #fff; border-radius: 4px; font-size: 10.5px; font-weight: 700; padding: 1px 6px; margin-right: 6px; }
#explain .step.ans { background: #f0fdf4; border-color: #bbf7d0; }
#explain .step.ans .badge { background: #16a34a; }

/* メモ欄 */
#memoToggleBar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: #64748b; padding: 2px 4px; }
#memoToggleBtn { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border-color); background: #ffffff; color: #475569; cursor: pointer; }
#memoArea { display: flex; flex-direction: column; flex: 1 1 0; min-height: 60px; gap: 4px; }
#memoArea.collapsed { display: none; }
#memoTools { display: flex; gap: 4px; align-items: center; }
#memoTools button { font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border-color); background: #ffffff; cursor: pointer; }
#memoTools button.active { background: #e0e7ff; border-color: #6366f1; color: #4338ca; }
#memoCanvas { flex: 1 1 0; min-height: 0; width: 100%; border: 1.5px dashed #16a34a; border-radius: 10px; background: #ffffff; touch-action: none; display: block; }
#memoText { display: none; flex: 1 1 0; min-height: 0; width: 100%; resize: none; font-size: 16px; border: 1.5px dashed #16a34a; border-radius: 10px; padding: 8px; font-family: inherit; }

/* 入力欄 */
#answerRow { display: none; flex: 0 0 auto; margin-top: 2px; }
#answer {
  display: block; margin: 2px auto 4px; font-size: 20px; font-weight: 700; width: min(94%, 380px); height: 44px;
  text-align: center; border: 1.5px solid var(--primary); border-radius: 8px; font-family: inherit; outline: none; background: #ffffff;
}

#symbols { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; max-height: 70px; overflow-y: auto; }
#symbols button {
  min-width: 38px; height: 34px; font-size: 15px; font-weight: 600; padding: 0 8px; border-radius: 6px;
  border: 1px solid var(--border-color); background: #ffffff; color: #1e293b; cursor: pointer;
}

/* ヒントボックス */
#hintBox {
  display: none; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px;
  padding: 10px 12px; margin: 6px 0 2px; font-size: 13px; color: #92400e; text-align: left; line-height: 1.6;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}
#hintBox strong { font-weight: 700; color: #b45309; }
.hintHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.hintCloseBtn { background: none; border: none; font-size: 12px; color: #b45309; cursor: pointer; text-decoration: underline; padding: 0; }
.hintInlineBtn {
  font-size: 11.5px; font-weight: 600; color: #b45309; background: #fef3c7; border: 1px solid #fde68a;
  border-radius: 4px; padding: 2px 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px;
}
.hintInlineBtn:hover { background: #fde68a; }

/* 操作ボタン */
#buttons { display: flex; gap: 6px; justify-content: center; flex: 0 0 auto; margin-top: 6px; }
.actionBtn {
  flex: 1 1 0; max-width: 140px; min-height: 42px; font-size: 14px; font-weight: 600;
  border-radius: 8px; border: 1px solid var(--border-color); background: #ffffff; color: #334155; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
}
.actionBtn:active { transform: scale(0.98); }
#btnHint { max-width: 95px; color: #b45309; border-color: #fde68a; background: #fffbeb; }
#btnHint:active { background: #fef3c7; }
#checkAnswer { flex: 2 1 0 !important; max-width: 240px !important; background: var(--primary) !important; color: #ffffff !important; border-color: var(--primary) !important; font-weight: 700; }
#checkback { background: #fafafa; border-color: #e2e8f0; color: #475569; }

/* ランダムテストボタン */
.randomTestBar {
  display: flex; gap: 8px; margin: 4px 0 10px;
}
.randomTestBtn {
  flex: 1; height: 34px; font-size: 12.5px; font-weight: 600; border-radius: 6px;
  border: 1px dashed var(--primary); background: #f8fafc; color: var(--primary);
  display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  transition: all .1s ease;
}
.randomTestBtn:hover { background: #eff6ff; }

/* 横画面対応 */
@media (min-width: 768px) and (min-aspect-ratio: 5/4) {
  body.quiz #workspace { flex-direction: row; }
  body.quiz #passageBox { flex: 1 1 48%; max-height: none; }
  body.quiz #memoArea, body.quiz #explain { flex: 1 1 52%; }
}

/* ノート画面 */
#notes { display: none; }
body.notes { height: var(--appH); overflow: hidden; }
body.notes #app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: calc(56px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom)); }
body.notes #notes { display: grid; flex: 1 1 0; min-height: 0; gap: 8px; text-align: left; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; }
#notesMain { grid-row: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
#notesBar { display: flex; gap: 6px; align-items: center; }
#noteSelect { flex: 1 1 auto; height: 40px; font-size: 15px; border-radius: 8px; border: 1px solid var(--border-color); padding: 0 10px; background: #fff; }
#noteText { flex: 1 1 0; min-height: 0; width: 100%; resize: none; font-size: 17px; line-height: 1.5; border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 10px; outline: none; font-family: inherit; }
#palette { grid-row: 2; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
#palTabs { display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; padding-bottom: 2px; }
#palTabs button { flex: 0 0 auto; height: 34px; font-size: 13px; font-weight: 700; padding: 0 12px; border-radius: 17px; border: 1px solid var(--border-color); background: #ffffff; cursor: pointer; }
#palTabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
#palKeys { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; max-height: 24vh; overflow-y: auto; }
#palKeys button { min-width: 40px; height: 38px; font-size: 17px; font-weight: 600; padding: 0 6px; border-radius: 8px; border: 1px solid var(--border-color); background: #ffffff; cursor: pointer; }
#notesBottom { grid-row: 3; display: flex; gap: 8px; justify-content: center; align-items: center; }

/* 成績分析・回答分析ダッシュボード */
#analysis { display: none; max-width: 720px; margin: 6px auto 30px; text-align: left; font-size: 14px; padding: 0 8px; }
.anaHeader { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.anaTitle { font-size: 18px; font-weight: 700; color: #0f172a; margin: 0; }
.anaOverviewGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 16px; }
.anaCard { background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; text-align: center; }
.anaCard .lbl { font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
.anaCard .val { font-size: 20px; font-weight: 800; color: #0f172a; }
.anaCard .sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }

.anaSection { background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.anaSecTitle { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }

.subProgItem { margin-bottom: 10px; }
.subProgMeta { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; color: #334155; margin-bottom: 4px; }
.progTrack { height: 8px; background: #f1f5f9; border-radius: 4px; overflow: hidden; position: relative; }
.progFill { height: 100%; border-radius: 4px; transition: width .3s ease; }

.focusList { display: flex; flex-direction: column; gap: 6px; }
.focusItem { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 6px; background: #fafafa; border: 1px solid #f1f5f9; font-size: 13px; }
.focusItem.bad { background: #fff7ed; border-color: #ffedd5; }
.focusItem.good { background: #f0fdf4; border-color: #dcfce7; }
.focusName { font-weight: 600; color: #1e293b; }
.focusRight { display: flex; align-items: center; gap: 8px; }
.jumpReviewBtn { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 4px; border: 1px solid #cbd5e1; background: #ffffff; color: #334155; cursor: pointer; }
.jumpReviewBtn:hover { background: #f1f5f9; color: #0f172a; }

.feedbackCard { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 4px solid var(--primary); padding: 12px 14px; border-radius: 6px; line-height: 1.6; font-size: 13px; color: #334155; margin-bottom: 14px; }
.feedbackCard strong { color: #0f172a; font-weight: 700; }

.wrongLogBox { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
.wrongLogItem { padding: 8px 10px; border-radius: 6px; background: #fafafa; border: 1px solid #f1f5f9; font-size: 12.5px; line-height: 1.5; }
.wrongLogItem .qTitle { font-weight: 600; color: #475569; margin-bottom: 2px; }
.wrongLogItem .qAns { color: #dc2626; font-weight: 600; }
.wrongLogItem .qExp { color: #64748b; font-size: 12px; margin-top: 2px; }

/* 間違い分析・フィードバック関連 */
.mistakeDiagnosisBox {
  margin-top: 10px;
  background: #fef2f2;
  border: 1.5px solid #fecaca;
  border-radius: 8px;
  padding: 10px 12px;
  text-align: left;
  line-height: 1.5;
}
.mistakeDiagHeader {
  display: flex;
  align-items: center;

  function applyRuby() {
    const root = document.getElementById("app");
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => (n.data.trim() && n.parentElement && !n.parentElement.closest("svg,textarea,select,option,rt,ruby,script,style,#symbols,#memoCanvas")) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      RUBY_RE.lastIndex = 0;
      if (!RUBY_RE.test(n.data)) return;
      RUBY_RE.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let last = 0, m;
      while ((m = RUBY_RE.exec(n.data))) {
        if (m.index > last) frag.appendChild(document.createTextNode(n.data.slice(last, m.index)));

        r.appendChild(document.createTextNode(m[0]));

        frag.appendChild(r);
        last = m.index + m[0].length;
      }
      if (last < n.data.length) frag.appendChild(document.createTextNode(n.data.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });

      text: `人工知能（AI）の急速な発展により、膨大なテキストデータを学習した大規模言語モデルが高度な文章を生成できるようになりました。\nしかし、AIが「言葉の意味」を真に理解しているわけではありません。AIは統計的な確率に基づいて、次に来る確率が最も高い単語を予測・配置しているにすぎないからです。【1】これに対し、人間は言葉を通じて世界を認識し、自らの身体感覚や情動、文脈を伴って他者と意味を共有しています。\nAIを道具として使いこなすためには、人間自身が言葉の持つ多面性や文脈を深く読み解く【2】洞察力を磨き続けることが不可欠です。`,
      questions: [
        { q: "傍線部【1】「これに対し」と対比されているAIと言語生成の特徴はどれですか。", options: ["統計的な確率に基づいて次に来る単語を予測していること", "人間以上の感情や情動を学習していること", "言葉の意味を深く哲学的に省察していること", "身体感覚を完全に再現していること"], ans: 1, explain: "本文第2段落に「AIは統計的な確率に基づいて…予測・配置しているにすぎない」とあります。" },
        { q: "傍線部【2】「洞察力」の読みとして正しいものはどれですか。", options: ["どうさつりょく", "とうさつりょく", "どうさいりょく", "とさいりょく"], ans: 1, explain: "「洞察」は「どうさつ」と読みます。" },
        { q: "筆者が主張する、AI時代において人間が磨くべき力は何ですか。", options: ["言葉の文脈や多面性を深く読み解く洞察力", "より高速にキーボードを入力する技術", "すべての作業をAIに任せる判断力", "計算処理の速度を極限まで高める力"], ans: 1, explain: "結びで「言葉の持つ多面性や文脈を深く読み解く洞察力を磨き続けることが不可欠」と述べられています。" }
      ]

    jp_pass_modern: {
      id: "jp_pass_modern", subject: "japanese", level: "高校生", genre: "評論文", title: "近代合理主義批判",
      text: `近代社会は、自然を客体化して分析・管理する合理主義によって目覚ましい科学技術の発展を遂げました。あらゆる事象を数量化・普遍化するデカルト的思考は、人類に利便性と物質的豊かさをもたらしたことは疑いようがありません。\nしかし、この過度な合理化の追求は、やがて人間自身をも数値や機能として【1】捨象し、疎外をもたらす逆説に直面しました。効率性の名のもとに、個別具体的な生の質感や自然との不可分な共生関係が見失われてしまったのです。\nいま求められているのは、近代の知を全否定することではなく、合理主義が切り捨ててきた「割り切れないもの」の価値を再発見し、両者を統合する新たな【2】止揚（アウフヘーベン）の視座です。`,
      questions: [
        { q: "傍線部【1】「捨象」の意味として最も適切なものはどれですか。", options: ["特定の要素以外を削ぎ落として切り捨てること", "反対の命題を論破すること", "新しい事物を生み出し普及させること", "普遍的な法則を具体的経験に適用すること"], ans: 1, explain: "捨象とは、特定の性質に着目する際に他の要素を捨て去ることです。" },
        { q: "筆者が述べる「近代合理主義の逆説」とはどういうことですか。", options: ["豊かさを生んだ合理化が人間自身をも機能として扱い疎外を生んだこと", "科学技術が衰退して産業が縮小したこと", "自然が人間を支配するようになったこと", "普遍的な理論がすべて否定されたこと"], ans: 1, explain: "第2段落にある通り、過度な合理化が人間を数値・機能として疎外し生の質感を奪った点です。" },
        { q: "傍線部【2】「止揚（アウフヘーベン）」が指す筆者の展望はどれですか。", options: ["近代合理主義と切り捨てられた価値を高次で統合すること", "近代の科学技術をすべて放棄して過去に戻ること", "すべての事象をさらに徹底して数値化すること", "論理の対立をそのまま放置すること"], ans: 1, explain: "本文末尾に「合理主義が切り捨ててきた価値を再発見し、両者を統合する」と述べられています。" }
      ]
    },

  // --- メインメニューの描画 ---
  function buildMainMenus() {
    const categories = {
      math: { elem: "mathGrid_elem", junior: "mathGrid_junior", high: "mathGrid_high", uni: "mathGrid_uni" },
      japanese: { elem: "jpGrid_elem", junior: "jpGrid_junior", high: "jpGrid_high" },
      english: { elem: "enGrid_elem", junior: "enGrid_junior", high: "enGrid_high" },
      science: { elem: "sciGrid_elem", junior: "sciGrid_junior", high: "sciGrid_high" },
      social: { elem: "socGrid_elem", junior: "socGrid_junior", high: "socGrid_high" }
    };

    UNIT_CATALOG.forEach(u => {
      const targetMap = categories[u.subj];
      if (!targetMap) return;
      const gridId = targetMap[u.group];
      if (!gridId) return;
      const grid = document.getElementById(gridId);
      if (!grid) return;

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "menuBtn";
      btn.onclick = () => window.openUnitSubMenu(u.id);
      btn.innerHTML = `
        <span class="btnLabel">${esc(u.name)}</span>
        <span class="btnBadge">${esc(u.badge)}</span>
      `;
      grid.appendChild(btn);
    });

    updateSchoolCounts();
  }

  // --- 単元サブメニュー画面の表示 ---
  window.openUnitSubMenu = function(unitId) {
    const unit = UNIT_CATALOG.find(u => u.id === unitId);
    if (!unit) return;
    currentUnit = unit;
    sessionId++;
    setQuiz(false);

    document.querySelectorAll(".menuPane").forEach(p => p.classList.remove("active"));
    document.getElementById("subjectNav").style.display = "none";
    document.getElementById("globalTools").style.display = "none";
    ["quizCard", "passageBox", "workspace", "answerRow", "buttons", "analysis", "notes"].forEach(id => show(id, "none"));

    const subMenu = document.getElementById("unitSubMenu");
    subMenu.style.display = "block";
    document.getElementById("subUnitTitle").textContent = unit.name + " (" + unit.badge + ")";
    document.getElementById("subUnitDesc").textContent = unit.desc;

    const listEl = document.getElementById("subStepList");
    const steps = unit.steps;
    const stepKeys = ['step1', 'step2', 'step3', 'random', 'test'];

    listEl.innerHTML = stepKeys.map((k, idx) => {
      const st = steps[k];
      if (!st) return "";
      const isFinal = (k === 'test');
      const isRandom = (k === 'random');
      const iconText = isFinal ? "🏆" : (isRandom ? "🎲" : (idx + 1));
      const badgeText = isFinal ? "実力判定" : (isRandom ? "シャッフル" : "学習");
      return `
        <div class="subStepCard ${isFinal ? 'stepFinal' : ''}" onclick="window.startUnitStep('${unit.id}', '${k}')">
          <div class="stepLeft">
            <div class="subStepIcon">${iconText}</div>
            <div class="subStepInfo">
              <h4>${esc(st.name)}</h4>
              <p>${esc(st.desc)}</p>
            </div>
          </div>
          <span class="subStepBadge">${badgeText}</span>
        </div>
      `;
    }).join("");

    updateTopBack();
  };

  // --- 科目別ランダム総合実力テスト（全単元からシャッフル10問出題） ---
  window.startSubjectRandomTest = function(subjKey) {
    const targetSubj = subjKey || currentSubject;
    const units = UNIT_CATALOG.filter(u => u.subj === targetSubj);
    if (!units || units.length === 0) return;

    // シャッフルして10問分のテストキューを生成
    const shuffledUnits = shuffleArray(units);
    const selected = shuffledUnits.slice(0, Math.min(10, shuffledUnits.length));
    // 足りない場合は重複を許容して10問にする
    while (selected.length < 10 && units.length > 0) {
      selected.push(pick(units));
    }

    randomTestQueue = selected.map(u => {
      const stepKeys = ['step1', 'step2', 'step3'];
      return { unit: u, stepKey: pick(stepKeys) };
    });

    isRandomTestMode = true;
    randomTestTotal = randomTestQueue.length;
    randomTestScore = 0;
    questionCount = 1;
    answerCount = 0;
    sessionId++;

    document.querySelectorAll(".menuPane").forEach(p => p.classList.remove("active"));
    document.getElementById("subjectNav").style.display = "none";
    const randBar = document.getElementById("randomTestBar");
    if (randBar) randBar.style.display = "none";
    document.getElementById("globalTools").style.display = "none";
    document.getElementById("unitSubMenu").style.display = "none";

    show("quizCard", "flex");
    show("workspace", "flex");
    show("buttons", "flex");
    setQuiz(true);

    isPassageMode = false;
    document.getElementById("passageBox").style.display = "none";
    makeStepQuestion();
  };

  // --- 特定ステップの出題開始 ---
  window.startUnitStep = function(unitId, stepKey) {
    const unit = UNIT_CATALOG.find(u => u.id === unitId);
    if (!unit) return;
    const step = unit.steps[stepKey];
    if (!step) return;

    currentUnit = unit;
    currentStep = stepKey;
    isRandomTestMode = false;
    randomTestQueue = [];
    sessionId++;
    questionCount = 1;
    answerCount = 0;

    document.getElementById("unitSubMenu").style.display = "none";
    show("quizCard", "flex");
    show("workspace", "flex");
    show("buttons", "flex");
    setQuiz(true);

    if (step.key && step.key.startsWith("jp_pass_")) {
      window.startPassageQuestion(step.key);
      return;
    }
    if (step.key && step.key.startsWith("en_pass_")) {
      window.startPassageQuestion(step.key);
      return;
    }

    isPassageMode = false;
    document.getElementById("passageBox").style.display = "none";
    makeStepQuestion();
  };

  window.startPassageQuestion = function(pId) {
    const p = PASSAGES[pId] || PASSAGES["jp_p_elem1"];
    isPassageMode = true;
    currentPassage = p;
    currentPassageQIdx = 0;

    const pBox = document.getElementById("passageBox");
    pBox.style.display = "block";
    document.getElementById("passageTitleText").textContent = p.title;
    document.getElementById("passageGenreBadge").textContent = p.genre + " (" + p.level + ")";
    document.getElementById("passageContent").textContent = p.text;

    makePassageQuestionItem();
  };

  function makePassageQuestionItem() {
    hideHintBox();
    usedHintInCurrentQuestion = false;
    const p = currentPassage;
    const qData = p.questions[currentPassageQIdx];

    document.getElementById("quizUnitName").textContent = currentUnit ? currentUnit.name : p.title;
    document.getElementById("quizStepBadge").textContent = (currentPassageQIdx + 1) + " / " + p.questions.length + " 問";
    document.getElementById("result").textContent = qData.q;
    explainText = qData.explain;
    hintText = `本文の該当箇所（傍線部やその前後2〜3行）を読み直すと手がかりがあります。登場人物の心情や因果関係を整理してみましょう。`;

    // 選択肢のシャッフル出題
    const correctVal = qData.options[qData.ans - 1];
    const indexedOpts = qData.options.map((opt, i) => ({ opt, isCorrect: (i + 1 === qData.ans) }));
    const shuffled = shuffleArray(indexedOpts);
    const newCorrectIdx = shuffled.findIndex(item => item.isCorrect) + 1;
    correctAnswer = String(newCorrectIdx);

    renderChoiceButtons(shuffled.map(s => s.opt));
    show("answerRow", "none");
  }

  function makeStepQuestion() {
    document.getElementById("answer").value = "";
    window.memoClear();
    hideHintBox();
    usedHintInCurrentQuestion = false;

    let unit = currentUnit;
    let stepKey = currentStep;

    if (isRandomTestMode && randomTestQueue.length > 0) {
      const curItem = randomTestQueue[questionCount - 1] || randomTestQueue[0];
      unit = curItem.unit;
      stepKey = curItem.stepKey;
      currentUnit = unit;
    } else if (currentStep === 'random' && unit) {
      // 単元内ランダム特訓：ステップ1〜3からランダム選定
      stepKey = pick(['step1', 'step2', 'step3']);
    }

    const step = unit.steps[stepKey] || unit.steps.step1;
    const isTest = (currentStep === 'test');

    document.getElementById("quizUnitName").textContent = unit.name;
    if (isRandomTestMode) {
      document.getElementById("quizStepBadge").textContent = `ランダム総合 (${questionCount}/${randomTestTotal})`;
    } else if (currentStep === 'random') {
      document.getElementById("quizStepBadge").textContent = `ランダム特訓 (${questionCount}/5)`;
    } else {
      document.getElementById("quizStepBadge").textContent = isTest ? `まとめテスト (${questionCount}/5)` : `${step.name} (${questionCount}/5)`;
    }

    if (unit.subj === 'math') {
      runMathEngine(step.key, step.level);
      document.getElementById("choicesArea").style.display = "none";
      show("answerRow", "block");
      updateSymbols(true);
      return;
    }

    } else if (unit.subj === 'social') {

    } else {
      hintText = `【ヒント】${baseExp.slice(0, 40)}...`;
    }

    const rawOpts = item[1].split(",");
    const origAnsIdx = Number(item[2]) - 1;
    const indexedOpts = rawOpts.map((opt, i) => ({ opt, isCorrect: (i === origAnsIdx) }));

    correctAnswer = String(newCorrectIdx);

    renderChoiceButtons(shuffled.map(s => s.opt));
    show("answerRow", "none");
  }

  function renderChoiceButtons(options) {
    currentChoiceList = options.slice();
    currentMathKey = "";
    const container = document.getElementById("choicesArea");
    container.style.display = "flex";
    container.innerHTML = options.map((opt, i) => {
      const num = i + 1;
      return `<button type="button" class="choiceOptionBtn" onclick="window.selectChoiceAnswer('${num}')">
        <span class="optNum">${num}</span>
        <span>${esc(opt)}</span>
      </button>`;
    }).join("");
  }

  window.selectChoiceAnswer = function(val) {
    if (answerCount !== 0) return;
    document.getElementById("answer").value = val;
    window.checkAnswer();
  };

  function updateSymbols(isMath) {
    const box = document.getElementById("symbols");
    let keys = isMath ?
      [{ t: "-", v: "-" }, { t: "/", v: "/" }, { t: "√", v: "√" }, { t: ".", v: "." }, { t: "⌫", a: "back" }, { t: "クリア", a: "clear" }] :
      [{ t: "1", v: "1" }, { t: "2", v: "2" }, { t: "3", v: "3" }, { t: "4", v: "4" }, { t: "⌫", a: "back" }, { t: "クリア", a: "clear" }];

    box.innerHTML = keys.map(k =>
      `<button type="button" data-v="${k.v || ''}" data-a="${k.a || ''}">${k.t}</button>`
    ).join("");
  }

  document.getElementById("symbols").addEventListener("mousedown", e => e.preventDefault());
  document.getElementById("symbols").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    const v = b.getAttribute("data-v");
    const a = b.getAttribute("data-a");
    const input = document.getElementById("answer");
    if (a === "clear") { input.value = ""; }
    else if (a === "back") { input.value = input.value.slice(0, -1); }
    else if (v) { input.value += v; }
    input.focus();
  });

  // --- 間違え方の診断エンジン（教科ごとのミスパターン分類と対策生成） ---
  function diagnoseMistake(subject, userRaw, correctRaw, questionText, explain, hint, choices, mathKey) {
    const qStr = (questionText || "").toLowerCase();
    const expStr = (explain || "").toLowerCase();

    let userText = userRaw || "";
    let correctText = String(correctRaw || "");
    if (choices && choices.length > 0) {
      const uIdx = Number(userRaw) - 1;
      if (choices[uIdx]) userText = choices[uIdx];
      const cIdx = Number(correctRaw) - 1;
      if (choices[cIdx]) correctText = choices[cIdx];
    }

    const uNum = Number(normalizeNumberText(userRaw));
    const cNum = Number(normalizeNumberText(correctRaw));
    const hasNumbers = !Number.isNaN(uNum) && !Number.isNaN(cNum);

    // 1. 算数・数学の診断
    if (subject === 'math') {
      if (hasNumbers && uNum === -cNum && cNum !== 0) {
        return {
          label: "符号ミス（正負・マイナスの逆転）",
          detail: `正解(${cNum})と絶対値が同じですが符号が逆(${uNum})になっています。`,
          advice: "移項した際の符号変化（＋から−へ）や、負の数で掛けたり割ったりする際の符号反転を意識しましょう。",
          category: "sign_error"
        };
      }
      if (mathKey === "math_root" || qStr.includes("√") || qStr.includes("平方根")) {
        return {
          label: "平方根・2乗の混同",
          detail: `2乗してその数になる平方根の計算で、2乗との取り違えや素因数分解のミスが生じています。`,
          advice: "「√a は2乗して a になる数」という定義を思い出し、√の中身を素因数分解して整理しましょう。",
          category: "formula_root"
        };
      }
      if (mathKey === "math_pythag" || qStr.includes("三平方") || qStr.includes("斜辺")) {
        return {
          label: "三平方の定理・公式適用の誤り",
          detail: `直角三角形の斜辺定理（c² = a² + b²）の二乗計算やルートの処理でミスが生じています。`,
          advice: "斜辺の長さを求める際は「a² + b² を計算してから平方根をとる」手順を丁寧に書き出しましょう。",
          category: "formula_pythag"
        };
      }
      if (mathKey && (mathKey.includes("diff") || mathKey.includes("uni") || mathKey.includes("det"))) {
        return {
          label: "導関数・微積分・行列式の適用ミス",
          detail: `微分の係数掛け算（(x²)'=2x）や代入計算、行列式（ad - bc）の積の順序で誤りがあります。`,
          advice: "先に導関数 f'(x) を一行書き出してから、指定された数値を落ち着いて代入しましょう。",
          category: "calculus_error"
        };
      }
      if (hasNumbers && (uNum === cNum * 10 || uNum === cNum / 10 || Math.abs(uNum - cNum) === 10 || Math.abs(uNum - cNum) === 100)) {
        return {
          label: "位取り・繰り上がり/繰り下がりの誤り",
          detail: `十の位や百の位の繰り上がり・繰り下げ計算、または小数点の位置でズレが生じています。`,
          advice: "筆算の桁を縦にきれいに揃えて書き、繰り上がりメモを省略しないことがミス防止のコツです。",
          category: "place_value"
        };
      }
      if (qStr.includes("+") && hasNumbers && (cNum > uNum || expStr.includes("+"))) {
        return {
          label: "演算順序・四則計算の取り違え",
          detail: `加減乗除の順序や移項の逆算（足すところを引いた等）で取り違えが起きています。`,
          advice: "掛け算・割り算を先に行う優先順位を守り、途中式を省略せずに1行ずつ変形しましょう。",
          category: "operation_order"
        };
      }
      return {
        label: "計算手順・ケアレスミス",
        detail: `解き方の筋道は合っていますが、途中の四則演算で数値のズレが生じています。`,
        advice: "暗算に頼らず、余白キャンバスやメモに途中計算を残して最後に逆算チェックをしましょう。",
        category: "arithmetic_slip"
      };
    }

    // 2. 英語の診断
    if (subject === 'english') {
      const isTenseChoice = /[a-zA-Z]+(ed|ing|s|es)\b/.test(userText) || /[a-zA-Z]+(ed|ing|s|es)\b/.test(correctText) ||
        /\b(yesterday|last|ago|tomorrow|will|did|was|were|has|have)\b/i.test(qStr);
      if (isTenseChoice || qStr.includes("過去") || qStr.includes("三人称")) {
        return {
          label: "時制・三人称単数（-s / -ed）の見落とし",
          detail: `主語の人称（he, she, it）や文全体の時制（過去・現在・未来）のルールを見落としています。`,
          advice: "英文中の主語と、時制を示すキーワード（yesterday, every dayなど）に印をつける癖をつけましょう。",
          category: "tense_agreement"
        };
      }
      const isPreposition = /\b(in|on|at|to|for|with|by|from|about|of|into|under)\b/i.test(userText) ||
        /\b(in|on|at|to|for|with|by|from|about|of|into|under)\b/i.test(correctText);
      if (isPreposition) {
        return {
          label: "前置詞・助動詞の使い分けミス",
          detail: `時間や場所・手段を表す前置詞（in, on, at, for等）のニュアンスを取り違えています。`,
          advice: "前置詞単体ではなく「動詞＋前置詞＋名詞」のフレーズごと口に出して音読暗記しましょう。",
          category: "preposition_slip"
        };
      }
      if (qStr.includes("語順") || qStr.includes("並び替え") || /\b(who|which|what|where|why|how)\b/i.test(qStr)) {
        return {
          label: "語順・文構造（文型）の誤認",
          detail: `英語特有の「主語＋動詞＋目的語」の語順や疑問詞の導く文構造で混乱が生じています。`,
          advice: "まず「誰が・どうする・何を」の骨格を見極めてから、修飾語句を付け足す意識を持ちましょう。",
          category: "sentence_structure"
        };
      }
      if (userText.length > 0 && Math.abs(userText.length - correctText.length) <= 2) {
        return {
          label: "紛らわしい類似語・つづりの混同",
          detail: `見た目やスペル、発音が似ている紛らわしい英単語を選択してしまっています。`,

          qStr.includes("光合成") || qStr.includes("呼吸") || qStr.includes("動脈") || qStr.includes("静脈") ||
          qStr.includes("酸化") || qStr.includes("還元") || qStr.includes("凸") || qStr.includes("凹")) {

  // --- 回答判定と次の問題への遷移（強化されたフィードバック＆間違い診断機能） ---
  window.checkAnswer = async function() {
    if (nextResolver) {
      const r = nextResolver;
      nextResolver = null;
      r();
      return;
    }
    if (answerCount !== 0) return;

    const raw = document.getElementById("answer").value.trim();
    if (raw === "") return;

    answerCount = 1;
    const mySession = sessionId;

    const cleanRaw = normalizeNumberText(raw).toLowerCase().replace(/\s/g, "");
    const cleanAns = String(correctAnswer).toLowerCase().replace(/\s/g, "");
    let isCorrect = (cleanRaw === cleanAns);

    function parseFracVal(s) {
      if (!s) return NaN;
      if (s.includes("/")) {
        const p = s.split("/");
        if (p.length === 2) {
          const n = Number(p[0]), d = Number(p[1]);
          if (!Number.isNaN(n) && !Number.isNaN(d) && d !== 0) return n / d;
        }
      }
      return Number(s);
    }

    if (!isCorrect) {
      const vRaw = parseFracVal(cleanRaw);
      const vAns = parseFracVal(cleanAns);
      if (!Number.isNaN(vRaw) && !Number.isNaN(vAns)) {
        isCorrect = Math.abs(vRaw - vAns) < 1e-6;
      }
    }

    const unitName = currentUnit ? currentUnit.name : (currentPassage ? currentPassage.title : "演習");
    const qSummary = (document.getElementById("result").textContent || "").split("\n")[1] || document.getElementById("result").textContent;
    subjectStats[currentSubject].total += 1;
    subjectStats[currentSubject].byUnit[unitName] = subjectStats[currentSubject].byUnit[unitName] || { total: 0, correct: 0, noHintCorrect: 0 };
    subjectStats[currentSubject].byUnit[unitName].total += 1;

    // 選択肢テキストまたは入力回答の整理
    let userDisplay = raw || "無回答";
    let correctDisplay = String(correctAnswer);
    if (currentChoiceList.length > 0) {
      const uIdx = Number(raw) - 1;
      if (currentChoiceList[uIdx]) userDisplay = `[${raw}] ${currentChoiceList[uIdx]}`;
      const cIdx = Number(correctAnswer) - 1;
      if (currentChoiceList[cIdx]) correctDisplay = `[${correctAnswer}] ${currentChoiceList[cIdx]}`;
    }

    let currentDiagnosis = null;

    if (isCorrect) {
      streak++;
      maxStreak = Math.max(maxStreak, streak);
      if (isRandomTestMode) randomTestScore++;
      subjectStats[currentSubject].correct += 1;
      subjectStats[currentSubject].byUnit[unitName].correct += 1;
      if (!usedHintInCurrentQuestion) {
        subjectStats[currentSubject].byUnit[unitName].noHintCorrect = (subjectStats[currentSubject].byUnit[unitName].noHintCorrect || 0) + 1;
      }

      const streakBonus = streak >= 2 ? ` (🔥 ${streak}問連続正解！)` : "";
      const compliments = ["正解！ その調子です。", "見事正解！ 素晴らしい着眼点です。", "正解！ 基礎がしっかり定着しています。"];
      document.getElementById("result").innerHTML = `
        <div style="color: #16a34a; font-weight: 700; font-size: 15px;">✓ ${pick(compliments)}${streakBonus}</div>
      `;
    } else {
      streak = 0;

      // 間違え方の診断を実行
      currentDiagnosis = diagnoseMistake(
        currentSubject,
        raw,
        correctAnswer,
        qSummary,
        explainText,
        hintText,
        currentChoiceList,
        currentMathKey
      );

      // 教科ごとの間違え方パターンの集計
      subjectStats[currentSubject].mistakePatterns = subjectStats[currentSubject].mistakePatterns || {};
      const patKey = currentDiagnosis.label;
      if (!subjectStats[currentSubject].mistakePatterns[patKey]) {
        subjectStats[currentSubject].mistakePatterns[patKey] = {
          count: 0,
          label: currentDiagnosis.label,
          advice: currentDiagnosis.advice,
          category: currentDiagnosis.category
        };
      }
      subjectStats[currentSubject].mistakePatterns[patKey].count += 1;

      // 不正解時の即時フィードバック表示（どんな間違え方をしたかを提示）
      document.getElementById("result").innerHTML = `
        <div style="font-weight: 700; color: #dc2626; font-size: 14px; margin-bottom: 2px;">❌ 不正解</div>
        <div style="font-size: 12.5px; color: #334155; margin-bottom: 5px;">
          あなたの回答: <strong style="color: #dc2626;">${esc(userDisplay)}</strong> / 正解: <strong style="color: #16a34a;">${esc(correctDisplay)}</strong>
        </div>
        <div style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 6px 9px; font-size: 12px; color: #991b1b; text-align: left; line-height: 1.5;">
          <strong>⚠️ 【間違え方の診断】:</strong> ${esc(currentDiagnosis.label)}<br>
          <span style="color: #450a0a; font-size: 11.5px;">${esc(currentDiagnosis.detail)}</span>
        </div>
      `;

      // 誤答ログを記録（最大30件まで）
      subjectStats[currentSubject].wrongHistory = subjectStats[currentSubject].wrongHistory || [];
      subjectStats[currentSubject].wrongHistory.unshift({
        unit: unitName,
        q: qSummary.slice(0, 45),
        ans: correctDisplay,
        userAns: userDisplay,
        mistakeLabel: currentDiagnosis.label,
        mistakeDetail: currentDiagnosis.detail,
        mistakeAdvice: currentDiagnosis.advice,
        explain: explainText,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      if (subjectStats[currentSubject].wrongHistory.length > 30) {
        subjectStats[currentSubject].wrongHistory.pop();
      }
    }

    // 最近の学習履歴を記録（正解・不正解問わず直近100件を保存）
    recentHistory = recentHistory || [];
    recentHistory.unshift({
      id: Date.now() + "_" + Math.random().toString(36).slice(2, 6),
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      date: (new Date().getMonth() + 1) + "/" + new Date().getDate(),
      subject: currentSubject,
      subjectName: SUBJ_INFO[currentSubject].name,
      unitName: unitName,
      question: qSummary,
      userAns: userDisplay,
      correctAns: correctDisplay,
      isCorrect: isCorrect,
      usedHint: !!usedHintInCurrentQuestion,
      mistakeLabel: currentDiagnosis ? currentDiagnosis.label : null,
      mistakeDetail: currentDiagnosis ? currentDiagnosis.detail : null,
      mistakeAdvice: currentDiagnosis ? currentDiagnosis.advice : null,
      explain: explainText || ""
    });
    if (recentHistory.length > 100) {
      recentHistory.pop();
    }
    saveData();

    let manual = false;
    if ((!isCorrect || settings.explainOnCorrect) && explainText) {
      manual = true;
      openExplain(isCorrect, currentDiagnosis);
      await waitForNext();
      closeExplain();
    } else {
      await sleep(isCorrect ? 800 : 2000);
    }
    if (mySession !== sessionId) return;

    if (isPassageMode && currentPassage) {
      currentPassageQIdx++;
      if (currentPassageQIdx < currentPassage.questions.length) {
        questionCount++;
        answerCount = 0;
        makePassageQuestionItem();
        return;
      } else {
        document.getElementById("result").textContent = "この文章題のすべての設問が完了しました！";
        await sleep(1800);
        window.openUnitSubMenu(currentUnit.id);
        return;
      }
    }

    const maxQ = isRandomTestMode ? randomTestTotal : 5;
    if (questionCount >= maxQ) {
      if (isRandomTestMode) {
        const rate = Math.round(100 * randomTestScore / randomTestTotal);
        document.getElementById("result").textContent = `🏆 ランダム総合テスト完了！\nスコア: ${randomTestScore} / ${randomTestTotal} 問 (${rate}%)\n学習分析レポートで弱点分野を確認しましょう！`;
        await sleep(2500);
        window.goHome();
        return;
      } else {
        const isTest = (currentStep === 'test');
        document.getElementById("result").textContent = isTest ?
          "単元まとめテスト完了！ お疲れ様でした。\n成績レポートで弱点分野を確認できます。" :
          "ステップ完了！ 次の段階やまとめテストに進みましょう。";
        await sleep(2000);
        if (currentUnit) window.openUnitSubMenu(currentUnit.id);
        else window.goHome();
        return;
      }
    }

    questionCount++;
    answerCount = 0;
    makeStepQuestion();
  };

  function waitForNext() {
    return new Promise(resolve => {
      nextResolver = resolve;
      document.getElementById("checkAnswer").textContent = "次へ進む ▶";
    });
  }

  function openExplain(isCorrect, diagnosis) {
    const box = document.getElementById("explain");
    const badgeText = isCorrect ? "解法のポイント" : "詳しい解説・解き方";
    box.innerHTML = `
      <div class="step ans">
        <span class="badge">${badgeText}</span>
        <div style="margin-top: 6px;"><strong>正解:</strong> ${esc(correctAnswer)}</div>
        <div style="margin-top: 4px; line-height: 1.6;">${esc(explainText)}</div>
        ${hintText ? `<div style="margin-top: 6px; font-size: 12px; color: #b45309; background: #fffbeb; padding: 6px 8px; border-radius: 4px;"><strong>💡 つまずき防止の要点:</strong> ${esc(hintText)}</div>` : ''}
        ${!isCorrect && diagnosis ? `
          <div class="mistakeDiagnosisBox">
            <div class="mistakeDiagHeader">
              <span class="mistakeTag">⚠️ 間違え方の分析</span>
              <strong class="mistakeLabel">${esc(diagnosis.label)}</strong>
            </div>
            <div class="mistakeDetail">${esc(diagnosis.detail)}</div>
            <div class="mistakeAdviceBox">
              <strong>🎯 対策アドバイス:</strong> ${esc(diagnosis.advice)}
            </div>
          </div>
        ` : ''}
      </div>
    `;
    box.style.display = "block";
    show("memoArea", "none");
  }

  function closeExplain() {
    document.getElementById("explain").style.display = "none";
    document.getElementById("checkAnswer").textContent = "回答する";
    if (!isMemoCollapsed) show("memoArea", "flex");
  }

  // --- 手書きメモキャンバス ---
  const memoCanvas = document.getElementById("memoCanvas");
  const memoCtx = memoCanvas.getContext("2d");
  let memoDrawing = false;
  let memoToolName = "pen";

  window.memoSetTool = function(tool) {
    memoToolName = tool;
    memoCtx.globalCompositeOperation = tool === "eraser" ? "destination-out" : "source-over";
    memoCtx.lineWidth = tool === "eraser" ? 28 : 4;
    memoCtx.lineCap = "round";
    memoCtx.lineJoin = "round";
    memoCtx.strokeStyle = "#1e293b";
    document.getElementById("memoBtnPen").classList.toggle("active", tool === "pen");
    document.getElementById("memoBtnEraser").classList.toggle("active", tool === "eraser");
  };
  window.memoSwitch = function(mode) {
    const isDraw = mode === "draw";
    memoCanvas.style.display = isDraw ? "block" : "none";
    document.getElementById("memoText").style.display = isDraw ? "none" : "block";
    document.getElementById("memoBtnDraw").classList.toggle("active", isDraw);
    document.getElementById("memoBtnText").classList.toggle("active", !isDraw);
  };
  window.memoClear = function() {
    memoCtx.clearRect(0, 0, memoCanvas.width, memoCanvas.height);
    document.getElementById("memoText").value = "";
  };
  window.toggleMemoCollapse = function() {
    isMemoCollapsed = !isMemoCollapsed;
    document.getElementById("memoArea").classList.toggle("collapsed", isMemoCollapsed);
    document.getElementById("memoToggleBtn").textContent = isMemoCollapsed ? "メモを開く" : "最小化";
  };

  function fitMemoCanvas() {
    const r = memoCanvas.getBoundingClientRect();
    const w = Math.round(r.width), h = Math.round(r.height);
    if (w < 20 || h < 20) return;
    if (memoCanvas.width === w && memoCanvas.height === h) return;
    memoCanvas.width = w;
    memoCanvas.height = h;
    window.memoSetTool(memoToolName);
  }

  function getCanvasPos(e) {
    const r = memoCanvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * memoCanvas.width / r.width,
      y: (e.clientY - r.top) * memoCanvas.height / r.height
    };
  }

  memoCanvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    memoDrawing = true;
    memoCanvas.setPointerCapture(e.pointerId);
    const p = getCanvasPos(e);
    memoCtx.beginPath();
    memoCtx.moveTo(p.x, p.y);
    memoCtx.lineTo(p.x + 0.1, p.y + 0.1);
    memoCtx.stroke();
  });
  memoCanvas.addEventListener("pointermove", e => {
    if (!memoDrawing) return;
    e.preventDefault();
    const p = getCanvasPos(e);
    memoCtx.lineTo(p.x, p.y);
    memoCtx.stroke();
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev =>
    memoCanvas.addEventListener(ev, () => { memoDrawing = false; }));

  window.memoSetTool("pen");
  window.memoSwitch("draw");

  // --- 数式・記号ノート画面 ---

    { name: "理科・記号", keys: ["℃","K","mol","Ω","V","A","W","J","N","g","kg","mL","L","cm³","H₂O","CO₂","NaCl","O₂","H₂","Fe","Cu","→","←","↑","↓","⇒","⇔","≒","≠","≡","≦","≧"] }
  ];
  let notesData = { notes: [{ id: "n1", title: "学習メモ 1", text: "" }], current: "n1" };
  let palTab = 0;

  window.openNotes = function() {
    ["quizCard", "passageBox", "workspace", "answerRow", "buttons", "analysis", "unitSubMenu"].forEach(id => show(id, "none"));
    document.querySelectorAll(".menuPane").forEach(p => p.classList.remove("active"));
    document.getElementById("subjectNav").style.display = "none";
    document.getElementById("globalTools").style.display = "none";
    document.body.classList.add("notes");
    renderNotesUI();
    updateTopBack();
  };

  function renderNotesUI() {
    const sel = document.getElementById("noteSelect");
    sel.innerHTML = notesData.notes.map(n =>
      `<option value="${n.id}" ${n.id === notesData.current ? 'selected' : ''}>${esc(n.title)}</option>`
    ).join("");
    const cur = notesData.notes.find(n => n.id === notesData.current) || notesData.notes[0];
    document.getElementById("noteText").value = cur.text;

    document.getElementById("palTabs").innerHTML = PALETTE.map((p, i) =>
      `<button type="button" class="${i === palTab ? 'active' : ''}" onclick="window.selectPalTab(${i})">${p.name}</button>`
    ).join("");
    document.getElementById("palKeys").innerHTML = PALETTE[palTab].keys.map(k =>
      `<button type="button" onclick="window.insertNoteKey('${k}')">${k}</button>`
    ).join("");
  }

  window.selectPalTab = function(i) { palTab = i; renderNotesUI(); };
  window.insertNoteKey = function(txt) {
    const el = document.getElementById("noteText");
    const st = el.selectionStart || el.value.length;
    el.value = el.value.slice(0, st) + txt + el.value.slice(st);
    el.selectionStart = el.selectionEnd = st + txt.length;
    el.focus();
  };

  document.getElementById("noteText").addEventListener("input", e => {
    const cur = notesData.notes.find(n => n.id === notesData.current);
    if (cur) cur.text = e.target.value;
  });
  document.getElementById("noteNew").addEventListener("click", () => {
    const id = "n" + Date.now();
    notesData.notes.push({ id: id, title: "学習メモ " + (notesData.notes.length + 1), text: "" });
    notesData.current = id;
    renderNotesUI();
  });
  document.getElementById("noteRename").addEventListener("click", () => {
    const cur = notesData.notes.find(n => n.id === notesData.current);
    const name = prompt("メモの新しい名前を入力してください:", cur ? cur.title : "");
    if (name && name.trim()) { cur.title = name.trim(); renderNotesUI(); }
  });
  document.getElementById("noteDelete").addEventListener("click", () => {
    if (notesData.notes.length <= 1) return;
    if (confirm("このメモを削除しますか？")) {
      notesData.notes = notesData.notes.filter(n => n.id !== notesData.current);
      notesData.current = notesData.notes[0].id;
      renderNotesUI();
    }
  });
  document.getElementById("noteCopy").addEventListener("click", () => {
    navigator.clipboard.writeText(document.getElementById("noteText").value).then(() => {
      alert("メモ内容をクリップボードにコピーしました！");
    });
  });

  // --- 高機能・回答分析 ＆ 学習診断ダッシュボード ---
  window.jumpToReviewUnit = function(unitName) {
    const unit = UNIT_CATALOG.find(u => u.name === unitName);
    if (unit) {
      window.openUnitSubMenu(unit.id);
    } else {
      window.goHome();
    }
  };

  window.checkanalysis = function() {
    ["quizCard", "passageBox", "workspace", "answerRow", "buttons", "notes", "unitSubMenu"].forEach(id => show(id, "none"));
    document.querySelectorAll(".menuPane").forEach(p => p.classList.remove("active"));
    document.getElementById("subjectNav").style.display = "none";
    const randBar = document.getElementById("randomTestBar");
    if (randBar) randBar.style.display = "none";
    document.getElementById("globalTools").style.display = "none";
    show("analysis", "block");
    updateTopBack();

    // 総合集計
    let grandTotal = 0;
    let grandCorrect = 0;
    let grandUsedHint = 0;
    let allUnitsList = [];
    let allWrongHistory = [];

    Object.keys(subjectStats).forEach(sKey => {
      const s = subjectStats[sKey];
      grandTotal += (s.total || 0);
      grandCorrect += (s.correct || 0);
      grandUsedHint += (s.usedHint || 0);
      if (s.wrongHistory && Array.isArray(s.wrongHistory)) {
        allWrongHistory.push(...s.wrongHistory);
      }
      Object.keys(s.byUnit || {}).forEach(uName => {
        const ud = s.byUnit[uName];
        if (ud.total > 0) {
          allUnitsList.push({
            subj: sKey,
            name: uName,
            total: ud.total,
            correct: ud.correct,
            noHint: ud.noHintCorrect || 0,
            rate: Math.round(100 * ud.correct / ud.total)
          });
        }
      });
    });

    const grandRate = grandTotal > 0 ? Math.round(100 * grandCorrect / grandTotal) : 0;
    let rankName = "見習い学習者";
    if (grandTotal >= 100 && grandRate >= 80) rankName = "マスター (Lv.5)";
    else if (grandTotal >= 60 && grandRate >= 75) rankName = "エキスパート (Lv.4)";
    else if (grandTotal >= 30) rankName = "アドバンス (Lv.3)";
    else if (grandTotal >= 10) rankName = "スタンダード (Lv.2)";
    else if (grandTotal > 0) rankName = "ルーキー (Lv.1)";

    // 得意・苦手単元の算出（挑戦数が2問以上のものを優先）
    const sortedByRate = allUnitsList.slice().sort((a, b) => b.rate - a.rate || b.total - a.total);
    const strengths = sortedByRate.filter(u => u.rate >= 70).slice(0, 3);
    const weaknesses = sortedByRate.slice().reverse().filter(u => u.rate < 80).slice(0, 3);

    // パーソナライズ診断アドバイス生成
    let diagnosticAdvice = "";
    if (grandTotal === 0) {
      diagnosticAdvice = "まだ学習記録がありません。まずは好きな科目の「STEP 1: 基礎確認」や「🎲 ランダムテスト」から始めてみましょう！";
    } else {
      const advs = [];
      if (grandRate >= 80) {
        advs.push(`総合正答率 ${grandRate}% と極めて優秀な理解度です！`);
      } else if (grandRate >= 60) {
        advs.push(`総合正答率 ${grandRate}% で着実に基礎が定着しています。`);
      } else {
        advs.push(`まずは各単元の「STEP 1」で基礎概念と公式を再確認しましょう。`);
      }

      if (grandUsedHint > 0) {
        advs.push(`ヒントを計 ${grandUsedHint} 回活用し、解法の着眼点を掴めています。次はノーヒントでの正解を増やしていきましょう。`);
      }
      if (maxStreak >= 5) {
        advs.push(`最高 ${maxStreak} 問連続正解の記録を達成！ 集中力が素晴らしいです。`);
      }
      if (weaknesses.length > 0) {
        advs.push(`要復習単元「${weaknesses[0].name}」のまとめテストに再挑戦すると、さらなるスコアアップが期待できます。`);
      }
      diagnosticAdvice = advs.join(" ");
    }

    let h = `
      <div class="anaHeader">
        <h2 class="anaTitle">📊 回答分析・学習カルテ</h2>
        <button class="headerBtn" onclick="window.goHome()">← メインメニュー</button>
      </div>

      <!-- 概要カードグリッド -->
      <div class="anaOverviewGrid">
        <div class="anaCard">
          <div class="lbl">総合正答率</div>
          <div class="val" style="color: var(--primary);">${grandRate}%</div>
          <div class="sub">${grandCorrect} / ${grandTotal} 問</div>
        </div>
        <div class="anaCard">
          <div class="lbl">総回答数</div>
          <div class="val">${grandTotal}<span style="font-size: 13px; font-weight: normal;">問</span></div>
          <div class="sub">学習の蓄積</div>
        </div>
        <div class="anaCard">
          <div class="lbl">最高連続正解</div>
          <div class="val" style="color: #ea580c;">${maxStreak}<span style="font-size: 13px; font-weight: normal;">問</span></div>
          <div class="sub">現在: ${streak}問連続</div>
        </div>
        <div class="anaCard">
          <div class="lbl">学習ランク</div>
          <div class="val" style="font-size: 15px; color: #0284c7; padding-top: 4px;">${esc(rankName)}</div>
          <div class="sub">ヒント利用: ${grandUsedHint}回</div>
        </div>
      </div>

      <!-- パーソナライズ学習診断アドバイス -->
      <div class="feedbackCard">
        <strong>💡 学習診断フィードバック:</strong><br>
        ${esc(diagnosticAdvice)}
      </div>

      <!-- 科目別 習熟度プログレス -->
      <div class="anaSection">
        <div class="anaSecTitle">
          <span>科目別 習熟度</span>
          <span style="font-size: 12px; color: #94a3b8; font-weight: normal;">全5科目</span>
        </div>
    `;

    Object.keys(subjectStats).forEach(sKey => {
      const s = subjectStats[sKey];
      const rate = s.total > 0 ? Math.round(100 * s.correct / s.total) : 0;
      let badgeStyle = "background:#f1f5f9;color:#64748b;";
      let badgeText = "未着手";
      if (s.total > 0) {
        if (rate >= 80) { badgeStyle = "background:#dcfce7;color:#15803d;"; badgeText = "習熟"; }
        else if (rate >= 60) { badgeStyle = "background:#e0e7ff;color:#4338ca;"; badgeText = "順調"; }
        else { badgeStyle = "background:#ffedd5;color:#c2410c;"; badgeText = "要復習"; }
      }

      h += `
        <div class="subProgItem">
          <div class="subProgMeta">
            <span>${SUBJ_INFO[sKey].name} (${s.correct}/${s.total}問)</span>
            <span style="padding: 1px 6px; border-radius: 4px; font-size: 11px; ${badgeStyle}">${badgeText} ${rate}%</span>
          </div>
          <div class="progTrack">
            <div class="progFill" style="width: ${rate}%; background: ${SUBJ_INFO[sKey].theme};"></div>
          </div>
        </div>
      `;
    });

    h += `</div>`;

    // --- 教科別・間違え方の傾向分析 ＆ 頻出ミスランキング集計 ---
    const subjKeys = ['math', 'japanese', 'english', 'science', 'social'];
    const subjIcons = { math: "📐", japanese: "📖", english: "🔤", science: "🔬", social: "🌍" };

    // 全体の間違い集計
    let totalAllMistakes = 0;
    const globalMistakeFreq = {};
    subjKeys.forEach(sk => {
      const s = subjectStats[sk];
      const mp = s.mistakePatterns || {};
      Object.keys(mp).forEach(k => {
        const item = mp[k];
        totalAllMistakes += item.count;
        globalMistakeFreq[item.label] = (globalMistakeFreq[item.label] || { count: 0, advice: item.advice, subj: sk });
        globalMistakeFreq[item.label].count += item.count;
      });
    });

    const sortedGlobal = Object.keys(globalMistakeFreq)
      .map(k => ({ label: k, count: globalMistakeFreq[k].count, advice: globalMistakeFreq[k].advice, subj: globalMistakeFreq[k].subj }))
      .sort((a, b) => b.count - a.count);

    h += `
      <!-- 教科別・間違え方傾向の分析 ＆ 頻出ミスランキング -->
      <div class="anaSection">
        <div class="anaSecTitle">
          <span>🔍 教科別・間違え方の傾向分析 ＆ 頻出ミスランキング</span>
          <span style="font-size: 11.5px; color: #94a3b8; font-weight: normal;">どんな間違え方が多いかを可視化</span>
        </div>
    `;

    if (totalAllMistakes === 0) {
      h += `
        <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; padding: 12px; font-size: 13px; color: #166534; text-align: center; line-height: 1.6;">
          🎉 <strong>現在、記録された誤答はありません！</strong><br>
          問題を間違えた際に、AI診断エンジンが「どんな間違え方をしたか」を判定し、ここに教科別の頻出ミス傾向や弱点克服アドバイスが集計表示されます。
        </div>
      `;
    } else {
      const topGlobal = sortedGlobal[0];
      const topGlobalPct = Math.round(topGlobal.count / totalAllMistakes * 100);
      h += `
        <div style="background: #fff7ed; border: 1px solid #fed7aa; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; font-size: 12.5px; color: #9a3412; line-height: 1.55;">
          <strong>⚡ 全教科を通じて最も多い間違え方:</strong> 【${esc(topGlobal.label)}】 （計 ${topGlobal.count} 回 / 誤答全体の ${topGlobalPct}%）<br>
          <span style="font-size: 12px; color: #7c2d12;">📌 <strong>全体克服アドバイス:</strong> ${esc(topGlobal.advice)}</span>
        </div>

        <!-- 教科別グリッド -->
        <div class="subjMistakeGrid">
      `;

      subjKeys.forEach(sk => {
        const s = subjectStats[sk];
        const mp = s.mistakePatterns || {};
        const patKeys = Object.keys(mp);
        const subjMistakeTotal = patKeys.reduce((sum, k) => sum + mp[k].count, 0);

        h += `
          <div class="subjMistakeCard">
            <div class="subjMistakeHeader">
              <span class="subjMistakeTitle">
                <span>${subjIcons[sk]}</span>
                <span>${SUBJ_INFO[sk].name}</span>
              </span>
              <span class="subjMistakeCount" style="${subjMistakeTotal === 0 ? 'color:#16a34a;background:#f0fdf4;border-color:#dcfce7;' : ''}">
                ${subjMistakeTotal === 0 ? '誤答 0件' : `誤答 ${subjMistakeTotal}件`}
              </span>
            </div>
        `;

        if (subjMistakeTotal === 0) {
          h += `
            <div style="font-size: 12px; color: #16a34a; padding: 10px 0; text-align: center;">
              ✓ この教科では誤答がありません！ 順調です。
            </div>
          `;
        } else {
          const sortedPats = patKeys.map(k => mp[k]).sort((a, b) => b.count - a.count);
          const medals = ['🥇 1位', '🥈 2位', '🥉 3位'];

          sortedPats.slice(0, 3).forEach((p, idx) => {
            const pct = Math.round(p.count / subjMistakeTotal * 100);
            h += `
              <div class="mistakeRankItem">
                <div class="mistakeRankMeta">
                  <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 75%;">${medals[idx] || '・'} ${esc(p.label)}</span>
                  <span style="color: #dc2626; font-weight: 700;">${p.count}回 (${pct}%)</span>
                </div>
                <div class="mistakeProgTrack">
                  <div class="mistakeProgFill" style="width: ${pct}%;"></div>
                </div>
              </div>
            `;
          });

          if (sortedPats.length > 0) {
            h += `
              <div class="subjMistakeAdvice">
                <strong>🎯 ${SUBJ_INFO[sk].name}の克服ポイント:</strong><br>
                ${esc(sortedPats[0].advice)}
              </div>
            `;
          }
        }

        h += `</div>`; // .subjMistakeCard
      });

      h += `</div>`; // .subjMistakeGrid
    }

    h += `</div>`; // .anaSection

    // 得意・苦手単元セクション
    if (allUnitsList.length > 0) {
      h += `
        <div class="anaSection">
          <div class="anaSecTitle">
            <span>🎯 重点強化＆得意単元</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px;">
            <div>
              <div style="font-size: 12px; font-weight: 700; color: #dc2626; margin-bottom: 6px;">⚠️ 要復習単元 TOP 3</div>
              <div class="focusList">
      `;
      if (weaknesses.length === 0) {
        h += `<div style="font-size: 12px; color: #94a3b8; padding: 6px;">要復習の単元はありません。順調です！</div>`;
      } else {
        weaknesses.forEach(u => {
          h += `
            <div class="focusItem bad">
              <div>
                <div class="focusName">${esc(u.name)}</div>
                <div style="font-size: 11px; color: #94a3b8;">${SUBJ_INFO[u.subj].name}・正答率: ${u.rate}% (${u.correct}/${u.total}問)</div>
              </div>
              <div class="focusRight">
                <button class="jumpReviewBtn" type="button" onclick="window.jumpToReviewUnit('${esc(u.name)}')">🔥 復習</button>
              </div>
            </div>
          `;
        });
      }
      h += `
              </div>
            </div>
            <div>
              <div style="font-size: 12px; font-weight: 700; color: #16a34a; margin-bottom: 6px;">✨ 得意単元 TOP 3</div>
              <div class="focusList">
      `;
      if (strengths.length === 0) {
        h += `<div style="font-size: 12px; color: #94a3b8; padding: 6px;">まだ得意単元が登録されていません。</div>`;
      } else {
        strengths.forEach(u => {
          h += `
            <div class="focusItem good">
              <div>
                <div class="focusName">${esc(u.name)}</div>
                <div style="font-size: 11px; color: #94a3b8;">${SUBJ_INFO[u.subj].name}・正答率: ${u.rate}% (${u.correct}/${u.total}問)</div>
              </div>
              <span style="font-size: 11px; font-weight: 700; color: #16a34a;">得意！</span>
            </div>
          `;
        });
      }
      h += `
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // 直近のつまずきログ（ミス振り返り）
    if (allWrongHistory.length > 0) {
      h += `
        <div class="anaSection">
          <div class="anaSecTitle">
            <span>📝 直近のつまずき振り返り（直近 ${Math.min(10, allWrongHistory.length)} 件）</span>
          </div>
          <div class="wrongLogBox">
      `;
      allWrongHistory.slice(0, 10).forEach(w => {
        h += `
          <div class="wrongLogItem">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px;">
              <div class="qTitle">[${esc(w.unit || "演習")}] ${esc(w.q)}</div>
              ${w.time ? `<span style="font-size: 11px; color: #94a3b8; shrink: 0; margin-left: 6px;">${esc(w.time)}</span>` : ''}
            </div>
            ${w.mistakeLabel ? `<div style="margin: 3px 0;"><span class="mistakePatternBadge">⚠️ ${esc(w.mistakeLabel)}</span></div>` : ''}
            <div class="qAns">あなたの回答: <span style="color: #dc2626;">${esc(w.userAns || "無回答")}</span> → 正解: <span style="color: #16a34a;">${esc(w.ans)}</span></div>
            ${w.mistakeDetail ? `<div style="font-size: 11.5px; color: #991b1b; background: #fff5f5; padding: 4px 6px; border-radius: 4px; margin-top: 3px;"><strong>診断:</strong> ${esc(w.mistakeDetail)}</div>` : ''}
            ${w.explain ? `<div class="qExp" style="margin-top: 3px;">解説: ${esc(w.explain.slice(0, 90))}...</div>` : ''}
          </div>
        `;
      });
      h += `
          </div>
        </div>
      `;
    }

    // 最近の学習履歴へのクイックリンク
    h += `
      <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 12px 14px; margin-top: 14px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
        <div>
          <div style="font-weight: 700; color: #166534; font-size: 13.5px;">📋 全問タイムライン（最近の学習履歴）</div>
          <div style="font-size: 12px; color: #15803d; margin-top: 2px;">正解・不正解・ヒント使用・間違え方の診断を含めた直近の回答履歴（${recentHistory.length}問）を全問確認できます。</div>

        <button class="toolBtn" type="button" style="background: #ffffff; color: #16a34a; border-color: #86efac; font-weight: 700;" onclick="window.openRecentHistory()">履歴タイムラインを開く →</button>

    // リセットボタン
    h += `
      <div style="text-align: center; margin-top: 18px;">
        <button class="toolBtn" style="color: #ef4444; border-color: #fca5a5;" onclick="window.checkreset()">⚠️ 学習記録を全消去・リセット</button>
      </div>
